study_notes:
  - "Ventiduesima partita con v1_1, quattordicesima sconfitta (13-9). KUMA Viola/Bianco, Operation Meteor/G Team Gundam Wing EW (doppia copia di Gundam Heavyarms Custom (EW), Gundam Sandrock Custom (EW) ricorrente, Wing Gundam Zero (EW) + Heero Yuy, GN Armor Type-E). Sconfitta per shield-out netto al t14: 1 shield rimasta per Kiraya contro 2."
  - "Revisione richiesta esplicitamente da Kiraya, convinto di aver perso per propri errori evitabili - dopo un'analisi turno per turno non è emersa nessuna sequenza di gioco chiaramente sbagliata. Il candidato più vicino a un errore (t7: sia il pair-ping di Mikazuki Augus sia Become a Shield colpiscono lo stesso Gundam Barbatos 2nd Form appena schierato invece di scaricare il secondo ping sul già fragile Ryusei-Go (Graze Custom II) a 1 HP) non ha cambiato nulla nei fatti: Barbatos 2nd Form muore comunque al t8 a un attacco da 5 danni contro i suoi 5 HP totali, e infligge lo stesso danno di ritorno (determinato dal suo AP, non dai suoi HP residui) indipendentemente dai due self-ping. Non un errore che ha deciso la partita."
  - "Il vero motivo della sconfitta è strutturale/di varianza, non di sequenza: (1) mill sfortunato al t6 che manda ENTRAMBE le copie di Gundam Barbatos Lupus in trash nello stesso momento (via Gundam Exia Repair), azzerando il piano-motore fin dall'apertura; (2) un motore di rimozione avversario molto efficiente - GN Armor Type-E distrugge Exia Repair al Deploy solo perché un Heavyarms lo aveva appena debuffato ad AP1 nello stesso turno (combo intenzionale: debuff-poi-distruggi, non un colpo di fortuna); (3) doppia copia di Gundam Heavyarms Custom (EW) che debuffano ripetutamente AP-1 ai bersagli di Kiraya turno dopo turno, sommandosi al debuff AP-2 ripetibile di Gundam Sandrock Custom (EW) ad ogni sua dichiarazione d'attacco."
  - "Ennesima conferma della tech 'blocker disinnescato prima di scegliere' (checklist, già vista vs jaysanti): al t12 Wing Gundam Zero (EW) resta Gundam Gusion Rebake con la propria abilità PRIMA che Kiraya possa assegnarlo come blocco al primo attacco di Sandrock quello stesso turno - stessa famiglia della tech di Domon Kasshu/Master Asia su Rising Gundam."
  - "Trade corretto e necessario al t13: Hyakuren attacca direttamente Wing Gundam Zero (EW) invece del player, sacrificando un corpo da 2 costo per eliminare l'unica minaccia da 5 costo dell'avversario (unica unità KUMA persa in tutta la partita) - la scelta giusta quando si è già in svantaggio di board."
