study_notes:
  - "Sedicesima partita con v1_1, nona vittoria (9-7). xDEADHEADx Viola/Verde, Neo Zeon (Char's Zaku Ⅱ + Char Aznable per l'High-Maneuver, Zeong con i suoi token Wire-Guided Arm/Zeong (Head), Sazabi, famiglia Jagd Doga/Geara Doga). Vittoria per shield-out netto: 4 shield rimaste contro 0."
  - "Char's Zaku Ⅱ linkato a Char Aznable (ST03-011, non la stampa vista in altre partite) ottiene AP+1 e High-Maneuver a ogni attacco (t8, t10) - stesso buco di block-bypass già documentato più volte, qui ha ucciso Isaribi e Shiden Custom senza contromossa possibile."
  - "Al t16 l'abilità Attack di Sazabi (GD05-049, distinta dalla stampa Deploy-mill già vista contro loklee) tenta di far distruggere un'unità a entrambi i giocatori: xDEADHEADx sacrifica Quess's Jagd Doga (che poi torna in mano per la sua stessa abilità Destroyed), ma la parte che avrebbe dovuto colpire Kiraya fallisce a vuoto perché Gundam Barbatos Lupus - l'unica unità di Kiraya in campo - era proprio quella sotto attacco, quindi non c'era nessuna unità 'non impegnata in combattimento' da colpire. Lupus e Sazabi poi si scambiano nel combattimento vero e proprio."
  - "Nessun errore tattico isolato individuato: scambi efficienti per tutta la partita (ping-poi-attacco con Gusion Rebake/Adapt, Lupus usato per rifinire bersagli già indeboliti invece che a vuoto)."
  - "Wire-Guided Arm e Zeong (Head) confermano il pattern già noto (CLAUDE.md): sono token generati dalle abilità di Zeong stesso, corretto che non abbiano una scheda propria nel database."
