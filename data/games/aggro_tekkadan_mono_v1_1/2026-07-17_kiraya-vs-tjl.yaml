study_notes:
  - "Quattordicesima partita con v1_1, ottava vittoria (8-6). TJL Blu/Bianco, stesso archetipo SEED Kira Yamato + Amuro Ray già visto contro Robotech (Aile Strike Gundam, Freedom Gundam, Strike Rouge Kira's Unit, Gundam ST01-001, Archangel, Rick Dias, Gundam Lfrith). Stravinta per shield-out netto: 5 shield rimaste contro 0."
  - "Unico errore reale individuato: al t7, l'Activate di Isaribi applica il bonus AP+2 'durante questo turno' a Ryusei-Go (Graze Custom Ⅱ) DOPO che Ryusei-Go aveva già attaccato quello stesso turno (era la primissima azione del turno) - il bonus è sprecato su un'unità già rested, che non può attaccare una seconda volta. L'attacco di quel turno è stato fatto con Graze Custom, non buffato. Stesso identico errore-tipo già in checklist ('controllare se l'unità bersaglio può davvero attaccare questo turno prima di un Activate') - qui violato una volta, poi eseguito correttamente altre due volte nella stessa partita (t9, t15)."
  - "Confermata una seconda coppia di stampe condivise di Kira Yamato nella stessa partita (dopo il caso già visto contro Robotech): la copia abbinata ad Aile Strike Gundam (t8, t10) mostra 'Modifier applied to' durante la dichiarazione di battaglia - la sua abilità Attack AP-2 (ST04-010), confermata anche dall'aritmetica esatta (Exia Repair AP2-2=0 danno inflitto). La copia abbinata a Freedom Gundam (t14) pesca invece immediatamente al Link - la sua abilità When-Linked (GD05-081)."
  - "Chiarito da Kiraya: al t15 'Gundam Gusion Rebake' in combattimento era una SECONDA copia (il mazzo ne ha 3), non la stessa distrutta al t12/esiliata al t13 - il deploy della seconda copia non era visibile nello spezzone di log passato inizialmente ma il resto della ricostruzione (danni, trade) è corretto così com'è."
  - "Apertura standard pulita (doppio Exia Repair t3-t7) ed esecuzione solida per il resto della partita, incluso il kill preciso di Lupus su 'Gundam' (ST01-001) al t13: due attivazioni da 2 danni ciascuna, esattamente i 4 HP pieni della sua barra dopo la rigenerazione di fine turno precedente."
