study_notes:
  - "Quindicesima partita con v1_1, settima sconfitta (8-7). Essen Blu/Rosso/Bianco, control/removal pesantissimo: Close Combat x3, Improved Technique, Battle of Aces x2 (una via Burst da shield), Overwhelming Pressure x4 (4 danni a comando, mai visto prima in questo mazzo), Darkness Finger, Strike Freedom Gundam x2 copie con bounce ripetuto, Unicorn Gundam 02 Banshee (Destroy Mode) con la solita tripla riattivazione finale. Motore di pesca fuori scala: Airframe Seizure, A Show of Resolve x2, A Healthy Curiosity x2, Kindhearted x2 - stimabile in oltre 20 carte pescate in più rispetto al normale in 23 turni."
  - "Revisione onesta richiesta da Kiraya (convinto di aver perso per propri errori): non ho trovato una sequenza di gioco chiaramente sbagliabile diversamente. Essen è rimasto a board vuoto fino al t13 (13 turni!) giocando solo rimozione e pesca, quindi ogni deploy di Kiraya nei primi 12 turni era la mossa di default corretta (nessun bersaglio da proteggere, nessun blocco da valutare) - e ogni singola unità è comunque morta a un comando diretto, non in combattimento. Lupus è stato usato bene quando aveva un bersaglio disponibile (t14: uccide Strike Rouge Ootori con precisione esatta; t20: tripla attivazione, 6 danni in un turno su Strike Freedom Gundam) e correttamente NON attivato quando Essen aveva board vuoto (t18) - non c'era nulla da colpire."
  - "Il vero problema strutturale: il bounce di Strike Freedom Gundam (t19, t21) ha colpito Lupus entrambe le volte perché era LA SOLA unità di Kiraya rimasta in campo - non per una scelta di sequenza, ma perché la rimozione di Essen aveva già eliminato ogni altro corpo economico che avrebbe potuto fare da bersaglio alternativo. La contromossa standard (tenere un corpo economico vivo insieme a Lupus) non era disponibile: non c'era altro rimasto da tenere in vita."
  - "Chiarito da Kiraya: al t22 Ryusei-Go si autopinga a 1 HP (proprio Deploy), poi si abbina a Mikazuki Augus e riceve un secondo ping da 1 (insieme a Strike Rouge Ootori) senza morire - non un'incongruenza, Mikazuki Augus aggiunge il proprio HP (1) all'unità abbinata al momento del Link, quindi Ryusei-Go passa a 3 HP totali prima del secondo ping e sopravvive a 1 HP residuo. Stessa regola già osservata più volte nel campione (le statistiche del pilota si sommano a quelle dell'unità) - qui vale anche per l'HP, non solo per l'AP."
  - "Conclusione: la sconfitta sembra guidata soprattutto dalla varianza dell'avversario (mano di rimozione e pesca fuori scala, la più pesante vista finora nel campione, persino più di loclee alla partita 11) più che da un errore di Kiraya. Non tutte le sconfitte hanno un errore da correggere - questa pare una di quelle."
