study_notes:
  - "Ventunesima partita con v1_1, tredicesima vittoria (13-8). Nate Blu/Rosso, League Militaire (Gadeel, famiglia Victory Gundam/V2 Gundam + Üso Ewin). Vittoria per shield-out netto in soli 11 turni: 4 shield rimaste contro 0."
  - "Turno di quasi-wipe al t10 non decisivo: Kiraya perde Gundam Barbatos 1st Form, Hyakuren e Ryusei-Go (Graze Custom II) tutti nello stesso turno (2 attacchi di Gadeel + 1 di V2 Gundam, mai un blocco disponibile) - ma chiude comunque la partita al turno successivo con 4 attacchi non contrastati (Graze Custom x2, Hyakuren, Flauros). Stesso principio già visto vs GenocidGIC (t12 quasi-wipe, vittoria 11 turni dopo)."
  - "Vittoria senza mai schierare il pacchetto Blocker (Gusion Rebake pescato solo come shield e scartato via Breach al t10, Shiden Custom mai visto) e con sia Barbatos Lupus che Barbatos Adapt persi al mill-on-death di Gundam Exia Repair fin dal t7 - il piano-motore era morto in partenza, eppure il ritmo di pressione pura (Exia Repair, Graze Custom x2, Ryusei-Go, Hyakuren, Flauros) ha comunque chiuso in 11 turni."
  - "Nessun errore tattico isolato individuato: tutte le perdite di Kiraya arrivano da attacchi dichiarati senza blocco disponibile, mai da una scelta di gioco; ogni turno propone la sequenza corretta (spazzare le shield quando il player è scoperto)."
