study_notes:
  - "Dodicesima partita con v1_1, sesta vittoria (6-6, pareggio). gogogo Bianco/Viola, Zaft Destiny/Minerva Squad (Destiny Gundam, famiglia Impulse Gundam, Shinn Asuka) con splash Militia (Kapool, ∀ Gundam come shield). Stravinta: 0 shield perse da Kiraya contro le 6 di gogogo, che era già a shield zero da fine t13 - il t14 è quasi certamente una resa (nessuna azione di gogogo quel turno, 'Winner!' arriva subito dopo il semplice 'Passed' di Kiraya)."
  - "Turno decisivo: t13, prima vera attivazione di Gundam Barbatos Lupus in questa partita - doppia attivazione uccide ENTRAMBE le copie rimaste di Sword Impulse Gundam nello stesso turno, ripulendo il board avversario in un colpo."
  - "Widespread Annihilation (il board wipe già segnalato come buco strutturale del mazzo in aggro_mono_p/ANALISI.md) è stata scartata come shield al t11 senza mai essere giocata - pura fortuna di variance, non un merito del mazzo: contro lo stesso avversario con un pescata diversa questa partita poteva aprirsi molto peggio."
  - "Trovate e documentate due copie diverse di Sword Impulse Gundam nella stessa partita (GD04-056 e ST09-006, distinte per abilità osservata) - stesso pattern già visto con Nu Gundam/Kira Yamato in partite precedenti: il nome è condiviso da più stampe reali giocate nello stesso mazzo avversario."
  - "Nessun errore tattico isolato individuato lato Kiraya in questa partita: curva pulita (doppio Graze Custom t3, seguito da 1st Form t5), scambi ragionevoli per tutta la prima metà, chiusura netta col trash accumulato per Lupus al t13."
