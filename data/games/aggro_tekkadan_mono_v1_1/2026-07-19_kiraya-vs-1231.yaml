study_notes:
  - "Ventottesima partita con v1_1, diciannovesima vittoria (18-10). '1231' Blu/Rosso, control leggero (Signs of a Revolution x2, Rewloola, Kindhearted, Unicorn Gundam 02 Banshee Destroy Mode mai giocata). Vittoria per resa dell'avversario al t10: 0 shield perse per Kiraya (6 rimaste) contro le 2 residue di '1231' - una posizione già completamente vinta indipendentemente dalla resa."
  - "Rimozione diretta ripetuta dall'avversario (Signs of a Revolution x2: uccide Exia Repair al t6, Graze Custom al t8) più un self-ping mirato di Rewloola che finisce un Ryusei-Go (Graze Custom II) già a 1 HP - tre unità di Kiraya perse in totale, ma senza mai intaccare il ritmo offensivo: l'EX Base avversaria cade comunque al t7 e Rewloola stessa muore al t9 in un solo colpo di Hyakuren+Mikazuki Augus (AP4+2=6 esatto)."
  - "Pairing di Mikazuki Augus senza alcun ping visibile al t9: l'abilità 'infliggi 1 danno a una tua unità e a una nemica' non si attiva quando l'avversario non ha nessuna unità in campo (solo una base) - stesso comportamento di fallback già visto con Gundam Flauros (Ryusei-Go) quando manca un bersaglio valido."
  - "Nessun errore tattico individuato: partita corta e pulita, pressione mantenuta nonostante le perdite."
