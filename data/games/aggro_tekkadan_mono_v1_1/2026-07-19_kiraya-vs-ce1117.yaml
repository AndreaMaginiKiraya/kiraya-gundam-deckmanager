study_notes:
  - "Trentesima partita con v1_1, sedicesima sconfitta (19-11). CE1117 Blu/Bianco, League Militaire (Gun EZ, Strike Rouge Ootori, Aile Strike/Strike Freedom Gundam + Kira Yamato, famiglia Victory Gundam/V2 Gundam + Üso Ewin, Zoloat). Sconfitta per shield-out al t24 nella partita più equilibrata del campione finora: entrambi i giocatori chiudono a 3 shield perse su 3, 0-0 - letteralmente decisa dall'ultimo pezzo, come descritto da Kiraya."
  - "Turno di svolta quasi risolutivo al t21: Gundam Barbatos Lupus si attiva TRE volte nello stesso turno (9 carte esiliate), eliminando sia Strike Freedom Gundam che Victory Gundam in un colpo solo - il momento in cui la partita sembrava tornata nettamente in favore di Kiraya, vanificato dalla rapidità con cui CE1117 ricostruisce (Victory Gundam multipli + token Parts + Zoloat nei turni successivi)."
  - "Nuova variante di bounce di Strike Freedom Gundam osservata (t20): 'Hyakuren returned to deck' invece che in mano - conferma la stessa variante 'returned to deck' già vista una volta vs Olo (2026-07-18), non un caso isolato. Notato anche un costo mai visto prima: Strike Freedom scarta 2 copie di Kira Yamato dalla mano di CE1117 stesso come parte della propria abilità di attacco."
  - "Nessun errore tattico isolato individuato dopo revisione: ogni turno di Kiraya usa le risorse disponibili in modo ragionevole (trade forzati per assenza di blocco - problema di densità Blocker sempre presente - ricostruzione rapida dopo ogni perdita, uso efficiente di Lupus). La sconfitta sembra decisa dalla velocità di ricostruzione del motore League Militaire di CE1117 (pesca ripetuta via Victory Gundam x3 stampe + A Show of Resolve + Overflowing Affection x2) più che da una sequenza specifica di Kiraya."
  - "Doppia stampa di Kira Yamato nella stessa partita, ennesima conferma (dopo desi, Olo, MrCross00, Juuto): ST04-010 (debuff AP-2 in dichiarazione, t8/t20) e GD05-081 (pesca su Link, t18)."
