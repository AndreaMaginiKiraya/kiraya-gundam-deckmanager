study_notes:
  - "Ventiseiesima partita con v1_1, diciottesima vittoria (17-9). Eshaku mono-Rosso, 'Tekkadan splash Zeon/UC/Clan' - un mirror-match parziale (corre anche Gundam Barbatos 1st Form, Gundam Barbatos Adapt, Hyakuren e Mikazuki Augus, lo stesso nucleo Tekkadan di Kiraya) con innesti di rimozione e minacce pesanti (Sazabi, Kshatriya + Marida Cruz, GQuuuuuuX Omega Psycommu, Close Combat x2, Improved Technique x2, Battle of Aces). Vittoria per shield-out al t24 dopo una partita lunga e logorante (24 turni) - vinta ma tutt'altro che a mani basse, coerente con la sensazione di Kiraya di averla vinta 'per un soffio'."
  - "Terza (e più estrema) istanza di attivazioni multiple di Gundam Barbatos Lupus nello stesso turno: al t14 la prima copia si attiva TRE volte consecutive (9 carte esiliate in tutto), spazzando via un Gundam Barbatos Adapt nemico da sola in tre ping successivi. Sia questa copia (t17, uccisa da GQuuuuuuX + Close Combat) sia una seconda ridispiegata poco dopo (t18, doppia attivazione, poi muore t21 in un trade diretto contro il Barbatos 1st Form di Eshaku) confermano quanto il piano-motore possa reggere un intero mirror-match da solo se alimentato a dovere dal trash."
  - "Avversario fortemente orientato alla rimozione diretta: Close Combat (x2: uccide Exia Repair al t4, finisce Lupus al t17), Improved Technique (x2: uccide Shiden Custom al t15, Barbatos 1st Form al t22) e Battle of Aces (uccide Barbatos Adapt al t19) - stessa famiglia di mazzi controllo/rimozione già catalogati (loclee, Essen), qui però con un core Tekkadan sotto che rende la partita più simmetrica del solito."
  - "Isaribi come collo di bottiglia riconfermato: muore due volte (t15, t19) nonostante due sostituzioni, sempre riaprendo una finestra di danno diretto - stesso problema strutturale già in checklist."
  - "GQuuuuuuX (Omega Psycommu) (GD03-034) è stata l'unità più pericolosa della partita: Deploy da 3 danni diretti al Lupus appena sceso (t17) più un attacco da 8 danni che spazza Isaribi (t19) - un LR costo 7 che il mazzo ha faticato a rimuovere finché Lupus non l'ha finita a ping ripetuti nell'arco di due turni."
