study_notes:
  - "Trentaduesima partita con v1_1, ventiduesima vittoria (21-11). omega Viola/Rosso, Neo Zeon (Quess's Jagd Doga + Quess Paraya, Sazabi, Kshatriya + Marida Cruz, Rezin's Geara Doga, base Axis). Vittoria per timeout dell'avversario al t14 da una posizione già completamente dominante: 5 shield rimaste contro 1, 0 shield perse."
  - "Turno pesante per Kiraya al t10 (3 unità perse: Barbatos 1st Form, Barbatos 2nd Form, Ryusei-Go), ma interamente forzato dall'assenza di blocker schierati in quel momento - stesso problema di densità già in checklist, non una scelta di gioco. Recupero completo già dal t11."
  - "Probabile kill silenzioso non registrato dal parser: Sazabi (GD05-052) scende a 1 HP dopo il trade col Ryusei-Go al t10, poi riceve un altro ping da Become a Shield al t11 (1 danno) - dovrebbe morire a 0 HP, ma il log non mostra mai un 'now destroyed' esplicito e la carta non ricompare più nel resto della partita. Stesso pattern già documentato in CLAUDE.md (kill da ping multi-target che il client a volte non logga come distruzione)."
  - "Interazione carte confermata: la 【Destroyed】di Quess's Jagd Doga (GD05-053, 'se distrutta da un effetto di una tua carta Neo Zeon, aggiungila alla mano dal trash') si attiva quando è proprio Sazabi (Neo Zeon) a distruggerla come costo del proprio Deploy al t8 - le due unità tornano entrambe in mano nello stesso turno per due motivi diversi e indipendenti."
  - "Nessun errore tattico individuato: buon uso di Isaribi al t13 (buff su Graze Custom nello stesso turno in cui attacca, non sprecato come in altre partite precedenti)."
