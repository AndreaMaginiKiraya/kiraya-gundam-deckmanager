study_notes:
  - "Ottava partita con v1_1, quarta vittoria (4-4) - rivincita immediata contro GenocidGIC, stesso mazzo Blu/Bianco Titans/Jupitris + Unicorn Gundam 02 Banshee Norn (Destroy Mode) della partita precedente. Vittoria netta: 0 shield perse da Kiraya contro le 6 di GenocidGIC."
  - "Gundam Barbatos Lupus non è mai apparso in mano in questa partita (nessuna riga 'Gundam Barbatos Lupus deployed' in tutto il log) - eppure il mazzo ha comunque vinto in modo dominante. Dato importante in controtendenza: il piano-motore non è indispensabile ogni partita per vincere, quando il resto del piano curva bene."
  - "Unicorn Gundam 02 Banshee Norn (Destroy Mode) ripete lo stesso pattern già visto nella partita precedente: si riattiva più volte nello stesso turno (3 attacchi al t14, altri 2 al t16) macinando corpi di Kiraya. Stavolta però Kiraya aveva già un vantaggio economico sufficiente (EX Base avversaria distrutta al t9, White Base avversaria distrutta al t11) da assorbire la perdita senza che pesasse sul risultato finale."
  - "Scambio inefficiente segnalato: entrambe le copie di Gundam Exia Repair sono state spese nello stesso turno (t11) per uccidere un singolo Messala (2 attacchi da 2 danni ciascuno, Messala aveva Repair) - un 2-per-1 sfavorevole in termini di conteggio carte, anche se ciascun Exia Repair ha comunque attivato il proprio mill-on-death. Non ha compromesso la vittoria ma è un pattern da tenere d'occhio contro bersagli con rigenerazione."
  - "Entrambe le Gundam Flauros (Ryusei-Go) calate questa partita (t11, t13) non hanno mai trovato un bersaglio per il proprio ping ('No targets for Gundam Flauros (Ryusei-Go)' entrambe le volte) - la loro sinergia dipende dalla presenza di bersagli in campo al momento del deploy, non garantita."
  - "Le tre carte rimaste ambigue (Gundam, Forbidden Gundam, Riddhe Marcenas) sono le stesse della partita precedente contro lo stesso avversario, con la stessa mancanza di prove decisive nel log - probabile stesso mazzo, ma non confermabile riga per riga."
