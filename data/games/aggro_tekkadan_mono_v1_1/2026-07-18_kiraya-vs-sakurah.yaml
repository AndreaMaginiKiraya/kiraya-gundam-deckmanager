study_notes:
  - "Ventitreesima partita con v1_1, quindicesima vittoria (14-9). Sakurah mono-Verde, Earth Federation/Londo Bell (Jegan, Gundam AGE-1 Normal + Asemu Asuno, Re-GZ, Nu Gundam + Amuro Ray). Vittoria per shield-out netto al t13: 1 shield rimasta contro 0, dopo una partita punto a punto sulle unità (5 perse per Kiraya, 4 per Sakurah) ma mai in bilico sulle shield."
  - "MVP della partita: Gundam Barbatos 1st Form. La sua abilità Attack (pesca 1 carta) si attiva almeno 6 volte nel corso della partita grazie a più copie che si alternano in campo (t9 x2, t11 x2, t13 x2) - il motore di pesca più prolifico osservato finora nel campione v1_1, anche se è un effetto collaterale della carta specifica e non un vero motore di card-advantage dedicato (il problema strutturale resta comunque catalogato in ANALISI)."
  - "Trade decisivo al t11: Gundam Barbatos 1st Form contro Nu Gundam, entrambi distrutti - rimuove la minaccia più pericolosa dell'avversario (Nu Gundam, che aveva già ucciso Hyakuren e Isaribi al t10) in cambio di una copia facilmente sostituibile grazie al motore di pesca sopra descritto."
  - "Terza conferma nella stessa giornata di due stampe di Amuro Ray nella stessa partita (dopo desi e MrCross00): stesso pattern, GD05-085 (cura su distruzione) sui link a Nu Gundam, ST01-010 (rest su unità nemica) sul pair a Jegan."
  - "Enigma aritmetico AP/HP risolto (era ricorso anche su 'Gundam' vs desi e MrCross00): la prima copia di Nu Gundam (t10, AP7/HP totale 7) è GD05-017 (AP5/HP5) abbinato ad Amuro Ray GD05-085, il cui bonus reale è +2/+2 - il database locale aveva GD05-085 sincronizzato erroneamente come ap:0/hp:0 da egmanevents (unica fonte disponibile per GD05, apitcg non ha ancora questo set), corretto il 2026-07-18 dopo conferma via immagine ufficiale della carta. La seconda copia di Nu Gundam (t12) resta GD05-020, pinnata dal trigger di Deploy ('Placed 1 Resource EX')."
  - "Jegan finalmente risolto con certezza (metodo più pulito delle volte precedenti): a differenza del caso vs Olo dove entrambe le stampe morivano comunque a 3 danni, qui SOLO GD05-027 (HP2) muore esattamente a 2 danni - GD01-016 (HP3) sarebbe sopravvissuto. Il log dice esplicitamente 'now destroyed', quindi la stampa è inequivocabile."
  - "Gundam Barbatos Lupus e Ryusei-Go (Graze Custom II) entrambi milled dal proprio Gundam Exia Repair già al t6 - variante del pattern già visto vs Nate (mill che nega l'accesso a due carte diverse invece che al solo piano-motore), ma la partita si vince comunque senza problemi."
