study_notes:
  - "Terza partita con v1_1, prima vittoria (1-2). SaintAbbel Blu/Bianco League Militaire/UC (Rick Dias, Strike Rouge Ootori, Perfect Strike Gundam, Full Armor Unicorn come shield, Argama, A Show of Resolve)."
  - "Vittoria netta sui numeri: 0 shield perse da Kiraya contro le 6 di SaintAbbel, nonostante 5 unità perse contro 4 - il mazzo ha macinato shield più veloce di quanto l'avversario riuscisse a stabilizzare, pattern già visto in altre partite del campione."
  - "Primo dato su Gundam Barbatos 5th Form (Ground Type) (GD03-066, novita' v1_1): mai calato, scartato al t5 come costo dell'abilita' di Ryusei-Go (pesca 1/scarta 1). Non prova un problema di zona Earth-only in sé (non e' mai arrivato il turno per giocarlo), ma segnala che in mano puo' finire per essere il primo scarto 'sacrificabile' invece di un pezzo giocato - da confermare su altre partite se la zona Earth-only lo rende sistematicamente più spesso scartato che calato."
  - "Gundam Barbatos Lupus/Lupus Rex di nuovo non pescati (terza partita su tre): con Adapt + 1st Form + Gusion Rebake + Mikazuki la vittoria e' arrivata comunque, ma resta il dato più ricorrente del campione v1_1 finora - zero informazioni sui due pezzi di punta del mazzo."
  - "SaintAbbel ha speso 2 card-draw command (A Show of Resolve x2, +4 carte) e una Exclusively Defense-Oriented Policy per bouncing Gundam Exia Repair in mano 3 volte in totale (t8, t11, t12) - un modo diverso, ma imparentato, di 'disinnescare' Exia Repair rispetto al removal diretto visto contro MMorelli: qui il bounce lo tiene semplicemente fuori dal ritmo invece di sfruttarne il Mill 2, ma il risultato (un corpo economico che non produce danno per un turno intero) è lo stesso tema di inefficienza."
  - "Mikazuki Augus pair/link ripetuto su corpi diversi nello stesso turno (t11: Link su 1st Form, poi Pair su Gusion Rebake) resta la linea di ping più efficiente vista finora in v1_1 - 2 ping da 1 danno nello stesso turno senza costo aggiuntivo oltre il pilota."
