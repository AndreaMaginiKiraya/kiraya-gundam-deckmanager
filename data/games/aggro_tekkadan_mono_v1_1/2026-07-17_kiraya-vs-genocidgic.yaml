study_notes:
  - "Settima partita con v1_1, terza vittoria (3-4). GenocidGIC Blu/Bianco, Titans/Jupitris (The-O, Messala, Paptimus Scirocco, Delta Plus (Waverider Mode)) + splash Unicorn Gundam 02 Banshee Norn (Destroy Mode) + Gundam/Amuro Ray + Zoloat (League Militaire) + Kindhearted + Corsica Base. Partita lunghissima (23 turni) vinta ai punti per sfinimento."
  - "Turno 12 devastante subito: Unicorn Gundam 02 Banshee Norn (Destroy Mode) (GD04-065, diversa dalla stampa vista contro MMorelli) si riattiva 3 volte nello stesso turno (Activate: Set Active, ripetuto) e uccide Gundam Barbatos 1st Form tre volte di fila, più Hyakuren dallo stesso Delta Plus - un turno che ha quasi azzerato il board di Kiraya. Nonostante questo la partita è stata comunque vinta: prova di resilienza, non di invulnerabilità - il motivo è la ridondanza del piano Lupus (vedi sotto), non una risposta diretta al turno stesso."
  - "Miglior dimostrazione finora nel campione v1_1 di Gundam Barbatos Lupus come motore ricorrente: 4 dispiegamenti distinti nel corso della partita (t13, t17, t21, t23), ognuno con 1-2 attivazioni, per un totale di 7 uccisioni dirette (Unicorn Gundam 02 Banshee Norn t13, Zoloat x3 tra t17/t19, Forbidden Gundam x2 t21/t23, più danno su Delta Plus). Muore due volte in combattimento (t16 a Messala, t20 al token Tallgeese) ma torna sempre, grazie alle 4 copie nel mazzo - il pattern-motore che il campione aspettava di vedere funzionare a pieno regime."
  - "Kindhearted (comando avversario, 'le unità amiche non possono essere distrutte da effetti nemici questo turno, poi pesca 1') giocato 2 volte (t15, t22) - una risposta diretta e reale al piano di ping/ability-damage di Kiraya (Adapt, Gusion Rebake, Mikazuki Augus). Non ha impedito la vittoria ma va tenuto a mente come contromossa che i mazzi con removal 'ad effetto' possono avere in mano."
  - "Corsica Base (base avversaria, ST02-016) genera automaticamente un token Tallgeese (AP4/HP2) al proprio Deploy quando è il turno del suo controllore - un pattern di generazione-token da tracciare separatamente dalle unità vere quando si legge il nome nei prossimi log ('Tallgeese deployed' senza una riga di deploy-da-mano separata è il segnale)."
  - "EX Base di entrambi i giocatori distrutte presto (Kiraya t14, GenocidGIC t7) e la partita si è decisa sulle shield rimanenti più che su un singolo colpo: alla fine entrambi erano praticamente a corto di risorse, chiusa da un attacco diretto di Gundam Barbatos Adapt con l'avversario a shield zero."
