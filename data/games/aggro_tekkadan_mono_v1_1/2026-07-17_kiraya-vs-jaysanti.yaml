study_notes:
  - "Diciassettesima partita con v1_1, ottava sconfitta (9-8). jaysanti Rosso/Bianco, Shuffle Alliance/G Gundam (Domon Kasshu, Master Asia, Shining Gundam x3 stampe, Rising Gundam, Dragon Gundam, Gundam Maxter, Royal Gundam, Chibodee Crocket/Sai Saici in modalità Pilota). Sconfitta per shield-out netto: 0 shield rimaste contro 3, dopo essere stata punto a punto fino a metà partita (t9 Kiraya aveva ucciso 2 unità nemiche in cambio di 0 shield perse)."
  - "Correzione alla diagnosi di Kiraya: la sconfitta NON è per High-Maneuver - nessuna istanza del keyword compare in questo log (a differenza di sgd/liko/xDEADHEADx, dove è stato davvero decisivo). La partita si è decisa su tre fattori diversi: un errore di priorità di blocco al t14, la tech dell'avversario che resta i blocker di Kiraya prima di attaccare, e Gundam Barbatos Lupus mai arrivato in mano perché milled 2 volte di fila dal proprio Exia Repair."
  - "Errore tattico reale al t14: al primo attacco del turno (Master Asia contro Hyakuren, dichiarato come attacco a un'unità specifica) Kiraya aveva 2 Shiden Custom (Ryusei-Go) attivi e ha scelto 'Assigned no blocker', lasciando morire Hyakuren gratis mentre Master Asia (colpito solo per l'AP ridotta da Hyakuren via il modificatore di Cyclone Punch) sopravviveva a 1 HP. Bloccare con uno Shiden Custom (AP4 contro Master Asia HP3, che infatti sarebbe stato distrutto) avrebbe scambiato Shiden per Master Asia mantenendo comunque il secondo Shiden Custom per il blocco successivo nello stesso turno - un 1-per-1 nettamente migliore del sacrificio a vuoto di Hyakuren avvenuto in realtà."
  - "Tech dell'avversario da tracciare: Domon Kasshu appaiato a Rising Gundam (t12) innesca sia il proprio 'pesca una carta' sia, tramite Shining Finger scartata dalla mano, il resting di Shiden Custom e Hyakuren PRIMA della fase di combattimento - stesso schema poi ripetuto al t16 con Master Asia su Rising Gundam (rest di Hyakuren). Risultato diretto: l'attacco di Rising Gundam su Gundam Barbatos Adapt al t12 arriva con 'No blockers available' perché gli unici due blocker potenziali erano già stati restati da un'abilità precedente nello stesso turno, non per assenza di carte in campo - variante del problema di densità Blocker già in checklist (item 5), ma qui il blocker C'ERA e viene disinnescato prima ancora di poter scegliere."
  - "Gundam Barbatos Lupus mai arrivato in mano per pura variance di mill: il proprio Gundam Exia Repair l'ha mandato in trash due volte (t6 e t8, sempre nel gruppo di 2 carte milled on death) prima che potesse mai essere pescato - il piano-finisher non si è mai attivato in tutta la partita, non per una scelta di gioco ma perché la propria stessa unità l'ha eliminato dal mazzo pescabile nei primi 8 turni."
  - "Buona esecuzione al t9: Barbatos Adapt (ping AP+1 su 2 bersagli) più Become a Shield (altro ping su 2 bersagli) sommano abbastanza danno da permettere a Gundam Barbatos 2nd Form di uccidere Dragon Gundam in trade netto nello stesso turno, oltre a un secondo attacco che porta la base nemica quasi a zero - miglior turno di Kiraya in tutta la partita."
