study_notes:
  - "Second game with v1_1, second loss (0-2). sgd played Blue/Red Earth Alliance/Phantom Pain (SEED Destiny package: Chaos/Gaia/Raider Gundam, Exass, Sting Oakley, Stellar Loussier) with an OZ splash (Tallgeese, Corsica Base)."
  - "The game was lost in the first 4 turns, not at the end: double mulligan, then zero deploys until t4 - and that first deploy (Barbatos 1st Form) died immediately to Close Combat in the end phase. Kiraya's board existed only from t6 onward while sgd's Chaos Gundam was already attacking freely from t5."
  - "Chaos Gundam + Sting Oakley linked = <High-Maneuver> on every attack ('Can't block High-maneuver' t5, t7): killed the EX Base and 2 shields with zero counterplay. Same structural hole as Wing Zero/Nu Gundam LR already noted in aggro_mono_p's ANALISI: the deck has no answer to block-bypass."
  - "Mid-game trades were actually fine (Adapt for Chaos #1 t8, Ryusei-Go for Chaos #2 t10, 2nd Form for Raider MA t10, Shiden blocking Exass t11), but sgd redeployed 2-3 fresh units per turn (2x Gaia + Exass t11; Gaia MA + Raider t13) and Kiraya never caught up on board count."
  - "Gundam Barbatos Lupus never appeared in hand all game - the deck's whole finisher plan (and both new v1_1 pieces, Lupus Rex and 5th Form) sat in the deck while the game was decided on tempo."
  - "Isaribi Burst-deployed from shields at t13 (nice free base) but was immediately killed by Gaia Gundam (MA Mode) + Stellar Loussier linked hitting for 6 - at that point 0 shields were left and the next attack ended it."
