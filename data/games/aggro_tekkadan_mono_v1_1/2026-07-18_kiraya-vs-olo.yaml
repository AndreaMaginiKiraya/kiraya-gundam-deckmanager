study_notes:
  - "Diciannovesima partita con v1_1, undicesima vittoria (11-8). Olo Blu/Bianco, Earth Alliance/SEED con doppia stampa di Kira Yamato (Rick Dias, famiglia Strike/Aile Strike/Strike Freedom Gundam, Wing Gundam Zero EW, Archangel, Gundam Lfrith). Vittoria per shield-out netto: 1 shield rimasta contro 0."
  - "Nessun errore tattico isolato individuato: trade sempre a favore o alla pari, incluso il t9 dove Gundam Exia Repair distrugge Rick Dias con il proprio effetto Attack anche mentre viene distrutto a sua volta."
  - "Seconda doppia attivazione di Gundam Barbatos Lupus nello stesso turno in due partite consecutive (dopo desi, t15): al t13 la copia appena schierata si attiva due volte di fila (6 carte esiliate), concatenando i ping con Become a Shield per abbattere Aile Strike Gundam quasi a zero e liberare la strada per 2 attacchi diretti su Archangel. Pattern che inizia a sembrare un'esecuzione intenzionale ricorrente più che un'eccezione."
  - "Variante inedita del bounce di Strike Freedom Gundam (problema strutturale numero 1 già in ANALISI): al t16 l'unità di livello più basso in campo di Kiraya (Graze Custom) viene 'returned to deck', non rimandata in mano come nelle partite precedenti (Robotech, Essen) - un effetto ancora più punitivo perché non è nemmeno ripescabile a comando, va rimescolata dal mazzo. Da verificare se è una stampa diversa di Strike Freedom o la stessa abilità con wording che il client mostra in modo incoerente tra partite."
  - "Conferma diretta del quirk di visualizzazione già documentato in CLAUDE.md: 'Strike Rouge (Kira's Unit)' è la stessa identica istanza citata come esempio nelle istruzioni del progetto - risolta a Kira's Strike Rouge (GD05-010) con piena conferma aritmetica di combattimento (AP3+2=5, HP4+1=5-2=3)."
