study_notes:
  - "Sesta partita con v1_1, quarta sconfitta (2-4). Robotech Blu/Bianco, SEED (Kira Yamato) + Orb/AEUG ibrido: Strike Freedom Gundam, Aile Strike Gundam, Strike Rouge (sia Ootori che Kira's Unit), Freedom Gundam, la famiglia Murasame/Andrew Waldfeld, Archangel come base Burst, Rick Dias, Gundam Lfrith, A Show of Resolve e Overflowing Affection per la pesca."
  - "Strike Freedom Gundam torna a essere il problema strutturale numero 1 già documentato in aggro_mono_p/ANALISI.md: la sua abilità (scarta 2, rimanda in fondo al mazzo l'unità nemica di livello più basso) ha colpito Gundam Barbatos Lupus Rex al t14 - la singola copia del pezzo nuovo di v1_1 rimandata nel mazzo prima ancora di attaccare una volta - e Gundam Barbatos 1st Form al t16. Avere più copie totali di Lupus/Lupus Rex (5 in v1_1 contro 4 in aggro_mono_p) non risolve il problema: l'abilità colpisce comunque quella di livello più basso in campo in quel momento, a prescindere dal totale nel mazzo."
  - "Isaribi colpita per 7 danni netti due volte di fila dallo stesso Strike Freedom Gundam (t14, t16) - enorme overkill su una base da 5 HP, ogni sostituzione ha bruciato un turno di risorsa senza guadagnare nulla in cambio."
  - "Robotech ha accumulato vantaggio-carte pesante: A Show of Resolve (+2), più i 'Draw a card' ripetuti di Strike Freedom Gundam (Deploy/Attack, triggerati almeno 3 volte) e di Kira Yamato (When Linked, altre 2 volte) - lo stesso squilibrio di carte già segnalato come problema strutturale di aggro_mono_p, non ancora risolto in v1_1."
  - "Turno decisivo t20: tre attacchi consecutivi (Gundam Lfrith, Rick Dias, Strike Rouge Ootori) colpiscono le ultime 3 shield di Kiraya nello stesso turno - una saturazione classica, stavolta subita invece che inflitta. Il Freedom Gundam calato a fine turno è arrivato a partita già decisa, mai sceso in azione."
  - "Scoperta di formato: il client mostra alcuni Unit con Link attivo sotto un nome diverso da quello stampato, tipo '<nome base> (<Pilota>'s Unit)' - 'Murasame (Andrew Waldfeld Unit)' è in realtà 'Waldfeld's Murasame' (GD05-003), 'Strike Rouge (Kira's Unit)' è 'Kira's Strike Rouge' (GD05-010). Annotato anche in CLAUDE.md per le prossime importazioni."
  - "Punto positivo: gli scambi centrali con Barbatos Adapt/5th Form/1st Form contro le copie di Strike Rouge (Ootori) sono stati onesti (t17, doppio trade), a dimostrazione che il mazzo tiene il ritmo a metà partita anche in questa sconfitta - il vero divario è nel motore di pesca e nel bounce ripetuto, non nei combattimenti diretti."
