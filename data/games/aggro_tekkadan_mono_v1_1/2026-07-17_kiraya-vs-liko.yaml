study_notes:
  - "Quinta partita con v1_1, terza sconfitta (2-3). liko Verde/Bianco, Londo Bell + Operation Meteor ibrido (Re-GZ/Kayra's Re-GZ/Re-GZ BWS, Nu Gundam in entrambe le stampe, Wing Gundam/Wing Gundam Zero/Wing Gundam Zero (EW), Heero Yuy, Amuro Ray, Ra Cailum, Overflowing Affection, Interwoven Blessings)."
  - "Il colpo di grazia (t20) è di nuovo il block-bypass: Wing Gundam Zero base ha <High-Maneuver> ('Can't block High-maneuver') e ha chiuso la partita senza contromossa possibile - stesso buco strutturale già visto vs sgd (Chaos Gundam + Sting Oakley) e in aggro_mono_p."
  - "Il vero punto di svolta è probabilmente il t14, non il t20: Nu Gundam LR (GD05-017) via il suo When-Paired ('esilia 3 carte Londo Bell dal trash, poi inizia una battaglia solo fase-danno con un nemico a scelta') ha ucciso sia Gundam Barbatos Lupus che Gundam Barbatos 2nd Form nello stesso turno, in due battaglie iniziate direttamente da un'abilità che salta la fase di dichiarazione/blocco - un meccanismo di rimozione diverso sia dall'High-Maneuver (che nega solo il blocco) sia dal removal a bersaglio (Darkness Finger e simili): qui manca proprio lo step in cui un blocco sarebbe stato possibile."
  - "Seconda vera prova di Gundam Barbatos Lupus in v1_1 (dopo iceberg): prima copia (t13) fa doppia attivazione ma muore subito dopo alla battaglia-abilità di Nu Gundam (t14) senza mai attaccare; seconda copia (t17) fa doppia attivazione e sopravvive fino al t19, tradando con Wing Gundam Zero (EW). Il piano-finisher regge quando gli viene dato un turno per agire, molto meno quando l'avversario ha una risposta diretta in mano."
  - "Interwoven Blessings (comando costo 10, 'distruggi le prime 2 carte nell'area shield nemica') ha distrutto Isaribi al t20 mentre Kiraya aveva già 0 shield in area - un'interazione da verificare (possibile che l'effetto ripieghi su altro bersaglio a shield-area vuota, oppure 'Isaribi' qui indica la base e non una shield propriamente detta); segnato per controllo futuro, non assunto come regola confermata."
  - "Scambi centrali onesti: Adapt vs Nu Gundam/Wing Gundam, Hyakuren vs Nu Gundam - il mazzo ha tenuto il ritmo per gran parte della partita, la differenza l'ha fatta il doppio kill del t14."
