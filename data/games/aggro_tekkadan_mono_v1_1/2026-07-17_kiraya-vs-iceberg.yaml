study_notes:
  - "Quarta partita con v1_1, seconda vittoria (2-2). iceberg Rosso/Viola, Earth Alliance/Phantom Pain (Chaos/Gaia/Abyss Gundam in modalità base e MA, Auel Neider, Sting Oakley, Stellar Loussier, Exass, Girty Lue) con splash 0 Gundam (Cb/Gn Drive, Viola) - stessa famiglia di archetipo di sgd (game 2) ma con un colore diverso in coppia."
  - "Prima vera prova di Gundam Barbatos Lupus da quando esiste v1_1 (le 3 partite precedenti non l'avevano mai pescato): doppia attivazione al t13 (uccide Chaos Gundam MA Mode) e una terza al t15 (uccide Chaos Gundam base) - il piano-finisher ha funzionato esattamente come nel campione aggro_mono_p."
  - "Gaia Gundam (During Pair, Once per turno: se distrugge una shield nemica con danno da battaglia, l'avversario scarta 1 o Kiraya calava gratis un (Phantom Pain) Lv.4-) ha scartato Gundam Barbatos Lupus dalla mano al t6 - una copia viva persa senza combattere. Nonostante questo, Lupus e' comunque arrivato in campo (altra copia pescata) e ha chiuso la partita: con 4 copie + Lupus Rex il mazzo regge anche a uno scarto forzato isolato."
  - "Stesso effetto ripetuto da Abyss Gundam (MA Mode) (When Paired: se l'avversario ha 4+ carte in mano, scarta 1) al t10, stavolta su Gundam Gusion Rebake - due scarti forzati diversi nella stessa partita, entrambi assorbiti senza conseguenze decisive."
  - "Isaribi di nuovo il punto debole: muore in due colpi nello stesso turno (t8, Exass 4 + 0 Gundam 2 = 6 danni contro 5 HP) - stesso schema 'unica base' già annotato nelle partite precedenti."
  - "Scambi centrali sostanzialmente alla pari (Graze Custom x2 contro Gaia/0 Gundam al t7, Adapt contro Exass/0 Gundam al t9, Adapt contro Gaia al t11) - la partita si e' decisa sul finisher di Lupus a metà/fine gioco, non sulla fase di trade."
