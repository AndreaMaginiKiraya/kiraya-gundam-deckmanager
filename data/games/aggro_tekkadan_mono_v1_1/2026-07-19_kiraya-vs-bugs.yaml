study_notes:
  - "Venticinquesima partita con v1_1, diciassettesima vittoria (16-9). Bugs Blu/Rosso, misto SEED/Unicorn/Neo Zeon (Strike Rouge Ootori/Kira's Unit + Kira Yamato, Zoloat League Militaire, Gundam Kyrios Flight Mode, Kshatriya, Strike Freedom Gundam, Unicorn Gundam 02 Banshee Destroy Mode). Vittoria totale: 0 shield perse, EX Base sostituita da Isaribi al t5 e mai più a rischio, 5 shield rimaste contro 2 al momento in cui il log si interrompe (probabilmente troncato prima del colpo di grazia effettivo, stesso caso già visto con loclee - il risultato 'win:Kiraya' resta comunque corretto dalla riga 'Winner!' finale)."
  - "Turno di sfondamento al t9: Barbatos 2nd Form uccide Strike Rouge (Ootori) bloccante e Barbatos Adapt (con Mikazuki Augus appena abbinato) uccide Strike Rouge (Kira's Unit) subito dopo - un 2-per-2 che elimina entrambe le minacce principali dell'avversario nello stesso turno, pur perdendo entrambe le proprie unità nel processo."
  - "SECONDA istanza confermata dello stesso errore nei dati carte scoperto ieri su Amuro Ray: anche Kira Yamato (GD05-081) era sincronizzato come AP0/HP0, ma la carta reale dà +2/+2 all'unità abbinata - confermato via immagine ufficiale e corretto in data/cards/en/gd05.json il 2026-07-19. Su 21 piloti del set GD05 nel database locale, 18 (compreso questo, ora sistemato a 2) mostrano AP0/HP0: non è detto siano tutti sbagliati (alcuni, es. Sting Oakley 1/1, sono corretti), ma con due conferme su due controllati è un pattern da tenere d'occhio - verificare via immagine ufficiale quando l'aritmetica di un pilota GD05 non torna, prima di dichiararla irrisolvibile."
  - "Prima osservazione di un'unità che attacca il turno stesso in cui viene schierata (t12, Gundam Kyrios Flight Mode contro un'unità nemica rested) - non un bug del log ma il testo esplicito della carta (GD05-048: 'On the turn this Unit is deployed, it may choose a rested enemy Unit as its attack target and attack it'), una meccanica che bypassa la normale regola di non poter attaccare al turno di schieramento."
  - "Nessun errore tattico isolato individuato: esecuzione pulita dall'apertura alla chiusura, inclusi trade sempre a favore o alla pari."
