study_notes:
  - "Ventesima partita con v1_1, dodicesima vittoria (12-8). MrCross00 Blu/Verde, Londo Bell/Earth Federation (Gundam + Amuro Ray, Jegan, Nu Gundam, Re-GZ/Re-GZ BWS, Ra Cailum, Zeong con token Wire-Guided Arm) - stesso arco di carte già visto vs desi lo stesso giorno. Vittoria per shield-out totale in 13 turni: 6 shield rimaste per Kiraya (mai perse, EX Base mai distrutta) contro 0."
  - "Vittoria completa senza mai pescare né il piano-motore (Barbatos Lupus non compare mai) né il pacchetto Blocker (Gusion Rebake/Shiden Custom mai visti) - solo pressione da apertura (Graze Custom, Barbatos Adapt, Flauros Ryusei-Go, Ryusei-Go Graze Custom II). Conferma ulteriore che nessuno dei due pilastri è indispensabile quando la curva iniziale tiene il ritmo (stesso principio già visto nella rivincita vs GenocidGIC, game 8)."
  - "Stessa identità ambigua irrisolta di 'Gundam' già trovata vs desi lo stesso giorno: la combo Repair-2 a fine turno + cura immediata 2 HP dopo aver distrutto un nemico (che qui salva letteralmente l'unità dalla morte per due volte, t10 e t12: HP4-4dmg+2cura=2 residui) punta a ST01-001 abbinato ad Amuro Ray (GD05-085), ma il danno inflitto resta di 6 in entrambe le occasioni di questa partita - lo stesso numero esatto osservato anche vs desi. La ripetizione esatta tra due partite indipendenti suggerisce un fattore sistematico non ancora identificato, non semplice varianza; segnata come domanda aperta per una revisione futura."
  - "L'abilità Attack di Gundam Flauros (Ryusei-Go) mostra 'No targets for Gundam Flauros (Ryusei-Go)' due volte (t9, t11) quando dichiara contro il player - l'assenza di bersagli validi per la sua componente opzionale non blocca comunque l'attacco stesso, che prosegue normalmente contro shield/base."
  - "Nessun errore tattico isolato individuato: unica perdita reale di Kiraya (Graze Custom e Barbatos Adapt al t10) arriva da attacchi dichiarati senza blocco disponibile, non da una scelta di gioco."
