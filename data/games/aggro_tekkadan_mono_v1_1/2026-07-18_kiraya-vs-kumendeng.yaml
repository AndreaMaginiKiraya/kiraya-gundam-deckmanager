study_notes:
  - "Ventiquattresima partita con v1_1, sedicesima vittoria (15-9). Kumendeng Blu/Verde, Zeon rush (Zaku I/II, Guntank, Char Aznable, Zeong + Char, Nu Gundam + Amuro Ray, Corsica Base). Vittoria per timeout dell'avversario al t15, da una posizione già nettamente vinta (1 shield contro 0, board di Kiraya nettamente superiore)."
  - "Correzione importante ai dati del database durante questa sessione: Amuro Ray (GD05-085) risultava sincronizzato come AP0/HP0 (unica fonte disponibile per il set GD05, egmanevents, non ha il dato completo), ma la carta reale dà +2/+2 all'unità abbinata - confermato via immagine ufficiale della carta e corretto in data/cards/en/gd05.json il 2026-07-18. Questo risolve anche il rompicapo aritmetico rimasto aperto su 'Gundam'/Nu Gundam nelle partite precedenti della stessa giornata (vs desi, MrCross00, Sakurah)."
  - "High-Maneuver reale e decisivo (t11): Char Aznable (ST03-011) linkato a Zeong ottiene AP+1 e High-Maneuver sul proprio attacco - 'Can't block High-maneuver' esplicito nel log, stesso buco strutturale già documentato più volte (sgd, liko, xDEADHEADx)."
  - "Seconda partita di fila con doppia attivazione di Gundam Barbatos Lupus nello stesso turno (t12, dopo Olo): la copia appena schierata si attiva due volte consecutive nello stesso turno, ripulendo Wire-Guided Arm e aprendo la strada a un turno di sfondamento con 4 azioni offensive."
  - "Ulteriore conferma dei pattern-token già documentati in CLAUDE.md: Corsica Base genera un token Tallgeese al Deploy (t7, mai morto nonostante 2 danni ricevuti - sopravvive senza mai comparire tra le casualties), e Zeong genera Wire-Guided Arm x2 al Deploy più Zeong (Head) alla propria distruzione (t11-12) - nessuno dei tre ha una scheda propria nel database, corretto lasciarli id: null."
