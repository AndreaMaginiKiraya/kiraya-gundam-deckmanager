study_notes:
  - "Undicesima partita con v1_1, sesta sconfitta (5-6). loclee Blu/Rosso, un mazzo che riunisce quasi tutti i problemi strutturali già catalogati per questo mazzo: Darkness Finger (rimozione ripetibile da 2 danni, giocata 3 volte), Improved Technique e Close Combat (altra rimozione diretta, 3 volte in totale), Strike Freedom Gundam (bounce + motore di pesca), e Unicorn Gundam 02 Banshee (Destroy Mode) con First Strike e riciclo del trash (stesso nucleo già visto letale contro MMorelli in aggro_mono_p). Log troncato esattamente sul colpo di grazia (Kiraya già a 0 shield, Strike Freedom Gundam non bloccabile in arrivo) - risultato impostato a mano come sconfitta."
  - "Unico errore tattico individuato: al t14, Gundam Barbatos 2nd Form attacca contro Strike Rouge (Ootori) sapendo che verrà bloccato, e muore per un chip di 2 danni - ma Gundam Barbatos Lupus, dispiegato e attivato due volte nello stesso turno subito dopo, infligge da solo 4 danni a Ootori (HP4 piena), sufficienti a ucciderla senza bisogno del contributo di 2nd Form. L'ordine delle azioni (attaccare con 2nd Form prima di sapere/decidere se Lupus sarebbe bastato da solo) ha sacrificato un'unità per un chip che si è rivelato ridondante."
  - "Ogni altra perdita di unità in questa partita è arrivata da comandi di rimozione diretta o dall'abilità di un'unità nemica durante il turno di loclee, senza alcuna finestra di decisione per Kiraya (nessun blocco disponibile, nessuna scelta di bersaglio alternativa) - non ci sono altri errori individuabili."
  - "Il turno 23 (Unicorn Gundam 02 Banshee Destroy Mode, GD01-003) mostra il meccanismo completo: 'ritorna 12 carte dal trash in fondo al mazzo, si riattiva, ottiene First Strike' ripetuto 3 volte nello stesso turno - identico schema già letale nelle partite contro MMorelli, confermando che resta un buco strutturale del mazzo senza contromossa, non un problema di sequenza di gioco."
