study_notes:
  - "Ventisettesima partita con v1_1, quindicesima sconfitta (17-10). Juuto Blu/Verde, Earth Federation/Londo Bell (Gundam + Amuro Ray, Nu Gundam LR + Amuro Ray, Re-GZ, ReZEL, Jegan, Kayra Su + Kayra's Jegan). Sconfitta per shield-out al t20."
  - "Revisione richiesta da Kiraya, convinto di aver commesso diversi errori - dopo un'analisi turno per turno non ne ho trovato uno che abbia cambiato l'esito. La partita è stata decisa da un unico motivo strutturale ripetuto tre volte: Nu Gundam (GD05-017) con Amuro Ray abbinato ha un'abilità When Paired che esilia 3 carte Londo Bell dal trash e inizia una battaglia diretta contro un'unità scelta, saltando completamente dichiarazione e blocco - usata specificamente per eliminare Gundam Barbatos Lupus non appena rischierato, per ben due volte (t14, t18), e una terza volta (t20) su Gundam Exia Repair dopo aver anche restato Gundam Barbatos 1st Form con l'abilità di Amuro Ray. Nessuna sequenza di gioco di Kiraya avrebbe potuto evitarlo: l'abilità non richiede nulla che Kiraya controlli (solo che Juuto abbia pescato Nu Gundam e abbia 3 carte Londo Bell in trash, cosa che si accumula naturalmente)."
  - "Effetto composto devastante al t14 e al t18 (identico in entrambi i casi): l'abilità di Nu Gundam uccide Lupus E fa scattare il suo <Breach 5>, distruggendo Isaribi nello stesso colpo - un 2-per-1 che si ripete esattamente due volte, spiegando da solo la maggior parte del divario nella partita."
  - "'No blockers available' ricorrente per gran parte della partita non indica assenza di scelta ma il problema di densità Blocker già in checklist (item 5): Hyakuren, Exia Repair, Graze Custom e Gundam non hanno la parola chiave Blocker - solo Gundam Gusion Rebake (mai schierato in tempo utile prima del t15) e Shiden Custom (mai pescato in questa partita) l'avrebbero avuta."
  - "Buona lettura del non-blocco al t16: con due copie di Gundam Gusion Rebake in campo, Kiraya lascia che Re-GZ ne distrugga una senza intervenire con l'altra - scelta corretta, dato che entrambe le copie sarebbero comunque morte a quell'AP (bloccare avrebbe solo scambiato quale delle due muore), mentre non bloccare ha permesso alla seconda copia di sopravvivere e contribuire al turno successivo."
  - "Risolto durante l'import il rompicapo ricorrente su 'Gundam' (visto anche vs desi e MrCross00 lo stesso weekend): è ST01-001, e l'abilità 【During Pair】'i tuoi Units ottengono AP+1 durante il tuo turno' spiega perché il danno inflitto cambia tra il turno di Juuto (AP6, buff attivo) e quello di Kiraya (AP5, buff inattivo) - lo stesso identico pezzo mancante che aveva lasciato irrisolti gli altri due casi."
