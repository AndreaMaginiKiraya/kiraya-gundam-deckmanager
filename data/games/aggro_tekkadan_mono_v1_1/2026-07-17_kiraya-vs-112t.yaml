study_notes:
  - "Decima partita con v1_1, quinta vittoria (5-5) - vinta per resa dell'avversario al t14, non per shield-out. 112t Rosso, Earth Alliance/Phantom Pain (Abyss/Chaos/Gaia Gundam, Auel Neider, Sting Oakley, Stellar Loussier, Exass, Girty Lue, Kindhearted)."
  - "Posizione al momento della resa nettamente favorevole a Kiraya: 4 shield rimaste contro 1 sola di 112t, board di Kiraya sano (1st Form vivo) contro un board fragile (Chaos Gundam (MA Mode) a 2 HP e rested, un Abyss Gundam appena schierato). Resa comprensibile vista la corsa alle shield ampiamente in vantaggio per Kiraya, indipendentemente da cosa sarebbe successo nei turni successivi."
  - "Gundam Barbatos Lupus non è mai comparso in mano in questa partita (nessuna riga nel log) - la valutazione di Kiraya che 'avrebbe vinto con Lupus due turni dopo' è plausibile dato lo stato di shield/board al momento della resa, ma resta una proiezione sui turni successivi non giocati, non verificabile dal log."
  - "Nessun errore tattico isolato individuato lato Kiraya in questa partita. Punti di esecuzione corretti: al t9 1st Form attacca la base Girty Lue (rimuove valore ricorrente) invece del player; al t12 l'unico blocco disponibile (Shiden Custom) viene speso per uccidere il primo Gaia Gundam invece di sprecarlo a vuoto, anche se il 2nd Form muore comunque al secondo attacco non bloccabile - la scelta massimizza comunque il valore ottenuto dal singolo blocco disponibile."
  - "Girty Lue (base avversaria) e Kindhearted tornano a comparire nello stesso pool di carte già visto contro GenocidGIC/altri avversari Earth Alliance/Phantom Pain di questa sessione - conferma che sono staple comuni in quell'archetipo."
