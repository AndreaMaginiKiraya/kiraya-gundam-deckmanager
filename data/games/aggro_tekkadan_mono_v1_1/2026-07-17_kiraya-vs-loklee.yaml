study_notes:
  - "First game with aggro_tekkadan_mono_v1_1, and a loss (21 turns, close - loklee ended it exactly on Kiraya's last shield). loklee played Green/Purple Zeon (Char's Zaku II ST03-006, Zeong GD04-017, Sazabi GD05-052 recursion engine, Rezin's Geara Doga, Quess's Jagd Doga)."
  - "Both Exia Repairs traded off cleanly for early tempo (turns 5-7: killed EX Base, then traded 1-for-1 into Rick Dom and Hobby Hizack via their own destroyed-mill), which is the deck's intended curve - no complaint there."
  - "The Gundam Barbatos Lupus double-activation on turn 13 (exiling 6 cards from trash total across both turns) closed out Zeong immediately, but ate through the graveyard fast; by turn 17 there was nothing meaningful left to exile for a 3rd activation, and Lupus went the rest of the game as a plain 5/5 beater until traded on turn 18."
  - "Sazabi GD05-052's mill-and-recur (turn 16) is a strong value engine when unanswered - it fetched loklee 2 extra Quess's Jagd Doga off one deploy, effectively 1-for-3ing that turn. No answer to it in hand at the time."
  - "Isaribi (the deck's only base) died 3 times in this game (turns 6, 14, 18) and was the actual shield-loss driver in the back half - each replacement gave loklee a fresh Breach-2 window since the deck runs no other base to alternate onto."
  - "Gundam Barbatos 5th Form (Ground Type) and Gundam Barbatos Lupus Rex (the two new v1_1 tech pieces) never showed up in the opening/mid hands this game - no data point on them yet from this match."
