study_notes:
  - "Nona partita con v1_1, quinta sconfitta (4-5). dogman Verde/Blu, Londo Bell/Zeon (Zaku Ⅱ, Jegan, Rick Dom x2, Gundam/Amuro Ray, Nu Gundam x2 - entrambe le copie confermate GD05-020, Kayra's Re-GZ, Re-GZ)."
  - "Svolta al t7: un turno di dogman con 3 attacchi consecutivi (Rick Dom, Zaku Ⅱ, Gundam) elimina Gundam Barbatos 2nd Form, Hyakuren e Graze Custom in un colpo solo - 'No blockers available' su tutti e tre perché il mazzo non ha unità Blocker, non per una scelta sbagliata di Kiraya. Le mosse del turno precedente (t6) erano corrette: il ping di Ryusei-Go su 2nd Form sfrutta il suo bonus AP+2-se-danneggiato, e l'attacco di Hyakuren su Jegan invece che sul player rimuove una minaccia in modo ragionevole."
  - "t10 corretto dopo revisione con Kiraya: nessun attacco dichiarato con Shiden Custom (Ryusei-Go), ma non è un'occasione mancata - era una scelta deliberata per tenerlo attivo e usarlo come blocco al turno 11 di dogman (dove infatti blocca). Ritirata l'ipotesi di errore inizialmente segnalata."
  - "Scarto di Ryusei-Go al t12 confermato non problematico: ha scartato Gundam Barbatos Lupus ma Kiraya ne aveva un'altra copia in mano - non un rischio reale, solo la copia di scorta ridondante mandata al trash (utile comunque come carburante per l'altra copia di Lupus più avanti)."
  - "Buona lettura al t11: con un solo Shiden Custom disponibile per bloccare due attacchi dichiarati (Gundam poi Nu Gundam), la scelta di bloccare Nu Gundam (trade netto: entrambi muoiono) invece di Gundam (che con Repair 2 e HP5 sarebbe sopravvissuto comunque, rendendo il blocco uno spreco) è stata quella corretta - lasciare Isaribi (una base sacrificabile) assorbire il colpo di Gundam invece."
  - "Con la correzione sopra, questa sconfitta non ha errori tattici individuabili lato Kiraya: il turno 7 di dogman (3 attacchi senza blocker disponibili) resta una sconfitta strutturale (il mazzo non ha Blocker), non una sequenza di gioco sbagliabile diversamente."
