  - "Trentunesima partita con v1_1, ventunesima vittoria (20-11). tinki Blu/Bianco, Earth Federation/SEED ibrido (Rick Dias, Gundam NT-1 + Amuro Ray, Gundam + Kira Yamato, Altron Gundam EW, Freedom Gundam, Industrial 7). Vittoria per shield-out al t20: 3 shield rimaste contro 0, dopo una partita lunga e piuttosto equilibrata."
  - "Risolto un altro caso del rompicapo 'Gundam' con lo stesso metodo ormai consolidato (Repair-2 + During Pair AP+1-nel-proprio-turno): qui abbinato a Kira Yamato (ST04-010, non Amuro Ray) - AP3+2(Kira)+1(buff)=6 esatto al t15. Resta un piccolo dettaglio scoperto sulla seconda copia (t17): abbinata a Kira Yamato via 'Paired' invece di 'Linked' (il campo link di ST01-001 nomina Amuro Ray, non Kira Yamato), il suo HP totale sembra non includere il bonus del pilota - possibile che l'addizione delle statistiche richieda un Link vero e non un semplice abbinamento generico, non confermato."
  - "Motore di debuff ripetibile di Kira Yamato (ST04-010) osservato quattro volte (t15, t17, t19 x2): AP-2 in dichiarazione d'attacco applicato ai bersagli di Kiraya, mai devastante da solo ma somma danno extra turno dopo turno - variante più leggera dello stesso principio visto con Heavyarms/Sandrock vs KUMA."
  - "Nessun errore tattico isolato individuato: sequenze ragionevoli per tutta la partita, incluso il t14 dove Lupus preferisce finire la base nemica (valore permanente) piuttosto che un Rick Dias già a 1 HP e comunque rimovibile in seguito."
  - "Isaribi muore una sola volta in tutta la partita (t15) - meglio della media recente del campione, complice anche il fatto che l'avversario non aveva strumenti di rimozione ripetuta della base."
