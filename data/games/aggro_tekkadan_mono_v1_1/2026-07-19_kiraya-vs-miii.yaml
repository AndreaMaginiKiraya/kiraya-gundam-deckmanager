study_notes:
  - "Ventinovesima partita con v1_1, ventesima vittoria (19-10). miii Blu/Verde, Earth Federation/Londo Bell + splash OZ/Zeon (Jegan, Re-GZ/Kayra's Re-GZ, Nu Gundam in due stampe, Corsica Base con token Tallgeese, Rick Dom x2). Vittoria per shield-out netto al t13, ma di misura: 1 shield rimasta contro 0, dopo un t12 quasi disastroso."
  - "Il turno che ha reso la partita 'per un pelo': al t12 miii concatena Nu Gundam (GD05-017, abilità When Paired che salta dichiarazione/blocco) più Tallgeese più Rick Dom in un solo turno, spazzando via Gundam Exia Repair, Graze Custom, Gundam Barbatos 1st Form e Isaribi - quest'ultima addirittura DUE volte nello stesso turno (distrutta da Breach 5, rimpiazzata al volo da una copia in shield via Burst, poi distrutta di nuovo da Breach 2). Nessuna scelta di Kiraya avrebbe potuto attenuarlo: ogni attacco è arrivato con 'No blockers available' per lo stesso motivo di densità Blocker già in checklist (Gusion Rebake e Shiden Custom mai pescati in questa partita)."
  - "Recupero pulito al t13: due attacchi di Hyakuren non contrastati consumano le ultime 2 shield di miii, poi Gundam Barbatos Lupus Rex (abbinato a Mikazuki Augus) chiude in un solo colpo - nessun errore individuato nella sequenza di chiusura."
  - "Terza conferma della stessa giornata/settimana del block-bypass-a-bersaglio-scelto di Nu Gundam (GD05-017, dopo Juuto): qui usato una sola volta (t12) invece di ripetutamente, ma con lo stesso identico effetto composto (uccide un'unità E fa scattare Breach 5 sulla base) - motivo sempre più ricorrente per prendere sul serio questa minaccia specifica nella checklist."
  - "Doppia stampa di Nu Gundam nella stessa partita, di nuovo: GD05-020 (trigger di Deploy 'Placed 1 Resource EX', t8) e GD05-017 (When Paired, t12) - pattern ormai consolidato, sempre distinguibile solo dal trigger osservato."
