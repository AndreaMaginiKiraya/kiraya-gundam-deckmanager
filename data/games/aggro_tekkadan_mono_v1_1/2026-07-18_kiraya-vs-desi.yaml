study_notes:
  - "Diciottesima partita con v1_1, decima vittoria (10-8). desi Blu/Verde, Earth Federation/Londo Bell/AGE System (Gundam + Amuro Ray, famiglia AGE-1/AGE-2 Double Bullet, Re-GZ, Nu Gundam, Jegan, base Ra Cailum). Vittoria per timeout dell'avversario al t18 (non per shield-out naturale: desi aveva ancora 1 shield residua) - Kiraya chiudeva comunque con 4 shield contro 1 e un board nettamente superiore, quindi una posizione già vinta indipendentemente dal timeout."
  - "Nessun errore tattico isolato individuato: partita eseguita in modo pulito dall'apertura (Exia Repair su EX Base) fino alla chiusura, inclusi trade sempre a favore o alla pari."
  - "Miglior prova finora di Gundam Barbatos Lupus come motore in un singolo turno: al t15 la SECONDA copia di Lupus si attiva DUE volte nello stesso turno (6 carte esiliate in tutto), concatenando 2 ping da 2 danni con un attacco di Barbatos Adapt in mezzo per finire Gundam AGE-2 Double Bullet (HP5) a suon di chip - un solo bersaglio, tre fonti di danno diverse nello stesso turno invece di sprecarle su tre bersagli separati. Prima copia di Lupus (t13) aveva già chiuso da sola con una singola attivazione + tris di attacchi su shield/base. Tre attivazioni totali in una partita da due copie distinte."
  - "Quinta/sesta conferma del problema di densità Blocker (checklist item 5): Shiden Custom (Ryusei-Go) muore in trade al t11 senza mai bloccare, Gundam Gusion Rebake arriva solo al t17 (ultimo turno giocato) - nessuno dei due era mai disponibile come blocco nei momenti critici (t6, t10, t14) di questa partita, coerente con la densità 12% già documentata piuttosto che un'anomalia isolata."
  - "Quinta coppia di stampe condivise nella stessa partita (dopo Nu Gundam, Kira Yamato, Sword Impulse Gundam, Sazabi): Amuro Ray appare in due prints diverse nello stesso turno (t14) - ST01-010 (rest su unità nemica <=5 HP, innescato due volte: su Hyakuren al t6 e su Gundam Barbatos Lupus al t14) e GD05-085 (cura 2 HP all'unità abbinata quando distrugge un nemico in combattimento, innescato su Nu Gundam al t14). Riconoscibili solo dall'effetto osservato, mai dal nome."
  - "Interazione da tenere a mente per futuri import: il modificatore di una base attivata (qui Ra Cailum su Nu Gundam, t14) può alterare sia l'AP che l'HP effettivi di un'unità abbastanza da rendere l'aritmetica del combattimento non deducibile dalle sole statistiche stampate + pilota abbinato - senza la riga 'Modifier applied to: X' esplicita nel log, il calcolo dei danni osservati può sembrare inconsistente con qualunque stampa candidata (successo qui con Nu Gundam grazie alla riga esplicita, fallito con 'Gundam' al t6/t11 dove nessun modificatore è stato loggato e i danni AP restano di 1 punto scoperti rispetto a tutte le stampe candidate)."
