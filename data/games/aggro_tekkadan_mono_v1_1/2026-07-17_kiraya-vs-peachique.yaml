study_notes:
  - "Tredicesima partita con v1_1, settima vittoria (7-6) - vittoria per shield-out netta al t13, 2 shield rimaste contro 0. peachique Blu/Verde, Londo Bell (ReZEL, Kayra's Jegan/Kayra Su, Nu Gundam in entrambe le stampe, Amuro Ray, A Show of Resolve, Davao)."
  - "Partita giocata in modo pulito dall'inizio alla fine, nessun errore tattico individuato. Punti di esecuzione da segnalare: t7, il ping di Mikazuki Augus ammorbidisce ReZEL prima che Graze Custom lo finisca in combattimento (trade a parità di costo su una minaccia reale); t11, quattro attacchi dichiarati nello stesso turno (Flauros, Graze Custom, Ryusei-Go, Hyakuren) con zero bloccanti disponibili per peachique - saturazione da manuale, distrugge una base e toglie 3 shield in un colpo; t13, sequenza di chiusura corretta (Adapt abbassa Davao a 1 HP, Graze Custom lo finisce, Ryusei-Go resta libero per colpire il player e chiudere la partita)."
  - "Conferma indiretta della regola 'le statistiche del pilota si sommano all'unità quando è in coppia' (osservata già in altre partite): ogni scambio con un'unità pilotata di peachique produce danno esattamente pari ad AP-unità + AP-pilota (es. Nu Gundam AP4/5 + Amuro Ray AP2), utile per riconoscere le stampe corrette nei prossimi import."
  - "Gundam Barbatos Lupus non pescato in questa partita, e non è mai servito: il mazzo ha vinto sulla sola pressione di corpi economici e ping ben piazzati, altro dato a favore del fatto che il piano-motore non è indispensabile ogni volta (vedi anche la rivincita vs GenocidGIC)."
  - "Trovata una terza coppia di stampe condivise nella stessa partita (Nu Gundam, GD05-020 e GD05-017 - stesso schema già visto con Kira Yamato e Sword Impulse Gundam in partite precedenti)."
