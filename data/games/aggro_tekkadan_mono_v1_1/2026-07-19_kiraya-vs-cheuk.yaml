  - "Trentatreesima partita con v1_1, ventitreesima vittoria (22-11). Cheuk Blu/Verde, Londo Bell (Zaku II + Kayra Su, Jegan, Re-GZ/Re-GZ BWS/Kayra's Re-GZ, Nu Gundam in due stampe + Amuro Ray, Ra Cailum). Vittoria per shield-out al t18: partita lunga e combattuta nonostante l'avversario abbia usato ripetutamente la stessa combo letale già vista contro Juuto e miii."
  - "Nu Gundam (GD05-017) usa la sua abilità When Paired che salta dichiarazione/blocco DUE volte in questa partita (t10, t12), colpendo direttamente Gundam Barbatos 2nd Form e Gundam Gusion Rebake, entrambe le volte innescando <Breach 5> - stessa combo devastante di Juuto e miii, ma stavolta la partita si vince comunque: la differenza è che Cheuk non ha mai un secondo Nu Gundam pronto abbastanza in fretta da ripetere il colpo su Lupus, e il ritmo di Kiraya regge lo stesso."
  - "Isaribi distrutta tre volte in tutta la partita (t10, t12, t16), sempre da Breach 5 o da un attacco diretto di Nu Gundam - la dimostrazione più insistente finora del collo di bottiglia della base singola, eppure senza conseguenze decisive sul risultato finale."
  - "Tech dell'avversario già nota che si ripresenta: al t14 Amuro Ray (ST01-010) linkato a Re-GZ resta Gundam Barbatos Lupus con la propria abilità prima che Re-GZ lo attacchi e lo distrugga - stessa famiglia della tech di Domon Kasshu/Master Asia vista contro jaysanti."
  - "Nessun errore tattico individuato: il blocco con Shiden Custom (Ryusei-Go) al t10 contro Nu Gundam è la scelta corretta anche se porta comunque alla sua perdita - infligge più danno di ritorno (AP4) di quanto avrebbe fatto Gundam Barbatos 1st Form lasciato senza blocco (AP3), e un'unità sarebbe comunque morta in entrambi i casi."
