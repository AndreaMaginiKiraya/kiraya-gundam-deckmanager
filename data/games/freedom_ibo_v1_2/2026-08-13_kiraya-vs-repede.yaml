study_notes:
  - "REAL MISPLAY FOUND, requested critical review: at t14, Kiraya attacked with Strike Rouge (Ootori) — the deck's only <Blocker>-capable unit all game — into Gundam Lfrith (a chump-blocker), instead of holding it back untapped. This tapped it out for the rest of the turn cycle, so it was unavailable when Repede's t15 alpha strike (V-Dash Gundam, Aile Strike Gundam, freshly-deployed Freedom Gundam — 3 attackers) came in with 'No blockers available' each time. The Aile Strike Gundam hit at t15 consumed Kiraya's second-to-last shield; the following Freedom Gundam hit was the fatal one. Had Strike Rouge (Ootori) been kept back, it could have blocked that Aile Strike Gundam attack instead (a good trade regardless of outcome — Strike Rouge dying to block is fine when it's the last blocker before lethal range), preserving that shield and very plausibly surviving Freedom Gundam's hit into t16. The t14 attack itself only achieved killing a chump blocker (Gundam Lfrith) — low value compared to what keeping the blocker available was worth given Kiraya was already deep into the shield pile and Repede had 2 live attackers plus visible gas (A Show of Resolve had just refilled their hand at t11)."
  - "Widespread Annihilation (GD05-114) is NOT a targeted-removal choice — its Main ability is 'Destroy all Units that are Lv.4 or lower', an automatic board wipe, not something Kiraya picked a target for. At t10 the only Lv.4-or-lower Unit Repede controlled was the already-weakened Victory Gundam (Lv.4) — Aile Strike Gundam (confirmed Lv.5 by its own trigger text) was never a legal target regardless of choice. So there's no 'should have hit the bigger threat instead' error here: the card did everything it could have done that turn."
  - "Matchup mechanic worth remembering for next time: Repede's Kira Yamato (ST04-010, confirmed by its repeatable 【Attack】AP-2 trigger) fired on every single one of Repede's attacks from t13 onward, each time targeting Strike Rouge (Ootori) specifically — a deliberate, recurring pattern of preemptively weakening Kiraya's only blocker before combat, on top of V-Dash Gundam's own Activate ability resting that same Strike Rouge Ootori at t13 to deny it as a blocker outright that turn. This deck has two independent, repeatable ways to neutralize a single Blocker-package deck's one blocker-capable unit — worth factoring into future blocking-timing decisions against this list."
  - "Net verdict: unlike prior losses this campaign, this one does have a concrete, actionable lesson — hold your only Blocker-capable unit back once you're low on shields and the opponent has multiple live attackers, even if it means passing up a favorable-looking trade. The t9 losses (Gundam Exia Repair's unlucky mill of Hyakuren+Strike Freedom Gundam, M1 Astray Shrike sniped directly by Victory Gundam, Strike Rouge Ootori bounced by Aile Strike Gundam's pairing trigger) were bad luck/opponent-tech, not misplays — but t14's attack decision was avoidable and reads as the turn that actually cost the game."
