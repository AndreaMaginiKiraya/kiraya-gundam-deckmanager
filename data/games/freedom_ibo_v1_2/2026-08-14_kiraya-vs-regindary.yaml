study_notes:
  - "Finale insolito: la partita termina al t19 senza un attacco esplicito nel log — Regindary gioca solo una base (Ra Cailum) e Kiraya vince subito dopo. Regindary aveva pescato in modo molto aggressivo per tutta la partita (3 copie di A Show of Resolve, Encounter, più i ripetuti 'returned to deck top' di Kayra's Re-GZ che rimescolano/ripescano), quindi la spiegazione più probabile è un deck-out (mazzo esaurito a inizio turno) piuttosto che una vittoria per scudi — da tenere presente come esito valido ma raro in questa campagna, non un artefatto di parsing (nessuna riga non interpretata)."
  - "Quinta vittoria di fila della campagna contro il matchup Nu Gundam/Amuro Ray Londo Bell (archetipo ora 5-1, 83,3%): Gundam Barbatos Lupus ripete la firma della doppia attivazione nello stesso turno (t16, 6 carte esiliate uccidono sia Kayra's Re-GZ sia Re-GZ), lo stesso schema già decisivo nelle partite precedenti contro questo archetipo."
  - "Strike Freedom Gundam ha negato un investimento avversario a metà partita: al t14, mentre distruggeva Ra Cailum, il suo During-Pair/Attack ha rimandato in fondo al mazzo il 'Gundam' di Regindary (appena appaiato ad Amuro Ray al turno precedente) — un turno di sviluppo avversario vanificato, coerente con l'uso già visto di questa abilità in altre partite della campagna."
  - "Notare: nonostante Kiraya abbia perso più carte-scudo nel corso della partita di Regindary (arrivando a corto di scudi da aggiungere in mano già dal t16, 'No more Shield cards to add to hand'), la partita è stata comunque vinta — la corsa sugli scudi non è l'unico modo in cui questo mazzo può chiudere una partita contro questo archetipo, il logoramento generale (units + risorse di carte) ha contato altrettanto."
