study_notes:
  - "Vittoria meritata su scambi efficienti più che su un colpo singolo: Gundam Barbatos Adapt (t8) e Gundam Barbatos 1st Form (t10) si sacrificano entrambi in scambi 1-per-1 puliti (Michaelis, poi Gundam Aerial Rebuild) proprio mentre le abilità Deploy/Link di Suletta Mercury li avevano già indeboliti — nessuna unità di Kiraya persa senza portarsi via qualcosa in cambio nei primi 10 turni."
  - "Darilbalde di HoloBurst (GD01-075, Deploy: rimanda in mano 1 unità nemica con 1 HP) ha fallito il proprio trigger entrambe le volte che è stato schierato ('No targets for Darilbalde', t11 e t13) — nessuna unità di Kiraya si è mai trovata esattamente a 1 HP nel momento sbagliato, il che ha reso una carta potenzialmente pericolosa un corpo vuoto per tutta la partita."
  - "Il finale (t16-18) ha sommato tre vantaggi nello stesso arco di turni: Strike Freedom Gundam ha rimandato in fondo al mazzo Gundam Aerial (Mirasoul Flight Unit) di HoloBurst (con Suletta Mercury agganciata) proprio mentre distruggeva Quiet Zero, poi Gundam Barbatos Lupus ha eliminato gratis Gundnode con la doppia attivazione, lasciando HoloBurst senza risposte per il colpo finale — nessuna singola giocata risolutiva, ma un accumulo di piccoli vantaggi ben sequenziati."
  - "Prima vittoria della campagna contro un deck Witch from Mercury/Academy (Suletta Mercury, famiglia Gundam Aerial, Quiet Zero, Darilbalde, Michaelis) — l'unico precedente contro questo archetipo largo era una sconfitta netta in freedom_ibo_v1_2 (partita #8, contro una lista molto più orientata al controllo con Gundam Calibarn). Lista di HoloBurst più aggressiva/aerea che di controllo puro, profilo diverso ma stesso trait (Academy) di base."
