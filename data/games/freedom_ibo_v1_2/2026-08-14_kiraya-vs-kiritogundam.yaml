study_notes:
  - "Vittoria sul filo, per ammissione di Kiraya quasi un 'miracolo': entrambi i giocatori hanno consumato quasi tutti gli scudi (Kiraya finisce a 0 rimaste su 6, キリトガンダム a 1 su 6) — un vero testa a testa fino all'ultimo turno."
  - "Doppio Widespread Annihilation ben piazzato: al t14 un 2-per-0 pulito (entrambe le copie di Guntank appena schierate), al t18 un 3-per-0 ancora più ampio (Jegan, Rick Dom, Graze Custom) — la seconda copia ha ripulito il board avversario proprio prima che Kiraya potesse sviluppare Strike Freedom Gundam senza opposizione immediata."
  - "Amuro Ray di キリトガンダム non ha mai mostrato l'abilità di cura-da-uccisione (GD05-085) in tutta la partita nonostante due kill da danno da battaglia (M1 Astray Shrike al t9, doppio kill di Nu Gundam al t15) — coerente solo con ST01-010 (riposo), confermato anche dal trigger diretto al t9. A differenza di altre partite di questa campagna, qui non c'è stato bisogno di splittare per istanza."
  - "Il finale (t20-23) è deciso più dall'accumulo di pescate extra (Strike Freedom Gundam + Kira Yamato agganciati, 3 pescate nello stesso turno) che da un singolo colpo — キリトガンダム ha ancora 1 scudo e un Jegan in campo al t23, ma la partita si chiude comunque a favore di Kiraya, probabile resa di fronte a un board ormai incolmabile (Strike Freedom Gundam e Gundam Flauros ancora vivi contro il solo Jegan avversario)."
