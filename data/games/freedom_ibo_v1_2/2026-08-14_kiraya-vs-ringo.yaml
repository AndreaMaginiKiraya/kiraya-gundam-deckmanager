study_notes:
  - "Vittoria durissima e sofferta (22 turni) contro lo stesso archetipo Calibarn/Schwarzette Academy che aveva già battuto Kiraya (vedi partita contro Altis) — seconda vittoria/prima vittoria reale dopo quella sconfitta, per ammissione di Kiraya un matchup molto duro e in crescita nel meta locale."
  - "Gundam Schwarzette (GD05-022, Activate·Action: esilia 2 Comandi dal cimitero, riduci di 2 il danno ricevuto in questa battaglia) si è dimostrata un vero motore di sopravvivenza: attivata 3 volte in un solo attacco al t17 (riduzione totale da 7 a 1 danno netto) e 2 volte al t18, alimentata proprio dalle carte di rimozione di ringo stesso (Airframe Seizure, Darkness Finger, Close Combat, Improved Technique) una volta finite in cimitero — più il mazzo usa rimozione, più carburante si accumula per questa carta."
  - "Strike Freedom Gundam è stato distrutto due volte (t17, contro Gundam Schwarzette; t21, contro Gundam Calibarn) ma Kiraya lo ha rischierato entrambe le volte grazie alle copie multiple in mazzo — è stata proprio la terza copia (t22, agganciata a Kira Yamato) a portare il colpo finale. La resilienza della ridondanza (4 copie in lista) ha pagato più della sopravvivenza di una singola copia."
  - "Widespread Annihilation al t20 ha eliminato entrambi gli Zaku Ⅱ appena schierati (2-per-1 pulito) prima che potessero mai attaccare — tempismo perfetto contro un turno avversario che aveva messo in campo Gundam Calibarn + Fortress Defense + 2 Zaku Ⅱ + Gundam Lfrith Thorn tutto insieme."
  - "Gundam Barbatos Lupus ha continuato a fare da workhorse con doppie attivazioni multiple (t16, t20) prima di essere infine spazzato via da Gundam Schwarzette al t21 — la stessa carta MVP vista in quasi tutte le vittorie recenti di questa campagna."
