study_notes:
  - "Sazabi (GD05-049, Neo Zeon) is a genuinely nasty recurring threat, worth remembering for future matchups: its Attack ability lets the controller destroy one of their OWN Units as a cost, and if they do, the opponent is forced to destroy one of their own non-battling Units too. Iseria fired this 3 times (t13, t15, t19), always sacrificing cheap same-turn fodder (Graze Custom, Ryusei-Go (Graze Custom Ⅱ), Gundam Barbatos 1st Form) to force Kiraya into destroying a real threat each time: Gundam Barbatos Lupus (t13), Strike Freedom Gundam (t15), Gundam Gusion Rebake (t19). This isn't a targeting mistake by Iseria — sacrificing a 1-cost unit to kill Kiraya's best available threat is a great rate for them."
  - "The real reason the Sazabi engine didn't run away with the game: Strike Freedom Gundam's own attack ability bounced Sazabi AND its paired Char Aznable back to Iseria's deck 3 separate times (t14, t16, t20) — each time forcing Iseria to redraw and redeploy the whole package from scratch, paying its full cost again. This tempo answer, not any single combat trick, is what let Kiraya out-race a card that was individually destroying a real Kiraya unit every time it attacked."
  - "Not a full shutout like the two prior wins — Kiraya lost 2 shields this game (1 remaining at the end vs. Iseria's 0) and lost 8 units/bases total (including 3 real threats to Sazabi) against Iseria's 12. A genuinely 'a bit long' game as Kiraya described it, kept under control by consistently having an answer (Strike Freedom Gundam's bounce, Barbatos Lupus's exile-for-damage) rather than by racing unopposed."
  - "Iseria's list shares almost the entire Tekkadan core package with Kiraya's own (Barbatos Adapt/1st Form/Lupus, Gusion Rebake, Flauros, Graze Custom, Hyakuren, Gundam Exia Repair) with a Neo Zeon splash (Sazabi/Char Aznable) instead of Strike Freedom Gundam/Kira Yamato — closer to a partial mirror than a fully distinct archetype. Classified here as Neo Zeon given Sazabi's confirmed trait, alongside the earlier Zeong/Char's Zaku Ⅱ encounter (WiNG)."
