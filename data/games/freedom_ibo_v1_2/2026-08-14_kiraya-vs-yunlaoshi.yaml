study_notes:
  - "Vittoria costruita alla lunga contro un mazzo quasi mirror (stesso nucleo Tekkadan — Barbatos Adapt/1st Form/Lupus, Gusion Rebake, Flauros Ryusei-Go — più splash SEED/Orb con Strike Freedom Gundam/Kira Yamato/Strike Rouge Ootori): a differenza di altre partite, qui la singola copia di Gundam Barbatos Lupus di Kiraya ha lavorato su più turni separati (t14, t18 x2, t20) invece che con la solita doppia attivazione nello stesso turno, ma il risultato netto è stato lo stesso — pressione costante che ha eroso il board avversario pezzo dopo pezzo."
  - "云老师 ha portato Gundam Barbatos Lupus Rex (GD05-051, LR, AP che aumenta con i danni ricevuti + fine turno: 1 danno a una propria unità Tekkadan per riattivarla) — una vera minaccia crescente, ma alla fine si è autodistrutta: al t19, già a 1 HP dopo aver bloccato Gundam Gusion Rebake, l'attivazione di fine turno (1 danno a sé stessa per riattivarsi) l'ha finita da sola. Da ricordare per il futuro: questa carta cresce more si danneggia, va rimossa prima che accumuli troppi contatori di danno, non lasciata a sanguinare."
  - "Widespread Annihilation di 云老师 al t19 (2-per-0 su Barbatos 1st Form + Barbatos Adapt) è arrivata troppo tardi per cambiare l'esito — il vantaggio di scudi (Kiraya 0 persi contro gli scudi già ridotti dell'avversario) era già consolidato da diversi turni."
  - "Chiusura per probabile resa al t20: Kiraya schiera un'altra Strike Freedom Gundam (terza copia in campo nel corso della partita) agganciata a Kira Yamato per l'ennesima pescata extra, mentre 云老师 rimane con il solo Hyakuren appena schierato sul board — nessun attacco finale esplicito nel log, ma la partita si chiude comunque a favore di Kiraya."
