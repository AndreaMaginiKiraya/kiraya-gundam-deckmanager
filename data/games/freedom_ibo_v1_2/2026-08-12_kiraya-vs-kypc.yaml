study_notes:
  - "Kiraya's early curve raced ahead unanswered: Graze Custom deployed t2 and t4 with no KYPC board presence until t7, chipping the EX Base down and then straight through 2 shields (t6, t8) before KYPC ever interacted."
  - "KYPC's only removal this game was a single Darkness Finger (GD05-110) at t8, killing one Graze Custom — the same recurring single-target removal piece seen in every MF/G Gundam loss this campaign, but only landing once instead of compounding."
  - "Master Asia (GD05-089) came down via an unusual line: revealed as a shield at t8, its Burst check ('if 3+ (MF) cards in your trash, you may deploy it as an AP3/HP3 Unit instead') was already satisfied (Master Gundam discarded t3, Shining Gundam and Gundam Maxter discarded as shields t6/t8), so it entered play directly as a body off a shield reveal rather than going to hand — worth remembering that MF's shield-burst can put a Unit into play, not just card advantage."
  - "t9 KYPC's Shining Gundam (GD05-066) recursion engine fired exactly as in the losses — exile 2 (MF) trash Units, return Darkness Finger to hand — but this time it never got recast: KYPC spent the turn's remaining resources on Argama and an Unforeseen Incident block instead, and the returned Darkness Finger sat unused for the rest of the (short) game."
  - "t10 closed it out efficiently: Kira Yamato linked to Strike Rouge (Ootori) twice for 2 extra draws, Argama died to the first swing, and 2 more shields fell to Graze Custom before a second linked Strike Rouge (Ootori) delivered lethal with KYPC already at 0 shields."
  - "Net verdict: a useful contrast with the recent MF/G Gundam losses (see freedom_ibo_v1_2/2026-08-12_kiraya-vs-sol.yaml) — Master Gundam itself never came back into play here (discarded t3 to Overflowing Affection and never redrawn), so the Darkness Finger bonus-draw and Master Gundam's own trash-exile-for-shield-damage never turned on, and the Shining Gundam engine only got one cycle instead of two. The pattern so far: this matchup is winnable when the aggro curve closes the game before Master Gundam assembles its full recursion package, and dangerous once it does — racing the clock looks like the real answer, not a dedicated tech card."
