study_notes:
  - "A genuinely hard-fought 35-turn grind, not a clean win — the game swung on two separate Strike Freedom Gundam mirror exchanges rather than any single decisive turn."
  - "t7's Graceful Demeanor (bouncing both Graze Custom and Gundam Barbatos 1st Form back to hand mid-combat) denied what would have been a 2-for-1 attacking turn right out of the gate — a strong, early answer from AZZ that set the tone for a close game rather than a snowball."
  - "t15 was Kiraya's best turn (Gundam Barbatos Lupus finishing Strike Rouge (Kira's Unit), Strike Freedom Gundam deploying and drawing twice off Kira Yamato plus its own Deploy/Attack triggers, then a Mikazuki Augus-boosted Graze Custom finishing the second Victory Gundam) — but AZZ answered immediately at t16 with their own Strike Freedom Gundam, whose paired Attack ability bounced Kiraya's Strike Freedom Gundam AND its paired Kira Yamato to the bottom of the deck in one shot, erasing most of that tempo swing in a single card."
  - "t20 was the turning point: AZZ's Strike Freedom Gundam killed Gundam Gusion Rebake as a blocker, then traded into Kiraya's own Strike Freedom Gundam (Kira Yamato's AP-2 debuff swinging that exchange in AZZ's favor), and Freedom Gundam finished the job — but Freedom Gundam died to the counter-damage too. Net for the turn: Kiraya lost Gusion Rebake + Strike Freedom Gundam, AZZ lost Strike Freedom Gundam + Freedom Gundam, roughly even on bodies but AZZ had already banked more card draws from repeated Strike Freedom Gundam triggers by this point."
  - "t21's Gundam Barbatos Lupus double-activation (finishing AZZ's last Strike Freedom Gundam, dying itself to the counter-attack) closed out the mirror war at parity — from here the game was a slower grind of League Militaire pieces (Victory Gundam, V-Dash Gundam) against Kiraya's remaining toolbox bodies, decided by AZZ running out of shields first at t35."
  - "No clear misplay stands out — both t16 (AZZ's SFG bounce) and t20 (the mirror trade) were opponent-initiated swings that Kiraya couldn't have prevented once committed to deploying Strike Freedom Gundam into an opponent who had their own copies. The win came from grinding back the parity after t20 and from AZZ's shields running out one turn before Kiraya's, not from a single big blowout turn."
