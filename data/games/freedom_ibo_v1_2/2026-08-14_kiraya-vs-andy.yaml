study_notes:
  - "Vittoria vinta per abbandono al t16, ma il punteggio scudi era già praticamente pari: entrambi i giocatori finiscono a 0 scudi rimasti (Kiraya 3 persi + 2 in mano + 1 schierata, Andy 5 persi + 1 in mano) — una vera corsa punto a punto, coerente con la lettura di Kiraya ('vinta per poco')."
  - "Gundam Barbatos Lupus ha fatto il lavoro decisivo con due attivazioni singole in turni separati (t12 uccide Re-GZ, t14 uccide Kayra's Re-GZ) invece della solita doppia attivazione nello stesso turno — comunque efficace, ha eliminato 2 minacce chiave del pacchetto Nu Gundam/Amuro Ray prima che potessero stabilizzarsi (Nu Gundam stesso non è mai arrivato in campo)."
  - "Amuro Ray di Andy ha mostrato entrambe le stampe (ST01-010 al t9 su 'Gundam', GD05-085 al t11/t15 su Re-GZ, con cura-da-uccisione confermata due volte) — stessa scoperta ricorrente in questo archetipo, non una stampa fissa."
  - "Curioso: senza Nu Gundam mai sceso, il pacchetto avversario è rimasto sulla sola combo Gundam/Re-GZ + Amuro Ray — un profilo più debole del solito per questo archetipo, e probabilmente il motivo per cui Andy si è arreso appena il divario di scudi si è azzerato senza una vera minaccia di chiusura in mano."
