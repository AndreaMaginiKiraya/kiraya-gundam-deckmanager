study_notes:
  - "Partita persa sul filo, non per un errore: entrambi finiscono a 0 scudi rimasti (3 persi ciascuno) e il conteggio unità perse è quasi pari (8 Kiraya / 5 Alvarn) — una vera corsa punto a punto decisa dall'ultimo attacco, non da un singolo colpo decisivo. Kiraya non ha mai pescato nessuna delle 4 copie di Strike Freedom Gundam in 19 turni: senza il suo During-Pair/Attack (discard 2, rimanda l'unità nemica di Lv più basso) o senza il corpo AP5/HP6 da schierare come bloccante d'emergenza, è mancato lo strumento che ha chiuso quasi tutte le altre vittorie di questa campagna contro lo stesso archetipo (vedi partite #1, #22, #24)."
  - "Il colpo letale al t19 è stato reso possibile dal When-Paired di Amuro Ray (ST01-010): appaiato al 'Gundam' (ST01-001) avversario, ha riposato Gundam Gusion Rebake di Kiraya — l'unico corpo <Blocker> ancora in campo — nello stesso turno in cui è arrivato l'attacco letale, lasciando Kiraya senza bloccanti disponibili e già a 0 scudi. Stesso identico meccanismo già visto/temuto in altri matchup Nu Gundam/Amuro Ray: il riposo preventivo del bloccante, non un attacco a sorpresa, è la vera minaccia di questo pacchetto."
  - "Doppia Widespread Annihilation ben giocata: al t12 un 6-per-1 quasi perfetto (Guntank, Gundam, Re-GZ, ReZEL, Zaku Ⅱ avversari contro solo il proprio Graze Custom) spazza via l'intero board di Alvarn tranne il 'Gundam' col Repair; al t14 un pulito 2-per-0 (Rick Dom + Jegan) senza perdite proprie. Le due copie hanno fatto esattamente il lavoro per cui sono incluse nel mazzo."
  - "Il t16-17 è stato uno scambio quasi perfettamente alla pari tra le due bombe di fascia alta: Gundam Barbatos Lupus (doppia attivazione, 4 danni totali) uccide Gundam NT-1, poi Nu Gundam (agganciato ad Amuro Ray) uccide sia M1 Astray (Shrike) sia — nello stesso turno avversario — lo stesso Gundam Barbatos Lupus in un secondo attacco, autodistruggendosi nel processo (7 danni a testa). Nessuno dei due giocatori ne esce avvantaggiato: il vero differenziale è stato la mano, non la sequenza di gioco."
