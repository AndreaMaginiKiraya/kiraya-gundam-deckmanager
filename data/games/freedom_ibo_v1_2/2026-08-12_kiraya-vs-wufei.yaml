study_notes:
  - "A real, evidence-backed misplay found, and it's specifically about Blockers — but not the one you'd guess from 'no blockers available' recurring so much: Gundam Gusion Rebake's own Deploy ability ('choose 1 of your Units and 1 enemy Unit, deal 1 damage to them') was self-targeted on BOTH copies (t10: 'Dealt 1 damage to: Gundam Gusion Rebake and Victory Gundam'; t12: '...and Parts'), even though other, less critical friendly units were on board both times (a Graze Custom, a surviving Gundam Barbatos Adapt). That's optional — the friendly target doesn't have to be itself. Both self-pings dropped Gusion Rebake to exactly 4 HP, which is precisely the threshold Wufei's V-Dash Gundam needs ('choose 1 enemy Unit with 4 or less HP, rest it') to rest it and then kill it outright for free — and that combo landed twice (t15, t17), removing both copies of your only reliable Blocker without you ever getting to choose whether it blocked. Pinging the ping onto Graze Custom/Barbatos Adapt instead both times would have kept Gusion Rebake at full HP5, out of range of that ability entirely."
  - "Strike Rouge (Ootori)'s HP4 is not something a play decision can fix — it sits exactly on the same 4-or-less threshold, so t15's Aile Strike Gundam pairing (a Lv.4+ Pilot bounces 1 enemy Unit with 4 or less HP to hand) removed it as a blocker option before V-Dash Gundam even acted that turn, with no discretionary choice available to you. Between that and the Gusion Rebake finding above, this matchup specifically punishes a Blocker package that clusters around HP4 — worth flagging as a real deck-vs-matchup weakness, not just this game's variance."
  - "So 'no blockers available' recurring through the whole back half wasn't really you failing to play around Wufei's Blockers (Wufei barely used any — only Aile Strike Gundam blocked once, at t20) — it was Wufei's kit systematically removing yours before you got a choice. The one avoidable piece of that was the Gusion Rebake self-ping."
  - "t18's Strike Freedom Gundam attack into V-Dash Gundam is a defensible tradeoff, not a misplay: it killed a real recurring threat (the same rest-then-kill engine that had already cost you Gusion Rebake once, and would again at t17... wait, t17 already happened by t18, so this was killing the copy that had just done it) at the cost of leaving Strike Freedom Gundam at 4 of its 8 effective HP. That exposure is exactly what let Freedom Gundam kill it 3 turns later at t21 — a real cost, but proactively removing a repeatable removal engine is generally the right call; this is the turning point of the game, not a clear error."
  - "Overall: this was a genuinely tough matchup (SEED/Orb toolbox with a League Militaire removal package layering two separate 'target an enemy Unit with 4 or less HP' effects on top of a Kira Yamato AP-2/pairing-modifier package), not a game lost to sequencing mistakes in the moment — except for the repeated Gusion Rebake self-ping, which is the one concrete, fixable habit here."
