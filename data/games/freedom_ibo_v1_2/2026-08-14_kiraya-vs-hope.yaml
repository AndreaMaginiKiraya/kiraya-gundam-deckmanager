study_notes:
  - "Mining Asteroid Palau (Hope's EX-Base replacement, 6 HP) absorbed the entire early game: Graze Custom alone chipped it 3 separate times (t5, t11, t13) for 2 each before Gundam Barbatos Adapt finished the first copy at t11 — Hope replayed a second copy at t12 that lasted only until Strike Freedom Gundam's 7-damage attack at t15. A single repeatable 2-damage attacker is enough to out-race a base that doesn't heal."
  - "GFreD's Activate ability (exile 1 Pilot from trash: 1 damage to all enemy Units) hit 4 of Kiraya's units at once at t10 (Graze Custom, both Strike Rouge Ootori, Gundam Barbatos Adapt) but didn't kill anything — a reminder this card is board-wide chip damage, not removal, and cheap for Hope to fuel (paid with their own already-discarded Kira Yamato)."
  - "GQuuuuuuX (Omega Psycommu, GD03-034) confirmed again as a real bomba (see also game #16 vs Repede): its Deploy dealt 3 free damage, one-shotting Gundam Flauros (Ryusei-Go) at 3 HP the instant it hit the board. No response available since it wasn't a combat trade — worth remembering as a Deploy-timing threat to any 3-HP-or-less unit, not just an attacker to block."
  - "The winning turn (t15) stacked three separate Strike Freedom Gundam/Strike Rouge (Ootori) triggers in sequence: Strike Freedom's own Deploy (draw on kill, applied to both units), Kira Yamato's When-Linked draw, and the During-Pair/Attack discard-2-bounce-lowest-Lv that removed Silver Bullet from the board entirely (returned to bottom of deck) while still landing lethal-range damage on Mining Asteroid Palau. Chaining Strike Freedom Gundam's own abilities with a second paired unit in the same turn is what let one attack step both draw cards and answer a live threat simultaneously."
  - "Fourth win vs a Toolbox SEED/Orb-adjacent multi-color pile (Hope ran Red/White: GFreD/Zeon splash, Justice Gundam, Silver Bullet, GQuuuuuuX/Clan) — no Blocker-capable unit ever appeared on Hope's side, so every Kiraya attack after t5 went through unopposed once Gundam Lfrith traded off at t13. Opponent conceded at 0 shields with a second Strike Freedom Gundam already in hand to finish it."
