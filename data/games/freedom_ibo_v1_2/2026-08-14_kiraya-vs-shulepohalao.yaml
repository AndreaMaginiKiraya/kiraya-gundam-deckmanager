study_notes:
  - "Dominant, fast win (9 turns, opponent conceded) confirmed by the client screenshot ('Opponent conceded!'). Kiraya's shields were never touched all game (0 lost, 3 remaining) while 输了打老婆 lost all 6. Even the early Zeon-swarm opener (2x Zaku Ⅱ at t3, both later buffed AP+2 on attack) only ever chipped the EX Base and one shield before Kiraya's counter-curve took over."
  - "t6 was the turning point: M1 Astray Shrike's Deploy ping killed a Zaku Ⅱ outright, Graze Custom traded into the other, and Gundam Barbatos 1st Form destroyed the opponent's brand-new Ra Cailum base unopposed — all in one turn. The opponent rebuilt Ra Cailum from a shield reveal the same turn, only for Kiraya to destroy it again at t8."
  - "Opponent's toolbox (Rick Dom/Zeon opener, Graham's Union Flag Custom/Graham Aker splash, Nu Gundam/Amuro Ray/Londo Bell payoff) mirrors the same broad archetype as the very first game this campaign (2026-08-12 vs AZZ, 'Toolbox Gundam + Amuro Ray') — Nu Gundam (GD05-020, confirmed by its 'place 1 EX Resource if 2+ Londo Bell in trash' Deploy trigger) only landed at t9, far too late to matter."
  - "No misplay to review — a clean, well-sequenced win where every Kiraya deploy immediately generated value (kills, base destruction, or unopposed shield damage) and the opponent never found a stable turn."
