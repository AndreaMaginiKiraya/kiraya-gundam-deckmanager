study_notes:
  - "ama played a genuinely disciplined pure-control plan — zero Units deployed until t15 (turn 15 of 21!), spending 11 turns purely on precise single-target removal (Close Combat x2+, Improved Technique, Overwhelming Pressure, Darkness Finger x2) to answer every Kiraya threat one at a time (Graze Custom t4, Hyakuren t6, chipping Gundam Gusion Rebake and Gundam Barbatos Lupus down repeatedly) while converting excess removal into card draw via Airframe Seizure."
  - "Two lucky shield reveals denied ama's actual bombs for free: Unicorn Gundam 02 Banshee (Destroy Mode) was discarded straight from the shield zone at t14, and the first Kshatriya copy the same way at t16 — both top-end threats that never got to matter. ama's second Kshatriya copy did land at t17 (Marida Cruz's pair-ping killed Gundam Barbatos 1st Form, then it hit face) but was traded away cleanly by Gundam Flauros (Ryusei-Go) the very next turn."
  - "Kiraya's own shields were never touched all game (shields_lost: 0, 4 remaining at the end) — remarkable against a removal-heavy opponent, mostly explained by ama having no attacker at all until t15's mirrored Strike Freedom Gundam swing, which Kiraya's own (already chipped by Darkness Finger) traded into evenly."
  - "Kiraya cycled 3 separate Strike Freedom Gundam copies over the back half of the game (t14, t15 was ama's though, t19... actually t14, t20, plus the earlier one destroyed t15) each bringing a Kira Yamato link-draw or its own attack-trigger draw — this repeated redeploy-and-draw pattern is what let Kiraya keep pace with ama's card-advantage engine (Airframe Seizure, Kindhearted) despite ama being significantly ahead on removal efficiency for the first 14 turns."
  - "Net verdict: a deserved, well-earned win against a genuinely strong, patient control list (per Kiraya, a top-20-ranked opponent) — no single lucky swing, just steady redeployment plus two fortunate shield discards that denied the opponent's actual finishers. The same broad archetype as the saikyo loss (heavy direct removal, though this build leaned more toward Kshatriya/Neo Zeon splash and never got to use its Unicorn Banshee copy) — first win this campaign against this archetype in v1_2."
