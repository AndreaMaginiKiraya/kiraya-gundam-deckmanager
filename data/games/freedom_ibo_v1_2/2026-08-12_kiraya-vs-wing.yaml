study_notes:
  - "WiNG's Neo Zeon deck opened faster: a linked Char's Zaku Ⅱ (the ST03-011 printing — AP+1 and <High-Maneuver> on Attack when Linked) hit unblockably for 5 into the EX Base at t4 and burned an unanswered shield at t6, while Kiraya's own Gundam Exia Repair traded down cleanly at t5 (mutual mill) and a Graze Custom died chipping the by-then-damaged Char's Zaku Ⅱ."
  - "t7 onward is where Kiraya's AoE pingers turned the game: Gundam Barbatos Adapt's Deploy ping plus M1 Astray Shrike's Deploy ping picked off WiNG's Char's Zaku Ⅱ copies one at a time (t7, then again t9) while they were already chipped, converting WiNG's early tempo into a running unit-count deficit."
  - "Kiraya had real bad luck with shield reveals: both Strike Freedom Gundam (t8) and Gundam Barbatos Lupus (t12) — 2 of the deck's best bombs — were discarded straight out of the shield zone and never got played this game, yet the game was won anyway on card-advantage from Kira Yamato's repeated When-Paired/Linked draws (Hyakuren t15, Strike Rouge (Ootori) x2 across t10/t17) rather than from big single threats."
  - "WiNG's one real bomb, Zeong (GD04-017, linked to Char Aznable to spawn 2 Wire-Guided Arm tokens at t12), got answered turn-for-turn: Kiraya's last Gundam Flauros (Ryusei-Go) traded into it at t13 (both destroyed), and the resulting Zeong (Head) token died the same turn to a Gundam Barbatos Adapt swing — it never got to run away with the game."
  - "Confirms the same Char Aznable split seen elsewhere: WiNG's t4/t6 instances (combat AP+1/High-Maneuver) are the ST03-011 printing, while the t12/t16 instances ('Selecting target for Char Aznable' -> 'Played base: Axis' once Axis was in trash from t15) are GD05-093's 【When Linked】Neo Zeon Base recursion — both printings are in this WiNG decklist, confirmed by their distinct trigger text."
  - "Net verdict: a genuinely back-and-forth game, not a blowout — WiNG's High-Maneuver rush and 2 lost bombs from shields could easily have flipped this, but Kiraya's constant small-AoE-ping value (Barbatos Adapt/Gusion Rebake/M1 Astray Shrike, each chipping 1 dmg on deploy) combined with repeated Kira Yamato draws ground out enough card advantage to answer every WiNG threat, including the one real bomb (Zeong), before it mattered. First recorded win this campaign against a Neo Zeon-style opponent."
