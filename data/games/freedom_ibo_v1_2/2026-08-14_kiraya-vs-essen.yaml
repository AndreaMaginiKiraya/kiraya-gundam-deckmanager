study_notes:
  - "Seconda vittoria di fila senza mai vedere Strike Freedom Gundam (0 copie pescate in 19 turni, come nella sconfitta precedente contro Alvarn) — stavolta il piano B ha retto: Strike Rouge (Ootori), unico corpo <Blocker> del mazzo, è stata usata una sola volta come bloccante (t12, salvando Gundam Barbatos 1st Form dall'attacco di Kayra's Re-GZ) invece di ogni turno, lasciando che gli scudi assorbissero altri colpi quando il cambio non conveniva — esattamente il 'dosare i blocker' descritto da Kiraya, e la differenza dei 2 scudi rimasti a fine partita (contro 0 di Essen) lo conferma."
  - "Gundam Barbatos Lupus ha di nuovo deciso un turno con la doppia attivazione (t13): 6 carte Tekkadan/Teiwaz esiliate in due tranche uccidono sia Kayra's Jegan sia Re-GZ BWS, ripulendo il board avversario proprio prima che il pacchetto Nu Gundam/Amuro Ray di Essen potesse stabilizzarsi — stesso schema già visto vincente nelle partite #22 e #24 contro questo archetipo."
  - "Essen porta ENTRAMBE le stampe sia di Amuro Ray (ST01-010 al t8, riposo su 'Gundam'; GD05-085 al t16, cura-da-uccisione su Re-GZ) sia di Nu Gundam (GD05-017 al t14, esilio-per-battaglia; GD05-020 al t18, Deploy piazza-Risorsa-EX) nello stesso game — conferma che il mazzo Toolbox Gundam+Amuro Ray non gioca una sola copia per carta ma mescola le due stampe di proposito, quindi ogni nuova istanza va comunque verificata dal testo osservato piuttosto che assumere la stampa già vista in partite precedenti contro lo stesso archetipo."
  - "Widespread Annihilation al t17 (Delta Plus + Re-GZ, entrambi Lv4) ha ripetuto lo stesso 2-per-0 pulito già visto contro Alvarn — la soglia Lv.4-o-meno continua a intercettare bene lo swarm di supporto di questo archetipo (Jegan, Re-GZ, Delta Plus) anche se non tocca mai Nu Gundam stesso (Lv7)."
