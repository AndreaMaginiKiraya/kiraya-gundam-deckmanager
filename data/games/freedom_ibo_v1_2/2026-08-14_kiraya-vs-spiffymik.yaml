study_notes:
  - "Sesta sconfitta della campagna contro MF/G Gundam (1-5, 16,7%), ma con una vera rimonta nel mezzo: dopo un'apertura dominata dal motore Shining Gundam/Domon Kasshu/Cyclone Punch (3 unità di Kiraya perse ai t5-11 senza scambi favorevoli), Gundam Barbatos Lupus ha rimesso in equilibrio la partita — doppia attivazione al t14 che uccide Shining Gundam, poi Widespread Annihilation al t16 con un pulito 2-per-0 (entrambe le copie di Shining Gundam in campo), e un'altra doppia attivazione al t18 che uccide Gundam Maxter. Per diversi turni (14-20) il board è tornato sostanzialmente alla pari."
  - "La rimonta si è esaurita per logoramento di risorse, non per un singolo errore: SPIFFYMIK ha giocato Overflowing Affection 5 volte in tutta la partita, generando un vantaggio di pescata enorme che ha permesso di rischierare Haow Gundam/Gundam Maxter/Shining Gundam più volte mentre Kiraya rimaneva senza nuove minacce dal t20 in poi — lo stesso pattern di 'motore di ricorsione mai interrotto' già documentato ripetutamente contro questo archetipo in ANALISI.md."
  - "Il finale è coerente con la firma già nota del matchup: Shining Finger ha riposato preventivamente l'ultimo attaccante di Kiraya per ben due volte di fila (Gundam Flauros Ryusei-Go al t24, Gundam Barbatos Adapt al t25) proprio nei turni in cui Kiraya avrebbe dovuto attaccare, azzerando ogni possibilità di rientrare in partita — nessun bloccante mai disponibile da diversi turni, gli scudi di entrambi erano già a 0."
