study_notes:
  - "Stravittoria netta per resa al t16: 0 scudi persi da Kiraya (5 rimaste) contro i 4 persi/3 in mano di BuffYogi, e Kiraya aveva ancora Strike Freedom Gundam a metà del proprio attacco finale quando l'avversario si è arreso — coerente con la dichiarazione di Kiraya di avere 3 piloti in mano pronti a superare le difese residue."
  - "Gundam Barbatos Lupus (GD03-050) ha fatto il lavoro pesante al t14: due attivazioni consecutive nello stesso turno (esiliando 3+3 carte dal cimitero) hanno inflitto 2+2 danni ad Akatsuki (Oowashi), uccidendola nonostante il suo Repair 2 di fine turno l'avesse già portata a 2 HP il turno precedente — il combo di doppia attivazione nello stesso turno resta la firma distintiva di questa carta quando il cimitero è già pieno di materiale Tekkadan/Teiwaz."
  - "L'unico vero scambio sfavorevole per Kiraya è stato il ciclo t11-t13: sia Aile Strike Gundam (Kira Yamato) sia Akatsuki (Oowashi) (Andrew Waldfeld) hanno distrutto Gundam Gusion Rebake in blocco diretto (6 danni ciascuna volta, ben sopra i 5 HP stampati), consumando 2 copie della carta in due turni consecutivi — ma il vantaggio di scudi accumulato nei turni 9-10 (doppia distruzione dell'Archangel avversario) ha reso questo cambio ininfluente sul risultato finale."
  - "Kira Yamato di BuffYogi ha innescato lo stesso trigger 'When-Linked: pesca 1' della copia di Kiraya quando appaiato al proprio Strike Freedom Gundam (t15) — conferma diretta che GD05-081 è la stampa corretta per entrambe le copie in questa partita, un caso raro in cui l'ambiguità multi-istanza si risolve identicamente per entrambi i giocatori."
