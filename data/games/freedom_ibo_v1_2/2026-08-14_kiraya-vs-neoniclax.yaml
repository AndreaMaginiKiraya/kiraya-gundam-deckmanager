study_notes:
  - "Stravittoria autentica nonostante i 35 turni: 0 scudi persi da Kiraya in tutta la partita (4 rimaste) contro i 3 di Neoniclax — lo stallo da blocker (Strike Rouge Ootori/Gundam Gusion Rebake da un lato, Silver Bullet/Aile Strike Gundam/Freedom Gundam dall'altro) ha allungato la partita ma non ha mai messo in pericolo il fronte difensivo di Kiraya."
  - "Gundam Barbatos Lupus è stato il vero motore della lunga partita: schierato e rischierato 4 volte (t16, t20, t30, t33), morendo e tornando ogni volta grazie alla ridondanza in lista — ha continuato a fornire doppie attivazioni anche a metà/fine partita, mai lasciando che l'avversario stabilizzasse."
  - "Widespread Annihilation al t22 ha centrato un 2-per-0 pulito (entrambe le copie di Gundam Lfrith) proprio mentre Neoniclax provava a costruire un secondo fronte d'attacco."
  - "Freedom Gundam (GD01-065, During-Pair: AP-2 a un'unità nemica ogni volta che appai un pilota) ha inflitto debuff ripetuti alle unità di Kiraya (t19 su Gundam Barbatos Lupus, t25 su Strike Freedom Gundam) — un pattern di logoramento costante da tenere presente contro liste League Militaire/SEED con questa carta specifica, anche se qui non ha cambiato l'esito."
  - "Il colpo finale (t35) è arrivato da Strike Rouge (Ootori) agganciata a Kira Yamato (pescata) che attacca senza opposizione con Neoniclax già a 0 scudi — chiusura anticlimatica dopo una partita di puro logoramento."
