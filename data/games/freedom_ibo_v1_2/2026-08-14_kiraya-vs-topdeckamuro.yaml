study_notes:
  - "Sconfitta combattuta fino alla fine (25 turni), coerente con la lettura di Kiraya: una copia di Gundam Barbatos Lupus è stata persa al mill di Gundam Exia Repair già al t8, la seconda ha fatto il suo lavoro (uccide Strike Rouge Ootori al t12, muore a Unicorn Gundam 02 Banshee al t15) ma la terza non è mai arrivata in mano nei restanti 10 turni — senza quella carta è mancato lo strumento che ha deciso la maggior parte delle vittorie di questa campagna."
  - "La vera ragione strutturale della sconfitta: TopdeckAmuro non ha MAI perso uno scudo per danno da combattimento in tutta la partita (0 su 6, contro i 6 consumati da Kiraya) — Mining Asteroid Palau è stato ricostruito 3 volte (t6, t13, t23) e ha assorbito quasi ogni attacco di Kiraya diretto al giocatore, trasformando ogni turno d'attacco in danno alla base invece che pressione reale sugli scudi."
  - "TopdeckAmuro ha schierato 3 copie di Strike Freedom Gundam nel corso della partita (t19, t21, t22), mantenendo il proprio motore di pescate (Kira Yamato + Draw-on-kill) quasi sempre attivo anche dopo che Kiraya ne rimandava una in fondo al mazzo — la stessa arma che decide tante vittorie di Kiraya qui ha giocato a sfavore, replicata in scala maggiore dall'avversario."
  - "Unicorn Gundam 02 Banshee (Destroy Mode) ha prevenuto completamente il danno in due battaglie di fila (t15, 'Damage prevented' contro sia Gundam Barbatos Lupus che Gundam Gusion Rebake) grazie al proprio loop torna-in-fondo-al-mazzo-e-si-riattiva — coerente con il pattern già documentato contro questo archetipo (partita #18, saikyo)."
