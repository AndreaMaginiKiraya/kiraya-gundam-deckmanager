study_notes:
  - "Kiraya's read is verified: Gundam Barbatos Lupus (3 copies in the decklist) was effectively unavailable all game. 2 of the 3 copies sat in the shield zone and got discarded unplayed (t22, t24 — 'Shield card: Gundam Barbatos Lupus revealed and discarded'), and the 3rd/last copy wasn't drawn and deployed until t25, the second-to-last turn of a 26-turn game. This is real bad luck on a key engine piece, not a sequencing or play error — the deck's best removal tool for this exact matchup (repeatable Activate: exile 3 trash cards, 2 damage) simply wasn't accessible until it was almost too late."
  - "When Barbatos Lupus finally landed at t25, it performed exactly as designed: 3 separate Activations in one turn killed an Unicorn Gundam 02 Banshee (Destroy Mode) that still had 7 HP, entirely for free (using already-dead trash cards as fuel). A clean demonstration that the card is excellent when available — the problem was availability, not the plan."
  - "saikyo's list is the same 'heavy direct removal + Unicorn Gundam 02 Banshee (Destroy Mode)' archetype already flagged as a tough matchup in freedom_ibo_v1_1 (2-0 there, but on a small sample) — Close Combat, Improved Technique, Darkness Finger, Battle of Aces for removal, Airframe Seizure/A Show of Resolve for a big card-draw engine, and a near-complete Unicorn Gundam toolbox (Full Armor Unicorn → Destroy Mode transformation, standalone Destroy Mode, 02 Banshee Destroy Mode, 2x plain Unicorn Mode at the very end) providing a stream of hard-to-answer bodies. Banshee (Destroy Mode)'s own 'return to deck bottom, set active' loop effectively grants it 2 attacks most turns, which is what let it clear Kiraya's board repeatedly (t18, t24) even while damaged."
  - "No misplay found on review — the mirror Strike Freedom Gundam trade at t23 (both to 1 HP) followed by M1 Astray Shrike's ping finishing saikyo's copy was a clean, correctly-sequenced play; saikyo's own Battle of Aces answered Kiraya's copy back at t24. A long, well-fought grind decided by removal density plus the Barbatos Lupus availability problem, not by a specific error."
