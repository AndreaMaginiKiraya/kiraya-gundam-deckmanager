study_notes:
  - "Genuinely fast, wide Zeon/Neo Zeon aggro, matching Kiraya's 'strong player, mega aggro' read: opponent curved 2x Zaku Ⅱ on t3 while Kiraya had literally nothing playable on t2 or t4 (mulligan didn't fix a slow hand), and never let up — by t11 they attacked 3 separate times in one turn (Zeong unblockable via Char Aznable's High-Maneuver, plus 2 more Zaku Ⅱ swings), something Kiraya's deck (no Blocker unit ever hit the board this game) had no way to slow down."
  - "Widespread Annihilation at t12 was excellent value — a 3-for-1, destroying a Zaku Ⅱ and both Wire-Guided Arm tokens from Zeong's own Deploy ability in one card — but even with that plus trading Gundam Gusion Rebake into Zeong itself the same turn, the opponent still had Char's Gelgoog (High-Maneuver again) and the resulting Zeong (Head) token ready to close it out unopposed the very next turn."
  - "No misplay found — the game was effectively decided by t6 (opponent already 2-for-0 on Kiraya's EX Base with zero board response) and Kiraya's answers from t8 onward, while individually good (M1 Astray Shrike/Barbatos Adapt trades, the Widespread Annihilation 3-for-1), were always playing catch-up against a wider board. Consistent with the broader 'Zeon aggro/OYW' and 'Neo Zeon' pattern already tracked this campaign — fast, redundant threats plus Char Aznable's repeatable unblockable damage are hard to out-tempo once behind."
