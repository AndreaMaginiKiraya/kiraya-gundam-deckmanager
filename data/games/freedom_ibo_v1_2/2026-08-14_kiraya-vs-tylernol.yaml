study_notes:
  - "Stravittoria netta in 13 turni: 0 scudi persi da Kiraya (5 rimaste) contro i 6 di Tylernol — la curva economica (Gundam Exia Repair, Gundam Barbatos Adapt, Graze Custom) ha corso senza mai trovare un vero bloccante, abbattendo l'EX Base sostituita (Mining Asteroid Palau, ricostruita due volte) in appena 3 attacchi ripetuti."
  - "Gundam Calibarn è stato deployato solo al t12, un turno prima della fine — mai arrivato in tempo per esprimere la propria minaccia (a differenza delle partite contro Altis e ringo, dove Calibarn/Schwarzette hanno deciso il match). Conferma quanto la velocità di sviluppo conti in questo matchup: la stessa bomba può essere quasi ininfluente se arriva troppo tardi."
  - "Lista avversaria eterogenea (Char's Zaku Ⅱ/Schuzrum-Galluss Neo Zeon, G-Self, Gundam Calibarn, rimozione generica Improved Technique/Close Combat) — primo incontro della campagna con questa combinazione esatta, troppo poco campione per classificarla oltre 'toolbox multi-fazione'."
