study_notes:
  - "Early exchanges were roughly even: Kiraya's EX Base pressure (Hyakuren traded 1-for-1 with Gaplant TR-5 \"Hrairoo\" Unit 1 at t7, M1 Astray Shrike then Gundam Barbatos 1st Form finished it off by t9) was offset by losing both copies of Graze Custom to Darkness Finger (GD05-110) on unblocked attacks at t7 — the same recurring single-target removal command already flagged in every prior MF/G Gundam loss this campaign."
  - "Sol's Shining Gundam (GD05-066, pinned by its Deploy/Attack/Link text — see the cards block) recursion engine came online at t10 exactly as in prior games: its Deploy ability exiled 2 (MF) trash Units to return Darkness Finger to hand, and Domon Kasshu's When-Paired discard trigger (draw 1, discard 1, activate the Main if the discard is a (Special Move) Command) replayed it immediately to kill Gundam Barbatos 1st Form the same turn."
  - "t15 was Kiraya's best turn of the game: double Gundam Barbatos Lupus activation killed a Gaplant TR-5 Unit 1, Strike Freedom Gundam deployed linked to Kira Yamato, and the follow-up attacks destroyed Silver Bullet and Shining Gundam (Super Mode) — but left Barbatos Lupus at 1 HP and Strike Freedom Gundam at 4 HP, both one hit from dying."
  - "t16 undid nearly all of that in a single turn, and shows the engine can compound worse than previously seen: Sol replayed Shining Gundam (recycling its exile-for-Darkness-Finger Deploy ability again) while also already holding a second copy of Darkness Finger drawn earlier via its own 'draw 1 if you control a Master-Gundam-named Unit' clause (true since Master Gundam deployed t14) — landing two separate Darkness Finger casts in one turn: the first killed the already-1-HP Gundam Barbatos Lupus outright, the second chipped Strike Freedom Gundam to 2 HP. Prior MF losses only ever showed this recursion firing once per turn."
  - "t18's kill sequence is worth remembering for future MF matchups: Master Asia (GD05-089), Linked to Master Gundam (matching its printed link), has a During-Link/Attack trigger that deals 2 damage to an enemy Unit if a (Special Move) Command's Main/Action was activated that turn (satisfied here by Shining Finger played earlier that turn) — so declaring an attack against the player let Master Gundam snipe Strike Freedom Gundam, the only potential blocker, before blocks were even assigned ('Selecting target for Master Asia' -> Strike Freedom Gundam destroyed -> 'No blockers available'). Master Gundam's own Attack ability then exiled 2 more Special Move Commands from trash to blast the revealed shield for 5, clearing the way for lethal with 0 shields left."
  - "Net verdict: no clear misplay — t15 was genuinely excellent play that would win most games, but ran into an MF engine that can apparently double up a key removal piece in one turn when its inputs line up (Domon Kasshu discard-trigger + Shining Gundam trash-exile-recursion + Darkness Finger's own bonus-draw once Master Gundam is out), then close with a Master Asia snipe that removes the only blocker before it can even be declared. At least the fourth loss to an MF/G Gundam-style deck this campaign (yui523 and ame in freedom_ibo_v1_1; Yodayo and now this game in freedom_ibo_v1_2) — this reinforces treating the matchup as needing a dedicated answer rather than three-going-on-four unrelated bad draws."
