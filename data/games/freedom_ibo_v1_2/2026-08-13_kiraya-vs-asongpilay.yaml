study_notes:
  - "Ended by resignation, not a shield-out: AsoNgPilay conceded at t20 with 1 shield still in reserve (vs. Kiraya's 3) — a genuine grind against a large, well-built pure-SEED toolbox (Justice/Providence Gundam, Aile Strike/Sword Strike Gundam, Athrun Zala/Rau Le Creuset/Kira Yamato) with a GQuuuuuuX/Clan splash, not a clean shutout like the two prior wins."
  - "Repeated Graceful Demeanor/Aile Strike Gundam bounces (t9, t10) cost Kiraya tempo early — Hyakuren+Graze Custom bounced back to hand at t9, then the redeployed Gundam Flauros (Ryusei-Go) bounced again at t10 — but never translated into a real setback since Kiraya kept redeploying and the EX Base race was already won by t9."
  - "The base-attrition war was the real story: AsoNgPilay's Jachin Due base got built and destroyed 3 separate times (t12 played, destroyed t15 by Strike Freedom Gundam; rebuilt t16 via Rau Le Creuset's return-and-redeploy, destroyed again t19 by a second Strike Freedom Gundam) plus Argama destroyed the same turn (t19) — each rebuild cost AsoNgPilay a card and a turn's tempo for zero net board presence, while Kiraya's repeated Strike Freedom Gundam deploys (t15, t19) each came with Kira Yamato/self-link draws attached."
  - "t16 was the closest the opponent came to a real turning point: Providence Gundam (linked Rau Le Creuset, buffed by Jachin Due's own modifier) killed Gundam Flauros (Ryusei-Go) outright with a targeted 3-damage ability, then traded with Strike Freedom Gundam in the main battle (both destroyed, Strike Freedom Gundam took a boosted 12 damage). A genuine 2-for-1 in AsoNgPilay's favor, but Kiraya had a second Strike Freedom Gundam and kept rebuilding while AsoNgPilay's board never fully recovered."
  - "GQuuuuuuX (Omega Psycommu) (GD03-034, confirmed by its Deploy 'choose 1 enemy Unit, deal 3 damage' one-shotting Gundam Barbatos 1st Form at t18) is a genuine bomb worth remembering — AP6/HP5 with a free removal Deploy trigger, the same shape of threat as Gundam Calibarn/Gundam Epyon seen in other tough matchups this campaign."
  - "Net verdict: no misplay found, a hard-fought and correctly-played grind against a strong list. The double Strike Freedom Gundam value turns (t15, t19), each destroying a rebuilt enemy base, were the actual engine behind the win — not any single decisive combat trick."
