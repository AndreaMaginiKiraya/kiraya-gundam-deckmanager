study_notes:
  - "First win with the v1_2 variant (Strike Freedom Gundam 3->4, Gundam Flauros (Ryusei-Go) 1->2, A Show of Resolve 2->0), but a genuinely back-and-forth game rather than a clean showcase of the changes — see below."
  - "Turn 9 was Kuro's best turn and the low point of the game: Zaku Ⅱ's self-buff traded for Gundam Barbatos 1st Form, ReZEL killed Graze Custom, and the freshly-deployed Gundam+Amuro Ray pairing killed Gundam Barbatos Adapt for free while healing back to full off Amuro Ray's kill-heal — Kiraya lost 2 units this turn for 1 in return, and the surviving Gundam (effectively AP6/HP6 while paired) hit the player for 6 unanswered the following turn, destroying Axis outright."
  - "Turn 12's Hyakuren, paired with Kira Yamato, was the turning point: it traded evenly into the AP6/HP6 Gundam (6 damage dealt, 5 received) right as that threat was starting to snowball, removing Kuro's best unit before it could hit the player again."
  - "Turn 14's double Gundam Barbatos Lupus activation (2 separate 3-card exiles from trash) was the biggest value swing of the game — 2 free kills (ReZEL, Guntank) plus an unblocked shield hit in a single turn, right after the pilot-pairing ping had already chipped it down."
  - "On the v1_2 changes specifically: this game doesn't say much either way. Strike Freedom Gundam only hit the board in the final action (game ended the instant its target-selection resolved, before any of its abilities could matter), and neither copy of Gundam Flauros (Ryusei-Go) was drawn. A Show of Resolve's removal wasn't felt — Gundam Barbatos 1st Form's own 'if damaged, draw 1' fired twice and card flow never looked short. Worth watching in future games whether the extra Strike Freedom Gundam copy actually comes online earlier, since it didn't here."
