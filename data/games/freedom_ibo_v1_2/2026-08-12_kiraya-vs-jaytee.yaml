study_notes:
  - "No clear misplay found on review. The game was genuinely close throughout (both players spent all 6 starting shields — JayTee 2 lost + 4 to hand, Kiraya 3 lost + 2 to hand + 1 deployed — this was a real race, not a blowout), and every individual trade Kiraya made looks reasonable given the information available at the time."
  - "JayTee's deck carries a clean answer command, A Wind Against Fires, used twice at the exact moments it mattered most: t9 it blanked Hyakuren's attack down to 1 damage right before Hyakuren died anyway, and t12 it zeroed Gundam Gusion Rebake's counter-damage entirely while Full Armor Unicorn Gundam killed it for free. Both are the opponent's deck doing its job, not something Kiraya could have played around without already knowing the card was coming."
  - "t16 is the real turning point: Gundam Epyon (GD02-002, linked to Zechs Merquise) has a Link ability that sets itself active again whenever one of your Units destroys an enemy Unit with battle damage — so its own first kill (Gundam Flauros (Ryusei-Go)) immediately refunded it a second attack the same turn, which then also killed Strike Freedom Gundam. One bomb doing the work of two removal spells, deployed and immediately impactful the turn it landed — there was no window for Kiraya to respond to this before it happened."
  - "By t20 JayTee simply had more attackers than Kiraya had blockers: Unicorn Gundam (Awakened), Sword Strike Gundam, Tallgeese III and Zechs' Leo all swung unopposed in the same turn because Kiraya's 2 live Strike Freedom Gundam copies on board don't carry <Blocker> — the only Blocker-capable unit played all game (Strike Rouge (Ootori)) had already died at t15. This is a natural consequence of the t16 double-kill more than a sequencing error afterward."
  - "Flagging a genuine card-data gap for later: the 'Tallgeese' (non-III) destroyed at t8 implies HP≤2 from the battle math (Gundam Exia Repair's own AP2 counter-attack was lethal), but none of the 3 known 'Tallgeese' printings in the database have HP that low (3, 4, 4) — worth checking against apitcg/egmanevents next sync rather than assuming it's just an unresolvable pin."
  - "Net verdict: this reads as a genuinely tough, close matchup against a well-built toolbox list (Banagher Links/Unicorn line + Zechs Merquise/Wing line, spanning UC and Wing eras with an EW splash via Striker Pack/Sword Strike Gundam) that had two above-curve answers (A Wind Against Fires) plus one bomb with built-in double-attack potential (Gundam Epyon) — not a skill issue. First encounter with this specific toolbox build this campaign."
