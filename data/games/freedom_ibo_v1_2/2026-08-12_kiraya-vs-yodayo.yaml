study_notes:
  - "The 'bad draw' read checks out: turns 1-5 show zero Kiraya actions (nothing playable), and the first two units deployed (Strike Rouge (Ootori) t6, Gundam Flauros (Ryusei-Go) t8) were each neutralized alone, one per turn, before a second body ever hit the board — consistent with a hand clogged with unlinkable Pilots (Kira Yamato/Mikazuki Augus with no matching Unit in hand yet) rather than a sequencing choice. t18's Kira Yamato pairing onto Gundam Barbatos 1st Form (its actual Link partner is Strike Freedom Gundam) is a visible example — a 'better than nothing' pairing that gets none of its real ability, exactly the kind of dead-pilot problem you flagged."
  - "New matchup detail worth remembering: Cyclone Punch/Chibodee Crocket (GD05-121) can stack a DOUBLE AP-2 — once from its Main-phase Command use, again from its own Attack trigger once paired as a Pilot from the trash — which is how Gundam Maxter dealt exactly 0 damage back at t7 (Strike Rouge's AP3 - 4 = 0). Combined with Shining Finger/Rising Gundam pre-emptively resting your only blocker before the attack even starts, this MF toolbox has two independent ways to guarantee a free kill on a lone defender — not something sequencing could have played around with only one unit in play at a time."
  - "t10's Widespread Annihilation (3-for-0, wiping Gundam Maxter/Rising Gundam/Shining Gundam in one card) and t14's Gusion Rebake+Barbatos Adapt double-ping into a direct Master Gundam kill were both excellent, correctly-timed answers — the game was genuinely close to even after t14, not a one-sided beatdown."
  - "t19's block (Gundam Gusion Rebake into the first Shining Gundam attack, to save Gundam Barbatos 1st Form) turned out to be a wash — Barbatos 1st Form died anyway to a second, freshly-deployed Shining Gundam later the same turn — but that second copy wasn't visible information at the time the block was assigned, so this reads as bad luck on hidden information, not a foreseeable misplay."
  - "Gundam Exia Repair's mill claimed Strike Freedom Gundam (plus Gundam Barbatos Adapt) right as the board was already lost at t24 — the same structural risk already flagged in ANALISI.md for this card, landing at the worst possible moment rather than a new finding."
  - "Net verdict: no clear misplay drove this loss — a slow opening from a Pilot-heavy hand, into a matchup with two independent ways to blank a lone blocker (Cyclone Punch/Chibodee's double debuff, Shining Finger's pre-attack rest) plus the already-known Shining Gundam recursion/Darkness Finger removal engine, is a genuinely tough draw against a genuinely strong archetype. This is the third loss to MF/G Gundam-style decks this campaign; each has featured a different specific engine piece (Yui523: Shining Gundam recursion; this game: Cyclone Punch/Chibodee's stacking debuff) — worth treating as a real, recurring bad matchup rather than three unrelated unlucky games."
