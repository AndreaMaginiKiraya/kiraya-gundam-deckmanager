study_notes:
  - "Confirms the known Cyclone Punch/Chibodee Crocket (GD05-121) double AP-2 stack already flagged in the yodayo loss (freedom_ibo_v1_1): at t13 Necessary played it as a Main-phase Command (debuffing Gundam Gusion Rebake) AND paired it as a Pilot onto Gundam Maxter the same turn (debuffing Graze Custom too) — one card, two separate AP-2 instances hitting two different Kiraya blockers in the same turn."
  - "New mechanical finding worth remembering: Shining Finger (GD05-120) doesn't just rest a small enemy Unit — it also grants a friendly 'Shining Gundam'-named Unit <First Strike> for that battle. Combined with Shining Gundam's already-high AP, this is why 'Shining Gundam received 0 damage' / 'Damage prevented' showed up 3 times this game (t9, t17, and implicitly t23) — the target dies to the first-strike hit before it ever gets to deal return damage. Not a passive Shining Gundam ability; it's Shining Finger's buff each time it's replayed via the exile-recursion engine."
  - "Kiraya's Barbatos Lupus plan did eventually work, unlike the saikyo loss — it came online at t18 with 4 activations in one turn, single-handedly killing both Master Gundam and a fresh Shining Gundam, and picked up 2 more kills later (Unicorn Gundam (Awakened) at t20, Mining Asteroid Palau at t22). The engine performing exactly as intended and still losing is the real takeaway: this matchup's problem isn't inconsistency, it's that the opponent's recursive removal (Shining Gundam/Darkness Finger/Shining Finger, fueled by 2 separate draw-2 discard-fuel commands played turns 1 and 3) simply outpaces what one resource-hungry engine piece can answer."
  - "Net verdict: no misplay found. Fourth MF/G Gundam loss (1-3 now) this campaign in freedom_ibo_v1_2 alone, each with genuinely no clean individual error — reinforces the standing conclusion that this archetype is structurally the hardest matchup for this deck, not a run of bad luck."
