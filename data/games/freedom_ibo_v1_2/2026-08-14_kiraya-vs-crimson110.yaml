study_notes:
  - "Early race (t5-t10): Graze Custom + Strike Rouge (Ootori) chipped the EX Base and Ra Cailum repeatedly while Crimson110 rebuilt with fresh Ra Cailum bases every couple of turns — by t12 Crimson110 was already down to 0 shields remaining, well before their Nu Gundam/Amuro Ray package came fully online. This tempo lead is what made the eventual t13 board loss survivable."
  - "Widespread Annihilation (t12) was played as a symmetric Lv.4-or-lower wipe, trading Kiraya's own 2x Graze Custom + Strike Rouge (Ootori) for Crimson110's Kayra's Re-GZ + 2nd Zaku Ⅱ. Correct trade here: it cleared the board the turn before Crimson110's Nu Gundam/Amuro Ray combo would have punished a crowded Kiraya board, and Kiraya still had Gundam Gusion Rebake (x2 copies) and Strike Freedom Gundam in reserve."
  - "Crimson110's Nu Gundam (GD05-017) paired with Amuro Ray exiled 3 Ra Cailum from trash to fight two separate damage-step-only battles in the same turn (t13), each dealing 7 to Gundam Gusion Rebake (5 HP) and healing 2 back via Amuro Ray's kill-heal. A Londo Bell toolbox deck that's been feeding its own bases to the trash (via repeated Ra Cailum plays) can convert that graveyard into a double-attack burst turn — worth remembering as a real threat, not just removal fodder sitting in trash."
  - "Closed it out t14 by deploying Strike Freedom Gundam paired with Kira Yamato (draw) straight into lethal — only needed one hit to connect since the early race had already zeroed Crimson110's shields. Third win in a row vs this Nu Gundam/Amuro Ray Londo Bell toolbox archetype (3-0): racing shields down early before the opponent's late-game engine turns on remains the right plan against it."
