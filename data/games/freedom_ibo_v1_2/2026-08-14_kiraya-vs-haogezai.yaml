study_notes:
  - "Mirror match vero (豪哥仔 gioca praticamente la stessa lista di Kiraya: Graze Custom, Hyakuren, Barbatos Adapt/Lupus, Gusion Rebake, Strike Freedom Gundam/Kira Yamato) perso sul filo — Kiraya finisce a 0 scudi rimasti (4 persi) contro i 2 di 豪哥仔, un distacco di 2 scudi che si è aperto presto e non si è mai richiuso."
  - "Lo snodo è il t7: Ryusei-Go (Graze Custom Ⅱ) di 豪哥仔 (Deploy: 1 danno a sé stesso + pesca 1, poi scarta 1 dalla mano — stavolta ha scartato proprio una copia di Strike Freedom Gundam di Kiraya già in mano tramite l'effetto di scarto) apre un turno che uccide sia Graze Custom sia Hyakuren di Kiraya in due scambi separati nello stesso turno, oltre a bruciare l'EX Base — un solo turno molto denso che ha messo Kiraya sotto pressione di carte e di scudi fin dall'apertura."
  - "Strike Freedom Gundam ribaltato: Kiraya lo schiera per prima al t14 (con Kira Yamato agganciato, pesca extra), ma 豪哥仔 risponde subito al t15 con la propria copia, il cui During-Pair/Attack (scarta 2, rimanda l'unità nemica di Lv più basso) rimanda proprio lo Strike Freedom Gundam di Kiraya (con Kira Yamato agganciato) in fondo al mazzo nello stesso attacco — esattamente il meccanismo che ha deciso partite precedenti a favore di Kiraya (vedi mirror contro CHAMP), stavolta contro di lui. Da quel momento 豪哥仔 tiene la propria copia in campo per 5 turni consecutivi (t15-t19), colpendo ogni turno mentre Kiraya non ne rivede una seconda copia."
  - "Gundam Barbatos Lupus si è scontrato con sé stesso: entrambi i giocatori hanno schierato una copia e usato la doppia attivazione più volte (豪哥仔 t13 e t19, Kiraya t18) — un vero logoramento speculare sulla stessa risorsa chiave del mazzo, con 豪哥仔 che riesce a portare la propria copia a incassare colpi (1 HP a fine t17, poi salvata) mentre quella di Kiraya viene bersagliata due volte allo stesso modo al t19. In un mirror match, il vantaggio si costruisce sul sequenziamento di questi pezzi condivisi, non sulla loro sola presenza."
