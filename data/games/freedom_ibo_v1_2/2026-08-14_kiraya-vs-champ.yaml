study_notes:
  - "Vittoria per abbandono al t23, ma la partita era già decisa nel board state: Kiraya aveva 3 piloti in mano (confermato da Kiraya) pronti a superare i due <Blocker> potenziali di CHAMP, mentre CHAMP era già a 2 scudi su 8 iniziali. Un mirror parziale genuino: entrambi i giocatori condividono lo stesso nucleo Tekkadan (Barbatos Adapt, Gusion Rebake, Barbatos Lupus, Flauros Ryusei-Go) più uno splash Orb/SEED, quindi ogni scambio 1-per-1 tende a essere alla pari — il vantaggio si è costruito sulla sequenza, non su una singola bomba."
  - "Il t10 è stato l'unico vero spavento: Widespread Annihilation di CHAMP ha cancellato entrambe le copie di Gundam Barbatos Adapt di Kiraya in un colpo solo (le uniche unità Lv.4-o-meno in campo in quel momento). Ma Kiraya aveva già staccato l'EX Base al t7 e la stessa Widespread Annihilation non ha impedito la doppia distruzione dell'EX Base avversaria al t9 — il tempo perso nel board wipe è stato recuperato subito col cambio di piano su Gundam Gusion Rebake."
  - "Gundam Barbatos Lupus di CHAMP (GD03-050, Activate: esilia 3 (Tekkadan)/(Teiwaz) dal cimitero per 2 danni) si è alimentato benissimo al t14 (Barbatos 1st Form + Graze Custom + Flauros, tutti appena finiti in cimitero nello stesso turno) uccidendo Gundam Gusion Rebake gratis — ma Strike Freedom Gundam di Kiraya lo ha rimandato in fondo al mazzo al t15 nello stesso attacco che ha chiuso Axis, azzerando l'investimento CHAMP aveva appena fatto per schierarlo."
  - "Waldfeld's Murasame (GD05-003) e Kira's Strike Rouge (GD05-010) — le due unità 'linkate' del pacchetto Orb di CHAMP — sono comunque cadute normalmente in combattimento diretto (Kira's Strike Rouge x2 contro Hyakuren al t15, Waldfeld's Murasame bloccata e ridotta a 1 HP da Strike Rouge Ootori al t22): a differenza di altri matchup Toolbox SEED/Orb visti in questa campagna, qui nessuna delle due si è dimostrata difficile da rimuovere, probabilmente perché CHAMP non aveva un motore di sostegno (heal/buff ripetuto) dietro di loro."
