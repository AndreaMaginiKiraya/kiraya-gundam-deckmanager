study_notes:
  - "Early race mirrored the C23 game (same broad Zeon aggro/OYW archetype, this time a Green/White build): Hyakuren+Graze Custom raced down 2DTRON's EX Base and a shield (Fortress Defense) before 2DTRON's board did much. The one real tempo swing 2DTRON found was t7's Graceful Demeanor, bouncing both Graze Custom and Hyakuren back to hand mid-combat — a genuine 2-for-1 tempo hit, but Kiraya redeployed both the very next turn (t8) with no lasting damage."
  - "From t9 onward Kiraya's AoE deploy-pingers (Gundam Gusion Rebake x2, Gundam Barbatos Adapt, M1 Astray Shrike, Gundam Barbatos 1st Form's Mikazuki Augus link) consistently converted otherwise-even trades in Kiraya's favor against the Zeon Ⅱ/Char's Zaku Ⅱ swarm — chipping a unit for free on deploy before combat even started meant several of 2DTRON's units died to attacks that would have traded evenly (or worse) without the ping."
  - "2DTRON's two real threats (Gelgoog linked to Char Aznable for an unblockable High-Maneuver hit at t11, and Gundam Deathscythe Hell (EW) finishing an already-damaged Strike Rouge (Ootori) at t15) each only cost Kiraya a base or an already-weakened blocker — never a full-value unit — which kept the unit-count race lopsided throughout."
  - "Net verdict: a clean, deserved win — no lucky swing, no misplay to flag, just Kiraya's ping-heavy value engine grinding down a Zeon swarm turn after turn. Consistent with Kiraya's own read that this Green/White build plays weaker than C23's mono-Green list from the prior game: fewer disruptive tricks (only Graceful Demeanor's bounce and Fortress Defense as generic answers) and no equivalent to C23's resilient Gundam+Amuro Ray engine to grind back with."
