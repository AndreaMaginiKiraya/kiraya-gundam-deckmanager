study_notes:
  - "Kiraya ha descritto la propria performance come non ottimale, ma rileggendo il log non emerge un errore tattico isolato. Il doppio chump-block del t11 (entrambe le copie fresche di Strike Rouge Ootori sacrificate contro ReZEL e Jegan) sembra la scelta giusta più che un errore: a quel punto Kiraya aveva già consumato 4 scudi su 6 (Strike Rouge Ootori e Hyakuren persi, Kira Yamato e Mikazuki Augus andati in mano), quindi non bloccare avrebbe rischiato la sconfitta immediata con soli 2 scudi rimasti contro 2 attaccanti."
  - "La vera differenza rispetto alle 5 vittorie precedenti di questa campagna contro l'archetipo Nu Gundam/Amuro Ray: qui Kiraya non ha mai pescato né Widespread Annihilation né Gundam Barbatos Lupus né Strike Freedom Gundam in 13 turni — esattamente gli strumenti che hanno deciso quasi ogni vittoria precedente contro questo stesso matchup. Una sconfitta rapida per assenza dei pezzi motore più che per una sequenza di gioco sbagliata."
  - "Amuro Ray di Maverick ha mostrato ENTRAMBE le stampe in questa partita: ST01-010 (riposo) al t7 su Gundam Barbatos Adapt, e GD05-085 (cura-da-uccisione) al t11 (due volte, su ReZEL e Jegan dopo aver ucciso le due Strike Rouge Ootori) e di nuovo al t13 su Nu Gundam — la stessa scoperta già fatta contro Essen: questo archetipo non gioca una sola stampa fissa per carta."
  - "Il colpo decisivo (t13) è stato un singolo turno di Nu Gundam molto efficiente: esilia 3 (Jegan + 2 Amuro Ray) dal cimitero per uccidere Gundam Gusion Rebake in sola fase-danno, si cura 2 HP, poi attacca di nuovo lo stesso turno per il colpo letale diretto — nessun bloccante disponibile perché Kiraya aveva già perso tutte le altre unità negli scambi precedenti."
