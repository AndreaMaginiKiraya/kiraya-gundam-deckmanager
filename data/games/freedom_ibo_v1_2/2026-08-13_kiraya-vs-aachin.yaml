study_notes:
  - "Total shutout: Kiraya never lost a single shield (6/6 remaining at game end) while あーちんふぁんとむ hit 0. Decided early — Kiraya's economical curve (2x Graze Custom, Gundam Exia Repair) raced down the EX Base by t6 and then immediately kept hitting the freshly-played Axis base in the same turn, destroying it before it ever mattered, all while the opponent (who mulliganed) had no board presence until t5."
  - "Some bad luck for Kiraya at t7 (Gundam Exia Repair's own Destroyed-mill hit Kiraya's own deck, milling Gundam Barbatos 1st Form and Gundam Gusion Rebake to trash) never mattered — the lead was already too large by then to notice losing 2 potential draws."
  - "The only real combat exchange all game was t9: あーちんふぁんとむ's Gundam Barbatos Adapt (paired to Kira Yamato) attacked and traded with Kiraya's own Gundam Barbatos Adapt directly (unit-vs-unit, not a player attack) — Kiraya's died, theirs survived at 2 HP. By that point it changed nothing: 4 of their 6 shields were already gone."
  - "Opponent's deck looks like a Tekkadan/SEED hybrid — runs the same Gundam Barbatos Adapt/1st Form staples as Kiraya's own list, plus a SEED package (Kira Yamato, Force Impulse Gundam, GN Armor Type-E, Fatal Strike) instead of the League Militaire/Orb split seen in other toolbox opponents this campaign. Sample size of 1 — worth watching for if it recurs."
