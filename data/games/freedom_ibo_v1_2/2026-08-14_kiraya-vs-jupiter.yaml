study_notes:
  - "Widespread Annihilation al t10 è stato il turno di svolta: un 3-per-0 pulito (Gundam, Re-GZ e Rick Dom, tutti Lv.4 o meno) che ha spazzato via l'intero board di jupiter proprio mentre il pacchetto Nu Gundam/Amuro Ray si stava assemblando — coerente con la lezione già consolidata contro questo archetipo (colpire quando tocca 2+ bersagli reali, non solo unità già ferite)."
  - "Doppia copia di Strike Freedom Gundam ha tenuto il motore di pescate acceso per tutta la seconda metà della partita (t18 e t22), sommandosi alla doppia attivazione di Gundam Barbatos Lupus al t14 — nessuna singola bomba ha deciso la partita, ma l'accumulo di piccoli vantaggi di carte e tempo sì."
  - "Ottava vittoria della campagna contro l'archetipo Nu Gundam/Amuro Ray Londo Bell: Kiraya chiude con 3 scudi rimasti contro 0 di jupiter, un margine netto nonostante una lunga serie di scambi di unità sul filo (diverse unità di Kiraya perse a 1 HP di distanza dal sopravvivere)."
  - "Chiarito (grazie a Kiraya): jupiter porta 2 stampe distinte di Nu Gundam — quella 'finalizer' AP5/HP5 (GD05-017, agganciata ad Amuro Ray dal t13) e quella 'economica' (GD05-020, Deploy piazza 1 Risorsa EX). I 7 danni inflitti a Gundam Barbatos Lupus al t17 sono la prima copia ancora agganciata ad Amuro: AP5 stampato + il modificatore AP+2 di Amuro Ray (GD05-085) che il database locale non espone (campi ap/hp nulli, gap noto dei dati egmanevents per i Piloti, vedi CLAUDE.md) — 5+2=7, conti tornano."
