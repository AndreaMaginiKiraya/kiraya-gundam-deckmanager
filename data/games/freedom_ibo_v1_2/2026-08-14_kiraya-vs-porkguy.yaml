study_notes:
  - "Vittoria davvero schiacciante: 0 scudi persi da Kiraya in tutta la partita (5 rimaste) contro i 6 di Porkguy — nonostante una lunga scia di scambi di unità sfavorevoli sulla carta nei primi 14 turni (Gundam Barbatos 1st Form perso 3 volte, M1 Astray Shrike 2 volte, Graze Custom 2 volte a rimozione diretta di Close Combat/Battle of Aces/Improved Technique), nessuno di quegli scambi ha mai messo in pericolo gli scudi: la pressione di Kiraya è sempre stata diretta contro basi ed EX Base avversarie, mai contro il proprio fronte difensivo."
  - "La suite di rimozione di Porkguy (Close Combat, Improved Technique, Battle of Aces) ha eliminato 5 unità di Kiraya nel corso della partita ma non si è mai tradotta in danno reale — un caso da manuale di 'rimozione senza pressione': togliere corpi all'avversario non vince la partita se non si converte in danno o in un vantaggio di tempo concreto."
  - "Gundam Barbatos Lupus ha ripetuto la firma della doppia attivazione nello stesso turno (t16, uccide Kshatriya prima che potesse mai attivarsi) — confermando ancora una volta il proprio ruolo di pezzo motore in questa lista."
  - "Porkguy porta anch'esso uno splash Strike Freedom Gundam/Kira Yamato (schierato al t21) sopra un nucleo Neo Zeon (Schuzrum-Galluss/Marida Cruz/Full Frontal, Kshatriya, Unicorn Gundam 02 Banshee, Neo Zeong mai sceso — scartato solo come costo dell'abilità del proprio Strike Freedom Gundam) — coerente con l'archetipo 'Rimozione diretta pesante + Unicorn Banshee' già tracciato in ANALISI.md, non un nuovo profilo."
