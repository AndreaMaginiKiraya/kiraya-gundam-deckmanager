study_notes:
  - "C23's Zeon-aggro swarm (Dopp, Zaku Ⅱ, Char's Zaku Ⅱ x3, Guntank x2) stumbled out of the gate: Dopp's own Deploy ability whiffed and returned it to the bottom of the deck at t1 (no valid target on an empty board), and both Guntank copies (GD01-008, needs a rested enemy Unit) whiffed the same way at t3 and t5 — three dead Deploy triggers before either player had really interacted."
  - "Kiraya's AoE deploy-pingers (Gundam Barbatos Adapt, M1 Astray Shrike) did efficient cleanup work on the small Zeon bodies once they were already chipped from combat — Char's Zaku Ⅱ (ST03-006, confirmed by its Destroyed trigger fetching a card at t8) died 3 separate times to 1-2 damage pings rather than full trades."
  - "C23's real engine was 'Gundam' (ST01-001, confirmed by its <Repair 2> triggering at the end of t11 and t13) linked to Amuro Ray (ST01-010, confirmed by its When-Paired rest-effect): a resilient body that heals 2 HP every turn and rests Kiraya's blocker on pairing. It took 3 separate copies (t9, t11, t13) and repeated trades from Barbatos Adapt/Barbatos 1st Form to fully burn through it — a grind, not a single clean answer."
  - "Net verdict: a deserved, unspectacular win — no single decisive swing, just Kiraya's AoE pings converting C23's early whiffed triggers into a running unit-count lead that never let up, closing out t14 with C23 fully out of shields (0 remaining) while Kiraya still had 1 in reserve. First recorded matchup this campaign against a Zeon-aggro/OYW swarm splashing the Gundam/Amuro Ray toolbox package."
