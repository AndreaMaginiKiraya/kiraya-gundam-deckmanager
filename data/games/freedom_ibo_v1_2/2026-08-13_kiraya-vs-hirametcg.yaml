study_notes:
  - "Genuine mirror match (Hirametcg's list shares almost every card name with 'freedom_ibo_v1_2'), and Kiraya won a landslide: 3 shields remaining vs. 0, and 0 shields ever lost outright (the 2 'shields_to_hand' and 1 'shields_deployed' events were all voluntary base-replacement/burst draws, not damage). Unit losses were much closer (9 for Kiraya vs. 13 for Hirametcg), so the shield gap is the real story, not a card-advantage blowout."
  - "t16 was the turning point: Kiraya's Strike Freedom Gundam deploy (linked to itself + Gundam Barbatos Lupus for AP buffs) set up a huge value turn — Barbatos Lupus's Activate (exile 3 trash cards, 2 damage) killed Hirametcg's Gundam Barbatos 1st Form for free, then Barbatos Lupus itself attacked unopposed to destroy Hirametcg's Axis base, and Strike Freedom Gundam's own attack drew 2 more cards off its Link/Deploy triggers. One turn, one free kill, one base destroyed, multiple draws — the kind of turn that decides an otherwise-even mirror."
  - "t17 was Hirametcg's best answer: a mirrored Strike Freedom Gundam trade (both dealt 7, Kiraya's died since it had already taken 1 self-chip damage earlier, Hirametcg's survived at 1 HP) plus bouncing Kiraya's Gundam Barbatos Lupus back to the deck with its own Attack ability — a fair trade that kept Hirametcg in the game, but Kiraya's shield lead from earlier turns was already large enough to absorb it."
  - "From t18 onward Kiraya simply out-valued the mirror: Gundam Barbatos Lupus (redrawn after the t17 bounce) kept firing its exile-for-2-damage Activate every turn it was in play (t19 twice, t20 twice, t21 wasn't Kiraya's turn but t22 again), converting dead cards in the trash into free removal turn after turn, while Hirametcg's own copy had already been spent at t13."
  - "Net verdict: a clean, deserved blowout in a mirror where both sides had access to the same tools — the difference was sequencing and turn efficiency (t16's multi-value turn in particular), not a card the opponent lacked. Worth remembering for future mirrors: Barbatos Lupus's Activate ability compounds hard when it gets to fire on consecutive own-turns before the opponent can answer it."
