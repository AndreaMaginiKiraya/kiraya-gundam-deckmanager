study_notes:
  - "Gundam Exia (GD04-038)'s Deploy ability ('if 2+ enemy Units in play, choose an enemy Unit Lv.2 or lower, deal 2 damage') specifically punishes this deck's early curve: it picked off 3 separate copies of Graze Custom for free across t4, t6 and t8, denying the exact early-aggro pattern that worked so well in prior wins this campaign (vs KYPC, vs WiNG)."
  - "t11's Improved Technique killed Gundam Barbatos Adapt straight out of the shield zone (Burst-activated on reveal, not played from hand) — the same generic-removal shield-burst pattern (Improved Technique, Darkness Finger, Close Combat, Overwhelming Pressure) already logged once for this exact archetype in freedom_ibo_v1_1/ANALISI.md (game #23, a win). This time the removal suite showed up far more densely: 4 distinct removal spells fired across the whole game, methodically answering every Kiraya threat deployed after t11 (Gusion Rebake x2, Barbatos Adapt, Barbatos 1st Form x2, Barbatos Lupus x2)."
  - "t16 was the decisive turn: Gundam Calibarn (GD05-018, AP7/HP5 with a damage-reduction clause) one-shot Strike Freedom Gundam (9 dmg vs. 6 HP) while its own damage was reduced from 7 to 1 net, and in the same turn Gundam Aerial Rebuild traded up into Gundam Barbatos Lupus and chipped Axis to 1 HP — Kiraya's two biggest threats died in a single opposing turn to a top-end bomb (Calibarn) this matchup hadn't shown before."
  - "Gundam Aerial Rebuild (GD04-024)'s Deploy ability (dig 3 for an Academy Unit/Command, add to hand) fueled Altis's hand twice (Guel Jeturk t12, Gundam Calibarn itself t14) — the removal density in the back half of the game is partly explained by this card finding more answers, not just a lucky draw."
  - "Net verdict: a clear loss, not a close one (12 Kiraya units/bases lost vs. 4 for Altis, 0 shields remaining vs. 3). Two structural problems stacked: Gundam Exia neutralizes the deck's cheap early units before they can apply pressure, and once that early plan is denied, the matchup's dense generic-removal suite (now confirmed recurring: same 4 spells as the freedom_ibo_v1_1 win) has time to answer every subsequent threat one at a time, including a new top-end bomb (Gundam Calibarn) not seen in the earlier encounter with this archetype. First loss this campaign to 'Witch from Mercury / G-Witch control' (see freedom_ibo_v1_1/ANALISI.md game #23 for the earlier win against the same archetype)."
