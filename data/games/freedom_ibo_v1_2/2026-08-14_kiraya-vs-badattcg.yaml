study_notes:
  - "Kiraya ha descritto questa sconfitta come colpa propria ('la fretta mi ha fatto perdere'), ma rileggendo il log non emerge una giocata avventata isolata — il t18 (deploy di Gundam Barbatos 1st Form, Strike Rouge Ootori, Gundam Barbatos Adapt e Hyakuren, ZERO attacchi) è anzi il turno più prudente di tutta la partita, non uno frettoloso: Kiraya ha ricostruito il campo senza spingere, probabilmente proprio per rispetto dei blocker avversari (Strike Rouge Ootori + Victory Gundam di BadAtTCG già in campo)."
  - "Il vero colpo che ha deciso la partita è stato interamente di BadAtTCG, non un errore di Kiraya: al t19 l'Activate di V-Dash Gundam ('Rest 1 delle tue altre unità (League Militaire): scegli 1 unità nemica con 4 HP o meno, riposala') ha riposato preventivamente Strike Rouge (Ootori) — l'UNICO corpo <Blocker> rimasto a Kiraya (Gundam Gusion Rebake era già morto al t11) — subito prima di un turno da 3 attacchi (Victory Gundam, Strike Rouge Ootori, Strike Freedom Gundam) tutti passati senza blocco possibile, esattamente pari ai 3 scudi rimasti di Kiraya. Un colpo calcolato e ben sequenziato dall'avversario, non una svista di Kiraya da correggere."
  - "Se c'è un momento da rivedere, è più a monte: lo scambio del t17 (Strike Freedom Gundam di Kiraya ucciso in trade diretto da V-Dash Gundam, dopo 2 danni di Darkness Finger) ha lasciato Kiraya senza alcuna unità in campo a inizio t18 — ma con 'No blockers available' su ogni attacco anche prima di quel trade, non è chiaro che una sequenza diversa avrebbe cambiato l'esito: il mazzo di BadAtTCG (V2 Gundam/V-Dash Gundam/Üso Ewin, splash Strike Freedom Gundam/Kira Yamato) ha semplicemente giocato in modo molto pulito nel finale."
  - "Partita comunque equilibratissima fino alla fine: entrambi i giocatori terminano a 0 scudi rimasti (6 scudi ciascuno consumati in totale) — una vera corsa punto a punto decisa dall'ultimo turno, non da un vantaggio schiacciante sprecato."
