study_notes:
  - "Decima vittoria della campagna contro l'archetipo Nu Gundam/Amuro Ray Londo Bell (Blu/Verde) — la variante avversaria di gran lunga più frequente in questa campagna, confermata anche stavolta con lo stesso shell (Gundam+Amuro Ray Repair 2, Jegan multipli come carburante per Nu Gundam, Kayra's Re-GZ/Re-GZ)."
  - "Widespread Annihilation al t12 ha centrato un 3-per-1 reale (Gundam, Jegan, Re-GZ avversari contro il solo Graze Custom proprio) proprio mentre il board di Bela era al suo picco — tempismo che ha impedito al pacchetto Nu Gundam di ereditare un board già sviluppato."
  - "Bela porta entrambe le stampe di Nu Gundam nello stesso game (GD05-017 'finalizer' agganciato ad Amuro Ray al t13, GD05-020 'economico' con Deploy Risorsa EX al t15) — pattern ormai ricorrente in questo matchup, mai una sola stampa fissa."
  - "Chiusura pulita al t16: Strike Freedom Gundam scarta le proprie 2 copie di Kira Yamato in eccesso (già una agganciata) per rimandare l'ultimo Re-GZ di Bela in fondo al mazzo, poi attacca senza opposizione con Bela già a 0 scudi."
