study_notes:
  - "Fifth MF/G Gundam loss this campaign (1-4 in v1_2 now), same recursive core as every prior one: Shining Gundam's Deploy (exile 2 (MF) trash Units, return a Special Move to hand) fetched Darkness Finger repeatedly — at least 3 separate casts this game (t14 killing Gundam Barbatos 1st Form, t16 chipping Gundam Gusion Rebake) — each time paid for with cards already dead in the trash, so it never cost YU123 real tempo."
  - "t16 was the back-breaking turn: a second fresh Shining Gundam deployed (recurring Darkness Finger yet again via Domon Kasshu's When-Paired discard-trigger), then Shining Finger rested Gundam Gusion Rebake pre-combat AND granted the attacking Shining Gundam <First Strike> — killing the blocker for zero return damage — while Shining Gundam (Super Mode) attacked unopposed the same turn to destroy Axis. Two attackers, one turn, no way to answer either."
  - "Widespread Annihilation at t17 was good value (3-for-1: both regular Shining Gundam copies plus Gundam Maxter) but its Lv.4-or-lower restriction let Shining Gundam (Super Mode), already the real threat on board, walk away untouched."
  - "The closing sequence (t20) shows the late-game reach that ends these games: Master Asia's During-Link/Attack ability (2 damage to an enemy Unit if a Special Move Command was activated that turn — satisfied by Shining Finger played the same turn) sniped Kiraya's already-damaged Strike Freedom Gundam right as Rising Gundam attacked, clearing the only possible blocker before the lethal hit — the same Master Asia/Special-Move interaction that decided the Sol loss earlier this campaign."
