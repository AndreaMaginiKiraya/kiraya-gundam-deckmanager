study_notes:
  - "A genuine Tekkadan mirror-ish grind (emily also ran Barbatos Adapt, Gusion Rebake, and a Gundam Barbatos Lupus Rex, mixed with Gundam Wing EW finishers) that went the full 19 turns and ended on a clean shield-out - a real, unambiguous win this time, not a concession."
  - "Turn 13's Lupus-vs-Lupus-Rex exchange is worth re-reading later: two Lupus activations (2+2) plus Mikazuki's paired ping (+1) add up to 5 damage on top of Lupus Rex's own turn-12 self-inflicted 1 (from its own end-of-turn ability), for 6 total against its printed HP6 - it should have been destroyed exactly, but no 'destroyed' line ever appears and Lupus Rex is never mentioned again. Same kind of missing-death-event gap as the Gundam Ez8 High Mobility Custom case in the previous Sally game - worth treating as a recurring gamelog/MSA display gap for multi-source lethal stacking, not a sign the unit actually survived."
  - "Gundam Barbatos Lupus performed at its ceiling: 3 separate copies deployed across the game (t13, and two more by t19), landing 4 total activations for 4 kills (Lupus Rex effectively, Wing Gundam, and chip damage on Wing Gundam Zero) before finally trading with Wing Gundam Zero at t18 - and Kiraya still had a fresh 4th copy ready to close the game at t19."
  - "No Lupus-discard-habit repeat: the one copy lost to Gundam Exia Repair's mill (t5) was pure random mill variance (Exia Repair mills automatically on death, no player choice involved), not the same failure mode as the earlier Overflowing Affection/Ryusei-Go discard-choice habit - worth keeping these two loss vectors (blind mill vs. an actual pick) mentally separate when tracking the pattern."
  - "No misplay found this game - clean execution across a long grind, including correct blocker assignments (Shiden Custom into Adapt t10, Gusion Rebake into Wing Gundam t16) and good self-ping target choices throughout."
