study_notes:
  - "Confirmed with Kiraya: won by concession at t15, not shield-out - タクヤ still had 2 shields remaining per the tally, but the log cuts off right after a Lupus activation with no attack shown against her; she resigned rather than play out a lost board (Kiraya had Barbatos Adapt + a fresh Gusion Rebake + Lupus all in play against タクヤ's single remaining Zaku Ⅱ)."
  - "Gundam Barbatos Lupus delivered again at t13: two activations killed both of タクヤ's remaining threats (Char's Zaku Ⅱ and a plain Zaku Ⅱ) in a single turn using only trash fuel, right after a Lupus copy had been discarded to Overflowing Affection at t11 - a second copy was already available, consistent with her own redundancy-management read of that discard rather than a mistake."
  - "A genuine Tekkadan-mirror-adjacent matchup again (タクヤ ran her own Gundam Barbatos Adapt line alongside a Char Aznable/Zeon shell) - the Barbatos Adapt vs Barbatos Adapt trade at t10 and the repeated Rick Dom/Shiden Custom exchanges were all fair value, nothing to flag as a misplay."
  - "No tactical mistake found - clean, controlled aggression start to finish."
