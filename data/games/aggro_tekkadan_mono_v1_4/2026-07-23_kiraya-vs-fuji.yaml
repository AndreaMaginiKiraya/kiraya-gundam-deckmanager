study_notes:
  - "Confirmed mistake (self-identified) at t14: Overflowing Affection's discard cost was spent on a freshly-drawn Gundam Barbatos Adapt, when the intent was to deploy it fresh and pair Mikazuki Augus with it instead. This mattered more than just losing the card: Barbatos Adapt's link field names [Mikazuki Augus] specifically, so pairing them would have created a true Link, and Link Units can attack the very turn they're deployed (rule 3-2-6-3) - bypassing the normal 'can't attack the turn deployed' restriction. Instead, Mikazuki got paired onto a freshly-deployed Hyakuren that same turn (no Link condition met, since Hyakuren doesn't name Mikazuki), which could NOT attack that turn - a real, quantifiable tempo loss of one attack, matching her own read of 'lost several turns.'"
  - "That said, the mistake didn't decide the game: by t14 fuji was already nearly out of shields (0 remaining per the tally, reached before this point), so the extra turn(s) of delay this cost just stretched out an already-won position rather than putting the win at risk - consistent with her own framing that she won anyway and the opponent conceded."
  - "Gundam Barbatos Lupus had an excellent game regardless: 3 separate activations across t12 and t14 (6 total damage) picking off Gundam Gusion Rebake, Blast Impulse Gundam, and chipping Sazabi, on top of a direct unblocked attack - the engine kept generating value even through the t14 sequencing hiccup."
  - "fuji's Sazabi (GD05-049) is worth remembering as tech: its Attack ability destroys 1 of her own units to force Kiraya to destroy 1 of her own non-battling units in return (seen t15, destroying Gundam Barbatos Adapt for free) - a real answer to a wide aggro board that doesn't care about blockers or AP thresholds. Good to recognize this trigger pattern ('Sazabi: destroyed X') early in future games against Neo Zeon decks."
