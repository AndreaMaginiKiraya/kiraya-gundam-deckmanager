study_notes:
  - "Total domination: Kiraya never lost a single shield the entire 16-turn game (shields_lost: 0) while Kaz was shield-out by turn 16 - a genuine stravittoria, not a close call anywhere."
  - "6th occurrence this session of discarding Gundam Barbatos Lupus to a card-filter cost (after ded, melon2222, kelryn, steel, sally): turn 3's very first Overflowing Affection discarded it immediately. Once again it cost nothing (the game was won at a canter regardless), but at 6 occurrences across two deck iterations this is a deeply ingrained habit, not variance - the discard prompt needs an actual second look before confirming, every time."
  - "Good, non-obvious use of Isaribi's Activate ability at t11 (Rest this Base: choose 1 damaged Unit, it gets AP+2 during this turn) buffing Barbatos Adapt right before its attack - not just passive shield-to-hand value, an active combat trick."
  - "Kaz's deck (Blue/White Earth Federation/Newtype - White Base token generation, Amuro Ray Link shenanigans resting/bouncing units, Kapool's card-advantage engine) never found its footing: EX Base died t7, White Base itself died t11, and no single threat survived more than a turn or two against Kiraya's board. Nothing to add to the opponent-archetype tracking beyond 'another grindy Federation/Newtype shell that couldn't keep pace'."
  - "No misplay found - total board and tempo control from turn 7 onward."
