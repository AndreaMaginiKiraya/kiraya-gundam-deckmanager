study_notes:
  - "A loss to a Green/Red Zeon/Neo Zeon evasion-aggro deck: Char Aznable (ST03-011) grants High-Maneuver to its Link Unit on Attack (used twice, t5 and t13 - the killing blow), and Sinanju/Full Frontal is unblockable by its own Link ability, so a large share of RYOMARU's damage was simply unblockable by design, not a result of any blocking error."
  - "Zeheart Galette's mill (t10) burned both Gundam Barbatos Lupus and Gundam Barbatos 1st Form in the same activation - bad variance (2 non-Vagan cards, so no AP-2 side benefit either), and it cost the deck its biggest finisher for the rest of the game. Not a play error, just the risk that card always carries."
  - "One small, genuinely avoidable inefficiency: t12's Gundam Barbatos Adapt deploy ping self-targeted the already-damaged Shiden Custom (Ryusei-Go) (2->1 HP) instead of the freshly-deployed Barbatos Adapt itself (4->3 HP), leaving Shiden Custom one point from death for no reason. It ended up not mattering - Zeong's unblockable attack ended the game the very next turn before Shiden Custom's HP was ever tested - but it's a checkable habit: when a deploy-ping needs a friendly target, self-hitting the healthiest available unit is free, hitting the frailest one isn't."
  - "Recurring data/parser gap, not a misplay: RYOMARU's Char's Zaku Ⅱ (GD01-026) token, spawned t6 from its own During Pair/Destroyed trigger with printed stats AP3/HP1, was immediately hit by Mikazuki Augus's own 1-damage ping that same turn - which should have destroyed it outright - yet it kept being tracked as alive and attacking through t9 (hitting Isaribi) until an explicit destroy at t10 vs Shiden Custom. Same 'missing destroy event' anomaly seen in prior games (Ez8, Barbatos Lupus Rex, Lfrith) - treat as a log/parser gap, not a missed kill."
  - "Blocking decisions were all correct given the board: no Blocker-capable unit existed until Gundam Gusion Rebake arrived t10, so 'No blockers available' through t5-t9 was forced, not a choice. t9's decision to let Isaribi (a disposable 1-cost base) absorb both of RYOMARU's attacks for free rather than risking Shiden Custom in a block was the right call - Isaribi did its job, soaking 6 damage across two attacks before dying, protecting two real shields."
