study_notes:
  - "Genuine shield-perfect stravittoria: Kiraya lost zero shields the entire 13-turn game (shields_lost: 0), ann was shield-out by t13 - a clean, unambiguous domination, not a concession."
  - "Real (marginal) mistake #1, t7: Mikazuki Augus's paired ping hit Gundam Barbatos Adapt itself instead of Hyakuren. Hyakuren was about to attack an undefended EX Base that same turn (zero return damage, confirmed - it took no damage from that attack), while Adapt was about to fight Gundam Exia Repair in a real trade. Pinging Hyakuren again instead would have cost nothing and left Adapt with 1 more point of HP buffer going into its fight (it ended that combat at 2 HP instead of what would have been 3). Didn't matter for the outcome, but it's a checkable inefficiency: when two forced-ping choices exist in one turn, none of them should land on a unit about to take real combat damage while a completely safe attacker is available."
  - "Real (marginal) mistake #2, t9: Gundam Gusion Rebake's own deploy ping hit itself instead of Hyakuren or Barbatos Adapt, both of which attacked unblocked (again zero return damage) that same turn. Gusion Rebake didn't attack this turn, so the self-damage bought nothing and only made it 1 HP more fragile heading into its future Blocker duty (moot here since it died to Barbatos Lupus's 7 AP at t12 regardless, but the same avoidable-inefficiency pattern as mistake #1)."
  - "Both of the above are the same underlying habit: when a 'choose 1 of your Units, deal 1 damage' effect comes up, check for a unit that's attacking an undefended target (zero-risk) before defaulting to the unit that just triggered the ability or is about to fight something live."
  - "ann's t12 Gundam Barbatos Lupus (same card Kiraya runs) got excellent value in a mirror-adjacent moment - 2 activations for 2 kills (Hyakuren, Barbatos Adapt) plus a direct melee trade into Gundam Gusion Rebake, a 3-for-0 turn that would have mattered a great deal in a closer game. It didn't here only because Kiraya's shield lead by that point was already insurmountable."
  - "No other misplays found - the two marginal ping-targeting slips above are the full list."
