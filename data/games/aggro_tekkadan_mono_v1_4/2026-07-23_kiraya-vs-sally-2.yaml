study_notes:
  - "Likely ended by concession, not shield depletion: the final 'Winner!' at turn 15 followed Sally's own attack landing on Isaribi (leaving it at 2 HP, not destroyed), and shields_tally shows neither side at 0 (Kiraya 3 remaining, Sally 2) - reading this as Sally conceding a losing board rather than an actual lethal swing."
  - "Concrete validation of the Zeheart Galette mill-stacking risk flagged when v1_4 was proposed: pairing it twice (t10, t12) forced 4 cards into the trash, and one of them was Gundam Barbatos Lupus itself (t12's mill: Ryusei-Go + Barbatos Lupus). It didn't cost this game only because a second Lupus copy was still in the deck and got drawn/deployed at t14 for a clean double-activation (2 kills, Zaku Ⅱ and Leo) - with fewer remaining copies this would have been the same 'Lupus milled before ever being drawn' failure mode that lost the jaysanti and kuma games in an earlier iteration."
  - "Between Zeheart Galette's forced mill and Gundam Exia Repair's own mill-2-on-death, Mikazuki Augus got milled away twice (t10, t12) before the game was half over - the deck now runs three separate forced-mill-2 effects (Exia Repair, Zeheart Galette x3, Ryusei-Go's own deploy) stacked on top of each other, meaningfully more mill pressure on key cards than v1_3 had."
  - "Barbatos Lupus performed exactly as designed once it landed: deployed and activated twice in the same turn (t14) using only trash fuel, no attack needed, 2 clean kills - the engine still works when it actually reaches the battlefield."
  - "Turn 7's block (Shiden Custom (Ryusei-Go) into Gundam Ez8 High Mobility Custom) was a good trade: it was the only Blocker available, and it chipped Ez8 down to 1 HP while only costing a 3-cost card to prevent a bigger hit. Note: Ez8 never appears in Sally's casualties for the rest of the game despite t8's Mikazuki ping targeting it at (apparently) 1 HP - likely a missed 'destroyed' line in the raw log/parser rather than the ping actually whiffing, since the targeting choice itself was correct either way."
  - "No clear tactical misplay found this game."
