study_notes:
  - "First game with the v1_4 list. 5th occurrence this session of discarding Gundam Barbatos Lupus to a card-filter cost (after ded, melon2222, kelryn, steel): turn 11's Overflowing Affection discard was spent on Lupus yet again. Didn't cost this game (won comfortably on shield-out at t15), but this is now a well-established habit across two different deck iterations - worth actually reading the discard prompt before confirming."
  - "Shiden Custom (Ryusei-Go)'s bumped count (3->4 in v1_4) already paid off: it blocked twice this game (t10 vs Gelgoog, t14 vs Gelgoog again), trading evenly both times (AP4/HP3 for AP4-ish attackers) - exactly the extra Blocker density this change was meant to add, and it showed up in a single game."
  - "Zeheart Galette and Minerva (the other two v1_4 additions) were never drawn this game, so no read yet on how they perform in practice."
  - "Opponent archetype: Sally ran a deep Green/Red Zeon toolbox (Char's Zaku Ⅱ's repeatable Destroyed-recursion into Zaku I Sniper Type/GFreD/Rick Dom, a Zeong+Char Aznable Link finisher, Big Zam and A Baoa Qu as heavy-hitters/bases) rather than a pure fast swarm - a slower, grindier build than the earlier Kelryn matchup despite sharing the same colors, so treating this as a variant of the existing Green/Zeon archetype rather than a new one."
  - "Clean aggressive execution otherwise: Barbatos 1st Form's unconditional 'draw 1 on attack declare' fired 5 times across the game, and repeated forced self+enemy pings (Barbatos Adapt x2 at t7, Gusion Rebake/Mikazuki at t11) were consistently aimed at units already committed to attacking or already fragile, not at anything that needed to stay healthy."
unparsed_lines:
