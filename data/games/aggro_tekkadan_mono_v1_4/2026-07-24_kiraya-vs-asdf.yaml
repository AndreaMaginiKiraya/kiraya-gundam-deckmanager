study_notes:
  - "A genuine narrow loss: 0 shields remaining for Kiraya vs 1 for ASDF at the end - decided by a single shield, not a blowout."
  - "The engine that actually decided this game: Cyclone Punch (a Command that can pair from trash onto an (MF) Unit as 'Chibodee Crocket') gives Gundam Maxter 【During Link・Attack】'reactivate this card's Main' - so every time Maxter itself declares an attack, it re-applies Cyclone Punch's 'choose 1 enemy Unit, AP-2 this turn' for free, indefinitely, no cost. This zeroed out Gundam Barbatos Adapt (AP2) completely every single time Maxter attacked it (t7 killed Hyakuren for 0 return, t9 killed two separate Adapts for 0 return) - Adapt's AP2 minus the -2 debuff is exactly 0 damage dealt back."
  - "Key mechanical detail worth remembering: the free reapplication only fires on Gundam Maxter's OWN declared attack, not when it blocks/defends. This is exactly why t10's trade worked in Kiraya's favor for the first time all game - she declared 'Gundam Barbatos Adapt against Gundam Maxter' (her own attack, into Maxter), the debuff never triggered, and Adapt's full AP2 (plus accumulated chip damage from its own deploy-ping hitting Maxter across t8-t9) was enough to finally kill it."
  - "Answering the direct question - could the early pieces have been played/protected better: partially, yes, but with real caveats. Once the pattern was confirmed at t7 (Hyakuren died for zero return), continuing to sit with fresh Barbatos Adapt copies exposed to Maxter's attacks at t8-t9 fed it two more free kills - recognizing 'my AP2 units are worthless as blocking targets against this specific Unit, I should be the one attacking Maxter, not the other way around' one turn earlier could plausibly have saved one Adapt copy. That said: she had no Blocker in play at that point (so there was no way to redirect/prevent Maxter's attacks defensively), and the deck's curve is overwhelmingly AP2 1-drops, so there wasn't a materially different, higher-AP body available to deploy instead - this is as much a genuine bad matchup for a low-AP swarm plan as it is a sequencing slip."
  - "The Lupus lateness was NOT a sequencing mistake: 2 of the 4 copies were sitting in Kiraya's own shield pile the whole game (both later revealed-and-discarded by ASDF's own attacks at t13) - pure shuffle/shield-placement variance, unreachable by any in-game decision. The other copies were simply slow to draw (first one landed t16) despite two Overflowing Affection casts along the way that didn't hit it. Nothing playable differently early would have changed this specific piece of bad luck."
  - "Once Lupus did land at t16, it delivered exactly as it should: 5 activations in one turn for 2 kills (Master Gundam, a Lv7/Lv5 HP5 LR, and Rising Gundam) - by then the shield gap (already down to the final couple of cards) was just too large to close."
