study_notes:
  - "The idle-attacker pattern flagged in the last two games (vs Fusiki, vs cdawg) shows up again here, bigger: Gundam Barbatos Lupus deployed t13 and never once declared an attack for the rest of the game (t13, t15, t17 all pass with only its ping activated, never its own AP5 swing), despite nothing in its own ability text requiring it to rest when activated - the activation logs never show a 'Rested' line for it, unlike Isaribi's own activations which do. Three full turns of a top-end attacker sitting still is the largest version of this issue seen so far across the sample."
  - "Same habit, sharper example: t17 paired Mikazuki Augus onto a freshly-deployed Shiden Custom (Ryusei-Go) - a true Link (its link field is any Tekkadan pilot), so it was eligible to attack that same turn per rule 3-2-6-3 - and it didn't attack either, on the very turn it came down. This is now a confirmed, repeatable pattern across 3 straight imported games, not a one-off: worth a standing habit of checking, every single turn, whether every attack-eligible unit on board actually swung before ending the turn."
  - "That said, this game's actual execution elsewhere was clean, matching her own read of 'decently played': Gundam Exia Repair's own 'destroys an unpaired Lv.4-or-lower enemy Unit it damages' text picked off Gundam Lfrith outright at t8 even though Exia Repair itself died in the same trade - good awareness of a card doing more than its stat line suggests. Gundam Barbatos Lupus's ping-only activations (t13 x2, t17) still cleared Providence Gundam and chipped Sword Strike Gundam efficiently even without ever swinging."
  - "KosXBlue's Close Combat has an odd recurring interaction worth flagging as a pattern rather than a play issue: revealed as one of Kiraya's own shields three separate times (t9, t13, t17), its burst-style trigger hit one of her OWN units each time (Hyakuren, Graze Custom, Ryusei-Go (Graze Custom Ⅱ)) rather than an enemy one - consistent enough across three instances that it looks like how this specific card's shield-reveal trigger actually works, not a random fluke."
  - "Won by concession at t18 with KosXBlue already at 0 shields and no real board left - a clean, deserved close even without ever using Gundam Barbatos Lupus's actual attack."
