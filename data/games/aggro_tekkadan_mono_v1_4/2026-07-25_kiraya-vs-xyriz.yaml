study_notes:
  - "Genuinely brutal, not a misplay-driven loss - checked closely and every turn was either forced (no blockers ever available) or a real trade she initiated well. 't10's Gundam Exia Repair pairing with Mikazuki Augus was ping-only (Exia Repair's link field is Setsuna F. Seiei, not Mikazuki, so no Link was possible there anyway) and she still attacked with it the same turn regardless, killing Xyriz's repair-engine Gundam - correct read, nothing to flag."
  - "t13 was the turn that really decided it: Nu Gundam (GD05-017) generated two separate battles off one deploy - its own Pair ability exiled 3 trash cards to start an extra damage-only battle that one-shot Gundam Barbatos Lupus, and it ALSO attacked normally that same turn, killing Hyakuren too - with Breach 5 discarding a shield each time. One card converting a full graveyard into two kills plus two shields is a genuinely powerful combo, not something blockable given how the extra battle skips the normal declare/block steps entirely."
  - "Bad variance compounded the tough matchup: both copies of Gundam Barbatos 1st Form got milled by t7 (Gundam Exia Repair's own destroyed-trigger), and t10's Zeheart Galette pairing milled Mikazuki Augus itself with no Vagan hit to offset it - losing key pieces to the deck's own downside before they could ever be used."
  - "t12's double Gundam Barbatos Lupus activation (killing Zaku Ⅱ and a fresh Jegan outright from graveyard fuel) was excellent value and briefly stabilized the board - it just wasn't enough against Xyriz's own engine coming back online the very next turn."
  - "Worth remembering Amuro Ray (ST01-010)'s recurring tech from this opponent archetype (also seen vs Bill): its Pair trigger rests an enemy Unit with 5 or less HP, used again here at t7 to tap Shiden Custom before it could ever be offered as a blocker."
