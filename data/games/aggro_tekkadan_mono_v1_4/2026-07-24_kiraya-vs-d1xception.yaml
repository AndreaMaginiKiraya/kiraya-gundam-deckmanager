  - "t9: Gundam Gusion Rebake's deploy ping hit itself instead of Gundam Exia Repair or Graze Custom, both of which attacked completely unblocked that same turn (zero return-damage risk, confirmed). Pinging either of them instead would have cost nothing and left Gusion Rebake with 1 more HP. In practice it never mattered - Gusion Rebake died to a 7-damage hit at t12 regardless, pure overkill either way - but it's the same avoidable-inefficiency pattern flagged in the ann game."
  - "t11's near-identical situation (a second Gusion Rebake deploy ping hitting itself) was actually correct, not a repeat of the same mistake: this time Gundam Exia Repair was about to fight Shenlong Gundam directly (a real contested battle, not a safe unblocked hit), so there was no fully risk-free alternative target available - hitting the non-attacking Gusion Rebake was the right call given the options that turn."
  - "Opponent tech worth recognizing on sight: Chang Wufei paired with a Breach-keyword Unit (here Shenlong Gundam) makes that Unit immune to battle damage from any enemy Unit with 3 or less AP during D1xception's turn (t10's 'Damage prevented' against Graze Custom, AP2) - not a Kiraya misplay, just a hard counter to small attackers that's worth remembering against Gundam Wing decks."
  - "Data anomaly, not a misplay: Gundam Lfrith was at 'leaving 1 HP remaining' after t8, then took what should have been a lethal 1-damage ping at t9 with no 'destroyed' line ever appearing - yet it kept acting normally for many more turns. Same unexplained missing-death-event pattern already seen with Gundam Ez8 (Sally game) and Gundam Barbatos Lupus Rex (emily game) this session. Not treating this as a missed kill opportunity since the log itself doesn't support Lfrith actually being killable at that HP with any confidence."
  - "Likely ended by concession at t18 (Kiraya's shields never dropped once, 0 lost all game; D1xception still had 1 shield left per the tally) rather than a hard shield-out."
