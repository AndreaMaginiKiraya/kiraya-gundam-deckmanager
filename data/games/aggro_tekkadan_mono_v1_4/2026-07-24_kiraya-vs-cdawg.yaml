study_notes:
  - "The same idle-Link habit flagged in the 2026-07-24 game vs Fusiki showed up again, smaller this time: Gundam Barbatos 1st Form got Linked with Mikazuki Augus at t7 (already well past its own deploy turn, so fully eligible to attack by then regardless of Link) against a Gundam Lfrith it had just weakened with its own ping - and didn't attack. It waited until t9 to swing (one turn later than it needed to, versus the Fusiki game's three-turn version of the same thing). Worth treating as a real, repeatable pattern now rather than a one-off: check every turn whether an already-eligible attacker actually swung."
  - "The good news: later in this same game she got the timing right. t19's fresh Gundam Barbatos 1st Form was Linked with Mikazuki Augus and attacked immediately the turn it deployed, alongside 3 other attacks and 2 Gundam Barbatos Lupus activations - so the rule itself isn't the gap, it's consistency in applying it every time a Link comes down."
  - "cdawg's Graceful Demeanor (t17) bouncing both Graze Custom and its paired Zeheart Galette mid-combat was a real tempo hit, but it's an instant-speed trick with no visible tell beforehand - nothing to have played around."
  - "Gundam Barbatos Lupus carried the closing stretch on pure graveyard fuel: t15 (2 activations killing Wing Gundam Zero (EW)), t19 (2 more clearing Sword Strike Gundam and chipping another), and t21 (2 activations alone killing both Wing Gundam and a second Wing Gundam Zero (EW)) - the engine that's been deciding most of these recent games did it again here."
  - "t20 was a genuinely brutal, fully forced turn (four separate attacks, all 'No blockers available', wiping Gundam Barbatos Lupus, Isaribi, and both remaining Gundam Barbatos 1st Form copies) - not a defensive misplay, just the bill coming due after the previous turn's all-in left nothing back to block with. Winning anyway afterward, on a nearly empty board, was a genuine comeback."
