study_notes:
  - "Re-checked every Mikazuki Augus/Zeheart Galette pairing this game against the corrected read (pairing is often just for the ping or a stat/defense buff, not to unlock an attack) - and every instance here fits that: t15 and t19 paired Mikazuki purely for the ping (onto Gundam Gusion Rebake and Hyakuren, neither of which even links with Mikazuki - both are plain pairings for the 1-damage value only), and t15's Rebake still attacked the same turn anyway once the ping had softened its target. Nothing to flag from any of these."
  - "The one real tempo question is different in kind: t7, Gundam Barbatos 1st Form was simply standing, unpaired, fully past its deploy-turn restriction, against a completely empty DDDRAGON board (both his t6 attackers had traded off), and didn't attack at all that turn. No pairing was involved here, so this isn't the ping-vs-attack pattern - it's a plain unused free attack. Worth a light note, not a strong one: DDDRAGON hadn't shown any removal yet at that point so there's no obvious defensive reason found for holding back."
  - "t11 and t13 both correctly used the Link-immediate-attack rule: Shiden Custom (Ryusei-Go) at t11 and Gundam Flauros (Ryusei-Go) at t13 both got Linked with Mikazuki Augus and swung the same turn they were paired, right after the ping resolved - good execution matching what should happen every time a true Link comes down mid-combat-turn."
  - "DDDRAGON's list is a real Setsuna F. Seiei/Gundam Exia buff-stacking Celestial Being deck, closing with a 6-card Decisive Last Resort at t18 that single-handedly removed Kiraya's last unit - a graveyard payoff that only a long, grindy game lets a control-leaning CB deck actually assemble. The loss came down to that late-game power spike rather than any specific misplay on Kiraya's side."
