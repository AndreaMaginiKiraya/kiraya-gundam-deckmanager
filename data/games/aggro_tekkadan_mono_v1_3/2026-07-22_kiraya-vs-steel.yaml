study_notes:
  - "Genuinely clean game: consistently good self-ping targeting all three times a 'choose 1 of your Units, deal 1 damage' effect came up - turn 7's Barbatos Adapt deploy hit Barbatos 1st Form (about to attack anyway) instead of itself, turn 9's Mikazuki Augus pairing hit Hyakuren (also about to attack, so the incidental damage was free) instead of the already-fragile Barbatos Adapt, and turn 11's Ryusei-Go deploy hit itself (a disposable filter unit) rather than the 1-HP Barbatos Adapt or the actively-attacking Barbatos 1st Form. This is the same target-discipline flagged as good in the Chinken game, holding up again here."
  - "Good trade efficiency: both 1-cost Graze Customs converted into kills on Gaia Gundam and Chaos Gundam (2-cost bodies) at turn 7, and the second Hyakuren traded evenly into Forbidden Gundam (a 3-cost Blocker) at turn 11 - repeatedly getting the better end of cost exchanges let Kiraya out-race steel's board despite never landing Barbatos Lupus at all this game."
  - "4th occurrence this session of discarding Gundam Barbatos Lupus to a card-filter cost (after ded, melon2222, kelryn): turn 11's Ryusei-Go (Graze Custom Ⅱ) 【Deploy】 discard was spent on Lupus again. Didn't cost this game (it was already won on board/tempo without it), but four times in one session is a real habit, not variance - worth actually checking the discard prompt before confirming it from now on, since Lupus is specifically the one card this deck can't afford to feed to its own filters."
