study_notes:
  - "Gundam Barbatos Lupus was the whole game: 6 separate 【Activate】 uses across two deployments (turn 14 x2, turn 16, turn 20, turn 28 x2), each burning 3 trash Tekkadan/Teiwaz cards for 2 guaranteed damage - accounted for 5 of the opponent's Unit kills (Leopard Destroy x1, Gundam Airmaster Fighter Mode x1, Gundam X x1 across its two deploys) without ever needing to swing into a blocker for most of them."
  - "Turn 21 Lupus-vs-Gundam DX mutual trade (both took lethal damage) was a fine outcome, not a loss: that copy had already paid for itself many times over (4 activations before dying), and a second copy came down turn 28 for 2 more kills - Lupus doesn't need to be preserved once it's extracted its value, only while its activation still has trash fuel."
  - "No Barbatos Lupus discard-to-filter-effect this game (unlike the ded/melon2222/Kelryn games) - the habit did not recur here."
  - "Turn 20 paired Lafter Frankland onto Lupus and attacked into the only available blocker (Gundam Airmaster) anyway: correct read, since Lupus's 5 AP vs Airmaster's 3 HP/4 AP still won the trade (Airmaster destroyed, Lupus survived at 1 HP)."
  - "Opponent's turn-27 Giant Killing (destroy 1 active enemy Unit with 4 AP or less) hit Gundam Barbatos Adapt, not Lupus - Lupus's 5 AP makes it naturally immune to that removal, which matters if Fatal Strike/Giant Killing get added to this list later: they'd be safe to run without exposing the deck's own Lupus copies to a mirror-image risk."
  - "29 turns but never a close game on the shield race: Kiraya kept a comfortable shield lead the entire way (finished at 4 remaining vs 0) despite the opponent's Vulture/Gundam X package grinding board state - length here was value-trading attrition, not a near-loss."
