study_notes:
  - "Fast, clean win on turn 12 despite an opening mulligan — Kiraya never lost a shield (5 remaining) vs maomao losing the EX Base plus both shields deployed. No Gundam Barbatos Lupus needed this game; pure early aggression closed it out before maomao's League Militaire package got going."
  - "Gundam Exia Repair's mill hit hard this game (Flauros + Barbatos Adapt turn 7, then both copies of Gundam Gusion Rebake turn 8) — four real cards gone from the deck involuntarily in two turns, the worst mill variance seen yet this session, but the early tempo lead was big enough that it didn't matter."
  - "Another League Militaire opponent (Victory Gundam, Üso Ewin, V-Dash Gundam discarded unplayed) but a different engine than Barbanja/GD05NOOB/ded: here the recurring [Parts] token comes from Üso Ewin's own 【When Paired】ability, not Victory Gundam Hexa's Attack trigger — confirms the same token can come from more than one source card depending on the specific build."
  - "Victory Gundam pinned to GD04-003 (Attack: draw if 3+ League Militaire in play) here, versus GD04-011 (Destroyed: Parts token) seen in the Barbanja/GD05NOOB/ded games — different printing, same card name, another reminder these ambiguous pairs really do vary by opponent."
