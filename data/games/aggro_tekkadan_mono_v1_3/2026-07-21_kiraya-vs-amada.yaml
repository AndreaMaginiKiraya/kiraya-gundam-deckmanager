study_notes:
  - "Dominant win on turn 17 — Kiraya never lost a proper shield all game (6 remaining; her EX Base was only finally destroyed turn 16, very late) while Amada lost the EX Base plus all 4 shields."
  - "Gundam Barbatos Lupus carried the midgame again: 3 activations total (2 at turn 13, 1 at turn 15) cleanly destroyed GN Armor (Type-E) and chipped Gundam Exia to 1 HP, all funded by already-dead trash cards — same free-value pattern confirmed all session."
  - "Amada's Celestial Being (CB/Gn Drive) shell repeatedly used Hallelujah Haptism's card-advantage ability (look at top card, add a CB card to hand on a battle-kill) and Setsuna F. Seiei's own mill-2-then-draw/end-of-turn-resource-ramp ability — a resilient, card-quality-focused deck, but it couldn't out-tempo Kiraya's aggression once Lupus came online."
  - "No tactical missteps stood out — trades were consistently fair (Barbatos Adapt into Gundam Kyrios turn 9, Barbatos 1st Form into Gundam Kyrios (Trans-Am) turn 11) and every discard/mill loss was involuntary (Gundam Exia Repair's own mill, Ryusei-Go's discard-cost) rather than a bad choice."
