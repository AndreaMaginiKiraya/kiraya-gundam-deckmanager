study_notes:
  - "Likely ended by concession, not shield depletion: the final 'Winner!' at turn 11 came right after Kiraya simply deployed Gundam Gusion Rebake (no attack declared), and the shields_tally shows neither side at 0 (cookd had 5 remaining, Kiraya 4) - reading this as cookd conceding a losing board rather than an actual lethal swing."
  - "Turn 9's Barbatos 1st Form vs Gundam Heavyarms trade (1st Form destroyed, Heavyarms survived) looked bad on the surface but wasn't a misplay: cookd stacked Heero Yuy's shield-kill AP-2 (turn 8) with a reactive Iron-Fisted Discipline AP-2 (turn 9, played mid-action-step) to blunt the attack - a trick that couldn't be seen coming. It was still the right attack to make regardless of the trade, since Barbatos 1st Form's 'draw 1' fires just from declaring the attack, independent of the outcome."
  - "New opponent tech for the meta model: a White/Green Gundam Wing (Operation Meteor) shell running AP-debuff stacking (Heero Yuy's on-shield-kill AP-2 + Iron-Fisted Discipline's reactive AP-2) to blunt attackers instead of blocking them, plus Shenlong Gundam's Attack-triggered 'destroy 1 enemy Blocker Lv.3 or lower' as anti-Blocker tech - a fifth distinct opponent archetype alongside the Blue/White Kira/Strike-Freedom grind, the Gundam-Fighter pilot-chain deck, the fast Green/Zeon swarm, and the Blue/Green One Year War curve-into-Zeong shell."
  - "No Barbatos Lupus involvement this game either way - never drawn, so the discard habit had no chance to come up."
