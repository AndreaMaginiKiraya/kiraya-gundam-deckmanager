study_notes:
  - "Dominant win on turn 16 despite an opening mulligan — Kiraya's own EX Base/shields were never even touched (0 lost, 6 remaining), while Azure lost the EX Base plus all shields."
  - "Azure runs a similar Blue/Orb Earth Alliance shell to the Petrullica loss (Aile Strike Gundam + Kira Yamato, Strike Freedom Gundam, Archangel) — worth noting as a recognizable matchup type, but this time Kiraya's aggression closed it out well before the bombs could take over."
  - "This game's Gundam Barbatos Lupus death (turn 15) is a useful contrast to the Petrullica loss: here it was Azure's own Strike Freedom Gundam that declared the attack directly at Lupus (not Kiraya choosing to swing it into a bad trade) — Lupus has no Blocker keyword and nothing could have stopped that specific attack. A reminder that losing Lupus in combat isn't inherently a misplay; it depends on who initiated the fight."
  - "Gundam Barbatos Lupus still got full value first: two activations at turn 12 cleanly killed Waldfeld's Murasame using only already-dead trash cards, before eventually trading into Strike Freedom Gundam at turn 15."
  - "Kira Yamato dual-instance confirmed again (ST04-010 Attack-debuff + GD05-081 Link-draw) — third game this session where an opponent runs both prints simultaneously."
  - "Resolved a name-mapping case documented in CLAUDE.md: 'Murasame (Andrew Waldfeld Unit)' is MSA's display name for Waldfeld's Murasame (GD05-003), the exact card that note describes."
