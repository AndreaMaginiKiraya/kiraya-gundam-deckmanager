study_notes:
  - "Detailed mistake review (requested): the clearest concrete misstep is turn 8's Overflowing Affection discard — Kiraya discarded Gundam Barbatos Lupus (a Lv.7 bomb that has single-handedly closed out most wins this whole session) as the card-selection cost, rather than a lesser card. That single choice meant her best removal/finisher tool was never available for the rest of this 19-turn game, against exactly the kind of sustained-threat, one-big-unit-at-a-time opponent Lupus answers best (see below). Can't see her full hand at that moment, but discarding a top-end bomb this early is a real, checkable cost, not just bad luck."
  - "A second Barbatos Lupus copy was also lost involuntarily to Hotarubi's own mill-1 trigger at turn 12 — bad luck stacking on top of the turn-8 choice, but not a play error in itself."
  - "Beyond that, combat/blocking decisions were mostly fine or forced (no Blocker-keyword units were ever available at the critical lockdown turns 13/17/19) — this wasn't a case of misassigned blockers."
  - "The real opponent engine: ded assembled multiple 'rest the blocker before it can block' tools (Gun EZ's Deploy, V-Dash Gundam's Activate) plus a hand-disruption/bounce suite (Strike Freedom Gundam's discard-2-to-bury-bottom-of-deck, Aile Strike Gundam's Lv.4+-pilot bounce) — every single turn from 13 onward, whatever Kiraya deployed got neutralized before it could either block or threaten back. This is a much more complete 'lockdown' package than the CVille or TRIAL losses, and a real answer to it would have needed either more Blockers (still only 6/50 in v1_3) or Gundam Barbatos Lupus surviving to clear the recurring V-Dash Gundams/Victory Gundams before they snowballed."
  - "Victory Gundam (GD04-011) and Kira Yamato (dual instance, ST04-010 + GD05-081) pinned the same way as in the Barbanja/GD05NOOB games — ded is very likely the same or a closely related League Militaire deck archetype."
