study_notes:
  - "Win on turn 20 (opponent concession, board and shields already spent) against an unusually removal-dense Red/Neo Zeon deck — melon2222 killed almost every Kiraya unit with direct spells rather than combat (Improved Technique, Battle of Aces, Darkness Finger, Close Combat, all seen this session as opponent tech) rather than board presence. Kiraya lost 0 proper shields all game (2 remaining) while melon2222 lost the EX Base plus all 6 shields — a clean demonstration of the deck's aggro plan working exactly as intended: redundant cheap threats kept connecting even while getting picked off turn after turn, because the removal never came backed by real blockers."
  - "Same habit flagged in the ded game recurred: turn 9's Overflowing Affection discarded Gundam Barbatos Lupus again. It didn't cost anything this time (melon2222 never developed a real board, so the aggro clock alone was enough), but it's now happened twice in tracked games — worth a conscious check before confirming that discard target given how much this deck's answers still lean on Lupus."
  - "Pinned Kshatriya to GD01-044 (the When-Paired dual-ping LR) via its Link-triggered 2-target ping on deploy."
