study_notes:
  - "Result correction: the raw log's last two lines both say 'Kiraya' as speaker ('No more shields available' then 'Winner!'), which the auto-detector misread as a Kiraya win. The shields tally proves the opposite — Kiraya 0 remaining/3+1 lost vs Petrullica 2 remaining/0 lost — so Kiraya is the one who ran out; result corrected by hand to win:Petrullica. Same MSA same-speaker export quirk as the crossroads game, just in the other direction this time."
  - "Serious mistake review (requested): the clearest concrete error is turn 15's decision to attack directly into Destiny Gundam with Gundam Barbatos Lupus. Petrullica simply chump-blocked with Blast Impulse Gundam — a cheap (cost 3) token that Destiny Gundam's own Attack ability had just freely recurred from trash the turn before — and both units traded. That let Kiraya's single best card (the repeatable trash-exile removal engine that carried nearly every win this whole session) die to a disposable, endlessly-recyclable blocker instead of the real threat it was aimed at. Lupus didn't need to attack at all to generate value; its Activate ability works from a standstill and this exact matchup (constant small trades feeding Purple/Minerva-Squad trash) was generating fodder for it every turn."
  - "The downstream cost was real: turns 16-20 had no more repeatable removal available, while Petrullica's Destiny Gundam (unblockable, During-Pair-Attack recursion of Minerva Squad units from trash) and Minerva (redeploys itself as a Base, refilling a shield each time) kept generating threats and resources faster than Kiraya could race them down. The eventual Destiny Gundam kill (turn 19, via Ryusei-Go finishing what a turn-17 Graze Custom chip started) came one or two turns too late relative to Kiraya's own shield clock."
  - "Contributing factor, not a play error: Gundam Exia Repair's mill and Hotarubi's mill both cost real cards this game too (Gundam Exia Repair itself milled turn 11, plus earlier Overflowing Affection/Barbatos Lupus-adjacent losses), consistent with the recurring variance risk of those two cards noted in earlier games this session."
  - "Opponent read: Petrullica (a strong player per the user) built a genuinely resilient shell — Impulse Gundam/Force Impulse Gundam/Blast Impulse Gundam all recur each other via trash-return effects, Destiny Gundam is unblockable and self-refuels every attack, and Minerva keeps rebuilding the Base row and shield count. This is a tougher, more complete engine than the League Militaire (Barbanja/GD05NOOB/ded) or Sazabi (TRIAL) opponents seen so far — worth remembering as a name to watch for."
