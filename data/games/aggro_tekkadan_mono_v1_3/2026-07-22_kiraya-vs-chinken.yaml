study_notes:
  - "Both players mulliganed, but Kiraya's redraw was still slow: only 1 unit in play through turn 6, and Mikazuki Augus wasn't paired onto a Unit until turn 10 - very late for this deck, which usually gets its first pilot pairing by turn 4-6. That delay meant no AoE-ping value and a much smaller board than usual going into the midgame."
  - "No Blocker-capable card was ever in play: every one of Chinken's turn 9 and turn 13 attacks (Gundam, Jegan, Rick Dom, Dijeh, Gundam NT-1) went either unblocked or ate a base, since this decklist runs zero Blocker units - the bases (Hotarubi x2, Isaribi) absorbed hits but bought no tempo back. This is a known structural gap, not a turn-by-turn misplay."
  - "Turn 11's block (Gundam Gusion Rebake into Gundam NT-1) was low value but defensible: it traded a freshly-deployed 4-cost Unit for only 3 damage on an AP4/HP4 attacker that didn't even die (and fully healed back via its own Repair 2 the same turn) - but the alternative was taking 4 unblocked damage while already well behind on shields, so this wasn't a clearly better-avoided error, just a bad trade forced by being outsized on board."
  - "The game was effectively decided turns 9-11: Chinken built Gundam+Jegan+Rick Dom+Gundam NT-1+Guntank while Kiraya still had 1-2 Units out, and turn 11 alone cost Kiraya three permanents (Hotarubi, Gundam Gusion Rebake, Gundam Barbatos Adapt) for zero of Chinken's - by turn 12 the board and card-advantage gap was already unrecoverable."
  - "New opponent archetype for the meta model: a Blue/Green 'One Year War' curve-out shell (Guntank/Rick Dom/Gundam/Jegan/Gundam NT-1/Dijeh into a Char Aznable-linked Zeong finisher with Wire-Guided Arm tokens and High-Maneuver unblockable damage) - wide early board plus a hard-to-block top end, distinct from the Blue/White Strike-Freedom grind shell, the Gundam-Fighter pilot-chain deck, and the fast Green/Zeon swarm archetype already tracked."
  - "No repeat of the Barbatos Lupus discard habit - Lupus never made it to the battlefield this game at all (mana-screwed out, per the slow start above), so the habit didn't have a chance to recur either way."
