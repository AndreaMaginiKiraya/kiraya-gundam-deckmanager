study_notes:
  - "Result correction: the raw log's last several lines are all attributed to 'Kiraya' ('No more shields available' then 'Winner!'), which the auto-detector misread as a Kiraya win. Per the established pattern (the speaker of 'no more shields' is always the player who just ran out), Kiraya is actually the one who lost here — matches the user's own account ('ho perso per un soffio'). Corrected by hand to win:JJL."
  - "Genuinely close 24-turn grind, decided by JJL simply having more recurring top-end than Kiraya could keep pace with — at least 2-3 separate Strike Freedom Gundam copies and 2+ Aile Strike Gundam copies came down over the game, each backed by Kira Yamato (bounce/debuff) or Amuro Ray (rest-lock)."
  - "Mistake review: no clear misplay found. Turn 15's Gundam Barbatos Lupus vs Strike Freedom Gundam trade (both destroyed) looked right in the moment: JJL had no blocker to redirect it (unlike the Petrullica game), and Strike Freedom Gundam's own 【During Pair・Attack】ability (discard 2, bounce the enemy's lowest-Lv Unit to the bottom of the deck) needed to be stopped before it kept recurring — it had already buried a Barbatos Adapt this way at turn 14."
  - "The second and third Barbatos Lupus losses (turn 18 bounced to the bottom of the deck, turn 20 traded in combat) were forced by board state, not by a prior Kiraya choice: turn 18's bounce hit Lupus specifically because Aile Strike Gundam's attack earlier that same turn had killed Kiraya's only other unit, leaving Lupus as the sole (and therefore 'lowest-Lv') target available to the ability."
  - "Between Lupus's own repeated activations (turns 13, 19) and combat use, Kiraya deployed and lost 3+ separate copies across the game — a good illustration of exactly the 'single point of failure' concern flagged in the deck-competitiveness discussion: even with multiple copies in the same game, JJL's card-advantage-and-bounce shell out-recurred them."
