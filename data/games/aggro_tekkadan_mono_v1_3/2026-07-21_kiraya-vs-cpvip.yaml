study_notes:
  - "Mistake review (requested): no clear misplay found. Every trade Kiraya made was fair-to-favorable (Re-GZ removed for free by accumulated pings turn 7, Hyakuren-for-Nu-Gundam turn 9, Barbatos Adapt-for-Kayra's-Jegan turn 11), and the one discard shown (Isaribi, a spare Base, via Overflowing Affection turn 11) was a low-cost choice, not a repeat of the Petrullica-game Lupus mistake."
  - "Turn 14 was the roughest patch: CPvip had accumulated 2-3 separate Nu Gundam copies by then, and between a blockable attack, Nu Gundam's own block-bypass ability (unblockable regardless of available blockers), and a second blockable attack, Kiraya lost her whole board (Gusion Rebake, Hotarubi, Shiden Custom, Barbatos 1st Form, Barbatos Adapt) in one turn. The block call (Gusion Rebake into the first Nu Gundam attack) is defensible either way — Barbatos 1st Form died to a later unblocked attack regardless of that choice, and the block-bypass attack couldn't have been blocked no matter what. This reads as CPvip's board simply outnumbering her one available Blocker, not a Kiraya misplay — and it didn't cost the game, since she closed it out cleanly the very next turn."
  - "CPvip runs both Nu Gundam printings at once (the block-bypass LR and the EX-Resource-ramp R) plus the heal-on-kill Amuro Ray printing — same dual-instance pattern as BIGDOG and several other opponents this campaign."
  - "Parser gap noted, not a card-data issue: 'X received Y damage, reduced by Z' (turns 12, 14, tied to Ra Cailum's own activated damage-reduction ability) fell into unparsed_lines — gamelog.py doesn't yet have a pattern for this exact phrasing."
unparsed_lines:
  - "[turn 12] Nu Gundam received 3 damage, reduced by 1, leaving 1 HP remaining"
  - "[turn 14] Jegan received 2 damage, reduced by 1, leaving 1 HP remaining"
