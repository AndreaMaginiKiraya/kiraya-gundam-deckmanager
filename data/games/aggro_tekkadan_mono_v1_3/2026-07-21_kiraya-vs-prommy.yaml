study_notes:
  - "Mistake review: no clear tactical misplay found this game. Both Gundam Barbatos Lupus uses were actually correct — turn 13 used its Activate ability (not melee) to clear Shining Gundam using only trash fuel, and turn 15's direct combat trade into Dragon Gundam happened with 'No blockers available' for Prommy, i.e. a clean forced trade with no wasted redirection, unlike the Petrullica game. Kiraya applied that earlier lesson correctly this time."
  - "The loss looks driven by Prommy's Gundam Fighter/Shuffle Alliance shell generating outsized value through chained Pilot-capable Command cards: Domon Kasshu's When-Paired draw+discard can trigger a discarded (Special Move) Command's own Main effect on the spot (seen turn 8 discarding Shining Finger, which then rested Hyakuren and buffed Shining Gundam into a damage-prevention state), and the same pattern repeated turn 14 with Sai Saici/Hoka Kyoten Juzetsujin. Turn 8 alone (Shining Gundam's trash-exile-for-card-retrieval Deploy, the Domon Kasshu chain, and a separate Cyclone Punch/Chibodee Crocket combo killing Gundam Exia Repair) was almost entirely Prommy's own card synergy — nothing in hand or on board could have played around it."
  - "Royal Gundam was redeployed 3 times (turns 4, 10, 14) and repeatedly chump-blocked to protect Shining Gundam from combat (turn 11) — a cheap, disposable unit doing exactly the job Blast Impulse Gundam did in the Petrullica game. Worth remembering as a recurring pattern across different opponents' decks: expect a cheap recurring blocker guarding the real bomb."
  - "Kiraya's Bases had a rough game structurally: Hotarubi died twice and Isaribi died the same turn it was deployed, all to direct unanswered attacks — not a play error (no Blocker-keyword units were ever available to protect them), just a symptom of how much unblocked pressure Prommy's board generated turns 8-16."
  - "Nice real confirmation of the Pilot-capable-COMMAND mechanic documented in CLAUDE.md: Hoka Kyoten Juzetsujin (GD05-112) was played once as a Command (turn 14 Main effect) and its embedded 【Pilot】[Sai Saici] identity was used separately to pair with Dragon Gundam the same turn — both correctly resolved to the same card id."
