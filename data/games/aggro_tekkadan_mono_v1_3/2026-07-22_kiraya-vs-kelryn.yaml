study_notes:
  - "Fast loss on turn 10 after a mulligan. The real story is tempo, not a specific misplay: Kelryn curved out much faster and wider early (2x Hobby Hizack by turn 4, a 3rd by turn 6, Char's Zaku II/Gelgoog adding unblockable High-Maneuver attacks via Char Aznable) while Kiraya's own board only came online turn 7 — by then 4 shields plus the EX Base were already gone. Turn 6 alone burned 3 shields with zero blockers available, simply because Kiraya had no board yet to trade with or block."
  - "Once Kiraya's board did come online (turn 7 onward) the trades were genuinely good — Barbatos 1st Form for Char's Zaku II, Graze Custom/Hyakuren for 2 Hobby Hizacks — but too late relative to the shield race already lost in turns 4-6."
  - "Recurring habit, now a 3rd occurrence this session (after ded and melon2222): turn 9's Ryusei-Go discard-cost discarded Gundam Barbatos Lupus again. Didn't change the outcome here (the game was already effectively lost by then), but worth a hard rule going forward: never let Lupus be the auto-discard target for Overflowing Affection/Ryusei-Go unless every other card in hand is worse to lose — it keeps happening and it's the deck's single best answer."
  - "Kelryn's Char Aznable (ST03-011, granting AP+1 + unblockable High-Maneuver on Attack) combined with a Zaku II that self-buffs AP+2 on Attack made for a deceptively hard-hitting early swarm — worth remembering this specific Green/Zeon shell as capable of a very fast curve-out if seen again."
