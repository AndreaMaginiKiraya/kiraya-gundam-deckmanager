study_notes:
  - "Mistake review (requested, user believes she erred): couldn't find a clear one on close inspection. Every Kiraya unit lost this game died either to a fair-to-good combat trade (Barbatos Adapt for Gundam NT-1 turn 9, Gundam Flauros for Re-GZ BWS turn 10) or to Nu Gundam's block-bypass ability (turn 14, 18), which forces an unblockable damage-step-only battle the attacker chooses the target for — nothing a blocking decision could have prevented, since neither Barbatos Lupus nor Gundam Gusion Rebake had Blocker anyway in those instances (Gusion Rebake does have Blocker but wasn't the one targeted)."
  - "Barbatos Lupus was used efficiently both times: turn 13's single activation cleanly finished an already-damaged Nu Gundam (no overkill), and turn 15's two activations (funded entirely by trash) killed the next Nu Gundam outright. Discard choices were also clean this game (Ryusei-Go turn 11, a fresh Graze Custom copy turn 15) — no repeat of the Lupus-discard habit flagged in the ded/melon2222 games."
  - "WKNG runs a Blue Federation shell heavy on dual-printed Nu Gundam (both the block-bypass LR and the ramp R) and dual-printed Amuro Ray, plus Gundam NT-1/Re-GZ family/Gundam AGE-2 — a recognizable, recurring opponent archetype this account keeps meeting, similar in shape to the ded/CVille/TRIAL games."
  - "If a specific turn felt like a misstep in the moment, it didn't show up as a clear game-losing (or even game-slowing) error from the log — worth flagging the specific turn number next time for a closer look if it's still bugging her."
