study_notes:
  - "A genuine mirror match — KIRRA runs almost the exact same Tekkadan core (Graze Custom, Gundam Exia Repair, Barbatos 1st Form/Adapt, Gundam Gusion Rebake, Ryusei-Go, Hyakuren, Mikazuki Augus) plus a White/Green splash (Guntank, Tallgeese, Siege Ploy, A Show of Resolve). Close race on shields both ways (3 lost each early), decided by Barbatos Lupus coming online first."
  - "Barbatos Lupus was the difference-maker again: 2 activations turn 12 (funded entirely by trash, including one copy of itself as fuel for the other) killed Guntank and Gundam Barbatos Adapt outright, then a 3rd activation turn 16 cleared a Gundam Gusion Rebake — all free value, no live cards spent, consistent with every other game this session."
  - "No tactical missteps stood out — trades were consistently fair or favorable (Gundam Exia Repair into Hyakuren turn 12 was a good cheap-for-expensive trade) and blocking assignments (Gundam Gusion Rebake blocking twice) were reasonable given available options each time."
