study_notes:
  - "Debut win for aggro_tekkadan_mono_v1_3 (added Lafter Frankland + Hotarubi, cut Become a Shield + Barbatos 4th Form). Win via concession on turn 13, right after Barbatos Lupus wiped out Aile Strike Gundam's HP — despite an opening mulligan and Kiraya's board getting fully traded away by turn 11, both sides had actually lost 0 shields each at that point, so this reads as GD05NOOB conceding to the board/tempo swing rather than an imminent shield loss."
  - "Lafter Frankland performed exactly as hoped on her first live rep: turn 9, Gundam Barbatos 1st Form was already damaged (from Gundam Gusion Rebake's own Deploy ping earlier that turn), so attacking triggered BOTH her own 'if damaged, gains High-Maneuver' AND Barbatos 1st Form's own 'if damaged, draw 1' at once — guaranteed unblockable damage plus a card, exactly the synergy the deckbuilding discussion predicted from all the self-damage this deck generates."
  - "GD05NOOB ran a League Militaire (Victory/V-Dash Gundam, Üso Ewin) shell similar to the Barbanja game, including the same [Parts] token engine (Victory Gundam Hexa generates one During Pair on Attack) — recognizable as a recurring opponent archetype this account keeps running into."
  - "Gundam Barbatos Lupus closed the game yet again on a single activation (turn 13), exiling 3 already-dead trash cards to finish off Aile Strike Gundam — the same free-recycling pattern confirmed all session, now validated across two different deck versions (v1_2 and v1_3)."
