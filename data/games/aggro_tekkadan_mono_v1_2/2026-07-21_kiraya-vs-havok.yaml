study_notes:
  - "Confirmed: the game was already decided before the turn-13 concession. Havok hit 0 shields at turn 12 ('No more Shield cards to add to hand') and stayed there — Kiraya lost zero shields the entire game (5 remaining). Unlike the Barbanja game, here the user's own read ('avevo già vinto') matches the data exactly."
  - "Havok's Neo Zeon Jagd Doga swarm (Gyunei's, Quess's) kept trading evenly with Kiraya's units turn after turn, but every one of those trades happened on the ground — none of it ever translated into shield pressure, while Kiraya's attacks kept connecting with Havok's face/shields almost every turn from turn 5 onward."
  - "Havok played Airframe Seizure (GD05-111, the Red discard-1-draw-2 card scoped out earlier this session during the v1_2 deckbuilding discussion) at turn 12 — first time seeing it actually played rather than just discussed."
  - "Quess's Jagd Doga (GD05-053) appeared again with its recursion-adjacent kit (paired with Quess Paraya, whose own ability debuffs an enemy attacker) — same card seen in the TRIAL game's Sazabi loop, here just played as a normal beatstick without a Sazabi to combo with."
