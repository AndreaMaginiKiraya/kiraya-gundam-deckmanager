study_notes:
  - "Grindy 21-turn win despite an opening mulligan. Ends abruptly mid-action at turn 21 (no 'no more shields' line) — reads as a concession right as Kiraya was setting up another attack. Dominant final margin: only 1 shield lost (4 remaining) vs james losing all 5."
  - "james ran an unusually wide mix of SEED Alliance icons (Sword/Perfect/Aile/Justice/Aegis Strike-family Gundams, Fatum-00) alongside Neo Zeon bombs (Sinanju+Full Frontal, Neo Zeong) in Red+White — a lot of individually strong cards but seemingly little synergy between the two halves, which may explain why big threats kept arriving one at a time instead of overwhelming at once."
  - "Gundam Barbatos Lupus's trash-exile activation carried the midgame again: fired 3 separate times (turns 13, 15, 17), each time cleanly destroying james's biggest threat in play at zero live-card cost (Perfect Strike Gundam, then Justice Gundam, then Sinanju) — same free-recycling value confirmed in earlier games this session."
