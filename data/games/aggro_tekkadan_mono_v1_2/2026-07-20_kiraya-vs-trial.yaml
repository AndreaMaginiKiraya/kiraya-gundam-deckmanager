study_notes:
  - "Loss on turn 20 to a Purple+White TRIAL deck running BOTH Sazabi printings (GD05-049 LR + GD05-052 R) plus Quess's Jagd Doga — exactly the 'White/Red-ish Sazabi' archetype asked about right before this game (turns out TRIAL was Purple+White, not Red, but the Sazabi core is the same)."
  - "Confirmed why no Gundam Barbatos Lupus showed up: turn 20's shield reveal shows it sitting in Kiraya's own shield pile ('Shield cards: Gundam Barbatos Lupus and Gundam Exia Repair revealed and discarded') — it was never draw-accessible all game, just unlucky placement, not a deckbuilding or play issue."
  - "TRIAL's real engine was the Sazabi + Quess's Jagd Doga loop: Sazabi's Attack ability destroys one of TRIAL's own Units (paying Jagd Doga each time) to force Kiraya to sacrifice a non-battling Unit, but Jagd Doga's own 【Destroyed】ability returns it to hand instantly since it's Neo Zeon-on-Neo Zeon — a nearly free, repeatable removal/sacrifice engine (turns 16, 18, 20)."
  - "Giant Killing (ST09-009, flat removal) took out Hyakuren (turn 6) and Gundam Barbatos 1st Form (turn 8) for free, no combat needed — hard removal this deck has no way to play around."
  - "Kiraya's opening was actually strong (EX Base down by turn 7, good trades through turn 11), but TRIAL's removal-heavy midgame (Giant Killing x2, the Sazabi/Jagd Doga loop, an Unforeseen Incident debuff) grinding down one unit at a time is exactly the profile this list struggles against most — same shape as the CVille loss (few answers to sustained single-target removal, only 6 Blocker-capable cards in 50)."
  - "Char Aznable pinned to GD05-093 again (Neo Zeon Base recursion — redeployed a used Axis from trash, turn 18), same identity as in the DekuGreen game."
