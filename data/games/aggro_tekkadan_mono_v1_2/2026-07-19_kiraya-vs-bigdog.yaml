study_notes:
  - "Win on turn 16, despite an opening mulligan. The ending is abrupt — BIGDOG deploys a Nu Gundam and places an EX Resource, then 'Kiraya: Winner!' fires with no 'no more shields' line, so this looks like a concession/timeout rather than a shield-based finish."
  - "Another Nu Gundam LR + Amuro Ray GD05-085 matchup (tracked since earlier this campaign) — another win, reinforcing that the block-bypass+heal combo is dangerous but not automatically decisive when the board can pressure back fast enough."
  - "BIGDOG is running BOTH Amuro Ray printings (GD05-085 heal-on-kill and ST01-010 rest-on-pair) and BOTH Nu Gundam printings (GD05-017 block-bypass LR and GD05-020 EX-Resource-ramp R) at once — a 'full playset across both prints' build, first time seeing this doubled-up approach in the campaign."
  - "Barbatos Lupus's trash-recycling activation (confirmed free, see the DekuGreen game correction) chipped the turn-12 Nu Gundam from 5 down to 1 HP for zero live-card cost, setting up the kill with Ryusei-Go next attack — good repeated confirmation of its value as a follow-up removal tool after a big trade turn."
  - "The turn-12 Nu Gundam swing was still very threatening on its own: block-bypass forced-battle killed Barbatos 4th Form, Breach 5 destroyed Isaribi, then a second normal attack killed Barbatos Adapt and Breach 5'd a shield — 2-for-2 plus 2 shields in a single turn from one card. Worth remembering as this deck's most dangerous single-turn swing seen yet."
