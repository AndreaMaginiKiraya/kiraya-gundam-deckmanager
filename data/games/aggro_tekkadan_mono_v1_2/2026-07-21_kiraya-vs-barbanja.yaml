study_notes:
  - "Win via concession at turn 16, mid-action, right as Barbanja's own V-Dash Gundam was declaring an attack against Kiraya. Checked whether the opponent genuinely had a comeback chance (as suspected): the shields tally says no — Kiraya lost only 1 shield in the entire 16-turn game (5 remaining) while Barbanja lost his EX Base plus went to 0 shields well before the end. Even if that final V-Dash Gundam hit had connected, it would have taken Kiraya from 5 to 4 shields — nowhere near a loss, while Barbanja had zero margin left (any single unblocked hit from Kiraya's side would have ended it). The concession reads as correct, not premature."
  - "The unit-for-unit combat itself was much closer than the shields gap suggests — lots of even 1-for-1 trades throughout (Javelin/Exia Repair, Graze Custom/Victory Gundam, Flauros/Victory Gundam, Hyakuren/Strike Rouge, Shiden Custom/V2 Gundam) — which is probably why the game felt competitive turn to turn. The real difference was that Kiraya's attacks kept connecting with Barbanja's shields/face (turns 7, 9x2, plus the EX Base), while Barbanja repeatedly redirected his own big attackers into killing Kiraya's units instead of pushing face damage (turns 8, 10, 14) — a choice that kept the game feeling close on board but let Kiraya's shield lead snowball uncontested."
  - "Barbanja's League Militaire package (Victory Gundam GD04-011, V2 Gundam, V-Dash Gundam, all linking Üso Ewin) generates disposable [Parts] tokens (AP1/HP1, can't attack the player) every time a League Militaire Unit dies — a real board-presence/chump-blocker engine, worth remembering if this archetype reappears, though it never got to matter here since the shield race was already decided."
  - "Kira Yamato pinned to GD05-081 this game (Link-triggered draw off Strike Rouge (Ootori)'s Orb trait) — a different printing than the ST04-010 seen in every other Kira Yamato appearance this session, confirming different opponents can run either print."
