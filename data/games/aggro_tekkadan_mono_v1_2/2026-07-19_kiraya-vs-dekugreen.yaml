study_notes:
  - "Debut of aggro_tekkadan_mono_v1_2 (cut both Barbatos 2nd Form, Lupus Rex and 5th Form Ground Type from v1_1; added 3x Overflowing Affection and 1x Barbatos 4th Form). Win on turn 17, no tactical mistakes spotted."
  - "Overflowing Affection (the new White splash) fired twice (turns 11 and 15), net +1 card each time for 1 cost — kept the hand full through a long grindy midgame without ever feeling like a dead draw. First good data point for the splash."
  - "Barbatos 4th Form (ST05-001, the new Suppression pickup) was never drawn this game — no data on it yet."
  - "DekuGreen ran an unusual Green(Zeon)+Purple(Tekkadan) two-color brew: Char Aznable/Zeong/Char's Zaku II alongside Gundam Barbatos 1st Form + Mikazuki Augus. First time seeing this combo across the whole campaign."
  - "Gundam Barbatos Lupus's activation (confirmed via get_card: exiles 3 (Tekkadan)/(Teiwaz) Unit cards from the TRASH, not the deck or board) was used three times in a single turn (15), clearing Zeong plus both Wire-Guided Arm tokens for a huge tempo swing. Correction to an earlier draft of this note: all 9 exiled cards (Graze Custom, Ryusei-Go, Shiden Custom, Gundam Barbatos Adapt, two Barbatos 1st Form, Hyakuren) were already dead/discarded before the activation — this ability recycles trash into removal essentially for free, not a real resource cost."
  - "Mikazuki Augus's When-Paired ping fired on essentially every unit deployed this game (both sides), chipping 1 damage each time — consistent with the 22-copy link count analyze_deck reported for this build."
