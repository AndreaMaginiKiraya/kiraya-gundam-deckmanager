study_notes:
  - "Win on turn 17 despite an opening mulligan. Kiraya never lost a shield (0 lost, 4 remaining, EX Base only ever replaced by a Base). Ending is abrupt again — no 'no more shields' line, just 'Kiraya: Winner!' right after seven's Wing Gundam Zero deploy — reads as a concession."
  - "Parser note (not a card-data issue): turn 9's 'Ryusei-Go (Graze Custom Ⅱ) and Graze Custom returned to hand' bundled two card names into one unmatched entry ('Ryusei-Go (Graze Custom Ⅱ) and Graze Custom', not found in the DB). Removed manually from this record — both real cards are already tracked correctly elsewhere in the file. gamelog.py's return-to-hand pattern doesn't yet split multi-card lines; worth a parser fix if this recurs."
  - "Wing Gundam (ST02-001) + Heero Yuy (ST02-010) repeated the base-box-plus-During-Link-ability stacking pattern first confirmed in the liko game: AP 4+2+1=7, HP 5+1+1=7, both matching the turn-12 battle exactly. Good repeated confirmation of the mechanism."
  - "seven's Silver Bullet shrugged off two separate 'reduced by 3' pings (Gundam Gusion Rebake's deploy ping, then Gundam Barbatos Lupus's trash-exile activation) before finally dying to a direct attack — some kind of built-in damage reduction that made the small pings far less effective against it than usual. Worth checking Silver Bullet's exact text if it shows up again, since it broke the deck's usual 'chip it down with pings then finish' pattern."
  - "seven's Wing Gundam Zero (deployed turn 16) hit all 4 of Kiraya's board Units for 3 damage each on ETB — a real board-wipe threat that never got to swing since the game ended the next turn. Worth remembering as a late-game topdeck that could have swung a longer game."
