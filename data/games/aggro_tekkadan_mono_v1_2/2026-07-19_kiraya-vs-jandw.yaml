study_notes:
  - "Dominant win on turn 12 — Kiraya never lost a single shield (5 remaining, EX Base only ever replaced by a Base, never destroyed) while Jandw lost the EX Base plus all 5 shields. No tactical mistakes to flag; this was clean execution of the aggro plan from turn 3 onward."
  - "Jandw's only real threat, a Gundam (ST01-001) linked to Amuro Ray (ST01-010) with Repair 2, traded into Graze Custom on deploy (turn 6) then died to Ryusei-Go the very next turn despite the heal — the classic 'good stats but no board presence beyond itself' starter-deck Gundam, easily raced down once Kiraya's board caught up."
  - "Jandw is running a Blue+Green Earth Federation/Londo Bell brew (Gundam/Amuro Ray/Re-GZ family/Jegan/Kayra Su/Ra Cailum) — thematically close to the DekuGreen/BIGDOG matchups but noticeably less threatening without a Nu Gundam LR ever showing up."
  - "Ryusei-Go's Deploy ping (draw 1, discard 1) and Barbatos Adapt's dual-ping both kept setting up exact-lethal battle math throughout (e.g. the turn-7 Gundam kill, chip damage first then a clean finishing blow) — a good reminder of how much this deck's small pings matter for closing out trades efficiently."
