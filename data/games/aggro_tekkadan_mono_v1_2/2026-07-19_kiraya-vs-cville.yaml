study_notes:
  - "Detailed mistake review (requested): no clear tactical misplay found. Every attack/block decision Kiraya made was a fair-to-good trade (see turn-by-turn breakdown below); the loss looks driven by CVille assembling an unusually strong removal/tempo package this list has few tools to answer, plus two unlucky Gundam Exia Repair mills."
  - "Turn 8: CVille's fresh Aile Strike Gundam (ST04-001), paired with a Lv.5 Kira Yamato, bounced Gundam Barbatos 1st Form back to hand on deploy — a free tempo swing from the opponent's card, nothing Kiraya could play around."
  - "Gundam Exia Repair's Destroyed-mill cost real value twice: turn 9 milled a live Gundam Barbatos 1st Form + the newly-drawn Barbatos 4th Form, turn 10 milled Gundam Barbatos Lupus + Gundam Barbatos Adapt — 4 real threats gone to trash involuntarily over 2 turns. This is a known downside risk of running Exia Repair, not a play error, but worth remembering as real variance the deck accepts."
  - "The turn-12 board wipe (Wing Gundam Zero (EW) forced through Isaribi via the no-blocker-available Base-intercept rule, then Gundam Lfrith directly killed the already-rested Gundam Barbatos 1st Form) was the real turning point. Checked whether holding a unit back on turn 11 would have helped: neither Gundam Barbatos 1st Form nor Gundam Flauros (Ryusei-Go) has the Blocker keyword, so there was no defensive option available regardless of that turn's attack/no-attack choice — attacking for value was correct, the wipe wasn't preventable with what was in hand."
  - "From turn 15 on, CVille's second Wing Gundam Zero copy (GD01-024, non-EW — Deploy: 3 damage to 2 of your choice) redeployed almost every turn to snipe whatever Kiraya had just played, while the surviving Wing Gundam Zero (EW) kept attacking shields. This out-paced Kiraya's ability to rebuild a board — going wider (2 units at once, turn 17) didn't help since the AOE hits exactly 2 targets."
  - "Deckbuilding observation, not a play mistake: aggro_tekkadan_mono_v1_2 only has 6 Blocker-capable cards in the full 50 (3x Gundam Gusion Rebake, 3x Shiden Custom (Ryusei-Go)), and only one of them (Gusion Rebake, turn 15) showed up all game. Worth keeping in mind against removal-and-bomb matchups like this one, where a Blocker would have mattered more than usual."
  - "Open arithmetic question on Heero Yuy (pinned GD05-098 from ability evidence, see the card note above): official card image confirms Wing Gundam Zero (EW)'s own stats are correctly synced (AP5/HP4), yet observed damage (7 to Isaribi turn 12; HP math implying 5 total turn 14) is 2 AP / 1 HP higher than GD05-098's 0/0 pilot box would explain. Not resolved — noting honestly rather than guessing."
