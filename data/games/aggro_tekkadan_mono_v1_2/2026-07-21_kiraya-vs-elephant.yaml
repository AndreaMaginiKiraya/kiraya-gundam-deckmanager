study_notes:
  - "Completely one-sided win on turn 13 despite an opening mulligan: Kiraya's own EX Base/shields were never even touched all game (0 lost, 6 remaining), while the opponent lost their EX Base plus all 6 shields. The opponent also runs Gundam Exia Repair (mirror-ish overlap, like the Tommy game) — theirs milled Destiny Gundam and Overflowing Affection from their own deck on death, pure bad luck for them."
  - "Opponent's deck is another wide multi-timeline 'Gundam icons' mix (Impulse/Force Impulse/Destiny/Strike Gundam from SEED Destiny, plus a Turn-A/∀ Gundam) with light synergy — same shape as the james game. Loran Cehack was only merely Paired to Strike Gundam (not Linked, since Strike Gundam's designated link partner is Kira Yamato), so his 【When Linked】bounce-a-weak-enemy ability never actually had a chance to fire."
  - "Notable engine to remember if this opponent/archetype reappears: Impulse Gundam's own Activate ability lets it return itself to the bottom of the deck and immediately deploy a stronger 'Impulse Gundam'-named Lv.4+ Unit from trash for just 2 resources — turned a 3/3 into Force Impulse Gundam (a much bigger threat) for cheap, and dodged whatever answer might have been lined up for the small form."
  - "Open arithmetic note: Force Impulse Gundam (ST09-002, pinned via its true Link to Shinn Asuka) dealt 8 damage to Ryusei-Go despite base AP5 + Shinn Asuka's 0/0 pilot box only accounting for 5 — no passive on Impulse Gundam ST09-001 or Shinn Asuka explains the extra +3. Left unresolved rather than guessed."
  - "Cleaned up a parser artifact: 'Impulse Gundam and Shinn Asuka returned to deck' got treated as one unmatched card name — both real cards are already tracked correctly elsewhere in this record."
