study_notes:
  - "Clean win on turn 14, opponent concedes after Kiraya cleared the board with Gundam Barbatos Lupus. Kiraya never lost a shield (5 remaining) vs Tommy losing all 4 — a dominant margin."
  - "This was close to a mirror match: Tommy runs Purple+White with a lot of overlapping card pool (Graze Custom, Hyakuren, Isaribi, Gundam Gusion Rebake Full City) plus Gundam Barbatos Lupus Rex — the exact card Kiraya herself cut from v1_1 to build v1_2 — and a Silver Bullet White splash. Tommy discarded his own Lupus Rex via Overflowing Affection turn 4 and never got to play it."
  - "Gundam Barbatos Lupus's trash-exile activation closed the game again (turn 13): cleared 3 already-dead cards from trash to finish off Graze Custom, consistent with the free-recycling value confirmed in every other game this session."
  - "Gundam Exia Repair's Destroyed-mill hit both sides this game (Kiraya lost Ryusei-Go/Hyakuren turn 6, then Overflowing Affection/Barbatos Lupus turn 8) — bad luck on her side specifically, but didn't matter given the overall tempo lead."
