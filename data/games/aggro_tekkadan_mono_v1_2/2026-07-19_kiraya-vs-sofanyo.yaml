study_notes:
  - "Loss on turn 22 (SOfanyo out of shields, but Kiraya ran out first). No clear tactical mistake found — this reads as a genuine grind that SOfanyo's late-game top end (Justice Gundam, Sazabi, repeated Overflowing Affection draws) outpaced, not a misplay."
  - "Turn 13's Barbatos Lupus triple-activation (9 trash cards exiled for 6 damage, destroying Gundam Gusion Rebake) was efficient, free-cost removal — same trash-recycling mechanic confirmed in the DekuGreen game, not a real resource sink."
  - "Sazabi (GD05-049, the LR with the board-wipe Attack ability) hit the table on turn 16 and attacked 4 more times through turn 22 without SOfanyo ever pulling the trigger on its 'destroy 1 of your Units -> all enemies destroy 1 non-battling Unit' effect — likely never worth it for him since Kiraya rarely had a spare non-battling Unit sitting around. Good sign the effect isn't as scary as it looks when the board stays lean."
  - "SOfanyo played Overflowing Affection twice in a row on turn 18 (drawing 4, discarding 2) — same card we just added 4x to v1_2 ourselves; good real-world confirmation it's a strong, splashable draw engine."
  - "Barbatos 4th Form (ST05-001) got real reps this game: traded into a blocked Launcher Strike Gundam (turn 13) then closed out Axis solo (turn 15) before dying to a double-block. Solid two-for-one value before going down."
  - "SOfanyo is running Purple+White (Tekkadan-adjacent White EX-Base/Gundam-Barbatos-1st-Form splash mixed with SEED-era Justice/Launcher Strike Gundam and Sazabi/Char Aznable Neo Zeon) — another unusual two-color brew, distinct from DekuGreen's Green+Purple mix seen in the previous game."
