study_notes:
  - "Fastest win yet with v1_2 — turn 10, MUSI concedes after a turn 9 that burned all 3 remaining shields at once. Kiraya never lost a single shield the whole game (0 lost, 5 remaining, EX Base only ever replaced)."
  - "Classic curve-out: double Graze Custom turn 3, Overflowing Affection turn 5 to refuel plus an immediate Become a Shield ping to soften a blocker, then just kept swinging. MUSI never really stabilized after losing Gundam Lfrith turn 5 and the EX Base turn 7."
  - "Data-gap found, not a rules mystery: MSA's log calls the card 'Gundam Heavyarms (EW)' but the DB only has 'Gundam Heavyarms Custom (EW)' (GD05-079) — the auto-resolver's exact-name match missed it because MSA drops 'Custom' from the display name. Pinned by hand from stats (AP3/HP3 matched exactly). Worth watching for more '(EW)' or other MSA-shortened names causing silent cards_not_found misses in future imports."
