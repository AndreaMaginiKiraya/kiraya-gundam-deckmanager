study_notes:
  - turn: 8
    note: "kirael's Wing Gundam (ST02-001, <Breach 5>) starts trading efficiently into Kiraya's board, breaching both EX Base and later Isaribi for 5 each — a real tempo problem, but Kiraya keeps refilling the board with cheap units (Graze Custom, Hyakuren, Barbatos Adapt) rather than trying to race it."
  - turn: 12
    note: "Aile Strike Gundam (ST04-001) paired with Heero Yuy (Lv4) bounces Gundam Barbatos 1st Form via its [When Paired・Lv.4+ Pilot] ability — a tempo loss but not a card loss, and Kiraya redeploys it next turn."
  - turn: 14
    note: "kirael's biggest turn: Wing Gundam Zero (EW) breaches 2 shields at once, Heero Yuy's shield-destroy trigger debuffs Barbatos 1st Form, then Rick Dias and Aile Strike Gundam both attack into blockers (Gusion Rebake, Shiden Custom) and die in even trades. Costly for Kiraya (Shiden Custom lost) but it costs kirael two units for zero net board or shield progress beyond the earlier breach."
  - turn: 15
    note: "Kiraya closes it out: Barbatos 1st Form (paired Zeheart Galette) kills Wing Gundam Zero (EW) in combat, then Barbatos Adapt and Gusion Rebake both hit shields unanswered — kirael has nothing left to block or race with."
  - turn: 16
    note: "Win by concession. Worth flagging per the user's own read: kirael never deployed Wing Gundam Zero (GD01-024, cost 8, 'Deploy: deal 3 damage to all Units that are Lv.5 or lower') despite reportedly reaching 8 resources at some point — every unit Kiraya played this game (Graze Custom, Hyakuren, Barbatos Adapt/1st Form, Shiden Custom, Gusion Rebake) is Lv.5 or lower, so that Deploy would have wiped Kiraya's board outright. Whether it was never drawn or just never played, this was a real out kirael didn't take — read this win with that caveat rather than as proof the matchup is favorable."
