study_notes:
  - turn: 6
    note: "Good efficient turn: Barbatos 1st Form + Mikazuki Augus pings kill t4vi's Dopp for free before it does anything, and the double attack (Barbatos 1st Form draws a card, breaks EX Base; Exia Repair takes a shield) keeps pace despite t4vi's faster start (2 Zaku Ⅱ + Char's Zaku Ⅱ already down by t5)."
  - turn: 7
    note: "t4vi attacks Barbatos 1st Form directly instead of the player — a fair trade in raw stats (paired AP5/HP3 vs Char's Zaku Ⅱ's AP3/HP2, both die), but Char's Zaku Ⅱ's [Destroyed] hands t4vi a fresh card off the top 3, meaning t4vi comes out ahead on cards even in a card-for-card trade. This repeats at t10 — 2 free cards across the game from a single recurring card type, the same kind of card-advantage-engine problem flagged earlier this session against Strike Freedom/SEED decks."
  - turn: 9
    note: "Three attacks in one turn with only one Shiden Custom (Ryusei-Go) to block: Kiraya blocked the plain Zaku Ⅱ (traded up, Shiden Custom survives at 1 HP, Zaku Ⅱ dies) rather than Char's Zaku Ⅱ (would have traded even but fed its Destroyed card-draw) — the right call given only one block is available per turn. Whether saving the block for ReZEL's attack (which hit a shield, not Isaribi, and would have been a better unit-for-unit trade) was possible depends on whether the attack order was known in advance; not clear from the log, so not counted as a misplay."
  - turn: 11
    note: "By the time the log cuts off, Kiraya has no board and 1 shield left against t4vi's Gundam/Zaku Ⅱ board plus M1 Astray Shrike — conceding here was the right call, not a case of fighting on too long. Overall this reads as a genuinely tough matchup (t4vi's faster Zeon curve plus 2 free cards from Char's Zaku Ⅱ) rather than a misplay-driven loss — no clearly wrong decision found in the available log."
  - "[turn 1] Returned to deck top"
