    note: "The turn that should have won it: triple Lupus activation exiles 9 already-dead cards from the trash (not live board units — Kiraya's own board wasn't sacrificed here) to kill Zoloat, V-Dash Gundam, and xWeee's Barbatos 1st Form in one turn — a huge, correctly-valued tempo swing. Attacking with Lupus Rex into the 1 AP/1 HP Parts token for 4 chip damage was low-value but, per Comprehensive Rules 8-3-1/13-1-4-1, irrelevant to next turn's defense regardless: blocking requires the printed <Blocker> keyword, which neither Lupus, Lupus Rex, nor Barbatos 1st Form have — so no choice of which unit to rest/reactivate that turn could have produced a blocker."
  - turn: 17
    note: "xWeee's answer turn: Victory Gundam and Barbatos Adapt strip Kiraya's last 2 shields, then a fresh Barbatos 1st Form (paired Mikazuki Augus) takes the final one with 'No blockers available' on all three swings. This wasn't decided by rested/active state or targeting choices on Rex's end-of-turn ability — none of Kiraya's t16 board (Lupus, Lupus Rex, fresh Barbatos 1st Form) has <Blocker> at all. v1_8 actually has two <Blocker> units, Gundam Gusion Rebake (2 copies) and Shiden Custom (Ryusei-Go) (4 copies) — a Shiden Custom was drawn and deployed this game (t12), but it never got a chance to block: V-Dash Gundam rested it on t13 and Parts killed it outright the same turn, before it survived to a turn where it could actually block. Gusion Rebake wasn't drawn at all. A genuinely close, correctly-played loss — the deck simply didn't have a live, active <Blocker> unit on the one turn it needed one."
