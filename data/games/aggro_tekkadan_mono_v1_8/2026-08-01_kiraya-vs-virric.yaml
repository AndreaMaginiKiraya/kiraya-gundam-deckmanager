study_notes:
  - turn: 6
    note: "Both Darkness Fingers spent early to clear Virric's Zaku Ⅱ pressure (Char's Zaku Ⅱ and the plain one) — correct tempo play against an aggressive Zeon opening, but it means no removal is left in hand for whatever comes later."
  - turn: 7
    note: "Bad variance, not a misplay: Gundam Exia Repair's Destroyed mill hits Kiraya's own Gundam Barbatos Lupus Rex — the one copy that was in the deck never gets to hit the board this game. v1_8's whole premise (a second finisher after base Lupus) doesn't get tested here at all."
  - turn: 11
    note: "Zeong linked with Char Aznable deploys 2 Wire-Guided Arm tokens (AP2/HP1 each) — a sudden 3-attacker board (Zeong + 2 tokens + Char's Zaku Ⅱ) that Kiraya has no way to answer, since no unit in play has <Blocker>. Same structural gap as the xWeee loss: v1_8's only Blocker-capable card (Gundam Gusion Rebake, cut to 2 copies) wasn't drawn this game either."
  - turn: 12
    note: "Lupus does what it can — double activation kills Char's Zaku Ⅱ and the last Barbatos Adapt, good value — but it can't touch Zeong or the Wire-Guided Arm tokens, and doesn't fix the underlying blocker problem."
  - turn: 13
    note: "Zeong plus the 2 Wire-Guided Arm tokens close it out unopposed. Two losses in a row now (xWeee, Virric) decided by the same pattern: no <Blocker> unit ever hits the board late-game once Gusion Rebake drops to 2 copies. Worth weighing whether v1_8's Lupus Rex swap is worth this recurring defensive gap, or whether Gusion Rebake needs to go back up."
