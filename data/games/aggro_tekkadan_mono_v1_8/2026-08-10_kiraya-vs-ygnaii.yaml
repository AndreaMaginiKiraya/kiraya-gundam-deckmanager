study_notes:
  - turn: 7
    note: "Strong efficient turn: Barbatos Adapt's deploy ping softens both Hyakuren's target and Char's Zaku Ⅱ, Exia Repair trades into Char's Zaku Ⅱ (which redeploys as a free token via its own Destroyed), Hyakuren kills Guntank, and Mikazuki-paired Barbatos Adapt finishes EX Base — good tempo despite losing Exia Repair."
  - turn: 8
    note: "Ygnaii's Gundam (ST01-001, Amuro Ray GD05-085) is the early problem: <Repair 2> plus heal-2-on-kill makes it very hard to race down with small units. Took two separate kills (t8 traded down, t9 with an Isaribi buff) to put it away for good."
  - turn: 12
    note: "Zeong+Char Aznable comes online: 2 Wire-Guided Arm tokens plus Char Aznable's High-Maneuver push an attack through unblockably, killing Ryusei-Go. A real pressure spike, but it's the last real threat Ygnaii lands."
  - turn: 13
    note: "Lupus cleans up the whole Zeong package in one turn: first activation kills Zeong itself, the second kills the Zeong (Head) token its own Destroyed spawned — both off already-dead trash, denying Ygnaii any lasting value from the line."
  - turn: 15
    note: "By the time Gusion Rebake deploys, Ygnaii's board is down to tokens and a fresh Zakrello/Char's Zaku Ⅱ with no real follow-up — a clean concession once the Zeong package got fully answered two turns earlier."
