study_notes:
  - "Prima partita del campione contro l'archetipo ZAFT Extended/Phantom Pain (Gaia Gundam, Chaos Gundam, Abyss Gundam + Stellar Loussier/Sting Oakley/Auel Neider) - vinta senza incontrare particolari difficolta'."
  - "Ottima gestione del danno incidentale in due occasioni distinte: al t6, il ping da 1 del Deploy di Gundam Barbatos Adapt riduce Abyss Gundam a 2 HP, poi Darkness Finger lo chiude senza sprecare un attacco; identica sequenza al t12 con la prima attivazione di Gundam Barbatos Lupus (2 danni) + Darkness Finger su Chaos Gundam (MA Mode). Conversione efficiente di danno parziale in kill completo, due volte nella stessa partita."
  - "Gundam Barbatos Lupus arriva finalmente in campo al t12 e fa esattamente il suo lavoro: due attivazioni nella stessa partita (t12: uccide Chaos Gundam MA Mode in combo con Darkness Finger; t14: uccide da solo un secondo Chaos Gundam) - la prova pratica di come il piano-motore del mazzo funzioni quando la carta non resta bloccata nella shield pile, a differenza di molte partite recenti (dadada, Ja Rul, Musou, Amo, ddd) dove non arrivava mai a schierarsi."
  - "T11: blocco corretto con Shiden Custom (Blocker dedicato) contro Gaia Gundam invece di lasciar perdere gratis Gundam Barbatos Adapt (gia' bersaglio dichiarato) - scambio 1-per-1 nel ruolo giusto, nessun errore."
  - "Nessun errore tattico individuato in tutta la partita."
