study_notes:
  - "Rivincita esatta contro l'identico archetipo di Hichem gia' perso nella prima partita del campione v1_5 (Duel Gundam Assault Shroud chain-deploy, Jachin Due, Aegis Gundam MA Mode, Blitz Gundam First Strike) - stavolta vinta in 20 turni. Stesso principio gia' visto con la coppia 240pBrian/OuO: lo stesso mazzo avversario non e' una sconfitta garantita."
  - "T11 e' stato il turno piu' pericoloso della partita per Hichem (uccide Ryusei-Go, Gundam Barbatos Adapt e Hyakuren nello stesso turno), ma e' stato attenuato in anticipo da un ottimo uso di Darkness Finger a velocita' di Azione: dichiarato l'attacco di Sword Impulse Gundam contro Gundam Barbatos Adapt, Kiraya lo uccide nello step di Azione PRIMA dello step di danno, annullando l'attacco per intero invece di subire lo scambio."
  - "Gundam Barbatos Lupus alla sua massima espressione in tutta questa sessione: una volta schierato al t14, si attiva 5 volte in 4 turni (t14 x2, t16 x1, t18 x2), eliminando altrettante unita' avversarie quasi a costo zero grazie al trash accumulato da due mill di Zeheart Galette, dal self-ping di Ryusei-Go e dalle unita' perse in combattimento. La sua abilita' Activate-Main non ha alcun vincolo 'once per turn' e non richiede di rendere l'unita' stessa: puo' quindi attivarsi piu' volte nello stesso turno finche' c'e' benzina nel cimitero - il contro-esempio piu' chiaro di tutta la sessione alla partita persa contro ddd, dove la stessa carta non arrivava mai in campo."
  - "T17: Lupus scende a 2 HP colpito a distanza dall'Attack di Aegis Gundam (nessun blocco disponibile, nessuna alternativa reale) - momento di rischio reale ma gestito bene al t20 con Isaribi (AP+2 su un'unita' danneggiata) per chiudere la partita con lo stesso Lupus.
    Nessun errore tattico individuato nel resto della partita."
