study_notes:
  - "Went looking specifically for the sequencing/ping-dosing mistake she suspected, and didn't find one that changes the outcome. t11's choice to finish an already-weakened Nu Gundam with Hyakuren (dying to the 7-damage counter) rather than with the freshly-Linked Gundam Barbatos Adapt was checked closely - but the two units were comparably 'spent' at that point (Adapt's own ping had already fired), so trading either one into the kill was roughly a wash, not a clear error. t13's Adapt-into-Nu-Gundam trade was the only unit she had left to attack with at that point - not a choice at all."
  - "The real story is dadada's deck running at least 3 separate Nu Gundam copies, each capable of the same devastating combo: Pair with Amuro Ray to exile 3 trash cards for a bonus damage-only battle, then still attack normally after. t10 and t12 each delivered three full attacks off a single Nu Gundam deploy this way, chewing through Shiden Custom x2, Hyakuren, and multiple shields with nothing blockable about the exile-triggered battle specifically."
  - "Bad variance compounded it in a way that mattered a lot here: Gundam Barbatos Lupus - her best answer to a big, recurring threat like Nu Gundam - was discarded straight from the shield pile at t12, never getting to act at all. Losing that card to chance rather than to a real attack removed her single best tool against exactly the problem she was facing."
  - "This is now a second loss to this specific Nu Gundam/Amuro Ray exile-combo package this session (also lost to it as Xyriz), separate from the Strike Freedom Gundam pattern already tracked - worth treating as its own recurring problem matchup, not folded into the SEED-Destiny one."
