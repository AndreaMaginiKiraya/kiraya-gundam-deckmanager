study_notes:
  - "'Won by a hair' is accurate, not just a feeling: both players hit exactly 0 shields remaining - this was a full mutual-attrition grind, not a game decided by one swing. Checked closely for a missed shortcut and didn't find one; the closeness came from a genuinely even trade war against a Zeon deck (Char's Zaku Ⅱ/Char Aznable, Z'Gok E, Hy-Gogg, Gelgoog, Rick Dom, Kämpfer), not from giving up tempo."
  - "t7 was excellent value: both Gundam Exia Repair copies traded into 2 separate Char's Zaku Ⅱ instances while Gundam Barbatos 1st Form's Link with Mikazuki Augus let it attack the same turn it deployed, finishing a third - clearing the opponent's whole dangerous Char-Zaku package in one turn despite losing 3 units doing it."
  - "t13 was the turn that decided the race: three chained Gundam Barbatos Lupus activations (6 total damage, fed entirely by cards already in the trash) wiped out both of HortyPidge's Rick Dom copies in one turn. Correctly recognized which Rick Dom needed one hit vs two based on its current HP rather than splitting damage evenly."
  - "One real structural note, not a misplay: Gundam Gusion Rebake - the only Blocker-capable card seen this game - was lost as a t10 shield discard before it was ever deployed, which is why 'No blockers available' held for the entire second half of the game (t11 onward) despite Kiraya having plenty of units on board by then. Nothing to have played around - it never touched the battlefield to begin with."
  - "t17's closing turn correctly went all-in: every attacker still standing (both Gundam Barbatos 1st Form copies, Gundam Barbatos Lupus, Gundam Barbatos Adapt) swung in the same turn once it was clear HortyPidge's shields were nearly gone, rather than holding anything back."
