study_notes:
  - "Her read on the game is accurate and confirmed by the log: Gundam Barbatos Lupus never appeared on the battlefield once - it sat in the shield pile the entire game and only ever showed up as a t20 shield discard. Genuine bad luck (an opening-hand/shield placement issue, not a play error) losing access to the deck's whole finishing engine for the full 21 turns."
  - "This is the same removal-heavy control archetype as the OuO and 240pBrian games (Close Combat, Improved Technique - played 3 separate times here, Darkness Finger, Overwhelming Pressure, Kindhearted, A Show of Resolve, A Healthy Curiosity, Strike Freedom Gundam x2, Unicorn Gundam 02 Banshee) but this build ran an even denser removal suite than either of those - nearly every unit Kiraya deployed died to a precise answer before contributing much, on top of losing the Lupus engine specifically."
  - "No real misplay found on review. t14's mid-combat Darkness Finger (chipping Strike Rouge (Ootori) before the trade resolved) was the same good proactive-removal habit seen in the OuO game, and t19's Gundam Barbatos 1st Form correctly used its fresh Link with Mikazuki Augus to attack immediately into Strike Freedom Gundam, trading it away for the kill."
  - "Conceded at t21 with 0 shields and no board left, one turn after Ja Rul's Strike Freedom Gundam/Unicorn Gundam 02 Banshee combination emptied the last of her defenses - a reasonable place to stop, not a premature give-up."
