study_notes:
  - "Confirmed the mechanism she flagged: Wing Gundam Zero (GD01-024) costs exactly 8 and its Deploy text is 'Deal 3 damage to all Units that are Lv.5 or lower' - a genuinely symmetric board wipe (it would hit 哪个男人's own small units too, though none were left in play at t13). It killed 3 of Kiraya's 4 units in one card with zero combat risk."
  - "Checked whether she was actually 'too slow' in a way she could have controlled, and didn't find one: she attacked with every available unit on every one of her turns before t13 (t6, t8, t10, t12), no idle attackers. The wipe landing at t13 (哪个男人's 7th personal turn) was accelerated by their own Nu Gundam copies each triggering 'Placed 1 Resource EX' on deploy (t9, t11) - their own engine reaching the cost-8 threshold faster than a flat 1-resource-per-turn pace would, not a pacing gap on Kiraya's side."
  - "The recovery after the wipe was genuinely excellent, not where the game was actually lost: t16 chained three Gundam Barbatos Lupus activations (6 damage) plus a Graze Custom attack to kill the newly-arrived Wing Gundam Zero outright, and t18 combined a Lupus ping with Darkness Finger to cleanly finish a second Wing Gundam. Both of the deck's two biggest recurring threats this game were answered with precise, efficient sequencing."
  - "The actual final blow came from a second, distinct powerful effect at t19: Interwoven Blessings destroyed the top 2 shield cards directly (same behavior flagged as worth double-checking against the rules in the v1_1 sample), immediately followed by two more unblocked attacks - a second board-punishing card landing right when Kiraya's board had just been rebuilt to nothing after answering both Wing Gundams, not a specific misplay."
