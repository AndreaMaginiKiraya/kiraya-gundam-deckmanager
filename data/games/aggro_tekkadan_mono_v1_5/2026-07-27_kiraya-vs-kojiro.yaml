study_notes:
  - "A clean, well-played dominant win (4 shields remaining vs 0) against a Federation/Londo Bell deck (Jegan, Zaku Ⅱ, Rick Dom, Ra Cailum, ReZEL x2, Nu Gundam, Gundam/Amuro Ray, Corsica Base). No forced sequence went wrong; several turns were genuinely sharp rather than just favorable."
  - "t6 was the standout turn: Mikazuki Augus's ping plus Darkness Finger combined to finish an already-weakened Rick Dom for free, while Gundam Barbatos 1st Form used its fresh Link to attack immediately and Hyakuren cleanly killed a Zaku Ⅱ - three separate threats cleared in one turn from a two-card combo plus combat."
  - "t8 found real value from a double pilot pairing: two separate copies of Mikazuki Augus paired onto the same Hyakuren in the same turn, each triggering its own 1-damage ping, together killing Corsica Base's 2-HP Tallgeese token for free before attacking the base itself down."
  - "t11 was a big forced turn (three separate attacks, all resulting in trades) but not a misplay - Shiden Custom (Ryusei-Go) was the only Blocker-capable unit available and was used on the first attack; the other two hits landing on undefended Hyakuren copies was simply the cost of only having one blocker against three attackers, and all three of kojiro's attackers died in the exchanges too."
  - "Confirmed a card-identity puzzle flagged as unresolved in the v1_1 sample's own notes: 'Gundam' paired with Amuro Ray dealt and took exactly 6 damage in its t11 mutual kill, cleanly matching GD04-008 (AP4/HP4) plus Amuro Ray's (GD05-085) real +2/+2 bonus on both stats - a cleaner fit here than the ST01-001/Repair-2 identification confirmed in other games (Bill, Xyriz), reinforcing that this opponent archetype can run either printing."
