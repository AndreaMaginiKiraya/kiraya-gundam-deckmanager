study_notes:
  - "This wasn't 'the deck sucks' - it was one of the hardest possible matchups. 240pBrian ran 7 separate one-for-one removal casts (Close Combat x2, Improved Technique x2, Darkness Finger x2, Battle of Aces x1), 2 copies of Strike Freedom Gundam plus Unicorn Gundam 02 Banshee and Kshatriya as finishers, all backed by 5 separate draw-2 effects (Airframe Seizure x2, A Show of Resolve x3 = 10 extra cards seen). That's a control shell built almost entirely to answer exactly what this deck does - deploy efficient units one at a time - and the game still went 21 turns and stayed close (Kiraya still had 2 shields left at the concession)."
  - "One real, checkable tempo miss, but small and isolated: Gundam Exia Repair came down t3 and was fully eligible to attack by t5 (her very next turn) against a completely empty enemy board - yet she deployed 2 more units that turn (Hyakuren, Graze Custom) without declaring any attack with it at all. Against a slow removal-control deck racing to assemble bombs, every free turn of unopposed damage matters, and this one turn of pressure was left on the table for no reason. Not a pattern, though - every other eligible turn (t7, t9, t11, t13, t15, t17) she attacked without hesitation."
  - "Gundam Barbatos Lupus's exile engine earned its cost this game: t15 converted 3 already-dead cards into the 2 damage that, combined with a fresh ping, finished off the first Strike Freedom Gundam; t17 chained two separate activations plus a Barbatos Adapt sacrifice-attack to grind down and kill Unicorn Gundam 02 Banshee (Destroy Mode) - correctly recognizing when the graveyard had enough fuel to answer a real bomb."
  - "Bad variance stacked on top of a hard matchup: Gundam Exia Repair's own destroyed-mill fired twice (t8: Ryusei-Go + Zeheart Galette; t18: Gundam Gusion Rebake + Shiden Custom (Ryusei-Go)), removing 4 cards from the deck without ever drawing them, on top of the units actually lost to removal."
  - "The t21 concession was the correct read, not premature - by then the board was Kshatriya plus a second, freshly-deployed Strike Freedom Gundam against nothing on Kiraya's side, with no shown resources left to answer either."
