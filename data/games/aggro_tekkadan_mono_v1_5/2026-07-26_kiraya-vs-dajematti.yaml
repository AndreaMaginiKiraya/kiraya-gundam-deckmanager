study_notes:
  - "This is the 'MF con Master Asia' deck she specifically flagged as a rising meta threat earlier in this session (Gundam Maxter, Cyclone Punch/Chibodee Crocket, Domon Kasshu, Shining Gundam's Special-Move-recursion engine, Master Gundam/Master Asia) - and she won it cleanly, never losing a single shield (4 remaining at the concession). First real data point on this specific archetype, and it's a good one."
  - "t6's Darkness Finger on Gundam Maxter was the sharpest read of the game: Maxter's own 【During Link】【Attack】 text re-triggers a paired Cyclone Punch's Main ability for free on every attack (the exact engine that caused real damage in an earlier logged game as 'ASDF') - killing it on sight denied that combo before it could ever start, rather than dealing with it once it was already running."
  - "t8's double ping (Gundam Barbatos Adapt's own deploy trigger plus Mikazuki Augus's Link ping) on an already-Darkness-Finger-chipped Rising Gundam looked like it fizzled with no destroy event shown, but t9's Shining Gundam deploy - which needs 2 (MF) Units already in trash to exile - confirms it really did die there. Same 'missing destroy event' log gap as prior games, this time indirectly confirmed by a later card's own cost requirement."
  - "dajematti's Shining Gundam (GD05-066) recursion loop (Deploy: exile 2 MF units from trash, return a Special Move Command to hand) kept bringing Cyclone Punch back turn after turn, but Kiraya's own pings consistently found and finished each fresh copy at 1-2 HP before it could attack more than once - good sustained pressure denying the engine time to compound."
  - "Bad mill luck struck yet again at t14 (Zeheart Galette milling Gundam Barbatos Lupus and Airframe Seizure in one hit) but this time it plainly didn't matter - the game was already won on board and shield count regardless."
