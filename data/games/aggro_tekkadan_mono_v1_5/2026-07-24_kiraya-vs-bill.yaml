study_notes:
  - "Solidly played win by concession against a Blue/Green Earth Federation (Amuro Ray/White Base/Londo Bell) deck. t4's Gundam Exia Repair attack landed on the very next eligible turn this time (unlike the 240pBrian game) - no repeat of that tempo miss."
  - "Double-checked t11's blocking call since it looked suspicious at first glance: assigning Shiden Custom (Ryusei-Go) to block a buffed Nu Gundam attack also let its Breach 3 trigger, chipping Minerva for 3 anyway. But Breach only fires when the attacker destroys a Unit with battle damage - had she NOT blocked, the boosted attack would have hit Minerva directly for its full (much higher) AP instead of the fixed 3, very likely destroying it outright in one hit rather than leaving it at 2 HP. Blocking was correct: it traded Shiden Custom to cap the damage Minerva actually took, not a misplay."
  - "Worth remembering for future games against this same opponent/archetype: Amuro Ray's (ST01-010) own Pair trigger rests an enemy Unit with 5 or less HP - used twice this game specifically to tap down Kiraya's only standing Blocker-capable unit (Shiden Custom at t7, Gundam Gusion Rebake at t13) right before an attack, denying the block outright rather than fighting through it. A real tech pattern to watch for, not something reactable in the moment once it resolves."
  - "Gundam Barbatos Lupus's exile engine closed the game again at t18, chaining two activations off cards already in the trash (both Barbatos 1st Form copies, Hyakuren, Barbatos Adapt, Graze Custom, Shiden Custom) for 4 total damage to finish off Bill's last threat - the same pattern that's been carrying wins across these last few games."
  - "Bad variance kept compounding, same as recent games: Gundam Exia Repair's self-mill fired twice (t7: Airframe Seizure + Gundam Barbatos 1st Form; t16: Hyakuren + Gundam Barbatos Adapt) and Zeheart Galette's mill hit real cards once more (t16: Mikazuki Augus + Isaribi). Didn't cost the game this time, but it's the same recurring pattern worth tracking across the sample."
