study_notes:
  - "One of the cleanest, most complete games in the sample - 26 turns against a genuinely resilient League Militaire/SEED hybrid (Reineforce Jr. replayed 4 separate times, 2 Overflowing Affections, a second Strike Freedom Gundam appearing after the first got discarded as a shield) and no real misplay found on close review. Good evidence that the deck and the play can grind out even a long, recursive-value opponent, not just fast openings against empty boards."
  - "Gundam Barbatos Lupus carried this one twice over: the first copy's t19 activation finished off Strike Freedom Gundam #2 right after a combat chip (2+2 damage exactly closing a 4-HP gap), and a second copy deployed the same turn Lupus #1 died kept the engine running through t21, killing Strike Rouge (Ootori) and Victory Gundam in the same turn. Running it as a 4-of is clearly pulling its weight across a long game like this."
  - "t9's decision to spend three attacks in a row finishing off Reineforce Jr. rather than going after shields directly was the right call given how much value that base kept generating on redeploy (shield-to-hand plus a Parts token each time) - denying a recurring engine piece is worth more than a shield in this specific matchup."
  - "Recurring log/parser gap again: t11's Kira's Strike Rouge (GD05-010) took what should have been lethal chip damage across three separate hits (Graze Custom's attack, then two pings) without ever showing a destroy event, yet doesn't reappear in later turns either - consistent with the same anomaly class seen repeatedly across this session's games."
