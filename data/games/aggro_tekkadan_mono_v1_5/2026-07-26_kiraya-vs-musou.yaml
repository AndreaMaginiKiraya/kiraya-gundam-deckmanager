study_notes:
  - "A genuine grind, not a misplay-driven loss - checked closely and the trades were consistently sound: t8's reactive Darkness Finger chipped Gundam Geminass 01 mid-combat (same proactive-removal habit as other games), t9's two-unit sequence into Gundam Heavyarms was necessary (neither Gundam Gusion Rebake nor Gundam Barbatos Adapt alone could break its 6 HP), and t16's block assignments were a wash either way (both Shiden Custom copies are identical, and the second one blocking Gundam Ez8 High Mobility Custom for a clean mutual kill was correct)."
  - "Musou's Wing Gundam/Heero Yuy/Peacemillion package is genuinely resilient: Peacemillion's heal kept a nearly-dead Wing Gundam alive after blocking, Wing Gundam's own Breach 5 chipped shields on every kill, and Gundam Heavyarms recurred itself via its own 'return to deck bottom' Deploy text, coming back for a second deployment later in the game."
  - "Bad luck stacked twice on the same card type again: Gundam Barbatos Lupus was lost straight to a t14 shield discard before it could contribute much, and t15's Zeheart Galette pairing then milled both Darkness Finger and Mikazuki Augus in one hit - the deck's two best answers to a resilient board gone to variance in consecutive turns."
  - "t5's 'Replaced Minerva base: Minerva' - swapping a damaged base for a fresh copy rather than just taking the hit - is a small, efficient habit worth remembering: it refreshes the HP pool at the cost of a card, and also re-triggers the base's own Deploy shield-to-hand value."
