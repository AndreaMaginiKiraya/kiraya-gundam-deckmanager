study_notes:
  - "Found a real, sizable issue this time, not a marginal one: Gundam Barbatos 1st Form deployed and Linked with Mikazuki Augus at t7 (eligible to attack immediately per rule 3-2-6-3, and eligible normally every turn after) but never attacked at t7, t9, or t11 - three full turns sitting idle with a completely passive opposing board (Fusiki deployed no new threats and cast no removal in any of those windows). It only attacked for the first time at t13, six turns after coming down, immediately drawing a card and killing Gundam Lfrith on contact - showing exactly what it had been capable of the whole time. At minimum that's 2-3 turns of free damage/shield pressure and 2-3 of its own attack-triggered card draws left on the table, in a game where Fusiki's Strike Freedom Gundam/Kira Yamato engine only came online at t14 - the exact window this delay wasted."
  - "The 'boring deck' frustration has a real pattern behind it, not just this game: this is the third recent v1_5 loss/near-loss built around the same core SEED-Destiny recursion package (Strike Freedom Gundam + Kira Yamato, seen also vs Hichem and 240pBrian) - a genuinely repetitive, hard-to-interact-with matchup type showing up often in the recent sample, worth tracking as a real trend rather than dismissing as one-off bad luck."
  - "Once she got going, execution was sharp: t17 was a 5-attack, 2-activation alpha turn (Gundam Barbatos Lupus killing Aile Strike Gundam, Ryusei-Go/Hyakuren/Gundam Flauros/Gundam Barbatos Adapt/Shiden Custom all swinging) that clawed back real tempo after the rough t14-16 stretch, and t19 correctly chained Lupus activations plus a Mikazuki ping to grind down and finish a third Strike Freedom Gundam copy."
  - "The concession at t22 was reasonable by that point - board and hand were fully spent against an opponent still holding Strike Rouge (Ootori) x2 plus whatever kept fueling the Strike Freedom recursion - but the t7-t11 stretch is the concrete, fixable thing to carry forward: an already-Linked attacker should be swinging every single turn it's able to unless there's a specific reason to hold it back, and none showed up in this log."
