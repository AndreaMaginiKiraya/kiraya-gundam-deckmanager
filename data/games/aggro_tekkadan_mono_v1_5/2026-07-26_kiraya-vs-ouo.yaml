  - "This is effectively the same deck archetype that beat Kiraya badly in the 2026-07-24 game vs 240pBrian - the exact same card pool (Close Combat, Improved Technique, Battle of Aces, multiple Airframe Seizures, Kindhearted, Marida Cruz, Kshatriya, Unicorn Gundam 02 Banshee, Strike Freedom Gundam, Strike Rouge (Ootori)). This time she won - real evidence the matchup is winnable, not just a hard loss waiting to happen every time."
  - "t14's decision NOT to block Unicorn Gundam 02 Banshee's attacks with the available Gundam Gusion Rebake was the right patient call, not hesitation: it let a shield go instead, but kept Rebake alive to contribute t15's finishing ping+Gundam Barbatos Lupus combo that killed the Banshee cleanly, rather than trading Rebake away for nothing against what would very likely have been a losing block anyway."
  - "Gundam Barbatos Lupus carried the whole back half again: t15's double activation killed Unicorn Gundam 02 Banshee, and t17's double activation killed a second Strike Rouge (Ootori) outright - two of OuO's biggest threats removed entirely from graveyard fuel, no combat risk taken either time."
  - "Bad mill luck showed up again early (t9: both copies of Gundam Barbatos Lupus milled by Zeheart Galette in one hit) but this time it didn't matter - the deck still found more copies to deploy at t15 and t17. Worth remembering as a data point on how much redundancy in the 4-of Lupus package actually buys against this specific kind of variance."
