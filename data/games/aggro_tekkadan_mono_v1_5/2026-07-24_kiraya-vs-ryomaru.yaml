study_notes:
  - "Found the real mistake, and it's exactly the one suspected - a pairing/attack sequencing error at t11, not a defensive one. Shiden Custom (Ryusei-Go) deployed and was immediately Linked with Mikazuki Augus (its link field is any Tekkadan pilot, so the Link is real and legal), which by rule 3-2-6-3 meant it could attack that same turn despite being freshly deployed. It never did: t11 shows only two attacks, both from a Gundam Barbatos Adapt (first killing Zeong, then a SECOND Barbatos Adapt finishing off the 1-HP Zeong (Head) token it left behind) - while Shiden Custom, already eligible to attack, sat unused all turn."
  - "The fix would have cost nothing: sending the already-Linked, already-standing Shiden Custom to finish the 1-HP Zeong (Head) token instead of the second Gundam Barbatos Adapt would have killed the exact same token (any positive AP does it) while keeping a full Barbatos Adapt alive. Checked whether that Adapt was actually needed as t13 exile fuel for Gundam Barbatos Lupus - it wasn't: by t13 there were already 8 other trash cards available (Hyakuren, Gundam Barbatos 1st Form, Isaribi, 2x Ryusei-Go, Graze Custom, 2x Gundam Gusion Rebake), comfortably enough for all 3 of that turn's Lupus activations even with one Adapt kept alive instead of exiled."
  - "What the surviving Adapt would and wouldn't have changed: it doesn't have Blocker, so it couldn't have stopped t14's final Wire-Guided Arm hit that ended the game (that one needed a Blocker-capable unit, and Gundam Gusion Rebake - the only one seen this game - was already spent turns earlier). What it would have given is a second attacker at t13 alongside Shiden Custom, likely pushing RYOMARU from 2 remaining shields down to 1. Real, quantifiable value left on the table, but not an outright 'this wins the game' fix - RYOMARU still had a live board and the finishing blow came from a separate unblockable attacker regardless."
  - "The defensive call she was also second-guessing - t12's 'Assigned no blocker' on Char's Zaku Ⅱ, letting a shield (Hyakuren) get discarded instead of trading the standing, Blocker-capable Shiden Custom into it - actually worked out fine and wasn't the error. Keeping Shiden Custom alive let it land a real kill on a different Char's Zaku Ⅱ the very next turn (t13, 6 damage, destroyed) instead of trading it away a turn earlier for a less favorable exchange. That's good patience, not a misplay - the mistake was specifically the t11 attack-assignment choice, not this one."
  - "Elsewhere, execution was sharp: t7 correctly paired Mikazuki Augus onto a freshly-deployed Barbatos Adapt (also a true Link) specifically to enable its immediate attack that same turn, combining Darkness Finger + two separate deploy pings to clear the dangerous Linked Char's Zaku Ⅱ. t13's triple Gundam Barbatos Lupus activation chained the graveyard built up over the whole game into 3 clean kills plus a fourth from Shiden Custom's own attack - excellent use of the accumulated trash fuel."
