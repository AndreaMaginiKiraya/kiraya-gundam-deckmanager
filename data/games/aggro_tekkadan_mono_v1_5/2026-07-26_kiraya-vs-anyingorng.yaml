study_notes:
  - "A genuine 'stra vittoria' - Kiraya never lost a single shield across 13 turns, against a Purple/White deck running a similar Tekkadan-adjacent shell (mirror copies of Gundam Barbatos 1st Form, Gundam Gusion Rebake, Ryusei-Go) that just didn't get its removal/tempo online in time. Checked every forced-ping target closely per the usual standard, even in a blowout, and didn't find a real mistake."
  - "t7's Gundam Barbatos Adapt deploy ping was the sharpest single read of the game: it targeted AnyingORNG's already-weakened Gundam Barbatos 1st Form (down to 1 HP from his own t6 self-ping) rather than a healthy target, finishing it for free off a ping that would otherwise have just been a minor chip. Good precision - checking an enemy unit's current HP before defaulting to whichever target is 'obviously' the biggest threat."
  - "Bad variance still showed up even in a blowout: t8's Gundam Exia Repair death milled both Darkness Finger and Mikazuki Augus in one hit - lost the removal spell and the signature pilot to chance, though it barely mattered here since the game was never really competitive. Mikazuki Augus came back anyway via a lucky t11 shield reveal (Burst: add to hand)."
  - "AnyingORNG's own Gundam Gusion Rebake and Ryusei-Go (Graze Custom Ⅱ) copies behave identically to Kiraya's own (same ids, confirmed via their Deploy triggers) - useful to know this specific opponent is running close to a mirror shell, just evidently a weaker build or draw of it this game."
