study_notes:
  - "Another shield-perfect win (6 remaining, never touched) against a League Militaire/UC hybrid deck. Checked every ping and removal timing; the whole game was precisely executed, not just favorable draws."
  - "t6's ping sequence was sharp: Gundam Barbatos Adapt's own deploy ping plus Mikazuki Augus's Link ping both landed on the same already-blocked-and-weakened Gundam Lfrith (down to 2 HP from chumping Graze Custom), finishing it for free rather than spreading the damage thin."
  - "t8's double Gundam Barbatos Adapt deploy set up t10 well: both pings landed on Strike Rouge (Ootori), and Darkness Finger then finished it outright at exactly 2 damage rather than being spent on a healthier target - good sequencing across two turns to get full value from a single removal spell."
  - "t10 was the standout turn: Airframe Seizure plus Darkness Finger plus four separate attacks cleared Reineforce Jr. and took two more shields in one turn, snowballing what was already a comfortable lead into a lopsided one."
