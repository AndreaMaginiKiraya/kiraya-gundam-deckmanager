study_notes:
  - "Verifica dell'autodiagnosi ('ho perso per un mio errore, permettendogli di attaccarmi invece di scatenare il lupus e limitare i gundam'): NON regge al controllo del log. Le 3 copie di Gundam Barbatos Lupus di questa partita non sono mai state giocabili: la prima e' stata persa come scudo colpito da Kayra's Re-GZ al t8 (mai in mano, pura sfortuna di posizionamento scudi), la terza allo stesso modo come scudo colpito da Breach 5 al t14. La seconda e' arrivata in mano al t13 ed e' stata scartata come costo di Airframe Seizure ('Discard 1. If you do, draw 2.') - ma quel t13 e' stato l'ULTIMO turno di Kiraya nella partita (ddd ha chiuso al t14 successivo): anche tenendola in mano non ci sarebbe mai stato un turno per schierarla. Inoltre il t13 aveva gia' impegnato circa 7 risorse tra Gundam Barbatos 1st Form (costo 2), Gundam Barbatos Adapt (costo 2) e due pairing di Mikazuki Augus (costo 1 ciascuno) - non c'era margine per aggiungere anche i 6 costo di Lupus nello stesso turno. In altre parole: non e' mai esistita una vera decisione 'schiero Lupus o no' in questa partita - la carta non ha mai raggiunto uno stato in cui giocarla fosse un'opzione reale."
  - "La causa reale della sconfitta e' il combo Nu Gundam (GD05-017) + Amuro Ray + Ra Cailum di ddd al t14: Ra Cailum riduce di 1 il danno subito dal Nu Gundam per il turno, poi il pairing con Amuro Ray attiva 'When Paired: esilia 3 carte dal trash, inizia una battaglia extra che salta dichiarazione/blocco' - una battaglia gratuita che uccide Gundam Barbatos Adapt, e SUBITO DOPO lo stesso Nu Gundam attacca normalmente e uccide anche Hyakuren. Un solo Unit ha quindi eliminato l'intero board rimasto di Kiraya in un solo turno avversario, lasciando la strada libera per il colpo di grazia del Gundam al turno successivo. Questo e' un value-engine specifico (When Paired su Nu Gundam LR) gia' visto in altre partite di questo campione (dadada, Amo) contro Barbatos Lupus - qui pero' Lupus non era mai arrivato in campo per poterlo intercettare.
    Nessun errore evidente nel resto della partita: il t10 e' stata una tripla battaglia forzata sfavorevole (3 unita' perse contro 2 avversarie) ma senza alternative di blocco migliori disponibili; il doppio pairing di Mikazuki Augus al t13 per pingare il Gundam avversario e' stato l'unico modo per tenere pressione sullo scudo dopo aver perso Barbatos 1st Form nello scambio con Nu Gundam."
