study_notes:
  - "Another clean dominant win (5 shields remaining, WanChin down to 1) against a Blue Earth Alliance/ZAFT Extended deck (Chaos Gundam, Forbidden Gundam, GFreD). Checked every ping and removal-spell timing closely; this one was sharply played throughout, not just a blowout on raw stats."
  - "t7's Gundam Barbatos Adapt deploy ping precisely finished off Chaos Gundam at 1 HP (already weakened from its own t6 attack) rather than defaulting to a healthier target - same sharp HP-checking habit seen in the AnyingORNG game."
  - "t8's Darkness Finger use was proactively timed: played mid-combat before the Chaos Gundam (MA Mode) attack resolved, setting it up at a lower HP for an easy finish later rather than just using the spell reactively. t9's Gundam Gusion Rebake ping then closed that gap, chipping the same target down again."
  - "WanChin's own Darkness Finger, revealed from Kiraya's shield pile at t9, hit her own Hyakuren rather than an enemy unit - same 'shield-revealed action card damages the shield owner's own board' behavior noted in a past game (the KosXBlue game's Close Combat) - a card-specific quirk to expect, not something to second-guess as a misplay when it happens."
