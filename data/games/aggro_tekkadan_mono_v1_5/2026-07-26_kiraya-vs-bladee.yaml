study_notes:
  - "Did the full turn-by-turn pass requested and genuinely found no misplays this time - every blocking decision, ping target, and trade allocation held up under scrutiny. This one really was clean, not just a favorable draw."
  - "t8's block was the sharpest defensive read: letting Gundam Heavyarms hit Hyakuren directly (already AP-2 debuffed by Heero Yuy) would have lost Hyakuren for nothing, since a debuffed Hyakuren's own counter-attack couldn't have killed Heavyarms (4 HP). Blocking with Shiden Custom instead turned it into a clean 1-for-1 trade (both units died) - correctly recognizing that the 'obvious' choice (protect the unit being attacked) was worse than accepting a different trade."
  - "t13 was the standout turn for sequencing: with only one attack each available from Hyakuren and Gundam Barbatos Lupus, she sent the cheaper Hyakuren into an already-pinged Wing Gundam Zero (EW) - a trade that was going to cost a unit either way given its AP - and kept Lupus swinging at the defenseless Underground Desert Base instead. Sending Lupus into Wing Gundam Zero (EW) would have traded away the more valuable finisher for the same kill; this allocation got the same result while protecting the better card."
  - "t9's decision to trade Hyakuren into an already-1-HP-effective Flat (Militia) rather than leave it alive was reasonable risk management (Flat (Militia) still had its full attack available and could have traded into something the next turn) - not a clear error, though a case could be made either way without full visibility into what else was in hand at the time."
  - "Corrected the imported result to a Kiraya win: the pasted log's final 'Winner!' line had no player name before it, and the importer initially misread it as bladee's win - bladee's own shields_tally (0 remaining, all 6 accounted for) confirms Kiraya actually won this one naturally."
unparsed_lines:
