study_notes:
  - "Genuinely clean game on Kiraya's side - checked every ping target, every blocker assignment, and the HP/AP math on every trade, and none of it holds up as a mistake this time. The 'flat' feel is right: a fast, uneventful curve (t3 Gundam Exia Repair, t5 double deploy, t7 double kill) built a lead against a Celestial Being (Gundam 00) deck that never got room to chain its bigger Trans-Am payoffs, and the game closed at t15 without a real crisis point."
  - "Bad variance, not a misplay: t6's Gundam Exia Repair death milled both copies of Gundam Barbatos Lupus at once, losing the deck's whole finisher line by turn 6. Won anyway on curve and combat trades alone, without ever needing Lupus - worth remembering as evidence the deck can close games on its aggro fundamentals when the top end doesn't show up."
  - "t7 was the best-played turn: Mikazuki Augus's ping correctly targeted the enemy Gundam Exia (which should have died outright to it - see the parser-gap note below) while Hyakuren traded into a blocked attack, and Graze Custom immediately finished off the now-2-HP Gundam Virtue left behind rather than letting it stick around - recognizing and following up on a wounded blocker in the same turn is exactly the right instinct."
  - "Airframe Seizure (v1_5's new draw engine) did solid work at t15: discarded a by-then-spare Gundam Barbatos 1st Form from hand to draw 2, finding what was needed to close the game out that same turn. A clean example of the card converting a redundant copy into gas."
  - "Recurring log/parser gap, not a missed kill: t7's Mikazuki Augus ping hit the enemy Gundam Exia (GD04-038, printed HP1) for 1 damage, which should have destroyed it outright, but no destroy event appears in the log and it's never referenced again on the battlefield afterward either way - consistent with the same anomaly class seen in prior games (Ez8, Barbatos Lupus Rex, Lfrith, RYOMARU's Char's Zaku Ⅱ token, Hichem's Aegis Gundam)."
