study_notes:
  - "A genuine mirror-ish matchup (Amo runs near-identical Gundam Barbatos Lupus/Adapt/Gusion Rebake copies plus a Sazabi/Char Aznable Neo Zeon splash) that came down to the wire - Kiraya was at 0 shields by t20, and the game ended on t22's Sazabi attack landing at exactly 1 remaining HP on that Sazabi. t15 was excellent: a first Gundam Barbatos Lupus traded into Gundam Gusion Rebake, then a second Lupus deployed the same turn combined with Gundam Exia Repair's attack to finish Sazabi #1 outright."
  - "t21 is the closest thing to a real 'what if': Gundam Barbatos Adapt's ping plus Gundam Barbatos 1st Form's attack plus a fresh Graze Custom's attack chipped Sazabi #2 down to exactly 1 HP but didn't finish it, and that surviving 1 HP is what delivered the t22 lethal. Genuinely can't tell from the log alone whether more damage was available that turn (hand/resources aren't visible), so this is a real near-miss worth remembering rather than a confirmed misplay - the margin really was that thin."
  - "t20's loss of Gundam Barbatos Lupus to Rewloola's incidental 1-damage Deploy ping (while already at 1 HP from blocking) is the same 'big finisher dies to chip damage rather than a real fight' pattern as the dadada game's shield-discarded Lupus - bad luck in a different shape, not a play error."
  - "This game's Char Aznable resolved to a different printing (GD05-093, the Neo Zeon Base recursion version) than the ST03-011 seen in both RYOMARU games - a good reminder that different opponents can run different copies of the same-named card even within what looks like the same archetype."
