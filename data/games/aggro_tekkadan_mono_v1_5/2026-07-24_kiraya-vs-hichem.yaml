study_notes:
  - "v1_5's first game and first loss, against a Red/Purple ZAFT (Gundam SEED) deck built around Duel Gundam (Assault Shroud)'s chain-deploy engine (top-3 dig + free deploy on every pairing - triggered 3 times: t10 Athrun Zala, t12 Yzak Jule Link, t24 Miguel Ayman), 2 copies of the spot-removal Command 'Eliminate Target', and a buff package (Jachin Due + Blitz Gundam) that grants First Strike to already-buffed high-AP attackers - which is what the repeated 'Damage prevented / 0 damage' log lines actually are: the attacker kills its target before it can strike back, not a separate damage-prevention ability."
  - "Checked every forced-ping and blocker-assignment decision this game for a safer alternative; none held up as a real error. t11's Mikazuki Augus ping self-hit a fresh Graze Custom rather than the healthier Gundam Gusion Rebake, but Graze Custom died in an unrelated t13 trade regardless (took 5 damage, way past either 1 or 2 HP) so it cost nothing, and prioritizing chip damage onto the disposable unit over the blocker was the right instinct anyway. t18's blocker choice between Impulse Gundam and Force Impulse Gundam looked like it might matter (different HP: 3 vs 4) but both trade into a mutual kill against Shiden Custom's AP4 either way - a genuine wash, not a missed better option."
  - "t12 was the turn that decided the game: with Gundam Gusion Rebake (the only Blocker-capable unit all game) already spent blocking the first attack, Hichem's two 'Eliminate Target' plays picked off Mikazuki Augus and Zeheart Galette - the paired pilots on Gundam Flauros and Hyakuren - while both units were undefended by rule, not by choice. This wiped 5 of Kiraya's board/hand pieces in one turn and wasn't preventable from her side without a blocker that didn't exist yet."
  - "t13 and t15 were excellent recovery turns: the trash left over from t12's wipe (Hyakuren x2, Gundam Flauros) fueled Gundam Barbatos Lupus's exile-cost activation for a precise 2-damage kill on a weakened Duel Gundam, and t15 chained Ryusei-Go (Graze Custom Ⅱ)'s discard-for-value into two more Lupus activations plus a direct combat kill, clearing Impulse Gundam and Blitz Gundam outright. Strong sequencing turning a disaster turn into fuel."
  - "Zeheart Galette's mill hit hard twice with no compensating Vagan trigger: t9 (Mikazuki Augus + Gundam Barbatos Adapt) and t21 (Gundam Gusion Rebake + Gundam Barbatos 1st Form) - 4 real cards lost to variance alone across the game, on top of the 2 pilots lost to Eliminate Target. Between removal and mill bad luck, the pilot/engine pieces took an unusually rough game."
  - "Darkness Finger (v1_5's new Red tech) did its job on the one occasion it came up: revealed as a shield at t16, its own trigger fired for 2 damage to Blitz Gundam - validates the card working as intended even off the top of the shield pile, not just as a hand play."
  - "Recurring log/parser gap, not a missed kill: t9's Gundam Gusion Rebake deploy ping hit Aegis Gundam (already at 1 HP from t8) for 1 more damage, which should have destroyed it, but no destroy event appears and an Aegis Gundam persists on Hichem's side until it deploys as 'Aegis Gundam (MA Mode)' at t20. Same class of anomaly as prior games (Ez8, Barbatos Lupus Rex, Lfrith, and the Char's Zaku Ⅱ token in the RYOMARU game)."
