study_notes:
  - "Vittoria shield-quasi-perfetta (16 turni, 4/5 shield residue) contro un avversario Verde ibrido Zeon rush + Phantom Pain (Zaku Ⅱ, Dopp, Abyss Gundam/Abyss Gundam MA Mode, Gaia Gundam/Gaia Gundam MA Mode con Stellar Loussier, Sting Oakley, Auel Neider, Exass, Girty Lue)."
  - "Prima vera prova in partita di Gundam Gusion Rebake Full City (sostituito a Flauros in questa versione): al t13 blocca un attacco pesante di Abyss Gundam Mode con Blocker, sopravvive (a differenza del vecchio Flauros HP3, che sarebbe morto) e distrugge l'attaccante nello scambio - esattamente il miglioramento di resilienza previsto dallo scambio. La sua abilita' firma (During Pair: quando un'unita' Tekkadan/Teiwaz subisce danno da effetto, rendi inattivo un nemico) pero' non si e' mai attivata in tutta la partita - nessun ping su un'unita' propria e' coinciso con la sua presenza in campo. Dato positivo parziale: il corpo/Blocker ha gia' pagato, l'abilita' resta da verificare."
  - "T7: al trigger di Gaia Gundam (scegli di scartare 1 carta o l'avversario schiera gratis un'unita' Phantom Pain) Kiraya sceglie di scartare Gundam Barbatos Lupus - non e' chiaro dal log se fosse davvero la carta meno utile in mano in quel momento, ma e' un'altra istanza della stessa carta finita nello scarto prima di essere giocata. Non ha comunque impedito il piano: un'altra copia di Lupus arriva regolarmente al t14 e si attiva 2 volte nel resto della partita."
  - "Buone scelte di scarto altrove: Airframe Seizure scarta Zeheart Galette (t8) e Graze Custom (t14), mai Lupus quando la scelta era libera (non forzata da una carta avversaria)."
  - "Nessun errore tattico individuato nella gestione dei combattimenti."
