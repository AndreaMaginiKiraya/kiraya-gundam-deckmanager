study_notes:
  - "Vittoria per resa (16 turni) contro un avversario Blu/Viola ibrido League Militaire + splash Tekkadan (Reineforce Jr., Zoloat, Victory Gundam, Üso Ewin, V-Dash Gundam mescolati a Gundam Barbatos 1st Form, Gundam Gusion Rebake e persino Mikazuki Augus) con una copia di Strike Freedom Gundam+Kira Yamato in coda - un altro data point sul pacchetto piu' pericoloso del campione, stavolta gestito senza problemi (un solo attacco prima della resa)."
  - "Buona correzione d'abitudine al t10: Airframe Seizure scarta Zeheart Galette, non Gundam Barbatos Lupus - esattamente il tipo di scelta rimessa in discussione nella conversazione recente su questo mazzo."
  - "Gundam Barbatos Lupus arrivato solo al t14 ma immediatamente doppia attivazione, eliminando entrambe le copie di Zoloat (League Militaire) nello stesso turno grazie al trash gia' accumulato - motore che continua a funzionare quando arriva in tempo."
  - "Nessun errore individuato; partita non richiesta come revisione rigorosa, controllo standard."
