study_notes:
  - "Prima sconfitta con v1_7 (ancora identico a v1_5). Avversario Zeon/Federation rush (Zaku I/II a raffica, Char's Zaku Ⅱ, ReZEL, Rick Dom, Zeong, 'Gundam'+Amuro Ray) - curva d'apertura molto aggressiva che ha portato Kiraya a 0 shield gia' entro il t13, ben prima che il suo motore (Lupus) entrasse in gioco."
  - "Problema centrale: 2 delle 4 copie di Gundam Barbatos Lupus perse PRIMA di riuscire a schierarne anche solo una - la prima al t8, milled dalla propria Gundam Exia Repair (automatico, nessuna scelta); la seconda al t10, scartata volontariamente come costo di Airframe Seizure. Quest'ultima e' l'unico punto della partita che vale la pena rivedere con occhio critico: scartare la seconda copia del proprio pezzo piu' importante subito dopo aver gia' perso la prima al mill e' una scelta che avrebbe meritato di essere valutata con piu' cautela, anche se dal log non e' possibile verificare se in mano ci fosse davvero un'alternativa migliore da scartare - non e' quindi un errore certificato, ma il candidato piu' plausibile se ce n'e' stato uno in questa partita."
  - "Il t14 (turno in cui Lupus finalmente scende in campo) e' stato giocato in modo quasi ottimale, non peggiorabile: con 3 minacce avversarie vive contemporaneamente (secondo 'Gundam', Zaku Ⅱ, Zeong) e le shield gia' a zero, Kiraya ha usato ogni risorsa disponibile (3 attivazioni di Lupus, Shiden Custom, Graze Custom) per eliminarle tutte e tre nello stesso turno - l'unica alternativa (tenere Shiden Custom indietro come Blocker invece di attaccare) avrebbe comunque lasciato l'avversario con 2 attaccanti al t15 (Zaku Ⅱ vivo + il token Zeong (Head), inevitabile alla morte di Zeong) contro il suo unico Blocker superstite, perdendo comunque essendo gia' a 0 shield. Non un errore: la sconfitta al t15 era gia' matematicamente cementata dal board state, non da una scelta migliorabile in quel turno."
  - "In sintesi: nessun errore tattico chiaro nella gestione di combattimenti/blocchi. La causa principale e' stata la doppia perdita anticipata di Lupus (in gran parte sfortuna) unita a una curva d'apertura avversaria molto veloce che ha azzerato le shield di Kiraya circa 4-5 turni prima che il piano-motore del mazzo potesse rispondere."
