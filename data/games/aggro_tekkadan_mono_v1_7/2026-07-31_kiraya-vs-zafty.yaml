study_notes:
  - "Vittoria pulita (16 turni, 5/6 shield residue) contro un avversario Verde/Rosso GQuuuuuuX/Clan (Zaku Four Snake Eyes, Red Gundam x2 stampe diverse, GQuuuuuuX Omega Psycommu a ripetizione con Deploy 3 danni, Amate Yuzuriha, Shuji Ito) con rimozione diretta (Close Combat, Undying Persistence, Improved Technique) - primo incontro con questo archetipo nel campione."
  - "T6 e t8: due rimozioni action-speed avversarie (Close Combat su Exia Repair, Undying Persistence su un Barbatos Adapt gia' a 1 HP) non erano evitabili - nessuna alternativa di gioco le avrebbe prevenute."
  - "Possibile occasione mancata al t11: con Shiden Custom sotto attacco da un Red Gundam AP2 appena schierato, Kiraya assegna 'no blocker' pur avendo Gundam Gusion Rebake (Blocker, HP5, gia' schierato e non ancora usato per attaccare quel turno) libero e disponibile - un blocco l'avrebbe probabilmente salvato senza rischio (Gusion Rebake avrebbe assorbito solo 2 danni sui suoi 5 HP). Non e' certificabile al 100% dal log che Gusion Rebake fosse davvero libero, ma sembra la spiegazione piu' plausibile e vale la pena verificarla in partita."
  - "Ottimo uso difensivo di Gundam Gusion Rebake Full City al t15: bloccato deliberatamente contro GQuuuuuuX per proteggere Gundam Barbatos Lupus (il pezzo piu' prezioso) - muore nello scambio ma e' il sacrificio corretto, e infligge comunque 5 danni lasciando l'attaccante a 1 HP."
  - "Gundam Barbatos Lupus arriva presto (t12) e si attiva 2 volte con valore pulito, eliminando 2 copie di GQuuuuuuX gia' indebolite - nessun problema di ridondanza questa partita."
