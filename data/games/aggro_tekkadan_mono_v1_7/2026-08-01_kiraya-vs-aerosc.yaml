study_notes:
  - "Sconfitta (15 turni) in un altro mirror-match quasi esatto (Graze Custom, Gundam Exia Repair, Gundam Barbatos Adapt/1st Form, Hyakuren, Isaribi, Shiden Custom, Zeheart Galette, Gundam Barbatos Lupus, Airframe Seizure, Darkness Finger). Corrisponde alla partita dello screenshot mid-game (t15, 1 shield contro 3, board vuota, 3 copie di Lupus in mano non giocabili a 4 risorse)."
  - "T10: un singolo mill di Zeheart Galette ha colpito ENTRAMBI gli strumenti di interazione rimasti in mano (Darkness Finger e Airframe Seizure) nello stesso momento - sfortuna pura (il mill e' automatico dalla cima del mazzo, non una scelta), ma un colpo pesante che ha lasciato Kiraya senza risposte dirette per il resto della partita."
  - "AeroSC schiera Lupus al t13, Kiraya al t14 - un turno di distacco che stavolta ha pesato di piu' del solito: quando finalmente arriva, il Lupus di Kiraya trova solo carburante sufficiente per UNA attivazione (poche unita' Tekkadan proprie ancora nel trash - Darkness Finger/Airframe Seizure sono Command, non contano), mentre nelle partite migliori di questa sessione Lupus ha spesso fatto 3-5 attivazioni nello stesso turno. Il divario non e' nella giocata ma nella quantita' di carburante disponibile in quel momento specifico."
  - "Nessun errore tattico individuato: i blocchi (Shiden Custom su Adapt al t9) erano corretti, e non c'erano alternative nei molti 'No blockers available' (nessuna unita' con Blocker in campo per Kiraya in questa partita). Sconfitta guidata da varianza (mill sfortunato, timing di un turno su Lupus, carburante limitato), non da decisioni migliorabili."
