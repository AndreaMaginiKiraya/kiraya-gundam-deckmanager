study_notes:
  - "Vittoria per resa dell'avversario al t12 (Markgundam a 1 shield residuo contro i 5 di Kiraya) - mazzo Celestial Being (Gundam Virtue, Gundam Exia+Setsuna F. Seiei, Gundam Kyrios, GN Armor, Aegis Gundam MA Mode) con tech che rispecchia la nostra (Fatal Strike, Airframe Seizure, Minerva)."
  - "Schema ricorrente vincente: Barbatos Adapt pinga al Deploy l'attaccante avversario appena schierato/indebolito, poi un blocco sacrificale con Shiden Custom (Ryusei-Go) assorbe l'attacco pesante di Gundam Exia (buffato da Setsuna F. Seiei) lasciandolo quasi morto - ripetuto identico al t10 e al t12, sempre con esito favorevole nello scambio complessivo anche perdendo lo Shiden Custom."
  - "Il costo forzato di Ryusei-Go (Graze Custom Ⅱ) - pesca poi scarta - ha buttato via Gundam Gusion Rebake Full City al t7 (la nuova carta appena aggiunta al mazzo); non e' una scelta libera (l'abilita' della carta impone lo scarto), quindi non e' lo stesso problema gia' visto con Lupus, ma resta un costo reale della carta da tenere a mente quando si valuta Full City su un campione piu' ampio."
  - "Nessun errore tattico individuato."
