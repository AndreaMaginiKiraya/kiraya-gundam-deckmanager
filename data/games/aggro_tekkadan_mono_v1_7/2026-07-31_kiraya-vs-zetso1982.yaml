study_notes:
  - "Prima partita registrata con v1_7 (clone esatto di v1_5, nessuna modifica ancora applicata). Avversario con un mazzo ibrido G Gundam MF/Master Asia + Academy/UC (Master Gundam, Shining Gundam+Domon Kasshu, Gundam Maxter, Haow Gundam+Master Asia, Gundam Aerial Rebuild+Suletta Mercury, Michaelis) - variante piu' eterogenea del solito 'MF con Master Asia' gia' visto contro dajematti."
  - "Verifica richiesta esplicitamente da Kiraya: nessun errore tattico individuato in tutta la partita di 24 turni. I due blocchi chiave sono entrambi corretti: t7 (Shiden Custom contro Michaelis, scambio pari, protegge Hyakuren) e t11 (Gundam Gusion Rebake contro Shining Gundam, il Blocker dedicato si sacrifica per salvare Hyakuren anche se il contrattacco viene annullato da Shining Finger)."
  - "Gundam Barbatos Lupus perde 3 copie su 4 in questa partita (t17 e t21 in combattimento, t21 anche di scarto da shield) - ma sempre DOPO aver gia' fruttato valore reale (uccide Haow Gundam al t14, Master Gundam quasi morto al t18, ecc.), mai perso a vuoto per scelta di Kiraya: sia al t17 che al t21 il log conferma esplicitamente 'No blockers available', quindi nessuna alternativa di blocco esisteva. Al t17 l'avversario gioca in modo specifico ottimo (Shining Finger rende inattivo lo Shiden Custom di Kiraya PRIMA di attaccare Lupus con Shining Gundam, negandole ogni blocco) - abilita' avversaria, non errore di Kiraya. La ridondanza a 4 copie di Lupus nel mazzo si e' dimostrata decisiva: ogni copia perduta veniva rimpiazzata e tornava subito a dare valore."
  - "Nessun errore individuato: partita lunga e logorante vinta sulla profondita' del mazzo (4x Lupus, motore Adapt/Mikazuki ping) piu' che su un singolo turno decisivo."
