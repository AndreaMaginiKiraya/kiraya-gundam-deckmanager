study_notes:
  - "Sconfitta (20 turni) contro un avversario Verde/Bianco Gundam Wing + Earth Federation/Londo Bell che ha messo in campo, nella stessa partita, le due minacce piu' pericolose gia' documentate in questa sessione: Wing Gundam Zero (board wipe simmetrico al Deploy, t12, e attaccante non bloccabile per il resto della partita) e la combo Nu Gundam (GD05-017)+Amuro Ray (esilio+battaglia gratuita, t20, che uccide l'ultima copia di Lupus). Le due minacce insieme in un'unica partita non erano ancora capitate nel campione."
  - "T17: turno di valore eccezionale nonostante la sconfitta finale - Gundam Barbatos Lupus si attiva 4 volte nello stesso turno (record della sessione), uccidendo Wing Gundam e riducendo sia Wing Gundam Zero che un Nu Gundam quasi a zero HP usando solo trash accumulato."
  - "T12: il wipe di Wing Gundam Zero colpisce solo 2 unita' (Gundam Barbatos 1st Form e Ryusei-Go, entrambe gia' a 1 HP da danni precedenti) perche' la board di Kiraya era gia' molto assottigliata in quel momento - non una board sovraestesa spazzata via, solo l'ultimo colpo su unita' che sarebbero comunque morte a breve."
  - "Nessun errore tattico chiaro individuato: la sconfitta viene dalla convergenza sfortunata dei due matchup piu' difficili del mazzo nella stessa partita, non da una giocata migliorabile. T19 (Lupus schierato ma non attivato) non sembra un'occasione persa - nessun combattimento e' avvenuto quel turno per nessuno dei due giocatori, quindi non c'era un bersaglio urgente da colpire."
