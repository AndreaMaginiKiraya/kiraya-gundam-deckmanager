study_notes:
  - "Sconfitta per resa di Kiraya al t22 (log troncato a meta' turno) contro un mazzo Neo Zeon/Sleeves molto resiliente: 2+ copie di Sazabi (una variante Deploy-mill-recupera-unita', una variante Attack-sacrificio-reciproco), Darkness Finger, Improved Technique, con Quess's Jagd Doga riciclato piu' volte in mano tramite il costo di sacrificio di Sazabi. Nota curiosa: al momento della resa Gordon era a 0 shield residue e Kiraya a 2 - la resa non era per mancanza di shield ma per board ormai esausta contro un avversario che continuava a rigenerare minacce."
  - "Unico punto realmente da rivedere: al t8 Airframe Seizure scarta Gundam Gusion Rebake Full City, la carta piu' nuova e preziosa del mazzo (solo 2 copie), gia' al turno 8 - stessa categoria di rischio gia' segnalata con gli scarti di Lupus in partite precedenti. Non verificabile con certezza senza vedere la mano completa, ma e' la scelta piu' discutibile trovata in tutta la partita."
  - "Nessun altro errore individuato dopo revisione turno per turno: i blocchi (Shiden Custom su Sazabi al t15 per proteggere Lupus, Sazabi su Adapt al t12 da parte di Gordon) sono stati tutti coerenti con la protezione del pezzo piu' prezioso in campo; le perdite forzate (l'abilita' di sacrificio di Sazabi, Darkness Finger, Improved Technique) non avevano contromisura disponibile nel momento in cui sono avvenute."
  - "Pattern strutturale confermato per la quarta volta consecutiva in questa sessione (dopo ENDEV, 2444, ZZZ): l'avversario aveva accesso a strumenti di rimozione ripetibili e mirati (qui il sacrificio forzato di Sazabi, che funziona in modo concettualmente identico al nostro stesso Adapt+Lupus+Darkness Finger) capaci di eliminare selettivamente gli investimenti piu' pesanti di Kiraya (Gusion Rebake, Lupus) uno alla volta nel corso della partita. Non e' una serie di errori di gioco - e' lo stesso tipo di matchup sfavorevole (mazzi control/removal densi) che ha deciso anche le tre sconfitte precedenti."
