  - "Vittoria naturale al t29, la partita piu' lunga della sessione - un altro mirror parziale (shsia gioca lo stesso nucleo Tekkadan: Barbatos 1st Form/Adapt, Mikazuki Augus, Zeheart Galette) con splash Neo Zeon (Char's Zaku Ⅱ/Char's Gelgoog+Char Aznable High-Maneuver, Zeong, Sazabi, Axis)."
  - "T14 e t16: Lupus concatena 4 uccisioni in due turni (Char's Gelgoog, Hobby Hizack, Zeong, il token Zeong (Head)) - motore al massimo rendimento quando arriva in tempo."
  - "T10: Airframe Seizure scarta di nuovo Lupus, ma come nella partita contro Okay il costo si e' rivelato minimo - la copia scartata e' finita nel trash che ha alimentato le attivazioni successive."
  - "T23: doppio Burst di Darkness Finger dalle shield (rivelate in sequenza) ha eliminato Sazabi senza alcuna azione diretta - puro colpo di fortuna nella distribuzione delle shield, non una giocata."
  - "Nessun errore individuato. Partita vinta per logoramento puro nel lungo periodo (29 turni) piuttosto che per un singolo turno decisivo."
