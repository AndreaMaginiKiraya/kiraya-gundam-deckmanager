study_notes:
  - "Sconfitta per resa di Kiraya al t18, ma margine sottilissimo: shields_tally finale 0 (Kiraya) contro 1 sola shield residua per ENDEV - una shield in meno e la partita si sarebbe probabilmente chiusa a suo favore. Avversario Earth Federation/Londo Bell ibrido (Re-GZ BWS, Gundam AGE-1 Normal, Wing Gundam+Heero Yuy, Jegan, Justice Gundam, Fatum-00, Kayra's Re-GZ, Silver Bullet) con Nu Gundam+Amuro Ray come piano principale."
  - "Gundam Barbatos Lupus non ha mai toccato il campo in tutta la partita: 2 copie viste, entrambe perse a scarto diretto dalla shield pile (t15, t17) prima di poter essere pescate in mano - identico al problema gia' documentato nella partita persa contro ddd. Senza il suo motore di rimozione ripetibile, il divario di 1 sola shield e' quasi certamente riconducibile a questa sfortuna specifica, non a un errore di gioco."
  - "T13 e' stato il turno decisivo per ENDEV: un solo Nu Gundam (GD05-017) fa doppio danno nello stesso turno - prima la battaglia gratuita da When Paired (esilio 3 dal trash) contro Gundam Gusion Rebake Full City, poi un secondo attacco normale contro Gundam Barbatos Adapt - eliminando 2 unita' di Kiraya da un solo dispiegamento. Stesso combo Nu Gundam+Amuro Ray gia' segnalato piu' volte come la minaccia specifica piu' pericolosa del campione contro Lupus; qui colpisce l'intero board invece che il solo Lupus, e viene ripetuto una seconda volta con un secondo Nu Gundam al t15."
  - "Nessun errore tattico individuato: tutti i 'No blockers available' erano forzati (nessuna alternativa disponibile), e la sequenza di ping/attacchi di Kiraya (doppio Adapt, Mikazuki, Zeheart Galette sui piloti giusti) e' stata efficiente per tutta la partita."
