study_notes:
  - "Sconfitta per resa (24 turni) contro un mazzo SEED/League Militaire (Victory Gundam, Aile Strike Gundam, V-Dash Gundam, Strike Freedom Gundam+Kira Yamato) con un motore di pesca nettamente superiore al nostro. Conteggio effettivo dal log: Mememaker pesca extra circa 12 carte nel corso della partita (4x Overflowing Affection da +1 netto ciascuna, 3x Victory Gundam Attack-draw, 1x Kira Yamato When Paired-draw, 4x Strike Freedom Gundam Deploy/Attack-draw), pagando solo 4 carte di costo (2 usi dell'abilita' di scarto-2-e-rimanda-al-mazzo di Strike Freedom) - un saldo netto di circa +8 carte sull'intera partita. Kiraya nello stesso lasso di tempo ha un solo strumento di vantaggio-carte reale (Airframe Seizure, +1 netto); Ryusei-Go e' a saldo zero (pesca1/scarta1) e Gundam Exia Repair mina, non pesca."
  - "Terza conferma in questa sessione (dopo ZZZ, WALKER) dell'abilita' di Strike Freedom Gundam di scartare 2 carte e rimandare in fondo al mazzo l'unita' nemica di livello piu' basso: qui usata due volte (t16 su Gundam Barbatos 1st Form, t20 su Gundam Barbatos Lupus+Zeheart Galette insieme) - un pattern ormai sistematico contro questo mazzo, non piu' un caso isolato."
  - "Nessuna revisione turno per turno richiesta esplicitamente questa volta - il punto sollevato da Kiraya (svantaggio di carte in mano strutturale, non un errore di gioco specifico) e' verificato e confermato numericamente sopra."
