study_notes:
  - "Vittoria naturale (15 turni) contro un avversario Verde/Viola ibrido Neo Zeon + splash Tekkadan (Zaku Ⅱ, Char's Zaku Ⅱ+Char Aznable High-Maneuver, Sazabi, Quess's Jagd Doga, Zeong, Axis, con Gundam Barbatos 1st Form/Adapt come mirror parziale)."
  - "Ancora una buona scelta di scarto al t3: Airframe Seizure scarta Zeheart Galette, non Lupus - seconda partita di fila con questa correzione d'abitudine."
  - "Una copia di Lupus persa a scarto da shield al t6 (sfortuna, non errore), ma quella rimasta arriva al t15 e fa tripla attivazione immediata, eliminando un Zaku Ⅱ e un Char's Zaku Ⅱ nello stesso turno prima del colpo finale."
  - "T10/t14: Char Aznable (ST03-011) da' High-Maneuver a Char's Zaku Ⅱ in attacco due volte, rendendolo non bloccabile - correttamente non contestato (nessuna alternativa esiste contro High-Maneuver)."
  - "Nessun errore individuato; partita non richiesta come revisione rigorosa, controllo standard."
