study_notes:
  - "Sconfitta (log troncato al t19, ma shields_tally gia' a 0 per Kiraya) contro un mirror-match quasi esatto: WALKER gioca essenzialmente la stessa lista Tekkadan (Ryusei-Go, Barbatos 1st Form/Adapt, Hyakuren, Isaribi, Shiden Custom, Zeheart Galette, Gundam Flauros, Gundam Barbatos Lupus, Gundam Gusion Rebake) con lo stesso splash Strike Freedom Gundam+Kira Yamato."
  - "Il suo Lupus arriva al t13 (5 turni prima del nostro, arrivato solo al t18) e fa il suo lavoro prima: doppia attivazione subito, poi una terza al t15 - uccide Shiden Custom e Gundam Barbatos 1st Form gia' indebolito. Quando il nostro Lupus finalmente arriva al t18 fa un turno eccezionale (5 attivazioni, elimina Strike Freedom Gundam e Ryusei-Go in un colpo solo) ma ormai troppo tardi - il divario di 5 turni sul pezzo chiave ha deciso la partita piu' di ogni singola giocata."
  - "Seconda conferma in questa sessione (dopo la partita contro ZZZ) della capacita' di Strike Freedom Gundam di scartare 2 carte e rimandare in fondo al mazzo l'unita' nemica di livello piu' basso: al t15 ha cancellato l'unico Graze Custom di Kiraya senza combattimento. Vale la pena tenerla a mente come minaccia specifica ricorrente, non un caso isolato."
  - "Nessun errore tattico chiaro individuato. L'unico momento leggermente discutibile: t12, l'appaiamento di Zeheart Galette su Hyakuren non ha prodotto alcun beneficio (nessuna carta Vagan tra le 2 milled, nessun debuff applicato) - minore, non decisivo."
  - "In questa partita specifica il fattore decisivo e' stato semplicemente il tempismo di arrivo di Lupus: chi lo schiera prima in un mirror-match quasi identico ottiene un vantaggio strutturale enorme, indipendentemente dalla qualita' delle giocate successive."
