study_notes:
  - turn: 11
    note: "Bonestar's Nu Gundam+Amuro Ray package (GD05-017/GD05-085) starts snowballing here: Amuro's on-kill heal keeps Nu Gundam and the linked Gundam topped off after every trade, so Kiraya's blockers (Shiden Custom, Gundam Barbatos Adapt) die for value but never actually threaten to finish either enemy unit. This is the same archetype flagged earlier this session as a structural bad matchup (25% WR sample)."
  - turn: 16
    note: "Kiraya's best turn of the game: Airframe Seizure cantrips into Darkness Finger killing Re-GZ, a Lupus activation kills Kayra's Re-GZ, and Barbatos 1st Form/Lupus both swing — but it costs almost the entire hand to do it (command, action, and two units committed), leaving nothing in reserve."
  - turn: 17
    note: "The turn that lost the game: Bonestar's Nu Gundam alone two-for-ones Kiraya's remaining board — the [When Paired] exile-3-Londo-Bell-trash free battle kills Gundam Exia Repair, then a full attack kills Gundam Barbatos Lupus too, healing back to near-full HP both times off Amuro Ray. That single unit erased both of Kiraya's remaining threats in one turn."
  - turn: 18
