study_notes:
  - turn: 8
    note: "A dominant turn: Barbatos 1st Form broke Corsica Base, drew a card off its Attack trigger, and three more attacks (2x Exia Repair + Graze Custom) stripped 3 of GuyManSon's shields in one go — by end of turn GuyManSon was already down to 1 shield with no board presence beyond a 1-HP Barbatos Adapt."
  - turn: 9
    note: "GuyManSon's only comeback attempt (a second Barbatos Adapt pinging both Exia Repair copies to death, then trading Barbatos Adapt into Kiraya's Barbatos 1st Form) actually helped Kiraya: each Exia Repair kill triggered its Destroyed mill-2, and GuyManSon's own attacker died in the trade too, leaving them with zero board and one shield against Kiraya's still-live Graze Custom and Hyakuren."
  - turn: 10
    note: "Closed it out in two swings — Graze Custom took the last shield, Hyakuren hit face for game. A near-perfect curve-out: no removal spells needed, opponent never landed enough pressure to threaten Kiraya's own 6 untouched shields."
