study_notes:
  - "Sconfitta lunga e logorante (25 turni) contro un altro 'MF con Master Asia' (G Gundam: 3 copie di Master Gundam, 3 copie di Shining Gundam con motore di recupero MF dal trash, Cyclone Punch/Chibodee Crocket, Domon Kasshu) - un mazzo gia' segnalato come denso e recidivo in questa sessione."
  - "Problema centrale: 2 delle 4 copie di Gundam Barbatos Lupus sono finite nel mill automatico di Gundam Exia Repair (t12, t20) senza mai combattere - solo 1 copia e' arrivata in campo (t14), ma quella ha comunque reso benissimo (2 attivazioni al t16, elimina Gundam Maxter preventivamente al t14 negando il combo Maxter+Cyclone Punch sul nascere, esattamente come nella vittoria contro dajematti). Il rischio del mill di Exia Repair sui pezzi pesanti e' ormai un pattern ricorrente in piu' partite di questa sessione, non un caso isolato - vale la pena tenerlo presente."
  - "T11 e t17: entrambi i blocchi (Gusion Rebake su Rising Gundam gia' indebolito, Shiden Custom sul primo Master Gundam) hanno sacrificato il corpo piu' grande per assicurare l'uccisione o attutire il colpo peggiore - scelte corrette, non c'era un modo piu' economico di ottenere lo stesso risultato in nessuno dei due casi."
  - "Nessun errore tattico individuato. Sconfitta per pura densita' di risorse avversarie (3 Master Gundam, motore di recupero ripetuto) unita alla sfortuna del doppio mill su Lupus - la partita e' durata 25 turni ed e' rimasta in bilico a lungo, non un crollo per una giocata sbagliata."
