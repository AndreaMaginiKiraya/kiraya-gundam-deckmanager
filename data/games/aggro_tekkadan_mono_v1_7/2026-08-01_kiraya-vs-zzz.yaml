study_notes:
  - "Sconfitta per resa (18 turni) contro un mazzo League Militaire/UC estremamente denso di rimozione e pesca: ZZZ gioca Darkness Finger 3 volte nella partita (t9, t15 da shield-burst, t16 - lo stesso strumento del nostro mazzo, qui usato contro di noi), Kshatriya+Marida Cruz (ping ripetibile 1-2 danni ad ogni pairing), 2x Airframe Seizure, e Strike Freedom Gundam+Kira Yamato nel finale."
  - "Scoperta nuova su Strike Freedom Gundam (GD05-002), mai documentata prima in questa sessione: la sua abilita' Attack e' 'Puoi scartare 2. Se lo fai, scegli 1 unita' nemica al Lv. piu' basso. Rimandala in fondo al mazzo del proprietario' - al t15 questo ha rimosso l'unica unita' di Kiraya in campo (Gundam Gusion Rebake Full City, con Zeheart Galette appaiata) SENZA combattimento e senza possibilita' di risposta, semplicemente scartando 2 carte da una mano gia' rimpinguata dal proprio motore di pesca. Finora di questa carta erano documentati solo il motore di pesca (Deploy/Attack draw) e il debuff AP-2 via Kira Yamato - questa e' una terza faccia del problema, probabilmente la piu' difficile da giocare intorno visto che non richiede nemmeno un combattimento."
  - "Revisione turno per turno rifatta una terza volta, con lo stesso livello di rigore delle due precedenti (ENDEV, 2444) dopo la richiesta esplicita di Kiraya di verificare i propri errori: ancora nessun errore tattico chiaro individuato. Ogni unita' persa e' caduta o a un 'No blockers available' genuinamente forzato (Kiraya non ha mai avuto un'unita' con Blocker in campo in questa partita) o a rimozione diretta senza finestra di risposta (Darkness Finger, ping di Kshatriya/Marida Cruz, il bounce di Strike Freedom). Il t13 di ZZZ in particolare (ping di Kshatriya + Darkness Finger + ping di Marida Cruz per eliminare sia Gundam Exia Repair che Gundam Gusion Rebake nello stesso turno) e' la stessa tattica di 'impilare piccoli danni per finire un bersaglio' che il nostro stesso mazzo usa sistematicamente (Adapt+Darkness Finger, Lupus+Darkness Finger) - qui applicata contro di noi con pari efficacia."
  - "Non e' un mazzo che 'non vince mai': record v1_7 7-3 prima di questa partita (70%). Questa e altre sconfitte recenti condividono un profilo comune - avversari control/removal molto densi (Nu Gundam+Amuro Ray, ora Kshatriya+Strike Freedom) - un matchup difficile per costruzione, non un problema di esecuzione in queste partite specifiche."
