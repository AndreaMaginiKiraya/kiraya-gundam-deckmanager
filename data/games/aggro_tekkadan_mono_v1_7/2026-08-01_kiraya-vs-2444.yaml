study_notes:
  - "Sconfitta per resa di Kiraya al t23, contro un mazzo Earth Federation/Londo Bell con accesso a 4 dispiegamenti separati di Nu Gundam (GD05-017)+Amuro Ray in tutta la partita (t13, t15/16, t21, t23) - lo stesso combo esilio+battaglia-gratuita gia' segnalato come la minaccia specifica piu' pericolosa del campione, qui con una ridondanza particolarmente alta (Kayra's Re-GZ/Re-GZ aggiungono ripetutamente nuove copie di Nu Gundam alla mano tramite le proprie abilita' Destroyed)."
  - "Revisione turno per turno rifatta da capo su richiesta esplicita di Kiraya dopo la sconfitta precedente (ENDEV) - nessun nuovo errore individuato. Anzi, il t13 mostra una giocata di valore non ovvia: bloccare Nu Gundam con Gundam Gusion Rebake (invece di lasciar morire il piu' debole Ryusei-Go non bloccato) sacrifica il corpo piu' grande ma salva Ryusei-Go, che al t14 chiude proprio quel Nu Gundam gia' indebolito - una sequenza di 2 turni che ha funzionato esattamente come pianificato."
  - "T16 e' un altro turno di eccellente valore: tripla attivazione di Gundam Barbatos Lupus nello stesso turno ripulisce interamente la board avversaria (Re-GZ + 2 colpi su Nu Gundam)."
  - "Il vero problema strutturale, confermato una terza volta in questa sessione (dopo ddd e ENDEV): contro un avversario che ha accesso a piu' copie ravvicinate di Nu Gundam+Amuro Ray, ogni investimento pesante di Kiraya (Gusion Rebake, Gusion Rebake Full City, Gundam Barbatos Lupus) rischia di essere annullato gratuitamente e senza possibilita' di blocco. Non e' un errore di gioco recuperabile con piu' attenzione - e' un matchup strutturalmente sfavorevole che meriterebbe di essere affrontato a livello di lista, non di esecuzione."
