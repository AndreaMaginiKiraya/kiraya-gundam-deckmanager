study_notes:
  - "Vittoria pulita (18 turni, 2/3 shield residue) contro un avversario con una serie di 5 vittorie consecutive, mazzo GQuuuuuuX/Clan (Sugai's Gelgoog, Red Gundam, GQuuuuuuX Omega Psycommu, Ortega's Rick Dom, Amate Yuzuriha, Shuji Ito, Zaku Four Snake Eyes, Nyaan)."
  - "T8: Airframe Seizure scarta Gundam Barbatos Lupus, e t12 un mill di Zeheart Galette ne perde un'altra copia - 2 copie su 4 mai arrivate in campo, la stessa categoria di scelta gia' segnalata piu' volte in questa sessione. Qui pero' non ha pesato: entrambe le copie perse sono finite nel trash ed e' proprio quel trash accumulato (insieme ad altri scarti/mill) ad aver alimentato le 3 attivazioni di Lupus al t14 e altre 2 al t16 - un promemoria utile: le copie di Lupus perse a scarto/mill non sono valore completamente sprecato come lo sarebbe una carta di rimozione, perche' ricompaiono come carburante per la copia che sopravvive."
  - "Nessun errore individuato: Lupus, una volta schierato, ha reso al massimo (5 attivazioni totali in due turni, eliminando Zaku Four Snake Eyes, entrambe le copie di Sugai's Gelgoog, GQuuuuuuX e Ortega's Rick Dom)."
