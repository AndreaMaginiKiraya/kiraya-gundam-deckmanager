study_notes:
  - "Vittoria schiacciante (17 turni, 3/5 shield residue) contro un mazzo SEED/Orb con DUE copie di Strike Freedom Gundam schierate (Berry) - terzo dato di questa sessione sul matchup piu' temuto del campione, vinto anche con doppia copia in campo."
  - "Prima vera attivazione confermata dell'abilita' firma di Gundam Gusion Rebake Full City in tutta la sessione: al t13, il ping da Deploy dell'altro Gusion Rebake su Gundam Barbatos 1st Form (danno da effetto a un'unita' Tekkadan propria) fa scattare la sua 'During Pair' e rende inattivo Strike Rouge (Ootori) - esattamente il funzionamento previsto quando le condizioni si allineano (unita' in campo, appaiata, e un ping su un'unita' Tekkadan propria nello stesso turno)."
  - "Nota di importazione corretta a mano: 'M1 Astray (Shrike)' non veniva trovato per una virgola/parentesi diversa dal nome stampato ('M1 Astray Shrike') - risolto in GD05-015, il suo Deploy (danno a un nemico gia' rendere inattivo) spiega esattamente i due trigger osservati. 'Strike Rouge (Kira's Unit)' e 'Murasame (Andrew Waldfeld Unit)' sono il consueto vizio di visualizzazione di Mobile Suit Arena per le Unit Linked gia' documentato (Kira's Strike Rouge GD05-010, Waldfeld's Murasame GD05-003)."
  - "Nessun errore individuato; analisi non richiesta esplicitamente, controllo standard."
