study_notes:
  - turn: 7
    note: "Ryusei-Go's self-damage-into-draw-then-discard cycle fed straight into Darkness Finger killing the first Re-GZ, then Hyakuren traded up into the attacking Zaku Ⅱ — a clean two-for-one that undid ken24's early EX Base rush (t4) and first-Zaku aggression."
  - turn: 9
    note: "Isaribi's activation buff on Ryusei-Go let it trade evenly with Kayra's Re-GZ despite the AP gap, and the double Barbatos 1st Form + Adapt deploy pinged both Barbatos 1st Form and the attacking Zaku Ⅱ for free — good tempo, opponent still had no board answer."
  - turn: 12
    note: "Nu Gundam (GD05-017) paired with Amuro Ray is exactly the archetype the earlier meta review flagged (Nu Gundam+Amuro Ray, 25% WR sample): exiling 3 Londo Bell trash cards bought a free damage-only battle that killed Gundam Gusion Rebake, then a full attack killed Gundam Barbatos Adapt too — a two-for-one in a single turn that reset most of Kiraya's board. Correctly answered with Darkness Finger off the Breach 5 shield reveal, chipping Nu Gundam down instead of trying to race it."
  - turn: 13
    note: "Textbook Lupus recovery turn: two activations exiled 6 already-dead Tekkadan/Teiwaz units (including the very Gusion Rebake and Barbatos Adapt lost turn 12) to kill Guntank and soften Nu Gundam to 2 HP, then Graze Custom finished Nu Gundam in combat — the t12 losses were never fully wasted, they became the fuel for the t13 comeback, consistent with the 'Lupus trash-fuel' pattern seen in the Okay and shsia games."
  - turn: 15
    note: "Same pattern repeats: freshly-dead Hyakuren and a just-deployed-then-fed Shiden Custom (Ryusei-Go) exiled to power a third Lupus activation that killed ken24's second Amuro-paired Gundam outright, while Barbatos Adapt (now paired with Mikazuki Augus for an extra ping) and Lupus itself both hit shields. By t16 ken24 had only chip damage left (two Guntanks pinging Barbatos Adapt) and conceded with Kiraya still holding 2 shields to 1."
