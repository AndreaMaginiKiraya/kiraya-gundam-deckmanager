study_notes:
  - "Sconfitta di Kiraya (aggro_mono_p) in 24 turni contro un mazzo SEED Blu/Bianco di 0622 (Strike Freedom + Kira Yamato): partita vinta ai punti dal card advantage, non dal board."
  - "Avvio identico al copione del mazzo: doppio Exia t3, EX Base nemica giù al t5, pressione costante. Ma da lì in poi quasi tutto il danno di Kiraya è finito sulle Nahel Argama (3 copie, una via Burst dalle shield): ~13 danni assorbiti e 2 shield convertite in carte — la Isaribi avversaria, in meglio."
  - "Kira Yamato (ST04-010, AP-2 al difensore quando attacca) azzera il piano dei trade di ritorno: Exia Repair è morto due volte contro Aile Strike infliggendo 0 danni. Contro questo pilota i corpi AP2 non scambiano mai."
  - "Il motore di 0622: Overflowing Affection x3 e A Show of Resolve x2 (+10 carte a costo di 3 scarti), poi Strike Freedom che pesca a ogni attacco e Kira GD05-081 che pesca al link — circa 15 carte extra sulla partita. aggro_mono_p non ha nulla di equivalente: dal t10 di nuovo top-deck."
  - "La tecnologia che ha deciso la partita: il bounce di Strike Freedom (scarta 2 -> rimanda un'unità nel mazzo). Ha rimosso Adapt (t16), Hyakuren (t18), LUPUS (t18!), Ryusei (t22) e Shiden (t24) senza mai passare dal trash — contro Lupus il bounce è più forte della rimozione, perché non alimenta né il trash né gli esili."
  - "Lupus di nuovo ottimo finché è rimasto in gioco (3 attivazioni: Freedom a 2 HP, Fatum-00 distrutto, Nahel da 5) e stavolta i blocchi dei due Gusion (t16) gli hanno comprato due turni — l'esatto opposto della partita 1. Ma rimbalzato nel mazzo al t18 il piano B è sparito."
  - "Conteggio finale rivelatore: in 24 turni Kiraya ha colpito le shield vere di 0622 solo 3 volte (1 scartata + 2 in mano al Burst). La partita 1 si è vinta colpendo shield, questa si è persa colpendo basi."
  - "Takeaway per aggro_mono_p: contro mazzi difensivi con basi ripetute e bounce servono o più portata sulle shield (evasion/Breach) o un piano carte; e attenzione a esporre Lupus quando l'avversario può rimandarlo nel mazzo."
