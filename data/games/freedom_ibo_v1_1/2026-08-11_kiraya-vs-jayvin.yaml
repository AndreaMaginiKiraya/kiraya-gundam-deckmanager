study_notes:
  - turn: 15
    note: "Archetype ID: this is a Witch from Mercury (G-Witch) control shell — Gundam Calibarn, Michaelis, Gundam Aerial Rebuild, and the Quiet Zero base are all from that source title, backed by a heavy generic single-target removal suite (Improved Technique, Darkness Finger, Close Combat, Overwhelming Pressure — four different removal spells used across 15 turns) rather than a big-unit beatdown plan. Close cousin of the 'Rimozione diretta pesante' bucket already tracked (Vash, clairfryer) but with a distinct unit core, worth its own tag going forward. Kiraya never lost a single shield the whole game (6 remaining) despite losing 7 units to a genuinely relentless removal package — Gundam Barbatos Adapt survived at 1 HP for several turns and kept chipping away regardless, and the sheer density of cheap Kiraya bodies (2x Hyakuren, 3x Graze Custom, 2x Strike Rouge (Ootori)) simply outlasted JayVin's answers. JayVin conceded turn 15 with an empty board after Quiet Zero (the last base) died."
