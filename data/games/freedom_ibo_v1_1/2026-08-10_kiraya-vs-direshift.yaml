study_notes:
  - turn: 19
    note: "Direshift's best turn of the game: Overflowing Affection to refill, a Base-swap shield-to-hand loop (Reineforce Jr.), then a double V-Dash Gundam rush (each activation resting a blocker first) that killed Gundam Gusion Rebake and Strike Rouge (Ootori) with two separate Breach 3 hits, discarding Gundam Exia Repair and a second Gundam Gusion Rebake straight off Kiraya's shields. This is the low point of the game for Kiraya — 2 units and 2 shields gone in one turn with nothing back."
  - turn: 20
    note: "Correct, high-value answer to turn 19: Widespread Annihilation caught all three of Direshift's freshly-deployed low-level units (Parts, the just-played Victory Gundam, and Gundam Lfrith) for zero cost to Kiraya's own board. Textbook use of the card — exactly the 'plenty of low units to hit' case the deck wants it for, and it fully undid the damage from the previous turn in one swing."
  - turn: 22
    note: "Second Widespread Annihilation cast is the one soft spot worth flagging: at this point Direshift's board was just two Parts tokens (AP1/HP1, and per their own text can't even attack the player directly) plus a nearly-dead Silver Bullet that the wipe doesn't even reach (Lv.5, above the Lv.4 threshold). Spending a second 6-cost board wipe to kill two harmless tokens — at the cost of sacrificing Kiraya's own healthy M1 Astray Shrike, the only unit she had in play — is a low-value trade. Not the same 'no low units worth it' case as the discard scenario you described; here there were low units, they just weren't worth answering with this card. A cheaper removal or just holding it would likely have been better, though it did leave the board fully clear for Kiraya's turn 24 rebuild."
  - turn: 27
    note: "Direshift hits 'No more Shield cards to add to hand' here — their shield pile is fully spent (shields_tally confirms 0 remaining, all 3 observed shields converted to hand rather than lost to combat, via the Argama/Reineforce Jr. base-swap loop). From this point on Direshift is one unblocked hit from losing, six turns before the game actually ends on turn 33. That undercuts the 'won by the skin of the teeth' framing a little — the position was effectively decided by turn 27, even though it took until turn 33 for Kiraya to actually land the final blow through Direshift's board (Silver Bullet, V-Dash/Freedom Gundam rebuilds, and two separate Unforeseen Incident tricks kept buying turns)."
  - turn: 32
    note: "Second time this game (after turn 18) that an attack into a 1-HP Silver Bullet got blanked by Direshift's Unforeseen Incident — Gundam Gusion Rebake's damage is reduced to 0, Silver Bullet survives at 1 HP again, but Gusion Rebake still dies to the counter-attack. Both times Kiraya lost a unit for nothing to the same trick baited off a unit sitting at exactly 1 HP. Not really an avoidable misplay (attacking a 1-HP blocker is correct on the numbers unless you know the trick is coming), but worth flagging as a real pattern from this opponent: Direshift is willing to keep Silver Bullet parked at 1 HP as bait and has shown Unforeseen Incident twice to protect it."
  - turn: 33
    note: "Overall: not really 'won by the skin of the teeth' in the sense of a close final board state — Direshift was shieldless and one hit from dead by turn 27. The length (33 turns) came from board stalls and two separate defensive tricks (Unforeseen Incident x2) buying time, not from the game being genuinely in doubt late. The turn 20 Widespread Annihilation was the real turning point, cleanly answering Direshift's best turn; the turn 22 recast was the only real inefficiency of the game (see above) but didn't cost the win."
