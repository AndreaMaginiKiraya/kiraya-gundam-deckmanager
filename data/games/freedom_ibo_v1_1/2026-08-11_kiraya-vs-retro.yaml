study_notes:
  - turn: 7
    note: "Bad variance, not a misplay: Gundam Exia Repair's HP1 means retro's own Barbatos Adapt Deploy ping (1 damage, an opponent action) kills it outright, milling Strike Rouge (Ootori) and Hyakuren straight out of Kiraya's deck before either was ever drawable — the same structural risk flagged elsewhere this session for this card."
  - turn: 9
    note: "Genuinely strong, well-sequenced opponent turn: Gundam Flauros (Ryusei-Go) debuts paired with Mikazuki Augus (AP boosted to 7) and destroys Axis unopposed, then two more attacks land — but the real damage here is variance, not the attacks themselves: Gundam Barbatos Adapt and Strike Freedom Gundam (Kiraya's premier bomb, never even played this game) are both lost straight to shield reveals in the same turn. Blocking Gundam Barbatos Adapt (survivable, AP2) with Strike Rouge (Ootori) rather than the unsurvivable Flauros (AP7) was the correct call given only one Blocker was available for three attacks."
  - turn: 11
    note: "More of the same pattern: retro's second Gundam Gusion Rebake pings Strike Rouge (Ootori) (already chipped) dead for free, and two more unblocked attacks put two separate Hyakuren copies onto the shield-discard pile. Five real cards lost to shield reveals across the game by this point (Gundam Barbatos Adapt, Strike Freedom Gundam, 2x Hyakuren, and later a Gundam Barbatos Lupus copy at turn 13) — a genuinely unlucky spread, and the single biggest factor in this loss."
  - turn: 12
    note: "Kiraya's best turn of the game: Gundam Barbatos Lupus's Link-ping kills the already-wounded Gundam Flauros (Ryusei-Go) outright, its Activate-Main ability kills Graze Custom for free, and the follow-up attack kills Gundam Barbatos Adapt — a clean 3-for-0 with Lupus surviving at 3 HP. Excellent recovery, but it came after the EX Base, Axis, and five cards already lost to shields/mill — too large a deficit to fully close in one turn."
  - turn: 13
    note: "Closing turn: with both of Kiraya's Blocker-capable units (Strike Rouge (Ootori), Gundam Gusion Rebake) already dead, a freshly-deployed and Linked retro Gundam Barbatos Lupus attacks completely unopposed for the final blow. Overall read: no clear tactical misplay found under review — the turn-9 blocking decision was correct, turn 10's quiet turn had no real attackers worth committing (M1 Astray Shrike's AP1 wasn't going to change anything), and turn 12 was genuinely excellent. This loss traces to a real run of bad luck (Exia Repair's ping-death mill plus five separate cards lost to shield reveals, including the one Strike Freedom Gundam copy that never got played) compounding a mirror matchup where retro's early curve (turns 7-11) simply generated more value than Kiraya's did in the same window."
