study_notes:
  - turn: 6
    note: "Bad variance, not a misplay: Gundam Exia Repair's own Deploy ping (an opponent ability, 1 damage) is enough to kill it outright (HP1), triggering its mill-on-death twice within the same turn (once from the ping, once from a combat trade) — the two mills together cost Kiraya a live copy of Widespread Annihilation and a Mikazuki Augus straight out of the deck before either was ever drawable. Known structural risk of running Gundam Exia Repair, not a sequencing error."
  - turn: 12
    note: "Confirmed instance of the High-Maneuver block-bypass family already documented for aggro_tekkadan_mono: Bewb's Hyakuren, paired with Lafter Frankland, attacks with 'Can't block High-maneuver' and destroys Axis unopposed. Same turn, a double Gundam Barbatos Lupus activation clears both of Kiraya's Gundam Gusion Rebake copies — the single worst turn of the game for Kiraya, three units and a base lost in one turn with no available response."
  - turn: 15
    note: "Strong recovery turn: Strike Freedom Gundam's Attack ability bounces Bewb's paired Gundam Barbatos Lupus + Mikazuki Augus entirely off the board, and the follow-up Gundam Barbatos Lupus attack kills the newly-played Isaribi base — removing Bewb's engine piece and denying the fresh base in one turn."
  - turn: 16
    note: "Turn 15's gains are fully erased: Bewb's own Barbatos Lupus (redeployed) trades symmetrically with Kiraya's, and a second Strike Freedom Gundam bounces Kiraya's paired Strike Freedom Gundam + Kira Yamato right back to deck — the same tempo swing Kiraya had just used against Bewb, this time in reverse. Both sides are running the identical toolkit, so these swings cancel out rather than compounding an advantage."
  - turn: 26
    note: "Closing turn: a Mikazuki Augus Link ping kills Kiraya's last blocker (Strike Rouge (Ootori), already at 1 HP) before combat even starts, then multiple unblocked attackers close it out. No single clear misplay found under review — the recurring theme is that Bewb cycled through at least 3 separate Gundam Barbatos Lupus deployments and 3 Strike Freedom Gundam deployments across the game (turns 12/14/22 and 15/16/24), while Kiraya's own copies of the same two cards only produced one Lupus activation (turn 13) and one Strike Freedom Gundam line (turns 15-16) before being traded away. In a genuine mirror sharing the same core engine, that draw asymmetry on the shared pieces — not a specific misplay — is the more likely deciding factor, on top of the early Exia Repair mill costing a Widespread Annihilation copy for the whole game."
