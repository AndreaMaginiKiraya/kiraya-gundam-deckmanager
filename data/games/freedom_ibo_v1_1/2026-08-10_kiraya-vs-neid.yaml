study_notes:
  - turn: 20
    note: "Turns 19-23 turn into a genuine Strike Freedom Gundam mirror war — both sides repeatedly deploy, pair Kira Yamato, bounce the other's paired Unit+Pilot off the board with the Attack ability, and trade combat damage. Turn 20 alone sees three separate Strike Freedom Gundam-involved battles (V-Dash Gundam, Parts, Gundam Lfrith all die to it, and it survives at 2 HP). Turn 23 finally ends the mirror with both players' Strike Freedom Gundams destroying each other simultaneously — a fair, symmetric resolution to a long attrition war neither side could clearly win outright."
  - turn: 27
    note: "Widespread Annihilation closes it out cleanly — Victory Gundam, Parts, and Kiraya's own Gundam Barbatos Adapt caught in the symmetric wipe, a solid trade given the board state (only her own cheap Adapt was at risk). Gundam Barbatos Lupus then finishes Argama the same turn, setting up the win two turns later. 'Vittoria all'ultimo' fits the shape of this one — 29 turns, a real mirror-match grind in the middle, but the ending (turns 27-29) reads as a clean, correctly-sequenced closeout rather than a nail-biter. Nothing to critique."
