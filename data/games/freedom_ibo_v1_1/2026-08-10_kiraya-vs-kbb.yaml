study_notes:
  - turn: 12
    note: "Widespread Annihilation lands well here, catching both of KBB's live units (Gundam Kyrios and Gundam Exia) for zero cost — a clean 2-for-0 at a point where the Celestial Being toolbox deck's damage-prevention shenanigans (Gundam Kyrios shrugging off counter-damage on turns 7 and 9) had been frustrating to answer through combat."
  - turn: 22
    note: "By this point both of Kiraya's key threats are critically low — Strike Freedom Gundam at 1 HP, Gundam Barbatos Lupus at 2 HP — after a long grind trading through KBB's repeated Gundam Kyrios/Kyrios (Trans-Am) redeploys (this opponent's toolbox kept bouncing and reusing the same handful of units via 'returned to deck' effects, functionally recurring threats). 'Vinta per un soffio' fits: neither of Kiraya's units could have survived one more hit."
  - turn: 24
    note: "The attrition comeback is real and matches the framing: turn 23 KBB has literally nothing to play (blank turn), and turn 24 Kiraya's wounded board (M1 Astray Shrike, Barbatos Lupus at 2 HP, Strike Freedom Gundam at 1 HP) gets three unanswered attacks through — KBB simply ran out of resources to keep the toolbox running. The win came from KBB running dry, not from Kiraya's units getting healthier or safer; both were still one hit from dying the whole way to the finish."
