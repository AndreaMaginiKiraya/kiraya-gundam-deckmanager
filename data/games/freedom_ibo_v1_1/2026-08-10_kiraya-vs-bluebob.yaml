study_notes:
  - turn: 11
    note: "bluebob's Giant Killing picked off both of Kiraya's Blocker pieces on separate turns (Strike Rouge at t7, Gundam Gusion Rebake here) — a real weakness of this build: with no protection or redundancy against single-target removal, the extra Blocker count from the v1_1 swap doesn't help if they're answered one at a time before they matter."
  - turn: 13
    note: "Sazabi's [Attack] forces a real cost on both sides: bluebob sacrifices Quess's Jagd Doga, then Kiraya is forced to choose and destroy one of her own non-battling units (Barbatos Adapt) — combined with Char Aznable's High-Maneuver making it unblockable anyway, this is a genuinely strong removal tool to play around, not just a big attacker."
  - turn: 14
    note: "Strike Freedom Gundam's debut trade: kills Sazabi outright (7 damage) but comes back to only 2 HP itself — a fair trade given Sazabi's cost, and the Deploy+Link card draws (2 cards total) make it worth it even though the unit itself doesn't survive long."
  - turn: 16
    note: "Widespread Annihilation nets a 3-for-0 (Quess's Jagd Doga, Zaku Ⅱ, Char's Zaku Ⅱ) with nothing of Kiraya's own on board to lose — the ideal case for this card, cast when your own board is already empty rather than trading it away."
  - turn: 18
