study_notes:
  - turn: 14
    note: "Clean, one-sided win — Belele never got out of single digits on shields (4 lost, 0 remaining at the end) while Kiraya never lost one at all. Interesting mirror-ish matchup: Belele's deck runs a large chunk of the same Tekkadan card pool (Barbatos 1st Form, Barbatos Adapt, Gundam Gusion Rebake, Widespread Annihilation), so this played more like an aggro race than a real answer-check — Kiraya's early Graze Custom/Barbatos 1st Form pressure (EX Base dead turn 6, Axis dead turn 8) never let up, and Belele's own Widespread Annihilation got discarded off a shield reveal turn 12 before it could ever answer anything. Strike Freedom Gundam closed it turn 14 with a shield hit followed by an unblocked lethal swing. Nothing to critique here."
