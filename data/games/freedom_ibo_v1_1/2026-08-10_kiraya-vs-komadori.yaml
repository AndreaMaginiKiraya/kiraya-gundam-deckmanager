study_notes:
  - turn: 14
    note: "Strong turn on the surface — Flauros trades into Waldfeld's Murasame (finally removing the repeating-heal problem unit), and Strike Freedom's bounce+attack combo clears both Akatsuki (Oowashi) copies in one sequence. But Widespread Annihilation was discarded as the bounce ability's cost here — the same pattern flagged in the Marcos sim loss. Can't say for certain it was wrong without knowing the rest of the hand, but it's the second game running where this deck's own reset button never got cast for its actual effect."
  - turn: 15
    note: "Komadori's own Strike Freedom Gundam (a real mirror on this card) bounces Kiraya's just-deployed Strike Freedom+Kira Yamato pair to the bottom of the deck — pure tempo loss, nothing Kiraya could play around. This symmetric bounce tool landing on whichever side's newest big threat is on the field is more a matter of sequencing luck than a misplay by either player."
  - turn: 17
    note: "Same thing happens again in reverse: Komadori's Strike Freedom bounces Gundam Barbatos Lupus (paired Mikazuki Augus) to deck bottom — though by this point it was Kiraya's only unit in play (Exia Repair had just been bounced back to hand by Aile Strike Gundam's ability), so it was the only legal 'lowest Lv' target, not really a targeted punish. The second copy of Widespread Annihilation is lost the same turn to a shield-reveal discard — meaning across the whole game, this deck's designated answer to a wide board never got cast even once."
  - turn: 19
    note: "Final loss margin was genuinely tight — both players were down to their last shield going into this turn. Reviewing the full log, there's no single clear misplay driving the loss: it reads more as two symmetric Strike Freedom bounces (t15, t17) landing on Kiraya's biggest investments each time, compounded by Widespread Annihilation never once resolving as an actual board wipe. Worth being more deliberate next time about what to discard for Strike Freedom's ability when Widespread Annihilation is in hand — but 'unlucky' is a fair read of this one, not 'misplayed.'"
