study_notes:
  - turn: 7
    note: "Bad variance: Gundam Exia Repair's Destroyed mill hits both Strike Rouge (Ootori) and, worse, an entire Strike Freedom Gundam copy — a real loss with no recycle engine (this deck has no Lupus-style trash recursion for non-Tekkadan cards) to get it back."
  - turn: 9
    note: "Waldfeld's Murasame becomes the recurring problem unit: Andrew Waldfeld's [During Link] grants it Repair every end of turn, so partial damage from Gusion Rebake/M1 Astray Shrike pings just gets healed back — it takes a dedicated Lupus double-activation (t16) to finally remove it for good."
  - turn: 15
    note: "First real look at the Strike Freedom mirror on both sides of this matchup too — Rei03's copy (paired-choosing Waldfeld's Murasame and Akatsuki) trades a card-advantage turn for killing Akatsuki, the same 'choose 1-2 units, draw on kill' pattern Kiraya's own copies use."
  - turn: 16
    note: "Big turn: Lupus finally kills Waldfeld's Murasame (2 activations, already-dead trash), then Barbatos Adapt+Mikazuki chip in — but Rei03's Murasame still nets a card off its own Destroyed trigger even in death, so the removal isn't fully free."
  - turn: 20
    note: "Widespread Annihilation closes it out again — fourth time this session it's delivered a lopsided trade (M1 Astray Shrike, Kira's Strike Rouge, Rick Dias for Kiraya's own single Graze Custom), backed by A Show of Resolve refilling the hand the same turn. A long, genuinely even 20-turn grind decided by having the better reset button at the right moment."
