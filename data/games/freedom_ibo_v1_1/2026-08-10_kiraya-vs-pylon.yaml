study_notes:
  - turn: 9
    note: "This is the real turning point, and it's pylon's turn, not a Kiraya misplay: Re-GZ, Kayra's Re-GZ, and Jegan all attack in sequence, then Gundam NT-1 (paired with Amuro Ray) deploys and immediately pings the already-chipped Strike Rouge (Ootori) dead before swinging into Gundam Gusion Rebake, and Guntank finishes off the low Graze Custom — pylon's whole board acted in a well-sequenced chain that cost Kiraya her EX Base, Strike Rouge (Ootori), Gundam Gusion Rebake, and a Graze Custom, for the loss of only Kayra's Re-GZ, Jegan, and Guntank on their side. Nothing here was avoidable from Kiraya's side (no blockers to assign, per the note below) — it's just a genuinely strong turn from the opponent."
  - turn: 14
    note: "Widespread Annihilation landed at maximum value — 5 units in one cast (Kayra's Re-GZ, 3x Re-GZ, Zaku Ⅱ) — the best possible use of the card. Its full value was blunted by Re-GZ's own Destroyed trigger, which tutors a specific card to hand each time it dies (a Jegan, a Kayra's Re-GZ, and a Nu Gundam were all recovered this way) — pylon's Re-GZ package has real built-in resilience against board wipes that's worth remembering for future games against this archetype."
  - turn: 16
    note: "Structural point, not really a piloting error: freedom_ibo_v1_1 has zero Blocker-capable units in the whole 50 (true across every game reviewed so far, not just this one) — 'No blockers available' appears on literally every enemy attack all game regardless of what's on board. That means once Kiraya fell behind on the shield race after turn 9, there was no way to slow pylon down defensively; the only lever was racing back faster. Turn 16's five-card hand dump (Hyakuren + 2x Gundam Exia Repair + Graze Custom + M1 Astray Shrike, no attacks) wasn't avoidable given the board was empty after turn 15's forced trade — but it did commit the whole hand to summoning-sick bodies that could neither attack nor block that turn, banking everything on getting to turn 18 for the payoff. pylon's turn 17 alpha strike (Zaku Ⅱ, Jegan, Kayra's Re-GZ, and a freshly-paired Gundam, none of it blockable by design) closed it out first."
  - turn: 17
    note: "Overall read: this doesn't look like 'mismanaged pressure' from Kiraya so much as a genuinely tough matchup — a deck with no Blockers at all falling behind early against a value/recursion-heavy toolbox opponent (Re-GZ's death-tutor engine, Gundam NT-1/Nu Gundam both paired with a real Amuro Ray combat/heal engine) is going to lose the race unless it can out-tempo them from the start, and turn 9 already put Kiraya on the back foot. Bad shield luck compounded it — Gundam Barbatos 1st Form, Gundam Flauros (Ryusei-Go), Gundam Gusion Rebake, and Strike Rouge (Ootori) were all lost to shield reveals rather than played. Worth taking the self-critique seriously as a prompt to look at this matchup rather than as evidence of a specific turn misplayed — no single turn stands out as a clear error under review."
