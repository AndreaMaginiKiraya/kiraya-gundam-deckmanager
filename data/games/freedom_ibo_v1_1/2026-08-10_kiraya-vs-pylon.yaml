study_notes:
  - turn: 9
    note: "CORRECTED (see turns 16/17 below for the full correction): freedom_ibo_v1_1 does have Blocker-capable units — Gundam Gusion Rebake (GD02-055, x4) and Strike Rouge (Ootori) (GD05-005, x3), both <Blocker>. Both of Kiraya's in-play copies were used exactly right this turn: Strike Rouge (Ootori) blocked Kayra's Re-GZ and killed it while surviving at 1 HP, and Gundam Gusion Rebake blocked Jegan and killed it while surviving at 2 HP — real value, not a blocker-less scramble. They were then finished off the same turn by Gundam NT-1 (paired with Amuro Ray): its Deploy ping killed the weakened Strike Rouge (Ootori) outright, then its attack killed the weakened Gundam Gusion Rebake. That's pylon simply having more total reach in one turn than two blockers could soak, not a deck-design gap. Re-GZ also hit the EX Base unblocked and Guntank finished off a low Graze Custom — a genuinely strong, well-sequenced turn from the opponent overall, not a Kiraya misplay."
  - turn: 14
    note: "Widespread Annihilation landed at maximum value — 5 units in one cast (Kayra's Re-GZ, 3x Re-GZ, Zaku Ⅱ) — the best possible use of the card. Its full value was blunted by Re-GZ's own Destroyed trigger, which tutors a specific card to hand each time it dies (a Jegan, a Kayra's Re-GZ, and a Nu Gundam were all recovered this way) — pylon's Re-GZ package has real built-in resilience against board wipes that's worth remembering for future games against this archetype."
  - turn: 16
    note: "CORRECTION to an earlier version of this note: I previously wrote that freedom_ibo_v1_1 has zero Blocker-capable units in the whole deck — that was flat wrong, and my own game logs already contradicted it (Gundam Gusion Rebake and Strike Rouge (Ootori) block repeatedly across the vs-Direshift, vs-clairfryer, vs-chong, and this game's own turn 9). The deck runs 7 Blocker bodies (4x Gundam Gusion Rebake, 3x Strike Rouge (Ootori)). What's actually true for turn 16: both of Kiraya's in-play blocker copies had already died on turn 9 (see above), and none of what she deployed this turn (Hyakuren, 2x Gundam Exia Repair, Graze Custom, M1 Astray Shrike) is a Blocker. Whether she was holding another Gusion Rebake/Strike Rouge (Ootori) copy in hand and chose not to play it, or simply hadn't drawn one, isn't visible from the log — hand contents aren't recorded, only what's played. So no claim either way on whether turn 16 missed a defensive option; only that the board she had in play at that point genuinely had nothing that could block."
  - turn: 17
