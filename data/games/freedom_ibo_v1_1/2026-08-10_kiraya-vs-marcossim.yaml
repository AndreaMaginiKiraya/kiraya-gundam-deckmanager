study_notes:
  - turn: 14
    note: "Strike Freedom Gundam's [During Pair][Attack] bounce cost Widespread Annihilation and a Kira Yamato as discard fuel — meaning the deck's own board-wipe answer was spent as an activation cost rather than ever being cast for its actual effect. Worth weighing whether that discard choice (vs. discarding something else) mattered, though the alternative options in hand aren't visible from the log."
  - turn: 15
    note: "Destiny Gundam (GD04-050) is unblockable outright (<High-Maneuver> baked into its text, not conditional) and its own [During Pair][Attack] pays a trashed Minerva Squad Unit's cost to redeploy it — meaning Marcos sim can keep recurring threats from trash indefinitely as long as resources allow. This is the structural problem more than any single misplay: t23, t25, and t27 all show Destiny Gundam attacking unblockably and re-fetching another unit from trash on the same swing."
  - turn: 21
    note: "Widespread Annihilation from Marcos sim's side wipes Hyakuren, Graze Custom, and M1 Astray Shrike in one turn, right after Destiny Gundam traded down Gundam Barbatos Lupus — Kiraya's board goes from 3 units to 0 in a single turn."
  - turn: 22
    note: "Turns 22 and 24 both show zero actions from Kiraya (straight to Turn end phase) — this is the concrete evidence for the user's own read: no playable unit in hand those turns. But it's worth noting Destiny Gundam is unblockable regardless, so even a normal hand of ground units couldn't have stopped its direct shield hits (t23, t25, t27) — the real gap is the deck's near-total lack of ranged/removal answers to an unblockable, self-recurring threat once Widespread Annihilation was already spent as ability fuel at t14."
  - turn: 27
    note: "Closing sequence: Destiny Gundam pays 2 resources to redeploy Sword Impulse Gundam from trash, which immediately destroys Kiraya's last unit (M1 Astray Shrike) on a Deploy-from-trash trigger, then Destiny Gundam itself swings unblocked for the last shield. A genuinely unlucky stretch of draws (0 actions on 2 of the last 6 turns) combined with a real, hard-to-answer engine (unblockable + trash recursion) rather than a clear sequence of misplays — the user's 'bad luck' read holds up, with the caveat that this matchup shape (Destiny Gundam) is a tough one for this decklist's removal suite specifically."
