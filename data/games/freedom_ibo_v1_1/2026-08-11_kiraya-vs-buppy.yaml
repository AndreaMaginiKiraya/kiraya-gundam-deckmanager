study_notes:
  - turn: 6
    note: "Pure bad variance, not a decision: both copies of Strike Rouge (Ootori) — one of the deck's two Blocker-capable card types — are lost straight off shield reveals this turn (both attacks from Zaku Ⅱ and Kayra's Re-GZ). Combined with Gundam Gusion Rebake's later losses (turns 10, 12), this leaves Kiraya with zero Blockers for the entire second half of the game."
  - turn: 12
    note: "New instance of a known problem family (already documented in aggro_tekkadan_mono_v1_1/ANALISI.md as 'blocker disinnescato prima di scegliere'): Amuro Ray (ST01-010)'s own 【When Paired】ability rests Gundam Gusion Rebake the moment it pairs with 'Gundam', before any attack is even declared — taking Kiraya's last Blocker off the table pre-emptively rather than out-fighting it in combat. Nu Gundam then kills the rested Gusion Rebake directly. Not avoidable from Kiraya's side; it's a proactive removal tool, not a sequencing choice."
  - turn: 13
    note: "Strong recovery turn: Gundam Barbatos Lupus's exile-ping (fueled by Barbatos Adapt + both dead Gusion Rebakes) kills Nu Gundam outright, and the follow-up attack trades Lupus for buppy's 'Gundam' — removing 2 of buppy's 3 remaining threats in one turn, even though it costs Kiraya both new deploys."
  - turn: 15
    note: "Best turn of the game for Kiraya: the second Gundam Barbatos Lupus copy (fueled partly by exiling the FIRST Lupus copy from trash) plus a Mikazuki Augus Link ping kill Kayra's Re-GZ outright, then the Lupus attack kills Rick Dom too — 2-for-0, Lupus survives at 2 HP. By this point buppy is down to Nu Gundam + 2x Jegan."
  - turn: 16
    note: "The loss comes down to the same structural pattern seen in the daedaedaes and Neid reviews: with both Blocker card types (Strike Rouge Ootori, Gundam Gusion Rebake) dead since turn 12 and Gundam Barbatos Lupus itself not a Blocker, three separate attackers (Nu Gundam, Jegan, Jegan) land completely unopposed in one turn to close it out. No single misplay found under review — the two Strike Rouge (Ootori) losses (turn 6) were pure shield variance, and every Gusion Rebake loss came from either a forced defensive trade or a proactive removal/rest effect from buppy's Amuro Ray package, not a sequencing choice available to Kiraya."
