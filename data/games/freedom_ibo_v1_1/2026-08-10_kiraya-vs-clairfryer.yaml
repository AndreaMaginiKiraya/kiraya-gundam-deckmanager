study_notes:
  - turn: 19
    note: "This is a genuinely tight, back-and-forth game (unlike the vs-Direshift one) — clairfryer's burn/removal suite (Improved Technique, Close Combat, Darkness Finger) picked off Kiraya's cheap units one-for-one through turns 5-12 before she could stabilize, and an unanswered Strike Rouge (Ootori) chipped Axis down and then out by turn 15. Turn 19 is clairfryer's first big value swing: two A Show of Resolves plus Airframe Seizure chain into a Kira Yamato Link and a Strike Freedom Gundam attack that bounces Graze Custom and kills Strike Rouge (Ootori) in the trade — a real low point for Kiraya."
  - turn: 20
    note: "Immediate answer: Gundam Barbatos Lupus's exile-engine (feeding it dead units from earlier turns for repeatable 2-damage pings) plus a Kira Yamato Link on Strike Rouge (Ootori) clear both of clairfryer's Strike Freedom Gundam and their blocking Strike Rouge for the loss of nothing but HP on Lupus. This exile-for-value/big-attacker pattern from Barbatos Lupus is the recurring engine that keeps pulling Kiraya back into games she's behind in — same thing happens again turns 22 and 26."
  - turn: 21
    note: "clairfryer answers right back just as hard: Unicorn Gundam 02 Banshee (Destroy Mode) plus Marida Cruz Link, backed by Airframe Seizure and Improved Technique, kills Hyakuren, kills a Barbatos Lupus with zero damage taken (Unicorn's own damage-prevention trigger), and finishes Axis base — a clean 3-for-0 turn. Turn 25 is another big clairfryer swing (double Strike Freedom Gundam pairing, double Unicorn attack with Marida Cruz pings, multiple 'Strike Freedom Gundam: Draw a card' triggers) that kills Graze Custom and burns two shields. This opponent's deck clearly has a real card-advantage/removal engine and punished every window Kiraya gave it."
  - turn: 28
    note: "Both Widespread Annihilation casts this game (turns 28 and 30) landed as clean 2-for-0s against real threats (paired Zoloats, then Strike Rouge + Zoloat) — a much better use of the card than the questionable turn-22 cast in the vs-Direshift game, since here there were always at least 2 meaningful bodies to hit rather than harmless leftover tokens."
  - turn: 42
    note: "The win itself is a shield-deck exhaustion ('No more shields available, game is over!'), not a direct kill through remaining shields — a legitimate but different win condition worth noting. clairfryer's shield-refill engine (repeatedly replacing Mining Asteroid Palau to draw shields to hand) got permanently shut off once Kiraya destroyed that base on turn 36, after which every attack was pure attrition on a shield pool that could no longer refill. 'Vittoria all'ultimo' is an accurate read of this one: real swings both directions through turn 25, and the outcome wasn't secure until clairfryer's shield pile physically ran dry 17 turns later."
