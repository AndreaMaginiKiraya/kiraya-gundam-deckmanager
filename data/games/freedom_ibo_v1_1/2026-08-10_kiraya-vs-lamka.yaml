study_notes:
  - turn: 6
    note: "Rough start: double Darkness Finger 2-for-1's Graze Custom and Gundam Exia Repair before either did much — Lamka is running the full MF (Master Gundam/Shining Gundam/Domon Kasshu/Master Asia) shell discussed earlier this session, the same archetype that sat at 37.5% win rate with the old aggro_tekkadan_mono decks."
  - turn: 12
    note: "Master Gundam + Graviton Hammer (played as pilot Argo Gulskii) pings for 2 twice in one sequence, killing both Gundam Gusion Rebake and Gundam Barbatos 1st Form — efficient removal that echoes the Sheldon loss's recurring-Darkness-Finger problem, just via a different tool this time."
