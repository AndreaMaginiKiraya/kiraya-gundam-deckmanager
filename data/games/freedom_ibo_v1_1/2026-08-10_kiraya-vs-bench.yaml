study_notes:
  - turn: 12
    note: "Turn 12 is the real momentum swing: Widespread Annihilation caught four of Bench's units at once (Strike Rouge (Ootori), Kira's Strike Rouge, M1 Astray Shrike, Gundam Barbatos Adapt — wait, the last one is Kiraya's own, so really a 3-for-0 against Bench plus one of her own low units caught in the symmetric wipe), right after Archangel had already been chipped down; Gundam Gusion Rebake finished the base off the same turn. From there Bench never really got back into it — Strike Freedom Gundam mirror trades (turns 14-15) both went in Kiraya's favor or even, and the concession came turn 16 with both players' Strike Freedom Gundams sitting at 1 HP. Clean win, nothing to critique."
