study_notes:
  - turn: 11
    note: "Genuinely brutal shield-reveal variance starts here and runs through turn 13: Gundam Barbatos Lupus, Graze Custom, Gundam Flauros (Ryusei-Go), Gundam Barbatos Adapt, and Hyakuren are all lost straight off shield reveals across these three turns — five real cards discarded with zero input from Kiraya, none of it a piloting decision. Worth keeping in mind when judging how far behind the following turns actually put her."
  - turn: 14
    note: "This looks like the turn the self-critique is aimed at, and under review it's actually the strongest turn of the game for Kiraya, not a misplay: Gundam Barbatos Lupus banks two free Activate-Main pings (fueled by the very cards lost to shields the turns before — nice recovery of 'dead' resources) to soften a Buster Gundam, Strike Freedom Gundam's Attack ability bounces daedaedaes's whole Strike Rouge (Kira's Unit) + Kira Yamato pairing back to deck AND still gets to attack, killing Akatsuki (Oowashi) — a 6-cost bomb — in the same action. Two enemy threats removed, one bounced entirely off the board, all in one turn. The one genuinely questionable piece: Gundam Barbatos Lupus then attacks into the weakened Buster Gundam and dies to the counter-hit. Lupus had already banked its ability value for the turn, and Buster Gundam at 1 HP wasn't an active threat — with no other attacker free to finish it, not swinging Lupus in would have kept her best recurring engine piece alive at the cost of leaving a nearly-dead 3-cost unit on board one more turn. That trade-off is arguable rather than clearly wrong, but it's the closest thing to a real decision point in this game."
  - turn: 17
    note: "The actual losing blow is a *second* Akatsuki (Oowashi) (a repeat 6-cost bomb) landing completely unblocked, because by this point Kiraya had no Blocker-capable unit left in play — Strike Rouge (Ootori) and Gundam Gusion Rebake (her only two Blockers this game) both died back on turns 8 and 11/14 and neither was redrawn. Combined with daedaedaes's Murasame/Strike Rouge (Kira's Unit)/Akatsuki package generating repeated card draw and two separate 6-cost finishers, this reads much more like 'ran into a strong, resilient opponent list while also getting unlucky on shields' than 'misplayed the combos' — the turn-14 combo turn was genuinely good play, not the problem."
