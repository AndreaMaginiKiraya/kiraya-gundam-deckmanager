study_notes:
  - turn: 10
    note: "Genuinely strong, well-sequenced opponent turn, not a Kiraya misplay: Haow Gundam deploys, pairs Master Asia (which rests Rising Gundam and pings Strike Rouge (Ootori) + Hyakuren for 2 each — on top of an earlier Darkness Finger hit, this likely finishes Strike Rouge (Ootori) via an unlogged multi-target ping kill), then its own Attack trigger from Master Asia pings Hyakuren dead outright before the actual attack even lands unblocked on Axis. Three separate kills plus a base destroyed from one unit's turn."
  - turn: 12
    note: "Shining Gundam (GD05-066) deploys for the first time and establishes the game's real engine: its Deploy ability exiles 2 trashed MF Unit cards to return Darkness Finger to hand. This repeats again turns 14 and 18 — three total returns of the same 1-cost, 2-damage, conditional-draw removal spell across the game. This recursive removal engine, not any single turn, is the main structural reason this matchup is hard."
  - turn: 15
    note: "The clearest concrete link to turn 16's disaster: Gundam Barbatos Lupus declares against Rising Gundam (which has no Blocker — this was a discretionary target choice, not a forced block) and survives the trade at only 1 HP instead of its full 5. Attacking the player instead would have kept Lupus at full HP, which matters directly next turn."
  - turn: 16
    note: "The turn that decided the game: Master Gundam deploys, and two separate Darkness Fingers (both drawing a card off Master Gundam's presence) kill the 1-HP Gundam Barbatos Lupus and a Graze Custom outright — a full-HP Lupus survives a single Darkness Finger (2 damage vs HP5), so turn 15's HP exposure is what made this exchange free for the opponent rather than a real trade. A third card (another Graze Custom) dies to Shining Gundam's attack with zero damage taken back (Shining Finger's prevention effect). Three units lost, nothing traded back, in one turn."
  - turn: 18
    note: "Bad variance compounds the structural problem: Widespread Annihilation — the one card that could answer a wide board — is lost to a shield reveal and never cast the entire game. Same turn, Shining Gundam recurs Darkness Finger a third time, killing another fresh Graze Custom."
  - turn: 19
    note: "Kiraya's best turn of the game gets somewhat buried by what came before: M1 Astray Shrike finishes the third Shining Gundam (denying the recursion engine for good), and two separate Gundam Barbatos Adapt attacks grind down and kill Master Gundam 2-for-2. Real recovery value, but too late relative to the resource deficit from turns 10 and 16."
  - turn: 20
    note: "Overall read: not a game of accumulating misplays — Kiraya answered most individual threats reasonably well (Shining Gundam killed twice, Haow Gundam and Master Gundam both traded down). The loss comes from a genuinely efficient opponent engine (Darkness Finger recurred 3 times via Shining Gundam, each also drawing a card), one concrete HP-exposure decision (turn 15) that turned a would-be-safe Gundam Barbatos Lupus into a free kill, and bad shield luck costing Widespread Annihilation for the whole game. The finishing blow (a fresh second Master Gundam landing completely unopposed) was simply a function of Kiraya's board being empty by then, not a defensive mistake in the moment."
