study_notes:
  - turn: 10
    note: "Same opponent engine as the vs-Yui523 loss: Shining Gundam (GD05-066) exiles 2 trashed MF Unit cards to return Darkness Finger to hand, then it's replayed immediately. This turn alone costs Kiraya 3 units (2x Graze Custom, M1 Astray Shrike) plus Axis destroyed by Rising Gundam — a genuinely rough turn."
  - turn: 11
    note: "Widespread Annihilation answers cleanly, 2-for-0 (Rising Gundam + Shining Gundam) — unlike the Yui523 game, this one lands on a real board rather than getting lost to a shield or spent as discard fuel."
  - turn: 12
    note: "The Darkness Finger recursion engine fires again (a second, then apparently a third Shining Gundam deploy this same turn), finishing off Gundam Flauros (Ryusei-Go) across two separate casts — this opponent's Shining Gundam package can clearly loop the same 1-cost removal spell multiple times per game when trash fuel is available."
  - turn: 13
    note: "Second Widespread Annihilation of the game, again a clean 2-for-0 (both Shining Gundam copies) — directly answering the recursion engine before it could generate more value. This is the key structural difference from the Yui523 loss: there, Widespread Annihilation was lost to a shield and never cast at all."
  - turn: 16
    note: "Gundam Exia Repair's mill-on-death costs a live Gundam Barbatos Lupus and Gundam Barbatos Adapt straight out of the deck (Darkness Finger, recursed a third time, is what killed it) — the same structural risk flagged elsewhere this session, here absorbed without changing the outcome since Kiraya still had an active Barbatos Lupus in play."
  - turn: 17
    note: "Closing turn: Gundam Barbatos Lupus's activation kills Master Asia for free, and the opponent concedes with Strike Freedom Gundam freshly deployed and no board of their own left. Second result this session against MF/G Gundam (now 2-1 for the archetype) — the difference from the loss reads mainly as Widespread Annihilation landing both times here instead of being lost to variance, plus Gundam Barbatos Lupus getting more turns of free value (activated 3 separate times across this game)."
