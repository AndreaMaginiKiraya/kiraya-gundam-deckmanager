study_notes:
  - turn: 11
    note: "First Strike Rouge block, good value: even though Kira Yamato (ST04-010) pre-emptively debuffed it before the Aile Strike Gundam attack that turn, Kiraya correctly held the block for the later Victory Gundam attack instead — Strike Rouge dies but leaves Victory Gundam at 2 HP, finished next turn by Graze Custom for a real 2-for-1 (Strike Rouge for Victory Gundam + tempo)."
  - turn: 12
    note: "The turn the user's own self-critique lands hardest: Gundam Barbatos Adapt attacks into Gundam Lfrith for pure chip damage (2 dealt, 2 taken, nothing dies) instead of pushing a shield — this trade accomplishes nothing and leaves Adapt at 1 HP, which is exactly what lets a 1-AP Parts token kill it for free next turn (t13). This is the 'lost time chasing opponent's units' the user flagged: a full attack spent on a non-lethal unit trade instead of shield pressure, in a game where Kiraya's shield count (below) shows she never got a single one through all game."
  - turn: 13
    note: "Second Strike Rouge block, bad value this time: Kira Yamato debuffs it again (AP-2) right before the block, so Strike Rouge dies dealing only 1 damage back to a 4-HP Aile Strike Gundam — a full card spent to barely dent an attacker that keeps coming back turn after turn. Once Kira Yamato's debuff-before-block pattern showed up once (t11), it was predictable that blocking Strike Rouge into a second Aile Strike Gundam attack would eat the same debuff again; the deck had no way to force through the trade cleaner (no removal in hand at that point), so this may not have been avoidable rather than a pure misplay."
  - turn: 15
    note: "Final tally: Kiraya lost every one of her own shields (0 remaining) while ZimZam never lost a single one (5 remaining at game end) — the game was never close on the shield race once t9-11 let Aile Strike Gundam hit face unanswered turn after turn. On the EX Resource point the user raised: no explicit EX Resource action appears anywhere in this pasted log, so that specific misplay isn't visible here to review — worth pointing to the exact turn/screenshot if it should go in the record."
