  - "Deserved win, but with a genuine mid-game scare: Coco's turn-17 alpha strike (Zaku Ⅱ x3, Char's Zaku Ⅱ, Rick Dom) cost Kiraya three units in one turn (Gundam Gusion Rebake, Strike Rouge (Ootori), Gundam Barbatos Lupus) plus a shield. Gundam Barbatos Lupus fell to a fully-loaded Zeong (base AP4 + Char Aznable's flat +1 pairing modifier + its 【Attack】+1 trigger = 6 damage vs. 5 HP) — an exact 1-for-1 trade, not a misplay."
  - "Turn 14's Gundam Barbatos Lupus activation (exiling Graze Custom, Gundam Gusion Rebake and Gundam Barbatos Adapt from the trash for 2 damage) is what actually won the game: it picked off Coco's Gundam Barbatos 1st Form for free, denying Coco the same 'if damaged, draw a card' engine Kiraya was also running, and set up the tempo lead that carried into turn 16."
  - "Turn 16 was the peak of the game: Strike Freedom Gundam deployed choosing itself and Gundam Barbatos Lupus for its Deploy setup, paired immediately with Kira Yamato for a Link draw, then both units attacked — Lupus's kill on Falmel triggered the Deploy draw, and Strike Freedom's own unblocked attack drew a second card off the revealed shield. Three card-advantage events in one turn funded the turn-18 counterpunch."
  - "Turn 18 was the correct answer to turn 17's swing: Strike Freedom Gundam's paired 【Attack】 ability (discard 2, return 1 enemy Unit with the lowest Lv to the bottom of its owner's deck) stacked with its normal combat damage to remove two separate Char's Zaku Ⅱ copies in a single action — a genuine 2-for-1 that reset Coco's board right after the scariest turn of the game."
  - "The 20-turn length and the close final shield count (Kiraya 1 remaining vs. Coco 0) reflect how real turn 17's swing was — without the turn-14 Barbatos Lupus pick and the turn-16/18 Strike Freedom Gundam sequence, Coco's Zeon toolbox (Char's Zaku Ⅱ dig-on-Destroyed, Zaku Ⅱ's AP+2 self-buff) had the tools to keep grinding shields down. Nothing here reads as a misplay by Kiraya; the win came from sequencing removal (Lupus) ahead of the payoff turn (Strike Freedom Gundam), not from opponent mistakes."
