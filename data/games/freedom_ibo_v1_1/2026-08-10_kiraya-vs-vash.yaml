study_notes:
  - turn: 10
    note: "Bad variance again: Gundam Exia Repair's Destroyed mill hits both Mikazuki Augus and a whole Strike Freedom Gundam copy — the second game in a row this exact mill has cost a Strike Freedom copy with no way to get it back. Kshatriya+Marida Cruz's double-target ping is efficient removal to watch for early."
  - turn: 16
    note: "Vash also runs the Kira Yamato package (Kira's Strike Rouge, later Strike Freedom Gundam too) — a genuine mirror on that piece. Kira's Strike Rouge trades evenly into Barbatos Lupus and, two turns later, Barbatos Adapt (t18) — solid value for a 2-cost card, redeployed from hand each time."
  - turn: 22
    note: "Unicorn Gundam 02 Banshee (Destroy Mode) is the scariest thing Vash plays: killed Strike Freedom Gundam while taking 0 damage back, likely a first-strike-style priority effect tied to Marida Cruz's pairing. Worth remembering as a genuine threat to play around if seen again."
  - turn: 23
    note: "Lupus answers immediately: two activations kill Unicorn Banshee using already-dead trash — notably including a second Gundam Barbatos Lupus copy as fuel for the first one's own activation, a reminder that Lupus can burn its own duplicate copies as fuel just as well as any other Tekkadan/Teiwaz card."
  - turn: 26
    note: "A long 26-turn grind, the longest freedom_ibo_v1_1 game yet, decided by attrition rather than any single blowout turn — Kiraya's board simply had more staying power (Barbatos Lupus's recycling, repeated A Show of Resolve refills) than Vash's, who ran out of answers once Unicorn Banshee and both Kshatriya copies were spent."
