study_notes:
  - "Vittoria di Kiraya (aggro_mono_p) in 13 turni contro un Londo Bell Verde di Pelumu (Genoace, Re-GZ BWS, Nu Gundam — ENTRAMBE le stampe usate, Amuro Ray, Kayra Su, Ra Cailum), ma con una statistica che salta all'occhio: Kiraya ha perso 7 unità contro le sole 3 di Pelumu, e l'EX Base di Kiraya è caduta al t4 contro il t6 di Pelumu. La partita è stata vinta sulla velocità della corsa, non sul vantaggio materiale — un percorso più rischioso delle vittorie pulite (partite 8 e 9)."
  - "ERRORE #1 — turno 5 passato senza attaccare: Exia Repair e Graze Custom (entrambi schierati al t3, sani, attivi) non hanno attaccato affatto, nonostante il board di Pelumu fosse COMPLETAMENTE rested (Genoace e Re-GZ BWS avevano attaccato al t4 e non si sarebbero riattivati fino al t6 di Pelumu). Un turno intero di danno gratuito lasciato sul tavolo contro un avversario esposto — l'esatto contrario della disciplina 'attacca sempre quando puoi' che ha vinto le partite precedenti. Il primo vero attacco di Kiraya in tutta la partita arriva solo al t7, tardissimo per lo standard del mazzo (di solito t4-5)."
  - "ERRORE #2 — Exia Repair speso su un bersaglio non urgente (t9): ha attaccato direttamente Re-GZ BWS (rested dal proprio attacco del t8, quindi NON poteva colpire di nuovo prima del t10 di Pelumu — nessuna urgenza reale di rimuoverlo subito), lasciandolo comunque vivo a 1 HP e morendo lui stesso. Il ping obbligato di Gusion Rebake schierato subito dopo lo ha poi finito, ma se Exia avesse invece colpito lo shield del player, la pressione sulle shield sarebbe stata maggiore e il ping di Gusion avrebbe comunque danneggiato Re-GZ BWS per il turno successivo. Coerente con la lezione già emersa più volte nel campione: 'colpisci il player, non i corpi che non minacciano nulla subito' — qui non è stata applicata. Nota a favore: il self-mill di Exia ha comunque messo Lupus e 1st Form nel trash, tornati utili più avanti."
  - "Lettura corretta e ben eseguita al t11: Gusion Rebake (paired con Akihiro) ha attaccato direttamente Nu Gundam (rested, guarito a 4 HP dall'abilità di Amuro Ray il turno prima) per un trade esatto — rimuovendo la minaccia più pericolosa in campo (AP alto, Breach, autocura) al prezzo di un'unità che aveva già dato valore col proprio ping. Nello stesso turno Kiraya ha comunque trovato altri due attacchi alle shield: recupero di tempo reale dopo l'inizio lento."
  - "Curiosità di regole scoperta in questa partita: il When Paired di Nu Gundam LR (GD05-017) — 'esilia 3 carte (Londo Bell) dal trash, poi inizia una battaglia con l'unità nemica scelta saltando dichiarazione e blocco, solo passo del danno' — bypassa completamente la possibilità di bloccare. Contro questa carta specifica non c'è difesa reattiva: l'unico modo per non subirla è non lasciare unità dell'avversario abbastanza in trash da alimentarla, o rimuovere Nu Gundam prima che possa pairare."
  - "Il doppio Breach 5 di Nu Gundam LR nello stesso turno (t12, prima l'attacco-abilità istantaneo poi un secondo attacco normale) ha consumato la prima Isaribi e forzato il redeploy della seconda dalle shield, esaurendo lo stack fino a 'No more Shield cards to add to hand' — le basi hanno lavorato esattamente come devono (assorbire, non le shield vere), ma qui il prezzo è stato pagato interamente in un solo turno pesante."
  - "Bilancio del campione aggro_mono_p dopo 10 partite: 7 vittorie, 3 sconfitte."
