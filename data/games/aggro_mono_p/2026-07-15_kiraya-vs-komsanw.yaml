study_notes:
  - "Vittoria di Kiraya (aggro_mono_p) in 18 turni, punteggio finale stretto: 3 shield rimaste a Kiraya contro 1 a Komsanw. Primo avversario After War Gundam X del campione (Bianco/Viola: Garrod Ran & Tiffa Adill, Gundam Airmaster, Leopard Destroy, Gundam DX, Freeden/Freeden II come basi) — curiosamente un mirror match parziale, perché ANCHE Komsanw gioca Gundam Exia Repair (stessa carta, stesso self-mill), e infatti nel record le due copie distrutte di Exia Repair restano 'unattributed' perché il nome da solo non basta a distinguere il proprietario."
  - "Partita quasi perfettamente simmetrica nei trade: 6 unità perse per parte, EX Base di entrambi giù entro il t7. La vittoria è arrivata sulla velocità di chiusura (corsa alle shield), non su un vantaggio di carte — a differenza della sconfitta vs アスファルトの雑草 dove il differenziale di card advantage era enorme, qui i due mazzi si sono scambiati colpo su colpo."
  - "Sequenza da manuale al t9: il ping del Deploy di Gusion Rebake (1 danno, obbligato su un'unità propria+una nemica) ha colpito l'Airmaster nemico già a 3 HP, portandolo a 2; Graze Custom (appena schierato, AP2) lo ha poi finito esatto. Danno-parziale-poi-rifinitura con un corpo da 1 costo: esecuzione pulita, stesso principio del t15 della partita vs 4444."
  - "Combo Isaribi ben eseguita al t11: Activate su un Gusion Rebake già danneggiato (dal proprio ping del t9) lo porta ad AP5, sufficiente per il kill esatto su un Leopard Destroy rested da 5 HP (trade reciproco). L'HP 'danneggiato' richiesto dall'abilità di Isaribi non è un limite se il self-ping precedente lo ha già soddisfatto."
  - "La sequenza più sofisticata della partita, ai t12-13: contro un doppio minaccia (ping automatico di Leopard Destroy + il suo attacco), Kiraya ha bloccato con un Gusion Rebake sano invece di lasciar cadere Isaribi (che avrebbe assorbito il colpo intero senza intaccare Leopard Destroy). Il blocco ha ridotto Leopard Destroy a 1 HP; il turno dopo un NUOVO Gusion Rebake lo ha finito gratis col proprio ping da deploy. Sacrificare un'unità per azzoppare la minaccia e chiuderla il turno successivo a costo zero è la lettura corretta quando hai già un'altra copia della stessa unità in mano."
  - "Buona prioritizzazione dei blocchi al t16: sotto doppio attacco nello stesso turno, Kiraya ha usato l'unico Gusion Rebake disponibile per salvare Sword Impulse Gundam (a 2 HP, sarebbe morto sicuro) dal primo colpo, accettando che Gusion stesso cadesse al secondo attacco (già rested, nessun blocco possibile) — la stessa identica logica di prioritizzazione delle minacce vista al t12 della partita vs 4444, applicata di nuovo con successo."
  - "Nessun errore di sequenza o di targeting del self-ping rilevato in questa partita (a differenza della vittoria vs 4444): le lezioni di quella partita — ping mai sprecato su se stessi quando c'è un bersaglio migliore, finire un kill gratis prima di rischiare un'unità in combattimento — risultano applicate qui in modo consistente. Bilancio del campione aggro_mono_p dopo 9 partite: 6 vittorie, 3 sconfitte."
