  - "Miglior partita del campione finora sul piano del danno: EX Base nemica giù al t7, e le TRE Axis nemiche abbattute a colpi d'attacco (6+5+2+2+5 = 20 danni su basi) senza mai perdere il tempo — la differenza rispetto alla sconfitta vs 0622 è che qui la pressione non si è mai fermata per gestire la board."
  - "Turno 15 da manuale del mazzo: TRIPLA attivazione di Lupus in un turno (9 carte esiliate, 6 danni) per uccidere il Sazabi appena pilotato prima che attaccasse mai. Il trash come risorsa: a fine partita ~12 carte esiliate su 4 attivazioni totali."
  - "Il secondo replace dell'EX Base con Isaribi (t9, come vs Fjfnc) si conferma linea standard: l'EX Base intatta diventa 5 HP + pesca, e ha assorbito il colpo da 7 del Kshatriya al t12."
  - "Akihiro Altland al primo uso nei log (t9, paired su 1st Form): con Isaribi rested per AP+2, 1st Form ha colpito la Axis per 6 e pescato con il suo Attack. La copia singola ha finalmente pagato."
  - "Il piano di waxtrax (Airframe Seizure per scartare pezzi grossi e ripescarli? + Sazabi bounce-engine + Kshatriya) è rimasto sempre un tempo indietro: ogni minaccia (Kshatriya t13, Sazabi t15, Sazabi t21) è stata rimossa dai ping di Lupus il turno dopo essere apparsa, spesso prima di attaccare."
  - "Nota di matchup: Widespread Annihilation giocato due volte (t12/t18) senza effetti registrati nel log — probabilmente AoE andato a vuoto contro la board larga e sacrificabile di Kiraya; il mazzo regge bene le sweep perché rigioca corpi da 1-2 costi all'infinito."
