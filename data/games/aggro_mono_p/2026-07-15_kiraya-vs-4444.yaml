study_notes:
  - "Vittoria di Kiraya (aggro_mono_p) in 18 turni contro 4444 (Blu/Bianco Orb: Archangel, Strike Rouge, Freedom, Akatsuki, entrambe le stampe di Kira Yamato — quarto avversario su sette con un mazzo SEED/Orb). 4444 ha scelto di giocare secondo. Kiraya chiude senza aver MAI perso una shield vera (0 shields_lost): tutto il danno subito è finito su Isaribi o sull'EX Base."
  - "ERRORE #1 — self-ping mal indirizzato (t7): il Deploy di Ryusei-Go ha pingato SE STESSO invece di un'altra unità, lasciandolo a 1 HP per il resto della sua vita in gioco. Al t9 quell'1 HP lo ha reso un'attaccante usa-e-getta: ha attaccato Strike Rouge (già scesa a 1 HP il turno prima) ottenendo solo 2 danni (Strike Rouge sopravvive a 2 HP) e morendo lui stesso. Confronto diretto nello STESSO game: al t17 il ping di un secondo Ryusei-Go è andato su Barbatos 1st Form (che pesca se danneggiato quando attacca) — la scelta corretta, a riprova che è un'abitudine, non un caso. Regola pratica: il ping di Ryusei-Go va SEMPRE dirottato su un'altra unità a meno che non ci sia nulla di meglio in gioco."
  - "ERRORE #2 (il più costoso) — sequenza sbagliata al t17: Graze Custom ha attaccato Akatsuki (Oowashi), già a 1 HP dal trade con Lupus del turno prima. 4444 ha risposto con Unforeseen Incident (azione, danno azzerato) e Graze Custom è morto per 6 danni di ritorno per ZERO guadagno. Subito DOPO, Kiraya ha pairato Mikazuki Augus su Barbatos 1st Form: il ping automatico di 1 danno ha colpito lo stesso Akatsuki (ancora a 1 HP) — uccidendolo comunque, gratis. Se il pair+ping fosse arrivato PRIMA dell'attacco, Akatsuki sarebbe morto senza spendere Graze Custom: la carta è stata buttata per un kill che era già disponibile a costo zero. Regola pratica: prima di attaccare un bersaglio già in kill-range, controlla se un ping/pair a disposizione lo finisce da solo."
  - "Trick da tenere a mente per i prossimi incontri con questo avversario: Unforeseen Incident (azzera/riduce il danno in action step) è stato giocato DUE volte in questa partita, sempre in risposta a un attacco di Kiraya (t15 su Lupus, t17 su Graze Custom). Dopo la prima comparsa andava messo in conto un secondo copy: value la stessa lezione dell'errore #2, ma a livello di pianificazione pre-turno, non solo di sequenza."
  - "Buona lettura al t12: Kira Yamato (ST04-010) ha applicato AP-2 a Gundam Gusion Rebake PRIMA dell'attacco di Freedom Gundam — un debuff preventivo per rendere inefficace un blocco. Kiraya non ha bloccato (lasciando morire Isaribi) e ha invece riservato Gusion Rebake sano per il SECONDO attacco dello stesso turno (Murasame), dove ha bloccato e sopravvissuto a 1 HP. Con due minacce nello stesso turno e un solo blocker, prioritizzare quale bloccare (anziché la prima che arriva) è stata la scelta giusta."
  - "Lupus ancora protagonista ma stavolta caduto in combattimento, non per bounce: usato in attacco al t15 (dopo doppia Activate) per finire Archangel, è rimasto rested ed è morto al t16 sotto Akatsuki+Kira — rischio accettabile di un uso offensivo, non un errore (nessun bounce in questo mazzo avversario)."
  - "Partenza lenta nonostante il mulligan: prima giocata di Kiraya solo al t5 (Hyakuren + replace Isaribi), turni 1-4 tutti passati. La pressione recuperata nella seconda metà (EX Base giù al t9, Archangel abbattuta due volte, Lupus+1st Form a chiudere) ha comunque bastato: bilancio del campione aggro_mono_p ora 4-3."
