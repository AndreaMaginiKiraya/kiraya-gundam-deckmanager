study_notes:
  - "Sconfitta di Kiraya (aggro_mono_p) in 22 turni contro un mazzo G Gundam/Mobile Fighter di やーこん (Domon Kasshu, Shining/Rising/Dragon Gundam, Gundam Maxter, Sai Saici, Chibodee Crocket, base Gundam Fight). A differenza delle tre sconfitte precedenti (0622, umberduel, アスファルトの雑草), QUI Strike Freedom non è mai apparso — eppure il risultato è identico: Kiraya a 0 shield contro 1 rimasta a やーこん."
  - "La causa non è un errore isolato di Kiraya (a differenza delle partite vs 4444/pelumu, qui non ho trovato una sequenza scorretta di ping/attacco): è un motore avversario a cui il mazzo non ha risposta. Shining Gundam (GD05-066) ha un Deploy che esilia 2 unità MF dal trash per recuperare 1 Command 'Special Move' — usato TRE volte nella partita (t4/t8/t12), ha continuato a rimettere in mano Darkness Finger e Graviton Hammer già scartati, più il proprio Attack che riattiva 1 risorsa rested a turno."
  - "Il turno decisivo è il 16: QUATTRO copie di Darkness Finger (2 danni ciascuna) giocate in sequenza hanno ucciso Barbatos Lupus (già a 4 HP dal ping di Mikazuki) e ridotto Hyakuren a 1 HP, spianando la strada al Gundam Maxter che lo ha finito nello stesso turno. Un singolo turno ha cancellato entrambe le minacce rimaste di Kiraya."
  - "Pattern condiviso con la sconfitta vs アスファルトの雑草: rimozione economica ripetibile (lì Close Combat/Battle of Aces/Improved Technique/Overwhelming Pressure, qui Darkness Finger x6 in totale nella partita) che risponde alle minacce di Kiraya una alla volta più velocemente di quanto il mazzo possa svilupparne di nuove — senza bisogno del bounce di Strike Freedom. Darkness Finger, verificato sui log grezzi, compare SOLO in queste due sconfitte e in nessuna delle 8 vittorie."
  - "Scoperta trasversale: le 4 sconfitte del campione hanno TUTTE almeno una tra Strike Freedom (0622, umberduel, アスファルトの雑草) e Darkness Finger (アスファルトの雑草, やーこん) — アスファルトの雑草 le aveva entrambe. Nessuna delle 8 vittorie ha nessuna delle due. Il filo comune non è la carta specifica ma il tipo di risposta: interazione ripetibile a basso costo (bounce o removal da 2 danni) contro cui il mazzo non ha contromisure strutturali, a differenza degli avversari che si limitano a correre o a rimuovere board senza quel tipo di strumenti."
  - "Buona gestione nonostante la sconfitta: Isaribi-replace tempestiva al t9 (nessuna urgenza prima, やーこん non aveva mai attaccato l'EX Base di Kiraya), Activate di Isaribi usata per un kill esatto su Shining Gundam allo stesso turno, nessun self-ping sprecato rilevato. La partita si è persa per il motore avversario, non per l'esecuzione."
