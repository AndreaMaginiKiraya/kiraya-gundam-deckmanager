study_notes:
  - "Vittoria di Kiraya (aggro_mono_p, mono-Purple Tekkadan) in 26 turni: corsa alle shield stravinta — Tonii senza shield già dal t18 ('No more Shield cards' confermato al t25), Kiraya chiude con 1 shield e la seconda Isaribi consumata."
  - "Pattern offensivo chiave di Kiraya: unità con self-ping (Ryusei-Go, Barbatos Adapt, Gusion Rebake, Sword Impulse) + il ping di Mikazuki al pair = rimozione gratuita delle unità piccole e corpi sempre 'damaged' per le sinergie Tekkadan. Barbatos Adapt + Mikazuki usato due volte (t6, t10)."
  - "Piano di Tonii: Nu Gundam (GD05-020) + Amuro = rest della minaccia + attacco da 6 con Breach 3 (t7, t9, t13). Rimuove sempre la cima della curva di Kiraya ma muore o quasi in ogni scambio: tre Nu Gundam finiti 1-per-1. Il When Paired di Amuro è stato sprecato due volte su unità già rested dall'attacco del turno prima (t7, t9)."
  - "Isaribi MVP difensivo: la prima copia assorbe i due Breach 3 (t7+t9), la seconda (t24) altri 7 danni al t25 — ~13 danni tenuti fuori dalle shield, più 2 shield convertite in carte in mano."
  - "Il blocco con Gusion Rebake (t13) ha salvato Barbatos 1st Form dal Nu Gundam ma ha esposto una shield al Breach 3, e 1st Form è morto comunque al Guntank nello stesso turno: blocco a valore negativo col senno di poi."
  - "Mid-game di logoramento (t14–t22) a mani vuote: Guntank + Amuro (GD05-085, cura 2 a ogni uccisione) ha vinto tre scambi di fila sopravvivendo sempre a 1 HP — il pilota-cura su un corpo economico è stato il miglior investimento di Tonii."
  - "Chiusura: Barbatos Lupus (GD03-050) al t26 converte il trash accumulato dai sacrifici (6 carte esiliate in due attivazioni) in rimozione ripetuta; con Tonii a 0 shield la seconda attivazione chiude la partita ('Winner!' senza attacco registrato: resa o stato irrecuperabile)."
  - "Corsica Base al t25 è arrivata troppo tardi: il suo Deploy non ha trovato shield da aggiungere alla mano; da giocare quando le shield esistono ancora."
