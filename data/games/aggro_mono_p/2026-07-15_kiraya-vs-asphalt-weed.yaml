study_notes:
  - "Sconfitta pesante di Kiraya (aggro_mono_p) in 25 turni contro アスファルトの雑草: removal-control fatto quasi solo di Action giocate in end phase (Close Combat, Darkness Finger, Battle of Aces, Improved Technique, Overwhelming Pressure — ~12 rimozioni da 1-2 costi in tutta la partita) con Banshee, Strike Rouge e Strike Freedom a chiudere. Il matchup peggiore visto finora."
  - "Il pattern che ha svuotato la partita: per ~10 turni OGNI unità di Kiraya è morta nella end phase del turno in cui era scesa (t4 Ryusei, t6 Shiden, t9 Hyakuren, t12/13 Adapt+Hyakuren, t14 Graze, t15 Flauros, t20 1st Form, t22 Ryusei, t23 Gusion). Le rimozioni da 2-4 danni tradano sempre in su contro corpi da 2-3 costi già auto-pingati."
  - "Contro questo archetipo il self-ping è un costo vero: Ryusei a 1 HP muore a qualunque cosa, Shiden a 3 HP muore esatto a Improved Technique. Se il ping non attiva niente di concreto, contro i control va messo sul bersaglio col massimo degli HP di scorta (Gusion a 4 HP è l'unico sopravvissuto a una catena)."
  - "L'unico modo per uscirne visto nel log: saturare. Ai t12/t14/t16 con 2-3 corpi calati nello stesso turno qualcosa è sopravvissuto e ha colpito (EX Base al t12, 2 shield + 2 Burst al t14-16). Una minaccia a turno = una rimozione a turno; due minacce = una passa."
  - "Ottimo il t18: tripla attivazione di Lupus per uccidere il Banshee (che aveva 'Damage prevented' in battaglia e aveva rimbalzato Gusion in fondo al mazzo) senza mai combatterlo. Ma al t19 Strike Freedom ha rimbalzato Lupus nel mazzo — QUARTA partita col bounce che spegne il piano B."
  - "Nota di lista avversaria: le shield contenevano Burst COMMAND offensivi (Close Combat e Improved Technique dalle shield hanno ucciso la 2nd Form al t16): attaccare le shield di questo mazzo ha un prezzo — altro argomento per chiudere in fretta invece di grattare."
  - "Bilancio del campione dopo 6 partite (3-3): le tre sconfitte hanno la stessa radice — mano vuota dal t10 e nessuna interazione a velocità Action. Il mazzo vince solo le corse pulite; vedi proposte di modifica in NOTES della cartella."
  - "SCOPERTE dai testi delle carte (ricostruzione in decks/meta/hypo_asphalt_weed_control): Battle of Aces colpisce solo unità DANNEGGIATE — il self-ping di aggro_mono_p rende ogni corpo un bersaglio legale del loro removal migliore. Il bounce di Strike Freedom (GD05-002) rimanda in fondo al mazzo l'unità nemica DI LIVELLO PIÙ BASSO: tenere in gioco un corpo Lv1-2 protegge Lupus (Lv7) dal bounce. E il t17 del Banshee è spiegato: GD01-003 rimescola 12 carte dal trash nel mazzo, si riattiva e guadagna First Strike ('Damage prevented' = Gusion morto prima di rispondere)."
