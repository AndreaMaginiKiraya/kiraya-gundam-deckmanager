study_notes:
  - "Sconfitta di Kiraya (aggro_mono_p) in 24 turni contro MMorelli - stesso avversario e sostanzialmente lo stesso mazzo Blu/Rosso della partita precedente (Gundam/Amuro Ray, Victory Gundam, Kshatriya/Marida Cruz, Unicorn Gundam 02 Banshee, Darkness Finger), rivincita nello stesso pomeriggio. Utente segnala esplicitamente che MMorelli è tra gli avversari più forti incontrati."
  - "Il motivo della sconfitta è diverso dalla partita precedente: qui Darkness Finger ha un ruolo marginale (una copia sola, vista come shield-burst al t15 e rigiocata al t21). Lo snodo vero è Unicorn Gundam 02 Banshee (Destroy Mode), che compare DUE volte (t16, t22) e ogni volta ripete la stessa sequenza: rimescola carte dal trash nel mazzo, ottiene First Strike, uccide un'unità di Kiraya senza subire contraccolpo, poi in un secondo attacco nello stesso turno abbatte anche la base/Isaribi. Da sola questa unità ha tolto a Kiraya Gundam Barbatos Lupus (t16) e tre Isaribi consecutive (t18, t20, t22)."
  - "Scambi e sequenze di Kiraya nella prima metà partita (fino al t15) sono stati puliti: nessun self-ping sprecato, Barbatos Lupus attivato solo su carte già morte nel trash, buon ritmo di rimozione (2 Reineforce Jr., 3 copie di Zoloat, 3 copie di Victory Gundam neutralizzate). La partita si decide comunque nella seconda metà quando Kiraya rimane senza risposte al motore delle due Banshee."
  - "Conferma tecnica: Victory Gundam di MMorelli include ENTRAMBE le stampe (come Nu Gundam nella partita vs SSS) - una con pesca in attacco (t10) e una che dispiega un token [Parts] alla propria morte (t18, confermato dal token apparso nello stesso istante della sua distruzione). [Parts] in questa partita arriva quindi da tre fonti diverse osservate: Reineforce Jr., Üso Ewin e Victory Gundam stesso."
  - "Bilancio del campione aggro_mono_p dopo 20 partite: 14 vittorie, 6 sconfitte."
