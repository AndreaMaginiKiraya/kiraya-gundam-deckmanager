study_notes:
  - "Vittoria di Kiraya (aggro_mono_p) in 22 turni contro un Londo Bell Blu/Verde di Fjfnc (Gundam ST01-001, Nu Gundam, Wing Zero): l'avversario ha concesso al t22 con le shield di Kiraya ancora quasi intatte (1 shield + Isaribi in gioco vs 1 shield)."
  - "Mossa nuova a repertorio: al t5 Isaribi ha SOSTITUITO l'EX Base di Kiraya intatta — converte una difesa monouso in una base da 5 HP che pesca pure. Le Isaribi hanno assorbito 2+3 danni (t6/t8 Breach) e 6 dal Gundam al t20; con 4 copie il muro è praticamente permanente."
  - "L'Activate di Isaribi usato per la prima volta nei log (t9): rest della base per AP+2 a Sword Impulse damaged -> 5 danni, uccide il Gundam nemico pulito. Il self-ping di Sword non è solo un costo: abilita proprio questo."
  - "Ride Mass: Become a Shield giocato come pilota su Ryusei-Go (t13) per i +1/+1 — uso corretto della modalità alternativa quando il ping non serve, ha permesso a Ryusei di finire la Ra Cailum."
  - "Wing Gundam Zero (GD01-024) è il problema tecnico della partita: High-Maneuver ignora i blocker e il Deploy da 3 spazza tutta la board sotto Lv.6 (t16 ha ucciso 3 unità in una riga, t18 il Graze). Ha ammazzato due Lupus di fila (t18/t20). aggro_mono_p non può bloccarlo: va corso più veloce o pingato prima che attacchi (il doppio Activate di Lupus al t17 lo aveva portato a 3)."
  - "Anche qui l'Amuro avversario ha restato unità già esauste o irrilevanti in 2 casi su 3; e il pattern 'Healed 2' post-distruzione (t12, Re-GZ) si ripete identico alla partita 1: da tenere d'occhio come possibile bug del client, non come carta da playare intorno."
  - "Confronto con la sconfitta vs 0622: stesso avvio, ma qui i danni sono andati su EX Base (t5/t9) e shield vere, e le basi nemiche (2 Ra Cailum) sono state abbattute in 3 attacchi. Colpire il player e non i corpi resta la condizione di vittoria del mazzo."
