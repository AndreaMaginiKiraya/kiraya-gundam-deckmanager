study_notes:
  - "Vittoria di Kiraya (aggro_mono_p) in 15 turni contro un mazzo Blu/Verde di SSS, Londo Bell classico (Jegan, Kayra's Re-GZ, Re-GZ BWS, Nu Gundam, Amuro Ray, Ra Cailum) con una copia splash di Strike Freedom Gundam."
  - "PRIMA vittoria del campione con Strike Freedom Gundam in lista avversaria - smentisce (in parte) la scoperta precedente ('ogni sconfitta ha Strike Freedom o Darkness Finger, nessuna vittoria le ha'). Punto chiave: il bounce di Strike Freedom colpisce l'unità nemica di LIVELLO PIÙ BASSO in campo, non la minaccia più pericolosa - qui ha rimandato Graze Custom (Lv.2, sostanzialmente una carta gratis) invece di un bersaglio reale, semplicemente perché Gundam Barbatos Lupus non era mai stato calato (visto solo come shield scartata al t12) e Graze Custom era l'unità più economica in campo. La lezione per ANALISI.md: Strike Freedom è pericoloso solo se Lupus (o un'altra minaccia chiave) è l'unità di livello più basso sul tuo board - avere sempre un'unità economica 'sacrificabile' in campo lo disinnesca."
  - "Conferma meccanica: <Breach> colpisce prima una Base in gioco (se presente) che le shield vere e proprie (regola 13-1-2-4). Isaribi ha assorbito 3 e poi 5 danni da Breach (dai due kill di Nu Gundam al t10 e t12), morendo al secondo colpo invece che intaccare le shield di Kiraya - una Base sana funge da cuscinetto extra contro Breach."
  - "Nota per l'archivio carte, non per il gioco: SSS gioca DUE stampe diverse di Nu Gundam nello stesso mazzo (GD05-020 al t10, GD05-017 con l'abilità di battaglia istantanea al t12) - utile sapere che 'Nu Gundam' da solo non basta a identificare la minaccia specifica in futuro contro questo tipo di lista."
  - "Nessun errore isolato di Kiraya individuato: partita di scambi quasi tutti simmetrici (quasi ogni battaglia finisce con entrambe le unità distrutte), vinta sulla velocità pura e sull'accumulo di pressione sulle shield."
  - "Bilancio del campione aggro_mono_p dopo 16 partite: 12 vittorie, 4 sconfitte."
