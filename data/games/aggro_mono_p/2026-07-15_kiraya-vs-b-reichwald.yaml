study_notes:
  - "Vittoria schiacciante di Kiraya (aggro_mono_p) in soli 10 turni contro un mazzo Bianco/Viola Neo Zeon di B Reichwald (Rick Dias, Axis, Sazabi, Char Aznable). Kiraya chiude senza aver MAI subito danno alle shield o all'EX Base: 6 shield intatte, EX Base mai nemmeno scalfita. La partita più lopsided delle 8 analizzate finora."
  - "MVP assoluto: Gundam Exia Repair (1 costo, HP1) ha attaccato 4 volte senza mai essere toccato — t4 (EX Base -1), t6 doppio (EX Base kill + 1 shield), t8 doppio ancora (2 shield). Un corpo da HP1 che regge un'intera partita è la controprova diretta di quanto sia letale la mano lenta di un avversario che non riesce mai a schierare un blocker o un attaccante prima del t5: contro un board vuoto, anche la carta più fragile del mazzo diventa un clock inarrestabile."
  - "Il ping di Gundam Barbatos Adapt (t6, 'Dealt 1 damage to: Gundam Barbatos Adapt and Rick Dias') ha probabilmente ucciso Rick Dias in silenzio: era già a 1 HP dal blocco contro Graze Custom pochi secondi prima nello stesso turno, e il ping multi-bersaglio non riporta mai 'now destroyed' anche quando lo è (pattern già visto in altre partite) — Rick Dias infatti sparisce dal log per il resto della partita."
  - "Char Aznable (GD05-093) ha richiamato Axis dal trash con il suo When Linked al t9 (Axis era stata distrutta al t8): la seconda 'Played base: Axis' non è una nuova copia dalla mano ma la stessa carta tornata in gioco — utile per non fraintendere il conteggio delle basi in mazzi Neo Zeon con questo pilota."
  - "Sazabi ha chiuso in pareggio mortale con Shiden Custom (Ryusei-Go)+Mikazuki al t9 (7 danni contro 7), portando via l'ultima minaccia di Kiraya ma senza che bastasse: al t10 B Reichwald non ha più fatto nulla, Kiraya ha vinto senza bisogno di attaccare ancora — probabile resa con la board ormai persa."
  - "Bilancio del campione aggro_mono_p dopo 8 partite: 5 vittorie, 3 sconfitte. Contro mazzi Neo Zeon/Sleeves (waxtrax, B Reichwald): 2-0. Le uniche sconfitte restano contro avversari con motori di pesca dedicati (0622, umberduel, アスファルトの雑草) — qui invece B Reichwald non ha mai attivato nulla del genere e la corsa si è chiusa prima che potesse iniziare."
