study_notes:
  - "Vittoria di Kiraya (aggro_mono_p) in soli 9 turni contro il mazzo mono-Verde Academy di Anuy (Suletta Mercury, Guel's Dilanza, Demi Barding, Guel Jeturk/Overcoming Hardships, Witches from Earth, Felsi's Plea) - la vittoria più rapida del campione finora (batte i 10 turni di b-reichwald), verificato controllando il turno massimo su tutti i record salvati."
  - "Board di Anuy quasi mai sviluppato: un solo corpo vero in campo per volta (Demi Barding poi Guel's Dilanza), mentre Kiraya ha attaccato con 3-4 unità sane ogni turno dal t5 in poi. Cinque shield colpite in tre turni (t5, t7 x4, t9) senza mai una risposta sul board di Kiraya - nessuno scambio subito fino al t8."
  - "Unica giocata difensiva di Anuy: al t9 ha usato Overcoming Hardships (Action, pilotata da Guel Jeturk) per deviare l'attacco di Hyakuren (diretto al player) sul proprio Guel's Dilanza già a 2 HP, sacrificandolo in cambio di uno scambio con Hyakuren invece di prendere danno sulle shield. Giocata difensiva corretta in astratto, ma tardiva: a quel punto Kiraya aveva già così tanta pressione (Gundam Gusion Rebake pronto a scendere) che il turno successivo ha comunque chiuso la partita."
  - "Nessun errore isolato di Kiraya individuato: partita a senso unico, mai in discussione dal t5."
  - "Bilancio del campione aggro_mono_p dopo 17 partite: 13 vittorie, 4 sconfitte."
