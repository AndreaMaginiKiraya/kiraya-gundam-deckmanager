study_notes:
  - "Vittoria di Kiraya (aggro_mono_p) in 11 turni contro il mazzo Blu/Bianco League Militaire di SaintAbbel (V-Dash Gundam, Victory Gundam, Zoloat, Üso Ewin, Rick Dias, Argama)."
  - "Errore isolato: al t7 Kiraya schiera Gundam Barbatos 1st Form e Gundam Barbatos Adapt (entrambi non possono attaccare al turno di dispiegamento) ma NON dichiara nessun attacco con Graze Custom, già in campo e sano dal t5 - nonostante Rick Dias fosse a 1 HP residuo (danneggiato bloccando al t5) e uccidibile gratis. Stesso pattern già segnalato in ANALISI.md ('passare un turno intero senza attaccare con unità sane e attive contro un board avversario esposto', visto la prima volta vs pelumu t5) - qui il costo è più contenuto perché la partita non era in equilibrio, ma resta un'occasione di danno/kill gratis persa."
  - "Conferma tecnica utile: il token [Parts] (League Militaire, AP1/HP1) viene creato dal When-Paired di Üso Ewin quando pairato con un'unità League Militaire (visto al t10 subito dopo 'Linked pilot: Üso Ewin on unit V-Dash Gundam') - non dal Destroyed di Victory Gundam come si potrebbe pensare dal nome/fiction della carta; quest'ultima non è mai stata dispiegata in questa partita."
  - "Bilancio del campione aggro_mono_p dopo 18 partite: 14 vittorie, 4 sconfitte."
