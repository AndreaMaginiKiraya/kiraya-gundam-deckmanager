study_notes:
  - "Sconfitta di Kiraya (aggro_mono_p) in 24 turni contro il mazzo Blu/Rosso di MMorelli (Gundam/Amuro Ray, V-Dash Gundam, Unicorn Gundam 02 Banshee/Marida Cruz, Zoloat, Reineforce Jr., Kshatriya) con Darkness Finger in lista - stesso profilo 'control/removal ibrido' già visto contro アスファルトの雑草."
  - "Darkness Finger gioca DUE volte (t6, t10) e uccide Gundam Exia Repair entrambe le volte (HP1, bersaglio perfetto per 2 danni). Il problema non è solo la rimozione in sé ma il suo effetto collaterale: la '[Destroyed] Mill 2' di Exia Repair ha scaricato nel trash carte vive a caso, incluso Gundam Barbatos Lupus stesso al t6 (mai più visto in gioco - solo come shield colpita al t20) e Gundam Barbatos 1st Form al t10. In pratica ogni Darkness Finger ha tolto a Kiraya un'unità DA 1 costo più una seconda carta a sorpresa: un moltiplicatore di svantaggio che il mazzo non aveva mai incontrato così esplicitamente prima. Da valutare se vale la pena includere Exia Repair contro mazzi con removal ripetuto a basso costo, nonostante il suo valore da pesca/riciclo normale."
  - "Errore isolato e netto: al t7 Kiraya attiva Isaribi (una risorsa Activate limitata a una volta a turno) per dare AP+2 a Sword Impulse Gundam APPENA SCHIERATO quello stesso turno - un'unità non-Link non può comunque attaccare nel turno in cui viene calata, quindi il buff 'durante questo turno' è sprecato al 100%: Sword Impulse Gundam muore al turno successivo (t8) senza aver mai attaccato. L'Activate andava riservato a un'unità che avrebbe effettivamente colpito quello stesso turno."
  - "Confermata per la terza volta nel campione la stessa dinamica: pingare un'unità propria per farla pescare/attivare il suo effetto la lascia scoperta a bassa HP, e l'avversario la elimina gratis al turno successivo. Qui è successo a Gundam Barbatos 1st Form (pingato da Ryusei-Go al t11 per la pesca in attacco, lasciato a 1 HP, ucciso da 'Gundam' di MMorelli al t12) - stesso schema già visto vs Zeding (t9-10)."
  - "Il momento di svolta vero è il t14: Unicorn Gundam 02 Banshee (Destroy Mode) unisce un'abilità di riciclo trash (rimescola 12 carte nel mazzo) a First Strike nello stesso attacco, uccidendo Ryusei-Go senza subire contraccolpo e poi finendo anche Isaribi nello stesso turno - un singolo corpo da 4 costo che vale due kill puliti. Da qui in poi Kiraya non ha più risorse per rispondere: gli ultimi 10 turni sono quasi tutti passati a vuoto mentre V-Dash Gundam e una seconda Banshee macinano le shield rimanenti senza opposizione."
  - "Bilancio del campione aggro_mono_p dopo 19 partite: 14 vittorie, 5 sconfitte."
