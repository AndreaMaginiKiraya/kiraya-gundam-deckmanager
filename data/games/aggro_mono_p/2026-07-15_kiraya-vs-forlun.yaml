study_notes:
  - "Vittoria di Kiraya (aggro_mono_p) in 14 turni contro un mazzo Celestial Being/Gundam 00 di Forlun (Virtue, GN Armor Type-E in due copie diverse, Kyrios + Flight Mode, Exia, Throne Eins, Ptolemaios, piloti Hallelujah Haptism e Nena Trinity, removal Overwhelming Pressure). Kiraya chiude con 0 shield perse (5 rimaste) contro le 4 di Forlun (0 rimaste) — nonostante abbia perso PIÙ unità (7 contro 3)."
  - "La chiave della partita è dal lato di Forlun, non di Kiraya: in 14 turni Forlun non ha MAI dichiarato un attacco contro il player — ogni singolo attacco (t6, t8, t10) ha preso di mira direttamente un'unità di Kiraya già rested, e la rimozione del t12 (Overwhelming Pressure) era un comando, non un attacco. Concentrarsi solo sulla rimozione dei corpi economici e auto-pingati di aggro_mono_p, senza mai correre verso le shield, ha permesso a Kiraya di colpire il player ogni volta che il percorso era libero: risultato, 0 danni reali subiti in 14 turni."
  - "Scoperta di regole utile: Gundam Exia Repair (GD05-050) ha ucciso GN Armor Type-E al t7 con solo 2 danni su un'unità da 3 HP grazie alla sua abilità intrinseca ('quando infligge danno da battaglia a un'unità nemica Lv.4-o-meno SENZA pilota abbinato, distruggila') — non un trade per HP ma un kill incondizionato, confermato dalla nuova riga di log 'X: destroyed Y' vista qui per la prima volta. Sword Impulse Gundam aveva preventivamente restato GN Armor Type-E col proprio Deploy, rendendolo un bersaglio sicuro: sequenza corretta (rest preventivo poi kill-condizionale) piuttosto che una coincidenza."
  - "Gundam Kyrios (GD04-034, AP1 su carta ma pericoloso in coppia con Hallelujah) ha qualche forma di prevenzione danno ('Damage prevented': ha ucciso Ryusei-Go al t8 senza subire nulla) — la minaccia più pericolosa in campo in quel momento. Kiraya l'ha rimossa al turno SUBITO successivo con Barbatos 1st Form (dopo il ping di Mikazuki per ammorbidirlo), trade pulito alla pari (5-5): stessa disciplina 'rimuovi prima la minaccia più grossa' già vista funzionare nelle partite precedenti."
  - "Bilancio del campione aggro_mono_p dopo 11 partite: 8 vittorie, 3 sconfitte."
