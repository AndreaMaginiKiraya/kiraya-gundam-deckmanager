study_notes:
  - "Vittoria fulminea di Kiraya (aggro_mono_p) in soli 11 turni contro un Londo Bell Blu di big stan (ReZEL, Gundam ST01-001 con Repair 2, Amuro Ray, White Base). Kiraya chiude con 5 shield intatte contro 0 — nessuna traccia di Strike Freedom o Darkness Finger nel mazzo avversario (coerente con la scoperta del campione: nessuna delle vittorie le ha)."
  - "Turno 11 da manuale della checklist di saturazione: DUE copie di Gundam Barbatos Adapt schierate nello stesso turno (ciascuna col proprio ping obbligatorio) più il pair di Mikazuki — tre pings totali sull'ultima minaccia avversaria, poi Isaribi Activate, poi QUATTRO attacchi in fila (White Base abbattuta, 3 shield colpite) nello stesso turno. La partita finisce lì: probabile resa di big stan con le shield esaurite."
  - "Amuro Ray (ST01-010) ha sprecato il proprio When Paired due volte di fila (t6 su Barbatos 1st Form, t8 su Barbatos Adapt) restando unità GIÀ rested dal proprio attacco del turno precedente di Kiraya — stesso pattern visto con lo stesso pilota nelle partite vs Tonii, Fjfnc e Pelumu. Conferma trasversale: contro Amuro Ray, il rest preventivo raramente cambia qualcosa se Kiraya ha già speso l'unità in attacco."
  - "Il 'Gundam' avversario (ST01-001, Repair 2 automatico a fine turno) si era appena curato a fine t8, ma è morto comunque a inizio t9 al ping di Gusion Rebake + l'attacco di Graze Custom nello stesso ciclo — la cura passiva non basta contro due fonti di danno consecutive nello stesso turno."
  - "Bilancio del campione aggro_mono_p dopo 13 partite: 9 vittorie, 4 sconfitte."
