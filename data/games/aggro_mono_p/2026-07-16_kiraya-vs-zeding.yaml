study_notes:
  - "Vittoria di Kiraya (aggro_mono_p) in 15 turni contro un mazzo Bianco/Verde di Zeding centrato su Suletta Mercury e le unità (Academy) — Chuchu's Demi Trainer, Gundam Aerial Rebuild, Gundam Pharact, Demi Barding, oltre a Wing Gundam (Bird Mode) come innesco di risorse EX. Prima partita di questo campione contro questo archetipo specifico."
  - "Nota (non un errore netto): al t9 Kiraya pinga con Ryusei-Go il proprio Gundam Barbatos 1st Form portandolo a 1 HP PRIMA di attaccare col Barbatos stesso — combo corretta, visto che la sua abilità è '[Attack] Se questa unità è danneggiata, pesca 1' (coerente con la dinamica 'ping-prima-di-attaccare' già confermata nel campione). Il costo collaterale è che l'unità resta scoperta a 1 HP fino al turno successivo, e al t10 Zeding la elimina gratis con Gundam Aerial Rebuild appena schierato. Non è chiaro se ci fosse un modo migliore di sequenziare senza rinunciare alla pescata: da tenere d'occhio se il pattern si ripete in altre partite."
  - "Turno 13 è il punto di svolta della partita: Gundam Barbatos Lupus deployato e attivato subito, esiliando 3 carte già morte/nel trash (Hyakuren, Gusion Rebake, Barbatos 1st Form) come costo — nessun valore reale sacrificato — per 2 danni che uccidono Demi Barding. Il pair immediato di Mikazuki Augus (link riuscito) piazza altro danno ad area (Gusion Rebake e Pharact insieme). Poi tre attacchi in fila al giocatore abbattono la base Quiet Zero e bruciano 3 shield di Zeding in un solo turno. Ottimo esempio di 'dinamica efficace' da ripetere: usare Barbatos Lupus quando il trash è già pieno di carte morte, non quando costerebbe carte vive."
  - "Il contrattacco di Zeding al t14 (Chuchu's Demi Trainer + Demi Barding + Gundam Pharact tutti in scambio) costa a Kiraya tre unità in un turno solo (Gusion Rebake, un secondo Barbatos 1st Form, Graze Custom) — il momento più pericoloso della partita. Ma l'aggressione del t13 aveva già portato Zeding a sole 2 shield residue più EX Base perso: il margine accumulato prima ha assorbito lo swing e la partita si chiude comunque al t15."
  - "Interwoven Blessings (COMMAND costo 10, Green, distrugge le prime 2 shield di un giocatore) pescata da Zeding al t12 non è mai stata giocata: la velocità del piano aggro di Kiraya (chiusura al t15) ha negato all'avversario il tempo/risorse per arrivare a un costo così alto. Conferma indiretta della validità del piano 'vinci prima che il tardo-gioco avversario diventi rilevante'."
  - "Bilancio del campione aggro_mono_p dopo 14 partite: 10 vittorie, 4 sconfitte."
