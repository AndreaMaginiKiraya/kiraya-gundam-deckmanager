study_notes:
  - "Vittoria di Kiraya (aggro_mono_p) in 17 turni contro il mazzo Viola/Bianco di IAN, basato quasi interamente sul precon ST05 'Destiny Ignition' (Impulse Gundam, Force Impulse Gundam, Shinn Asuka, Minerva) più Aile Strike Gundam e due copie di Widespread Annihilation come tech. Prima partita di questo campione contro questo archetipo."
  - "Trovata la carta più pericolosa vista finora contro questo mazzo: Widespread Annihilation ('[Main] Distruggi tutte le unità Lv.4 o inferiore') gioca DUE volte (t10 e t16) e ogni volta rade al suolo l'intero board di Kiraya (tutte le sue unità in questa partita sono Lv.4 o meno). Il mazzo ha retto solo per la ridondanza: 4 copie ciascuna di quasi tutte le unità chiave permettono di ridispiegare subito dopo. Contro un mazzo con più copie di un board wipe economico, il piano deve assumere che il board verrà azzerato più volte e non investire tutto in un solo turno."
  - "Effetto collaterale positivo del primo wipe (t10): ha riempito il trash di Kiraya con esattamente il carburante che Gundam Barbatos Lupus ha usato nelle due Activate del t13 (Barbatos Adapt x2, Barbatos 1st Form, Ryusei-Go, due copie extra di Lupus stesso finite nel trash per mill). Nessun valore vivo perso nell'attivazione: la stessa dinamica 'Lupus si nutre di carte già morte' vista nelle partite precedenti, qui amplificata dal wipe avversario."
  - "Isaribi (la base che sostituisce l'EX Base) ha dato valore concreto due volte in questa partita: Activate su Hyakuren al t9 (Modifier +AP prima di un attacco decisivo su Minerva) e su Sword Impulse Gundam al t13 (stesso pattern). Linea di gioco confermata ancora una volta: sostituire l'EX Base con Isaribi appena possibile resta la giocata di default."
  - "Nessun errore isolato di Kiraya individuato in questa partita: le uniche perdite (Ryusei-Go t11 in blocco, Sword Impulse Gundam t14, Gundam Barbatos Lupus t16) sono tutte scambi netti o subiti dal board wipe, non sequenze scorrette."
  - "Bilancio del campione aggro_mono_p dopo 15 partite: 11 vittorie, 4 sconfitte."
