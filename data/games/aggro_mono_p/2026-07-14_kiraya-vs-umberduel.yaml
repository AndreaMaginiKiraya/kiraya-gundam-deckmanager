study_notes:
  - "Sconfitta netta di Kiraya (aggro_mono_p) in 17 turni contro umberduel: League Militaire (Victory/V2/Üso/Parts) con splash Strike Freedom+Kira. La statistica che dice tutto: umberduel ha chiuso con 3 shield intatte e 0 shield distrutte — in 17 turni Kiraya non ha mai rotto una shield avversaria (solo 2 finite in mano ai Burst e la Reineforce Jr. abbattuta)."
  - "Il blowout del t4 ha segnato la partita: Exia+Akihiro (2 carte investite) ha attaccato con l'avversario a risorse aperte e mano piena -> Close Combat in action step l'ha ucciso a metà battaglia. Zero danni, due carte perse. Contro mano/risorse aperte, il primo attacco di un'unità appena pilotata va pesato: meglio attaccare prima di pairare, o aspettare."
  - "Il motore del V2 Gundam è il problema centrale del matchup: attacca, poi Activate (resta 2 Parts) -> Set Active -> attacca DI NUOVO, con Repair 2 che lo ricuce. Due attacchi a turno da 6+ hanno mangiato 3 Isaribi (19 danni) e le shield. Il punto debole è il carburante: i Parts (AP1/HP1). Vanno uccisi i token, non inseguito il V2 — i ping di Mikazuki/Adapt/Gusion li spengono gratis. Lupus l'ha capito solo al t16."
  - "Strike Freedom conferma la lezione della partita vs 0622: ha rimbalzato Lupus nel mazzo DUE volte (t15 e t17, dopo il redeploy). Terza partita in cui il bounce nega il piano B: contro mazzi con Strike Freedom, Lupus va calato solo nel turno in cui le sue attivazioni chiudono qualcosa, non prima."
  - "Turni 9-11 buttati: t10 un deploy e passa, t11 niente. La solita mano vuota, ma qui è costata la finestra in cui il V2 non era ancora online. Le tre Isaribi consecutive (t12/t14/t16) sono state usate come muri, mai come tempo per contrattaccare."
  - "Dettaglio tecnico dal log: umberduel gioca ENTRAMBE le stampe di Victory Gundam (GD04-011 che lascia Parts morendo, GD04-003 che pesca attaccando) — il mazzo è costruito per perdere le Victory con profitto. Ucciderle conviene solo se poi si uccide anche il token."
  - "Confronto con le vittorie: nelle 3 partite vinte l'EX Base nemica cadeva entro il t7 e la pressione non si fermava; qui dopo il t8 tutti gli attacchi di Kiraya sono finiti su una base. Quando il piano A (corsa alle shield) si spegne e il piano B (Lupus) viene rimbalzato, il mazzo non ha un piano C: la partita era persa strutturalmente, non per una singola giocata."
