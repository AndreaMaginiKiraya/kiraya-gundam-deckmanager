study_notes:
  - turn: 7
    note: "One's Graceful Demeanor bounces both Graze Custom copies back to hand — a real tempo hit, but freedom_ibo's low curve absorbed it easily (both got redeployed within a turn or two) rather than losing real board presence, unlike the tighter-curve v1_x decks where a double-bounce would have hurt more."
  - turn: 11
    note: "First outing for freedom_ibo debut: a clean 11-turn win with Kiraya never losing a single shield (6 remaining at the end). One's Wing-EW shell (Heavyarms/Sandrock Custom debuffs, Noin's Taurus, Overflowing Affection cantrips) never assembled a real board — no Blocker units, no removal beyond the one Graceful Demeanor bounce and a late Unforeseen Incident. Not a strong test of the deck's plan against the Strike Freedom/MF-heavy meta this was built for; the early Graze Custom/Barbatos Adapt curve alone was enough to close it before Strike Freedom or Widespread Annihilation ever needed to come down."
