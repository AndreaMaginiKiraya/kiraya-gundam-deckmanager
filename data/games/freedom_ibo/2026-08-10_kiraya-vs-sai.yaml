study_notes:
  - turn: 8
    note: "Strike Rouge (Ootori) is Orb-trait, so linking Kira Yamato onto it triggers the [When Linked] draw-1 immediately (not just a flat stat bonus) — good early value from a card that would otherwise just sit as a body, and confirms the deck doesn't need to wait for Strike Freedom specifically to get card advantage out of Kira Yamato."
  - turn: 9
    note: "sai's Nu Gundam+Amuro Ray (the exact Londo Bell archetype flagged as a bad matchup earlier this session) does its usual two-for-one: exiles 3 Londo Bell trash cards for a free damage-only kill on Impulse Gundam, then a full attack kills Gundam Barbatos Adapt too, healing back both times. Same problem pattern as the aggro_tekkadan_mono losses to this archetype — freedom_ibo doesn't inherently solve it, it just has more resources in reserve to answer it (see t12)."
  - turn: 12
    note: "Barbatos Lupus (still present at 2 copies in this list) cleans up Nu Gundam in one activation using already-dead trash — the same recycle engine from the old decks, still doing real work here even in a deck built around a different primary plan."
  - turn: 14
    note: "Closing turn confirms Strike Freedom Gundam's Deploy trigger ('choose 1-2 Units, they draw when they destroy an enemy card with battle damage this turn') counts shield hits, not just Unit kills — the final draw fired off Lupus breaking sai's last shield, not off a unit kill. Combined with Kira Yamato's own Link draw, that's 2 cards from a single Deploy+attack sequence — a strong first real look at the deck's actual payoff turn, closing a game that had gone the full distance against exactly the archetype it was built to answer."
