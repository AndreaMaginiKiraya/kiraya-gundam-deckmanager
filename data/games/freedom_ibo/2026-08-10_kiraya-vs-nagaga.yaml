study_notes:
  - turn: 12
    note: "Widespread Annihilation's first real showcase: destroys 5 units at once (2x Gundam Lfrith, Rick Dias, Sword Strike Gundam, plus Kiraya's own already-spent Impulse Gundam) after a turn of trades had already softened the board. Exactly the 'reset button' role discussed when the deck was built — a 4-for-1 in ながが's favor to break, since the only Kiraya casualty was a unit that had already done its job."
  - turn: 18
    note: "First real look at the mirror dynamic on Strike Freedom Gundam — both players run it. Kiraya's copy (paired Kira Yamato) bounces ながが's Aile Strike Gundam+Amuro Ray to the bottom of the deck via its [During Pair][Attack] ability, a genuine tempo denial tool, not just a stat stick."
  - turn: 19
    note: "Symmetric answer: ながが's own Strike Freedom Gundam bounces Kiraya's Strike Freedom+Kira Yamato right back — losing the payoff piece just deployed is a real tempo cost. This mirror match on the same card cuts both ways; whoever lands the ability first doesn't keep a lasting edge if the opponent has the same tool."
  - turn: 20
    note: "Gundam Barbatos Lupus (2 copies in this list) starts grinding down ながが's Freedom Gundam over two activations (t20, t22) using already-dead trash — the same recycle engine from the old aggro_tekkadan_mono decks, still pulling real weight in freedom_ibo alongside the newer Strike Freedom/Kira Yamato plan."
  - turn: 24
    note: "Gundam Flauros trades even into Strike Freedom Gundam (mutual destruction) — a fair but not great trade given Flauros costs half as much. From here the game grinds into a long attrition war (t25-32) with both sides slowly rebuilding, eventually decided by ながが timing out at t33 rather than a clean board state — a 33-turn game, easily the longest and closest test of freedom_ibo so far."
