study_notes:
  - turn: 8
    note: "Efficient clearing turn: Barbatos 1st Form's paired ping softens Impulse Gundam for Graze Custom to finish, Hyakuren kills Guntank, and Barbatos 1st Form trades even into soulnate's Amuro-paired Gundam (drawing a card first) — three of soulnate's units gone for Graze Custom + Barbatos 1st Form."
  - turn: 9
    note: "Gundam NT-1 (Amuro Ray-paired, <Repair 2>) is the recurring problem unit: kills Exia Repair for free off its own Deploy ping, then kills Hyakuren in combat and repairs back to full at end of turn — hard to remove cleanly with small units."
  - turn: 12
    note: "Lupus answers with a double activation, killing the first Blast Impulse Gundam outright — but soulnate runs a second copy (paired with Amuro Ray again at t13), which trades into and kills Lupus. The Blast Impulse Gundam package is clearly the deck's main threat, appearing 3 times across the game."
  - turn: 16
    note: "The closing turn: Barbatos 1st Form (paired Mikazuki) softens Rey's Blaze Zaku Phantom, trades with Blast Impulse Gundam, then Exia Repair finishes Rey's Blaze Zaku Phantom off — that unit had a damage-reduction ability (<Rey Za Burrel>-linked, 'reduced by 3') that made it awkward to remove cleanly, needing two separate attacks across two turns. Lupus Rex closes out the last Minerva-guarded shield, and soulnate conceded with no board left."
