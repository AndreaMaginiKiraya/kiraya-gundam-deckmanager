study_notes:
  - turn: 7
    note: "Sheldon's first big value turn: a second Shining Gundam exiles 2 already-trashed MF cards to recur Shining Finger, Domon Kasshu's pair draw/discard re-triggers Shining Finger's Main for free (resting an already-rested Hyakuren — the target choice mattered less than the buff), and the resulting first-strike attack kills Gundam Barbatos Adapt with zero counter-damage while a reactive Darkness Finger snipes Graze Custom on the side. Two Kiraya units gone for nothing back — this is the Special Move recursion engine discussed earlier this session working exactly as designed, and there wasn't a way for Kiraya to see it coming or play around it with the information available."
  - turn: 9
    note: "Gundam Maxter (paired as 'Chibodee Crocket' via Cyclone Punch's own Pilot-mode) kills Hyakuren and its Destroyed-adjacent trigger nets a Darkness Finger straight to hand — the second of what becomes at least 3 separate Darkness Finger recursions this game (also via Maxter's death at t13 and Shining Gundam's Deploy at t15). This one card effectively became reusable removal across the whole game, which is the core reason this matchup reads as unfavorable even beyond variance."
  - turn: 11
    note: "Rising Gundam (linked Master Asia) plus Darkness Finger plus Gundam Maxter chip Gundam Gusion Rebake down through three separate damage sources in one turn and take Isaribi too — no single play was a misplay by Kiraya, this is just the deck's stacking-damage-sources plan working as intended against a board with no way to remove multiple threats per turn."
  - turn: 12
    note: "The one genuinely questionable turn: Kiraya deploys 3 fresh units (Flauros, Barbatos 1st Form, Graze Custom) but declares zero attacks, even though Sheldon had no known <Blocker> unit on board at the time. If that's correct, this was free damage/shield pressure left on the table — worth checking next time whether a defensive hold was intentional (expecting a big swing-back, which did arrive at t13) or just missed. Not certain enough to call a hard mistake without knowing what information was visible in-client at the time."
  - turn: 13
    note: "The turn that broke the game open: Darkness Finger kills the fresh Barbatos 1st Form and draws a card, Shining Finger rests Flauros, Gundam Maxter (Cyclone Punch-debuffed target) trades into Flauros and dies too — but even Maxter's death refunds yet another Darkness Finger — and Rising Gundam's Master Asia splash kills Graze Custom outright before hitting a shield. Four Kiraya cards gone (Barbatos 1st Form, Flauros, Graze Custom, plus a discarded shield) against one Sheldon unit lost, and that unit's death paid for itself in card advantage. This is where the game was effectively decided."
  - turn: 15
    note: "Closing turn: two more recurred Darkness Fingers whittle Lupus Rex to 2 HP (drawn via t13's Maxter death and t15's fresh Shining Gundam recursion), Master Gundam's shield-burn and Rising Gundam's splash finish it and take shields, and a second Shining Gundam closes the game. Gundam Barbatos Lupus itself was never drawn all game — the deck's main removal/recycle engine never came online, which on top of the opponent's genuinely stronger recursion plan is the honest read on why this one felt disastrous."
