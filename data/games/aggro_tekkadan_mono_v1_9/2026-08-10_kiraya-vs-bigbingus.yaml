    note: "The turn that turned the game around: a triple Lupus activation exiles 9 trash cards — including the very Lupus Rex discarded back at t8 — to kill Sazabi (bigbingus's biggest threat, which had just two-for-one'd Barbatos Adapt and Flauros the turn before) across 3 pings. Nothing wasted this game, even the bad early discard."
  - turn: 23
    note: "Down to the wire: both players were at 0 remaining shields — this final combat was a straight race. Blocking Rick Dom (buffed by Char Aznable's High-Maneuver/AP+1) with Shiden Custom traded both units, but with bigbingus out of attackers that was the game. A genuinely close, well-played finish — the block was the only unit available and it was exactly enough."
