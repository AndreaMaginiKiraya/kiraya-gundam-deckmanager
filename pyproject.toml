[project]
name = "kiraya-gundam-deckmanager-mcp"
version = "0.1.0"
description = "MCP server for the Gundam Card Game: card search, deck building, deck validation, and deck visualization"
requires-python = ">=3.10"
authors = [
    { name = "Kiraya" }
]
dependencies = [
    "mcp[cli]>=1.0",
    "httpx>=0.27",
    "Pillow>=10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
kiraya-gundam-deckmanager-mcp = "kiraya_gundam_deckmanager.__main__:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["~"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kiraya_gundam_deckmanager"]
